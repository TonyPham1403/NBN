<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>derive_chain T ticks</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    font: 13px/1.35 "Segoe UI", system-ui, sans-serif;
    background: #f6f7f9; color: #111;
  }
  .banner {
    flex: 0 0 auto;
    background: #111827; color: #fff;
    padding: 10px 16px;
  }
  .banner .title-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;
  }
  .banner h1 { margin: 0; font-size: 16px; font-weight: 700; }
  .banner p {
    margin: 4px 0 0; opacity: .85; font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .threshold {
    display: inline-flex; align-items: center; gap: 6px;
    background: #fff; color: #111;
    border: 1px solid #e5e7eb; border-radius: 8px;
    padding: 4px 8px; font-size: 12px;
    /* Nằm trên overlay popup — vẫn chỉnh được khi modal mở. */
    position: relative;
    z-index: 60;
  }
  body.modal-open .threshold {
    box-shadow: 0 0 0 2px #fff, 0 8px 24px rgba(0, 0, 0, .35);
  }
  .threshold .th-label { font-weight: 700; color: #374151; }
  .threshold input {
    font: inherit; color: #111;
    border: 1px solid #d1d5db; border-radius: 5px;
    background: #fff; height: 28px; box-sizing: border-box;
  }
  /* Dropdown dấu (custom — để tô màu từng option; native <select> không tô được trên Windows). */
  .threshold .op-dd {
    position: relative;
    display: inline-block;
    z-index: 70;
  }
  .threshold .op-dd-btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 4px;
    min-width: 52px; height: 28px; padding: 0 8px;
    border: 1px solid #111; border-radius: 5px;
    font: inherit; font-weight: 800; font-size: 12px; line-height: 1;
    cursor: pointer; user-select: none;
  }
  .threshold .op-dd-btn::after {
    content: "";
    width: 0; height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 5px solid currentColor;
    opacity: 0.85;
  }
  .threshold .op-dd-btn.op-ge { background: #ff0000; color: #fff; }
  .threshold .op-dd-btn.op-eq { background: #ffff00; color: #111; }
  .threshold .op-dd-btn.op-le { background: #006400; color: #fff; }
  .threshold .op-dd-menu {
    position: absolute; top: calc(100% + 3px); left: 0;
    min-width: 100%;
    background: #fff;
    border: 1px solid #111;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0,0,0,.25);
    z-index: 80;
  }
  .threshold .op-dd-menu[hidden] { display: none; }
  .threshold .op-dd-item {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 28px; padding: 0 8px;
    border: 0; border-radius: 0;
    font: inherit; font-weight: 800; font-size: 12px; line-height: 1;
    cursor: pointer; text-align: center;
  }
  .threshold .op-dd-item.op-ge { background: #ff0000; color: #fff; }
  .threshold .op-dd-item.op-eq { background: #ffff00; color: #111; }
  .threshold .op-dd-item.op-le { background: #006400; color: #fff; }
  .threshold .op-dd-item:hover { filter: brightness(1.08); }
  .threshold .op-dd-item.is-on { outline: 2px solid #111; outline-offset: -2px; }
  .threshold input[type=number] {
    width: 52px; text-align: center; font-variant-numeric: tabular-nums;
    font-weight: 700;
    appearance: textfield;
  }
  .threshold input[type=number]::-webkit-outer-spin-button,
  .threshold input[type=number]::-webkit-inner-spin-button {
    appearance: none; margin: 0;
  }
  .threshold .step {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 28px; padding: 0;
    border: 1px solid transparent; border-radius: 5px;
    font-weight: 800; font-size: 16px; line-height: 1;
    cursor: pointer; user-select: none;
  }
  .threshold .step > span {
    display: block;
    line-height: 1;
    transform: translateY(-0.5px);
  }
  .threshold .step.dec {
    background: #ff0000; color: #fff; border-color: #990000;
  }
  .threshold .step.dec:hover { filter: brightness(0.92); }
  .threshold .step.dec:active { filter: brightness(0.85); }
  .threshold .step.inc {
    background: #006400; color: #fff; border-color: #003d00;
  }
  .threshold .step.inc:hover { filter: brightness(1.12); }
  .threshold .step.inc:active { filter: brightness(0.9); }
  .threshold .unit { color: #6b7280; font-weight: 600; }
  /* Mã phòng sync click phá (sim) — bên phải threshold */
  .sim-room-tag {
    position: relative;
    z-index: 60;
    width: 3.25em;
    height: 28px;
    margin: 0;
    padding: 0 6px;

    background: #fff;

  body.modal-open .sim-room-tag {

  .sim-room-tag:focus {

    outline-offset: 1px;
    border-color: #0f766e;
  }
  .sim-room-tag:not(:placeholder-shown) {
    border-color: #0f766e;
    color: #0f766e;
  }
  .banner .err { color: #fecaca; margin-top: 8px; }
  .banner .summary {

  .banner .summary .chip {

    color: #111;

    font-variant-numeric: tabular-nums;

  .viol-rate,

    font-size: 12px; color: #fff;
    font-variant-numeric: tabular-nums;

    position: relative;
    z-index: 60;
  }
  .viol-rate .vr-label,
  .rest-rate .vr-label { opacity: .85; font-weight: 600; }
  .rest-rate .vr-label-tog {
    margin: 0; padding: 0 2px;
    border: 1px solid transparent;
    border-radius: 4px;
    background: transparent;
    color: inherit;
    font: inherit;
    font-weight: 600;
    opacity: .9;
    cursor: pointer;
    line-height: 1.2;
  }
  .rest-rate .vr-label-tog:hover {
    background: rgba(255, 255, 255, .12);
    border-color: rgba(255, 255, 255, .28);
  }

    color: #86efac;
    border-color: rgba(134, 239, 172, .45);
    opacity: 1;
  }
  .rest-rate .vr-xem {
    margin: 0 0 0 2px;
    padding: 2px 7px;
    border: 1px solid rgba(255, 255, 255, .35);
    border-radius: 5px;
    background: rgba(255, 255, 255, .1);
    color: #fff;
    font: 700 11px/1.2 inherit;
    cursor: pointer;
  }
  .rest-rate .vr-xem:hover {
    background: rgba(255, 255, 255, .2);

  .viol-rate .vr-pct { font-weight: 800; color: #ef4444; font-size: 14px; }
  .rest-rate .vr-pct { font-weight: 800; color: #4ade80; font-size: 14px; }
  .viol-rate .vr-frac,
  .rest-rate .vr-frac { opacity: .75; font-weight: 600; font-size: 12px; }
  body.modal-open .viol-rate,
  body.modal-open .rest-rate {
    text-shadow: 0 1px 2px rgba(0, 0, 0, .45);
  }
  .modal .rest-tabs {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin: 0 0 10px;
  }
  .modal .rest-tabs button {
    border: 1px solid #d1d5db;
    border-radius: 6px;
    padding: 4px 10px;
    background: #fff;
    color: #111;
    font: 700 11px/1.2 inherit;
    cursor: pointer;
  }
  .modal .rest-tabs button:hover { background: #f3f4f6; }
  .modal .rest-tabs button.is-on {
    background: #111827;
    border-color: #111827;
    color: #fff;
  }
  .banner .summary button {
    border: 1px solid #d1d5db; cursor: pointer; font-weight: 700; font-size: 11px;
    padding: 5px 10px; border-radius: 6px;
    background: #fff; color: #111;
  }
  .banner .summary button:hover { background: #f3f4f6; }
  .id-list {
    display: flex; flex-wrap: wrap; gap: 6px;
    font-variant-numeric: tabular-nums;
  }
  .modal .id-list button,
  .id-list button {
    background: #fff !important;
    border: 1px solid #d1d5db !important;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 12px;
    cursor: pointer;
    color: #111 !important;
    font-weight: 600;
  }
  .modal .id-list button:hover,
  .id-list button:hover {
    background: #eff6ff !important;
    border-color: #93c5fd !important;
  }
  .id-list button small { font-weight: 500; color: #6b7280; }
  tr.flash-row td:not(.nop) { animation: flashRow .9s ease; }
  @keyframes flashRow {
    0%, 100% { background: inherit; }
    30% { background: #fde68a !important; }
  }
  /* Luôn giữ chỗ scrollbar ngang/dọc — thêm/bớt cột không làm co viewport (nhảy hàng). */
  .wrap {
    flex: 1 1 auto;
    overflow: scroll;
    scrollbar-gutter: stable;
    padding: 0 0 24px;
  }
  /* Không min-width:100% — ít cột sẽ bị kéo giãn ô → lệch hàng khi đổi ngưỡng. */
  table {
    border-collapse: separate; border-spacing: 0;
    width: max-content;
    background: #fff;
  }
  th, td {
    border-bottom: 1px solid #9ca3af;
    border-right: 1px solid #9ca3af;
    padding: 6px 10px;
    text-align: center;
    white-space: nowrap;
  }
  /* Chiều cao hàng data cố định — thêm/bớt cột không đổi geometry dọc. */
  tbody td {
    height: 32px;
    max-height: 32px;
    box-sizing: border-box;
    line-height: 18px;
    vertical-align: middle;
  }
  /* Ẩn cột không thỏa threshold — không innerHTML lại (giữ scroll). */
  table.dc-table th.col-off,
  table.dc-table td.col-off {
    display: none !important;
  }
  thead th.pct {
    position: sticky; top: 0; z-index: 4;
    background: #0f766e; color: #ecfdf5;
    font-weight: 700; font-variant-numeric: tabular-nums;
    height: 28px; box-sizing: border-box;
  }
  thead th.xy {
    position: sticky; top: 28px; z-index: 4;

  }
  thead th.name {
    position: sticky; top: 56px; z-index: 4;
    background: #1f2937; color: #fff;
    font-weight: 600;
    height: 30px; box-sizing: border-box;
  }
  /* Freeze pane ngang: id(72) | pool(148) | phá(--viol-w) | rest(--rest-w) */
  table.dc-table {
    --viol-w: 48px;
    --rest-w: 48px;
  }
  thead th.id.pct {
    position: sticky; top: 0; left: 0; z-index: 8;

    min-width: 72px; width: 72px; max-width: 72px;
  }
  thead th.id.xy {

    min-width: 72px; width: 72px; max-width: 72px;
  }
  thead th.id.name {
    position: sticky; top: 56px; left: 0; z-index: 8;
    background: #111827; text-align: left;
    box-sizing: border-box;
    min-width: 72px; width: 72px; max-width: 72px;
  }
  td.id {
    position: sticky; left: 0; z-index: 5;
    text-align: left;
    font-variant-numeric: tabular-nums;

    background: #fff;

  }
  thead th.pool-h.pct {
    position: sticky; top: 0; left: 72px; z-index: 7;
    background: #0f766e; color: #ecfdf5;
    font-weight: 700;
    box-sizing: border-box;
    min-width: 148px; width: 148px; max-width: 148px;
  }
  thead th.pool-h.xy {
    position: sticky; top: 28px; left: 72px; z-index: 7;
    background: #115e59; color: #ccfbf1;
    font-weight: 600;
    box-sizing: border-box;
    min-width: 148px; width: 148px; max-width: 148px;
  }
  thead th.pool-h.name {
    position: sticky; top: 56px; left: 72px; z-index: 7;
    background: #1e3a5f; color: #bfdbfe;

    min-width: 148px; width: 148px; max-width: 148px;
    border-bottom: 3px solid #111827;
  }
  td.pool-nums {

    background: #fff;

  tr:nth-child(even) td.pool-nums { background: #eff6ff; }

  }
  thead th.viol-h.xy {

    background: #115e59; color: #ccfbf1;
    font-weight: 600;
    box-sizing: border-box;
    min-width: var(--viol-w); width: var(--viol-w); max-width: var(--viol-w);

  thead th.viol-h.name {
    position: sticky; top: 56px; left: 220px; z-index: 7;

  td.viol-nums {

  let tableBundle = null;
  const TH_LS_KEY = 'ticks.threshold';

  function isEmptyResultRow(row) {
    return !String((row && (row.result || row.Result)) || '').trim();
  }

  function parseMainNums(s) {
    if (!s) return [];
    return String(s).split('|')[0].split(',')
      .map((x) => parseInt(x, 10))
      .filter((n) => !isNaN(n));
  }

  function rowIdOf(row, i) {
    const raw = String(row.id || row.ID || '').replace(/^0+/, '');
    const n = parseInt(raw, 10);
    return Number.isFinite(n) ? n : i + 1;

  function collectDirectedAdjEdgeIndices(histSets, y, x) {
    const idxs = [];
    for (let e = 0; e < histSets.length - 1; e++) {
      if (histSets[e].has(y) && histSets[e + 1].has(x)) idxs.push(e);
    }
    return idxs;
  }

  function nonOverlapAdjCountStarts(idxs) {
    const sorted = idxs.slice().sort((a, b) => a - b);
    let last = -3;
    const counted = [];
    for (let i = 0; i < sorted.length; i++) {
      const ii = sorted[i];
      if (ii > last + 1) {
        counted.push(ii);
        last = ii;
      }
    }
    return counted;
  }

  /** focusIdx có thể = rows.length (kỳ giả lập chưa có đáp án). */
  function enumerateTail3Cands(rows, rowNums, focusIdx) {
    const n = rows.length;
    const idx = focusIdx;
    if (idx < 1 || idx > n) return [];
    const phaseRow = rows[idx - 1];
    if (!phaseRow || isEmptyResultRow(phaseRow)) return [];
    const phase1 = rowNums[idx - 1];
    if (!phase1 || phase1.length !== 5) return [];
    const lookback = 20;
    const histStart = Math.max(0, idx - lookback);
    if (idx - histStart < 3) return [];
    const answerSet = new Set(idx < n ? rowNums[idx] : []);
    const histSets = [];
    for (let r = histStart; r < idx; r++) {
      histSets.push(new Set(rowNums[r] || []));
    }
    const byNum = new Map();
    for (let yi = 0; yi < phase1.length; yi++) {
      const y = phase1[yi];
      for (let x = 1; x <= 35; x++) {
        if (x === y) continue;
        const counted = nonOverlapAdjCountStarts(
          collectDirectedAdjEdgeIndices(histSets, y, x)
        );
        if (counted.length < 2) continue;
        if (!byNum.has(x)) {
          byNum.set(x, { num: x, inAnswer: answerSet.has(x) });
        }
      }
    }
    return Array.from(byNum.values());
  }

  function buildCandsCache(rows, rowNums) {
    const n = rows.length;
    const cache = new Array(n);
    for (let i = 0; i < n; i++) {
      cache[i] = enumerateTail3Cands(rows, rowNums, i);
    }
    return cache;
  }

  function windowCounts(rowNums, focusIdx) {
    const counts = new Int16Array(36);
    for (let r = focusIdx - 10; r < focusIdx; r++) {
      if (r < 0 || r >= rowNums.length) continue;
      const nums = rowNums[r];
      for (let ni = 0; ni < nums.length; ni++) {
        const v = nums[ni];
        if (v >= 1 && v <= 35) counts[v]++;
      }
    }
    return counts;
  }

  /**
   * Cần ít nhất 1 hàng W10 có derive[D] và peer[P] khác số (cùng chuỗi).
   * Chỉ có derive freq=D mà không còn P khác cùng hàng → disable (vd 942,(5,5)).
   */
  function hasDerivePeerWitness(rowNums, focusIdx, cands, counts, deriveFreq, peerFreq) {
    if (!cands || !cands.length) return false;
    const derivesD = [];
    for (let ci = 0; ci < cands.length; ci++) {
      const c = cands[ci];
      if (!c) continue;
      if ((counts[c.num] | 0) === deriveFreq) derivesD.push(c.num);
    }
    if (!derivesD.length) return false;
    const deriveDSet = new Set(derivesD);
    for (let r = focusIdx - 10; r < focusIdx; r++) {
      if (r < 0 || r >= rowNums.length) continue;
      const nums = rowNums[r];
      if (!nums.length) continue;
      let hasDerive = false;
      for (let di = 0; di < derivesD.length; di++) {
        if (nums.indexOf(derivesD[di]) !== -1) {
          hasDerive = true;
          break;
        }
      }
      if (!hasDerive) continue;
      for (let ni = 0; ni < nums.length; ni++) {
        const v = nums[ni];
        if (!(v >= 1 && v <= 35)) continue;
        if (deriveDSet.has(v)) continue;
        if ((counts[v] | 0) === peerFreq) return true;
      }
    }
    return false;
  }

  function isPairDisabled(rowNums, focusIdx, cands, counts, deriveFreq, peerFreq) {
    return !hasDerivePeerWitness(rowNums, focusIdx, cands, counts, deriveFreq, peerFreq);
  }

  function splitFor(rows, rowNums, candsCache, deriveFreq, peerFreq) {
    const n = rows.length;
    const hold = [];
    const violate = [];
    const disabled = [];
    /** @type {Map<number, Set<number>>} */
    const violNums = new Map();
    /** Peer loại theo (D,P) tại kỳ — hợp thành cột pool; phá ⊆ pool. */
    /** @type {Map<number, Set<number>>} */
    const poolNums = new Map();
    const counts = new Int16Array(36);
    const addRow = (ri, sign) => {
      if (ri < 0 || ri >= n) return;
      const nums = rowNums[ri];
      for (let ni = 0; ni < nums.length; ni++) {
        const v = nums[ni];
        if (v >= 1 && v <= 35) counts[v] += sign;
      }
    };

    for (let i = 0; i < n; i++) {
      if (i >= 10 && rowNums[i].length) {
        const cands = candsCache[i] || [];
        if (isPairDisabled(rowNums, i, cands, counts, deriveFreq, peerFreq)) {
          disabled.push(i);
        } else {
          const answerSet = new Set(rowNums[i]);
          const derivesD = [];
          for (let ci = 0; ci < cands.length; ci++) {
            const c = cands[ci];
            if (!c) continue;
            if (deriveFreq != null && (counts[c.num] | 0) !== deriveFreq) continue;
            derivesD.push(c.num);
          }
          const deriveDSet = new Set(derivesD);
          let applicable = false;
          let isViol = false;
          /** @type {Set<number>|null} */
          let hitPeers = null;
          /** @type {Set<number>|null} */
          let allPeers = null;
          const winStart = i - 10;
          for (let r = winStart; r < i; r++) {
            const nums = rowNums[r];
            if (!nums.length) continue;
            const derivesOnRow = [];
            const seenD = new Set();
            for (let di = 0; di < derivesD.length; di++) {
              const x = derivesD[di];
              if (seenD.has(x)) continue;
              if (nums.indexOf(x) === -1) continue;
              seenD.add(x);
              derivesOnRow.push(x);
            }
            if (!derivesOnRow.length) continue;
            const wantPeer = peerFreq != null ? peerFreq : (counts[derivesOnRow[0]] | 0);
            const peersOnRow = [];
            const seenP = new Set();
            for (let ni = 0; ni < nums.length; ni++) {
              const v = nums[ni];
              if (!(v >= 1 && v <= 35) || seenP.has(v)) continue;
              if (deriveDSet.has(v)) continue;
              if ((counts[v] | 0) !== wantPeer) continue;
              seenP.add(v);
              peersOnRow.push(v);
            }
            if (!peersOnRow.length) continue;
            applicable = true;
            if (!allPeers) allPeers = new Set();
            for (let pi = 0; pi < peersOnRow.length; pi++) allPeers.add(peersOnRow[pi]);
            let anyDeriveInAnswer = false;
            for (let di = 0; di < derivesOnRow.length; di++) {
              if (answerSet.has(derivesOnRow[di])) {
                anyDeriveInAnswer = true;
                break;
              }
            }
            if (anyDeriveInAnswer) continue;
            for (let pi = 0; pi < peersOnRow.length; pi++) {
              if (answerSet.has(peersOnRow[pi])) {
                isViol = true;
                if (!hitPeers) hitPeers = new Set();
                hitPeers.add(peersOnRow[pi]);
              }
            }
          }
          if (applicable) {
            if (allPeers && allPeers.size) poolNums.set(i, allPeers);
            if (isViol) {
              violate.push(i);
              if (hitPeers && hitPeers.size) violNums.set(i, hitPeers);
            } else hold.push(i);
          }
        }
      }
      addRow(i, 1);
      if (i >= 10) addRow(i - 10, -1);
    }
    return {
      hold: new Set(hold),
      violate: new Set(violate),
      disabled: new Set(disabled),
      violNums: violNums,
      poolNums: poolNums
    };
  }

  /** Chi tiết loại peer khi giả định (D,P) đúng — trước đáp án. */
  function elimDetailsForPair(rows, rowNums, ids, focusIdx, focusId, cands, counts, D, P) {
    const label = '(' + D + ',' + P + ')';
    if (isPairDisabled(rowNums, focusIdx, cands, counts, D, P)) {
      return { label, D, P, disabled: true, lines: [], elim: [] };
    }
    const derivesD = [];
    for (let ci = 0; ci < cands.length; ci++) {
      const c = cands[ci];
      if (!c) continue;
      if ((counts[c.num] | 0) === D) derivesD.push(c.num);
    }
    const deriveDSet = new Set(derivesD);
    const lines = [];
    const elim = new Set();
    for (let r = focusIdx - 10; r < focusIdx; r++) {
      if (r < 0 || r >= rowNums.length) continue;
      const nums = rowNums[r];
      if (!nums.length) continue;
      const chuoi = focusId - ids[r];
      const derivesOnRow = [];
      for (let di = 0; di < derivesD.length; di++) {
        const x = derivesD[di];
        if (nums.indexOf(x) !== -1) derivesOnRow.push(x);
      }
      if (!derivesOnRow.length) continue;
      const peersOnRow = [];
      const seenP = new Set();
      for (let ni = 0; ni < nums.length; ni++) {
        const v = nums[ni];
        if (!(v >= 1 && v <= 35) || seenP.has(v)) continue;
        if (deriveDSet.has(v)) continue;
        if ((counts[v] | 0) !== P) continue;
        seenP.add(v);
        peersOnRow.push(v);
      }
      if (!peersOnRow.length) continue;
      peersOnRow.forEach((p) => elim.add(p));
      lines.push({
        chuoi: chuoi,
        rowId: ids[r],
        derives: derivesOnRow.slice(),
        peers: peersOnRow.slice()
      });
    }
    return {
      label,
      D,
      P,
      disabled: false,
      lines,
      elim: Array.from(elim).sort((a, b) => a - b)
    };
  }

  /** Peer nằm trong đáp án (derive không) → phá luật (D,P). */
  function violateDetailsForPair(rows, rowNums, ids, focusIdx, focusId, cands, counts, D, P) {
    const label = '(' + D + ',' + P + ')';
    if (isPairDisabled(rowNums, focusIdx, cands, counts, D, P)) {
      return { label, D, P, disabled: true, lines: [], viol: [] };
    }
    const answerSet = new Set(rowNums[focusIdx] || []);
    const derivesD = [];
    for (let ci = 0; ci < cands.length; ci++) {
      const c = cands[ci];
      if (!c) continue;
      if ((counts[c.num] | 0) === D) derivesD.push(c.num);
    }
    const deriveDSet = new Set(derivesD);
    const lines = [];
    const viol = new Set();
    for (let r = focusIdx - 10; r < focusIdx; r++) {
      if (r < 0 || r >= rowNums.length) continue;
      const nums = rowNums[r];
      if (!nums.length) continue;
      const chuoi = focusId - ids[r];
      const derivesOnRow = [];
      for (let di = 0; di < derivesD.length; di++) {
        const x = derivesD[di];
        if (nums.indexOf(x) !== -1) derivesOnRow.push(x);
      }
      if (!derivesOnRow.length) continue;
      const peersOnRow = [];
      const seenP = new Set();
      for (let ni = 0; ni < nums.length; ni++) {
        const v = nums[ni];
        if (!(v >= 1 && v <= 35) || seenP.has(v)) continue;
        if (deriveDSet.has(v)) continue;
        if ((counts[v] | 0) !== P) continue;
        seenP.add(v);
        peersOnRow.push(v);
      }
      if (!peersOnRow.length) continue;
      let anyDeriveInAnswer = false;
      for (let di = 0; di < derivesOnRow.length; di++) {
        if (answerSet.has(derivesOnRow[di])) {
          anyDeriveInAnswer = true;
          break;
        }
      }
      if (anyDeriveInAnswer) continue;
      const hit = [];
      for (let pi = 0; pi < peersOnRow.length; pi++) {
        const p = peersOnRow[pi];
        if (answerSet.has(p)) {
          hit.push(p);
          viol.add(p);
        }
      }
      if (!hit.length) continue;
      lines.push({
        chuoi: chuoi,
        rowId: ids[r],
        derives: derivesOnRow.slice(),
        peers: hit.slice()
      });
    }
    return {
      label,
      D,
      P,
      disabled: false,
      lines,
      viol: Array.from(viol).sort((a, b) => a - b)
    };
  }

  /**
   * Kỳ giả lập = kỳ ngay sau kỳ cuối CÓ đáp án.
   * Nếu data có hàng rỗng trailing (vd id 943 trống) thì focus đúng hàng đó,
   * không +1 thêm thành 944 (phase1 sẽ rỗng → mọi cột loại không).
   */
  function resolveSimFocus(rows, rowNums, ids) {
    let lastNe = rows.length - 1;
    while (lastNe >= 0 && !(rowNums[lastNe] && rowNums[lastNe].length)) {
      lastNe--;
    }
    if (lastNe < 0) return null;
    if (lastNe + 1 < rows.length && !(rowNums[lastNe + 1] && rowNums[lastNe + 1].length)) {
      return { focusIdx: lastNe + 1, focusId: ids[lastNe + 1] };
    }
    return { focusIdx: lastNe + 1, focusId: ids[lastNe] + 1 };
  }

  function buildSimState(rows, rowNums, ids) {
    const focus = resolveSimFocus(rows, rowNums, ids);
    if (!focus) return null;
    const { focusIdx, focusId } = focus;
    const counts = windowCounts(rowNums, focusIdx);
    const cands = enumerateTail3Cands(rows, rowNums, focusIdx);
    const disabled = [];
    const details = [];
    for (let pi = 0; pi < PAIRS.length; pi++) {
      const D = PAIRS[pi][0];
      const P = PAIRS[pi][1];
      disabled[pi] = isPairDisabled(rowNums, focusIdx, cands, counts, D, P);
      details[pi] = elimDetailsForPair(
        rows, rowNums, ids, focusIdx, focusId, cands, counts, D, P
      );
    }
    return { focusId, focusIdx, disabled, details, cands: cands.map((c) => c.num) };
  }

  function detailsAtFocus(focusIdx, focusId) {
    if (!dataCtx) return null;
    const { rows, rowNums, ids, candsCache } = dataCtx;
    const counts = windowCounts(rowNums, focusIdx);
    const cands = focusIdx < candsCache.length
      ? candsCache[focusIdx]
      : enumerateTail3Cands(rows, rowNums, focusIdx);
    const details = [];
    const violDetails = [];
    const disabled = [];
    for (let pi = 0; pi < PAIRS.length; pi++) {
      const D = PAIRS[pi][0];
      const P = PAIRS[pi][1];
      disabled[pi] = isPairDisabled(rowNums, focusIdx, cands || [], counts, D, P);
      details[pi] = elimDetailsForPair(
        rows, rowNums, ids, focusIdx, focusId, cands || [], counts, D, P
      );
      violDetails[pi] = violateDetailsForPair(
        rows, rowNums, ids, focusIdx, focusId, cands || [], counts, D, P
      );
    }
    return { focusId, focusIdx, details, violDetails, disabled };
  }

  /** T% cột luật (hold/applicable) — gắn sau nhãn (D,P) trong popup. */
  function pairHoldPctText(pi) {
    if (!tableBundle || !tableBundle.stats || !tableBundle.stats[pi]) return '';
    const pct = tableBundle.stats[pi].pct;
    if (!pct || pct === '—') return '';
    return ' ' + pct;
  }

  /**
   * Loại (cột ✓). excludePhá: số đã ∈ tập phá (luật khác) → không đưa vào loại.
   */
  function renderPairElimBlocks(details, disabled, mask, deriveSet, excludePhá) {
    const skip = excludePhá instanceof Set ? excludePhá : null;
    const chosen = [];
    const allElim = new Set();
    let html = '';
    for (let pi = 0; pi < PAIRS.length; pi++) {
      if (!mask[pi] || disabled[pi]) continue;
      const d = details[pi];
      if (!d) continue;
      chosen.push(d.label);
      const elimShow = [];
      for (let ei = 0; ei < d.elim.length; ei++) {
        const x = d.elim[ei];
        if (skip && skip.has(x)) continue;
        elimShow.push(x);
        allElim.add(x);
      }
      html += '<div class="pair-block">';
      html += '<div class="pair-title">' + d.label + pairHoldPctText(pi) + ' → loại: '
        + (elimShow.length ? formatNumsDeriveHtml(elimShow, deriveSet, ', ') : '(không)') + '</div>';
      if (!d.lines.length) {
        html += '<div class="none">Không có chuỗi witness derive[D]+peer[P]</div>';
      } else {
        for (let li = 0; li < d.lines.length; li++) {
          const L = d.lines[li];
          const peersShow = [];
          for (let pi2 = 0; pi2 < L.peers.length; pi2++) {
            const p = L.peers[pi2];
            if (skip && skip.has(p)) continue;
            peersShow.push(p);
          }
          html += '<div class="pair-line">chuỗi ' + L.chuoi
            + ' (id ' + L.rowId + '): derive {' + formatNumsDeriveHtml(L.derives, deriveSet, ',')
            + '} → loại {' + formatNumsDeriveHtml(peersShow, deriveSet, ',') + '}</div>';
        }
      }
      html += '</div>';
    }
    return { chosen, allElim, html };
  }

  function renderPairViolBlocks(violDetails, disabled, violMask, lineSuffix, deriveSet) {
    const suffix = lineSuffix || 'đáp án có peer';
    const chosen = [];
    const allViol = new Set();
    let html = '';
    for (let pi = 0; pi < PAIRS.length; pi++) {
      if (!violMask[pi] || disabled[pi]) continue;
      const d = violDetails[pi];
      if (!d || !d.viol || !d.viol.length) continue;
      chosen.push(d.label);
      d.viol.forEach((x) => allViol.add(x));
      html += '<div class="pair-block viol-block">';
      html += '<div class="pair-title viol">' + d.label + pairHoldPctText(pi) + ' → phá: '
        + formatNumsDeriveHtml(d.viol, deriveSet, ', ') + '</div>';
      for (let li = 0; li < d.lines.length; li++) {
        const L = d.lines[li];
        html += '<div class="pair-line">chuỗi ' + L.chuoi
          + ' (id ' + L.rowId + '): derive {' + formatNumsDeriveHtml(L.derives, deriveSet, ',')
          + '} → ' + suffix + ' {' + formatNumsDeriveHtml(L.peers, deriveSet, ',') + '}</div>';
      }
      html += '</div>';
    }
    return { chosen, allViol, html };
  }

  function escapeAttr(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;');
  }

  const COPY_ICON_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">'
    + '<path fill="currentColor" d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>'
    + '</svg>';
  const COPY_OK_ICON_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">'
    + '<path fill="currentColor" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>'
    + '</svg>';

  /** Nút copy đang giữ hiệu ứng is-ok — tắt khi click nút copy khác. */
  let copyNumsOkBtn = null;

  function clearCopyNumsOkEffect() {
    if (!copyNumsOkBtn) return;
    if (copyNumsOkBtn.isConnected) {
      if (copyNumsOkBtn.getAttribute('data-copy-icon') === 'delta') {
        copyNumsOkBtn.textContent = 'Δ';
      } else {
        copyNumsOkBtn.innerHTML = COPY_ICON_SVG;
      }
      copyNumsOkBtn.classList.remove('is-ok');
    }
    copyNumsOkBtn = null;
  }

  /** Nút copy dãy a,b,c thuần (không freq, không style). */
  function copyNumsBtnHtml(nums) {
    const csv = (nums || []).join(',');
    return '<button type="button" class="copy-nums-btn" data-copy="'
      + escapeAttr(csv)
      + '" title="Copy ' + (csv ? csv : '(rỗng)') + '" aria-label="Copy dãy số">'
      + COPY_ICON_SVG + '</button>';
  }

  /** Nút Δ — copy hiệu pool(dòng này) \ pool(mốc trên). Tooltip custom (không title). */
  function copyDeltaBtnHtml(nums) {
    const csv = (nums || []).join(',');
    return '<button type="button" class="copy-nums-btn copy-delta-btn" data-copy="'
      + escapeAttr(csv)
      + '" data-copy-icon="delta" aria-label="Copy hiệu pool Δ: '
      + escapeAttr(csv || '(rỗng)') + '">Δ</button>';
  }

  /** poolCurr \ poolPrev — giữ thứ tự trong poolCurr. */
  function poolDiffFromPrev(poolCurr, poolPrev) {
    const prevSet = new Set(poolPrev || []);
    const out = [];
    const curr = poolCurr || [];
    for (let i = 0; i < curr.length; i++) {
      const n = curr[i];
      if (!prevSet.has(n)) out.push(n);
    }
    return out;
  }

  function copyTextToClipboard(text, btn) {
    const done = () => {
      if (!btn) return;
      if (copyNumsOkBtn && copyNumsOkBtn !== btn) clearCopyNumsOkEffect();
      btn.innerHTML = COPY_OK_ICON_SVG;
      btn.classList.add('is-ok');
      copyNumsOkBtn = btn;
    };
    const fail = () => {
      if (btn) btn.title = 'Copy thất bại';
    };
    const plain = text || '';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(plain).then(done).catch(fail);
      return;
    }
    try {
      const ta = document.createElement('textarea');
      ta.value = plain;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    } catch (e) {
      fail();
    }
  }

  function wrapDeriveMarkHtml(innerHtml, num, deriveSet) {
    if (deriveSet && deriveSet.has(num)) {
      return '<span class="derive-mark">' + innerHtml + '</span>';
    }
    return innerHtml;
  }

  /**
   * Danh sách số; gạch chân ∈ derive; phaSet = tô màu phá (khi đã có ĐA).
   * hoverMode: 'tl' | 'tl-pha' | 'tl-pha-rm' (sim: click bỏ phá) | 'affect'
   */
  function formatNumsDeriveHtml(nums, deriveSet, sep, phaSet, hoverMode) {
    const list = nums || [];
    const joiner = sep == null ? ',' : sep;
    const parts = [];
    for (let i = 0; i < list.length; i++) {
      const n = list[i];
      let bit = wrapDeriveMarkHtml(String(n), n, deriveSet);
      if (phaSet && phaSet.has(n)) {
        bit = '<span class="pha-mark">' + bit + '</span>';
      }
      if (hoverMode === 'tl-pha-rm') {
        bit = '<span class="tl-num tl-pha-rm" data-hl-num="' + n
          + '" data-hl-col="pha" data-tl-pha-rm="' + n
          + '" title="Click: bỏ khỏi phá">' + bit + '</span>';
      } else if (hoverMode === 'tl' || hoverMode === 'tl-pha') {
        const col = hoverMode === 'tl-pha' ? 'pha' : 'pool';
        bit = '<span class="tl-num" data-hl-num="' + n + '" data-hl-col="' + col + '">' + bit + '</span>';
      } else if (hoverMode === 'affect') {
        bit = '<span class="affect-num" data-affect-num="' + n + '">' + bit + '</span>';
      }
      parts.push(bit);
    }
    return parts.join(joiner);
  }

  function formatPoolSubHtml(arr, boldSet, deriveSet, label) {
    const nums = arr || [];
    const tag = label || 'pool';
    let body;
    if (!nums.length) {
      body = tag + '[0] {}';
    } else {
      const parts = [];
      for (let i = 0; i < nums.length; i++) {
        const n = nums[i];
        const isBold = !!(boldSet && boldSet.has(n));
        let bit = wrapDeriveMarkHtml(String(n), n, deriveSet);
        if (isBold) bit = '<b>' + bit + '</b>';
        parts.push(bit);
      }
      body = tag + '[' + nums.length + '] {' + parts.join(',') + '}';
    }
    return '<span class="pool-sub-text">' + body + '</span>' + copyNumsBtnHtml(nums);
  }

  function toSubscript(n) {
    return String(n).replace(/[0-9]/g, (d) => SUBSCRIPT_DIGITS[Number(d)]);
  }

  /**
   * Cột khi pool tối đa: hợp active của >=1% và <=100%
   * (rest cố định, không đổi theo threshold header).
   */
  function maxPoolPairIndices() {
    const seen = new Set();
    const out = [];
    function addAll(list) {
      for (let i = 0; i < list.length; i++) {
        const pi = list[i];
        if (seen.has(pi)) continue;
        seen.add(pi);
        out.push(pi);
      }
    }
    addAll(activePairIndicesAt('>=', 1));
    addAll(activePairIndicesAt('<=', 100));
    return out;
  }

  /** rest = (1..35) \ nonexist(freq=0) \ poolMax; mỗi số kèm freq dưới chân. */
  function buildRestItems(poolMaxArr, counts) {
    const poolSet = new Set(poolMaxArr || []);
    const out = [];
    for (let n = 1; n <= 35; n++) {
      const f = counts && (counts[n] | 0);
      if (!f) continue;
      if (poolSet.has(n)) continue;
      out.push({ num: n, freq: f });
    }
    return out;
  }

  function formatRestSubHtml(restItems, answerSet, deriveSet) {
    const items = restItems || [];
    const nums = items.map((it) => it.num);
    let body;
    if (!items.length) {
      body = 'rest[0] {}';
    } else {
      const ans = answerSet || null;
      const parts = [];
      for (let i = 0; i < items.length; i++) {
        const it = items[i];
        let bit = String(it.num) + '<span class="freq-sub">' + toSubscript(it.freq) + '</span>';
        bit = wrapDeriveMarkHtml(bit, it.num, deriveSet);
        if (ans && ans.has(it.num)) bit = '<span class="rest-hit">' + bit + '</span>';
        parts.push(bit);
      }
      body = 'rest[' + items.length + '] {' + parts.join(',') + '}';
    }
    return '<span class="pool-sub-text">' + body + '</span>' + copyNumsBtnHtml(nums);
  }

  function hideModalRestPool() {
    if (modalRest) {
      modalRest.hidden = true;
      modalRest.innerHTML = '';
    }
    if (modalPool) {
      modalPool.hidden = true;
      modalPool.innerHTML = '';
    }
  }

  function resetPopupPoolTrack() {
    popupPoolPrev = null;
    popupPoolBold = new Set();
  }

  /**
   * Sim timeline: số user click (từ pool đậm) → hiện trên cột phá
   * từ mốc lần đầu số đó ∈ newlyIn, bất kể click ở hàng nào.
   * @type {number[]}
   */
  let simTlPháPicks = [];
  /** @type {object[]|null} */
  let simTlMilestonesCache = null;
  /** @type {Set<number>|null} */
  let simTlDeriveSetCache = null;
  /** @type {number[]} pool max — Loại sim = poolMax \ picks */
  let simTlPoolMaxCache = [];

  function clearSimTlPháCache() {
    simTlMilestonesCache = null;
    simTlDeriveSetCache = null;
    simTlPoolMaxCache = [];
  }

  function clearSimTlPháPicks() {
    simTlPháPicks = [];
    clearSimTlPháCache();
  }

  /** milestone index đầu tiên số n được tô đậm (newlyIn). */
  function firstBoldMilestoneIndex(milestones, num) {
    const n = Number(num);
    if (!milestones || !milestones.length || !Number.isFinite(n)) return -1;
    for (let i = 0; i < milestones.length; i++) {
      const neu = milestones[i].newlyIn || [];
      for (let j = 0; j < neu.length; j++) {
        if (Number(neu[j]) === n) return i;
      }
    }
    return -1;
  }

  /** Map num → first bold milestone index. */
  function buildFirstBoldIndexMap(milestones) {
    const map = new Map();
    if (!milestones) return map;
    for (let i = 0; i < milestones.length; i++) {
      const neu = milestones[i].newlyIn || [];
      for (let j = 0; j < neu.length; j++) {
        const n = Number(neu[j]);
        if (!map.has(n)) map.set(n, i);
      }
    }
    return map;
  }

  /**
   * Chuỗi phá sim tại mốc mi: các pick có firstBold ≤ mi,
   * sắp theo firstBold rồi theo thứ tự click.
   */
  function simPháPicksAtMilestone(milestones, picks, mi, firstBoldMap) {
    const items = [];
    const fb = firstBoldMap || buildFirstBoldIndexMap(milestones);
    for (let p = 0; p < (picks || []).length; p++) {
      const n = Number(picks[p]);
      if (!Number.isFinite(n)) continue;
      const fi = fb.has(n) ? fb.get(n) : -1;
      if (fi < 0 || fi > mi) continue;
      items.push({ n: n, fi: fi, ord: p });
    }
    items.sort((a, b) => (a.fi - b.fi) || (a.ord - b.ord));
    const out = [];
    const seen = new Set();
    for (let i = 0; i < items.length; i++) {
      if (seen.has(items[i].n)) continue;
      seen.add(items[i].n);
      out.push(items[i].n);
    }
    return out;
  }

  const SIM_PHA_PICK_MAX = 5;

  function toggleSimTlPháPick(num) {
    const n = Number(num);
    if (!Number.isFinite(n)) return false;
    if (!simTlMilestonesCache || !simTlMilestonesCache.length) return false;
    if (firstBoldMilestoneIndex(simTlMilestonesCache, n) < 0) return false;
    const ix = simTlPháPicks.indexOf(n);
    if (ix >= 0) {
      simTlPháPicks.splice(ix, 1);
      return true;
    }
    /* Cột phá tối đa 5 số — chặn pick thêm. */
    if (simTlPháPicks.length >= SIM_PHA_PICK_MAX) return false;
    simTlPháPicks.push(n);
    return true;
  }

  /** Bỏ số khỏi cột phá sim (click trên cột phá). */
  function removeSimTlPháPick(num) {
    const n = Number(num);
    if (!Number.isFinite(n)) return false;
    const ix = simTlPháPicks.indexOf(n);
    if (ix < 0) return false;
    simTlPháPicks.splice(ix, 1);
    return true;
  }

  /** Tô đỏ số đã pick trên các dòng "Ảnh hưởng k luật". */
  function syncSimAffectPhaMarks() {
    if (!modalBody) return;
    const picked = new Set();
    for (let i = 0; i < simTlPháPicks.length; i++) {
      picked.add(Number(simTlPháPicks[i]));
    }
    modalBody.querySelectorAll('.affect-num[data-affect-num]').forEach((el) => {
      const n = Number(el.getAttribute('data-affect-num'));
      const on = Number.isFinite(n) && picked.has(n);
      let mark = null;
      for (let c = el.firstChild; c; c = c.nextSibling) {
        if (c.nodeType === 1 && c.classList && c.classList.contains('pha-mark')) {
          mark = c;
          break;
        }
      }
      if (on && !mark) {
        mark = document.createElement('span');
        mark.className = 'pha-mark';
        while (el.firstChild) mark.appendChild(el.firstChild);
        el.appendChild(mark);
      } else if (!on && mark) {
        while (mark.firstChild) el.insertBefore(mark.firstChild, mark);
        el.removeChild(mark);
      }
    });
  }

  /**
   * Loại sim: pool max trừ các peer thuộc luật dính pick.
   * Pick số x → mọi luật (pool max) có x trong elim đều bị coi là phá
   * → toàn bộ elim của luật đó ra khỏi Loại (không chỉ x).
   */
  function buildSimLoạiArr(poolMaxArr, picks) {
    const poolMax = Array.isArray(poolMaxArr) ? poolMaxArr : [];
    const picked = new Set();
    for (let i = 0; i < (picks || []).length; i++) {
      const n = Number(picks[i]);
      if (Number.isFinite(n)) picked.add(n);
    }
    if (!picked.size) return poolMax.slice();
    const ban = new Set(picked);
    if (simState && simState.details) {
      const pairs = maxPoolPairIndices();
      for (let ai = 0; ai < pairs.length; ai++) {
        const pi = pairs[ai];
        if (simState.disabled && simState.disabled[pi]) continue;
        const d = simState.details[pi];
        if (!d || !d.elim || !d.elim.length) continue;
        let hit = false;
        for (let ei = 0; ei < d.elim.length; ei++) {
          if (picked.has(Number(d.elim[ei]))) {
            hit = true;
            break;
          }
        }
        if (!hit) continue;
        for (let ei = 0; ei < d.elim.length; ei++) {
          const x = Number(d.elim[ei]);
          if (Number.isFinite(x)) ban.add(x);
        }
      }
    }
    const out = [];
    for (let i = 0; i < poolMax.length; i++) {
      const n = Number(poolMax[i]);
      if (!Number.isFinite(n) || ban.has(n)) continue;
      out.push(n);
    }
    return out;
  }

  /**
   * Tóm tắt Loại/Phá luật trên popup sim:
   * - Loại = pool max \ (peer mọi luật dính pick)
   * - Phá luật = các số đã click
   */
  function formatSimPickSumHtml(deriveSet, poolMaxArr) {
    const poolMax = Array.isArray(poolMaxArr) ? poolMaxArr : simTlPoolMaxCache;
    const elimArr = buildSimLoạiArr(poolMax, simTlPháPicks);
    const picksSorted = simTlPháPicks.slice().sort((a, b) => a - b);
    let sumHtml = elimArr.length
      ? ('Loại (' + elimArr.length + ' số): '
        + formatNumsDeriveHtml(elimArr, deriveSet, ', '))
      : 'Loại (0 số): (không)';
    sumHtml += '<div class="viol-sum">'
      + (picksSorted.length
        ? ('Phá luật (' + picksSorted.length + ' số): '
          + formatNumsDeriveHtml(picksSorted, deriveSet, ', '))
        : 'Phá luật (0 số): (không)')
      + '</div>';
    return sumHtml;
  }

  function refreshSimPickSumDom() {
    if (!modalSum || !simIdOn || popupKind !== 'elim') return;
    modalSum.innerHTML = formatSimPickSumHtml(simTlDeriveSetCache, simTlPoolMaxCache);
    modalSum.hidden = false;
  }

  function refreshSimTimelinePháDom() {
    if (!modalTimeline || !simTlMilestonesCache) return;
    modalTimeline.innerHTML = renderThresholdTimelineHtml(
      simTlMilestonesCache,
      'sim',
      simTlDeriveSetCache,
      simTlPháPicks
    );
    syncSimAffectPhaMarks();
    refreshSimPickSumDom();
  }

  /* —— Sync click phá sim giữa tab cùng mã định danh (trống = không sync) —— */
  const SIM_ROOM_TAG_SS = 'ticks.simRoomTag';
  const SIM_TAB_ID_SS = 'ticks.simTabId';
  const SIM_PHA_BC_NAME = 'sua-sim-pha-picks';
  const SIM_PHA_LS_PREFIX = 'sua:simPhaPicks:';
  let simRoomTag = '';
  let simTabId = '';
  let simPhaSyncApplying = false;
  let simPhaLastAppliedT = 0;
  /** @type {BroadcastChannel|null} */
  let simPhaBc = null;
  const simRoomTagEl = document.getElementById('simRoomTag');

  function ensureSimTabId() {
    if (simTabId) return simTabId;
    try {
      let id = sessionStorage.getItem(SIM_TAB_ID_SS);
      if (!id) {
        id = 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        sessionStorage.setItem(SIM_TAB_ID_SS, id);
      }
      simTabId = id;
    } catch (e) {
      simTabId = 't' + Math.random().toString(36).slice(2, 9);
    }
    return simTabId;
  }

  function normalizeSimRoomTag(raw) {
    return String(raw == null ? '' : raw)
      .replace(/[^a-zA-Z0-9]/g, '')
      .slice(0, 3)
      .toUpperCase();
  }

  function simPhaStorageKey(tag) {
    return SIM_PHA_LS_PREFIX + tag;
  }

  function readStoredSimPhaPicks(tag) {
    if (!tag) return { picks: [], t: 0 };
    try {
      const raw = localStorage.getItem(simPhaStorageKey(tag));
      if (!raw) return { picks: [], t: 0 };
      const o = JSON.parse(raw);
      if (!o || !Array.isArray(o.picks)) return { picks: [], t: 0 };
      return { picks: o.picks, t: Number(o.t) || 0 };
    } catch (e) {
      return { picks: [], t: 0 };
    }
  }

  function publishSimTlPháPicks() {
    if (simPhaSyncApplying) return;
    const tag = simRoomTag;
    if (!tag) return;
    const payload = {
      type: 'sim-pha-picks',
      tag: tag,
      picks: simTlPháPicks.slice(),
      t: Date.now(),
      from: ensureSimTabId()
    };
    try {
      if (simPhaBc) simPhaBc.postMessage(payload);
    } catch (e) { /* ignore */ }
    try {
      localStorage.setItem(simPhaStorageKey(tag), JSON.stringify({
        picks: payload.picks,
        t: payload.t,
        from: payload.from
      }));
    } catch (e) { /* ignore */ }
  }

  function applyRemoteSimTlPháPicks(picks, meta) {
    const metaT = meta && meta.t != null ? Number(meta.t) : 0;
    if (metaT && simPhaLastAppliedT && metaT < simPhaLastAppliedT
      && !(meta && meta.force)) {
      return;
    }
    const next = [];
    const seen = new Set();
    const raw = picks || [];
    for (let i = 0; i < raw.length; i++) {
      if (next.length >= SIM_PHA_PICK_MAX) break;
      const n = Number(raw[i]);
      if (!Number.isFinite(n) || seen.has(n)) continue;
      seen.add(n);
      next.push(n);
    }
    const same = next.length === simTlPháPicks.length
      && next.every((n, i) => n === simTlPháPicks[i]);
    if (same && !(meta && meta.force)) {
      if (metaT > simPhaLastAppliedT) simPhaLastAppliedT = metaT;
      return;
    }
    simPhaSyncApplying = true;
    try {
      if (metaT) simPhaLastAppliedT = metaT;
      simTlPháPicks = next;
      if (simIdOn && popupKind === 'elim' && simTlMilestonesCache) {
        const fb = buildFirstBoldIndexMap(simTlMilestonesCache);
        simTlPháPicks = simTlPháPicks.filter((n) => fb.has(Number(n)));
        refreshSimTimelinePháDom();
      } else if (simIdOn && popupKind === 'elim') {
        syncSimAffectPhaMarks();
        refreshSimPickSumDom();
      }
    } finally {
      requestAnimationFrame(() => { simPhaSyncApplying = false; });
    }
  }

  /**
   * Tab sau đặt mã đã có → ăn theo toàn bộ trạng thái phòng
   * (localStorage ngay + xin tab đang giữ mã trả lời live).
   * Không publish đè phòng khi join — chỉ seed nếu mã chưa từng có bản ghi.
   */
  function joinSimRoom(tag) {
    if (!tag) return;
    let hasKey = false;
    try {
      hasKey = localStorage.getItem(simPhaStorageKey(tag)) != null;
    } catch (e) { /* ignore */ }
    const stored = readStoredSimPhaPicks(tag);
    applyRemoteSimTlPháPicks(stored.picks, {
      force: true,
      t: stored.t || Date.now()
    });
    if (!hasKey) {
      requestAnimationFrame(() => {
        if (simRoomTag === tag) publishSimTlPháPicks();
      });
    }
    try {
      if (simPhaBc) {
        simPhaBc.postMessage({
          type: 'sim-pha-join',
          tag: tag,
          from: ensureSimTabId(),
          t: Date.now()
        });
      }
    } catch (e) { /* ignore */ }
  }

  function loadSimPhaPicksForTag(tag) {
    if (!tag) return;
    const stored = readStoredSimPhaPicks(tag);
    applyRemoteSimTlPháPicks(stored.picks, { force: true, t: stored.t });
  }

  function setSimRoomTag(raw, opts) {
    const next = normalizeSimRoomTag(raw);
    const prev = simRoomTag;
    simRoomTag = next;
    if (simRoomTagEl && simRoomTagEl.value !== next) simRoomTagEl.value = next;
    try {
      sessionStorage.setItem(SIM_ROOM_TAG_SS, next);
    } catch (e) { /* ignore */ }
    if (next && next !== prev) {
      /* Vào phòng có sẵn → cập nhật toàn bộ theo tab/mã trước. */
      joinSimRoom(next);
    }
    if (!next && prev) {
      /* Rời phòng — giữ picks local của tab này. */
    }
    if (opts && opts.publish && next) publishSimTlPháPicks();
  }

  function initSimRoomTagSync() {
    ensureSimTabId();
    try {
      if (typeof BroadcastChannel === 'function') {
        simPhaBc = new BroadcastChannel(SIM_PHA_BC_NAME);
        simPhaBc.onmessage = (ev) => {
          const msg = ev && ev.data;
          if (!msg || !msg.type) return;
          const tag = normalizeSimRoomTag(msg.tag);
          if (!tag || !simRoomTag || tag !== simRoomTag) return;
          if (msg.from && msg.from === ensureSimTabId()) return;
          if (msg.type === 'sim-pha-join') {
            /* Tab đang giữ mã → trả toàn bộ picks hiện tại cho tab mới vào. */
            publishSimTlPháPicks();
            return;
          }
          if (msg.type === 'sim-pha-picks') {
            applyRemoteSimTlPháPicks(msg.picks, {
              force: true,
              t: Number(msg.t) || Date.now()
            });
          }
        };
      }
    } catch (e) { /* ignore */ }
    window.addEventListener('storage', (e) => {
      if (!e || !simRoomTag) return;
      if (e.key !== simPhaStorageKey(simRoomTag)) return;
      if (!e.newValue) return;
      try {
        const o = JSON.parse(e.newValue);
        if (o && Array.isArray(o.picks)) {
          applyRemoteSimTlPháPicks(o.picks, {
            force: true,
            t: Number(o.t) || Date.now()
          });
        }
      } catch (err) { /* ignore */ }
    });
    try {
      const saved = sessionStorage.getItem(SIM_ROOM_TAG_SS);
      if (saved) setSimRoomTag(saved);
    } catch (e) { /* ignore */ }
    if (simRoomTagEl) {
      simRoomTagEl.addEventListener('input', () => {
        const cur = simRoomTagEl.value;
        const norm = normalizeSimRoomTag(cur);
        if (cur !== norm) simRoomTagEl.value = norm;
        setSimRoomTag(norm);
      });
      simRoomTagEl.addEventListener('blur', () => {
        setSimRoomTag(simRoomTagEl.value);
      });
    }
  }

  function syncPopupPoolBold(poolArr) {
    const next = new Set(poolArr);
    if (!popupPoolPrev) {
      popupPoolBold = new Set();
    } else {
      const newlyIn = [];
      next.forEach((n) => {
        if (!popupPoolPrev.has(n)) newlyIn.push(n);
      });
      if (newlyIn.length) {
        // Có số mới → chỉ đậm đúng các số vừa vào lần này.
        popupPoolBold = new Set(newlyIn);
      } else {
        // Không có số mới → giữ đậm các số đậm trước đó còn nằm trong pool.
        const kept = new Set();
        popupPoolBold.forEach((n) => {
          if (next.has(n)) kept.add(n);
        });
        popupPoolBold = kept;
      }
    }
    popupPoolPrev = next;
  }

  /** Đậm dòng pool phía trên = peer của luật mới ở mốc timeline cuối. */
  function seedPoolBoldFromMilestones(milestones, poolArr) {
    const bold = new Set();
    if (milestones && milestones.length) {
      const last = milestones[milestones.length - 1];
      const newly = last.newlyIn || [];
      for (let i = 0; i < newly.length; i++) bold.add(newly[i]);
    }
    popupPoolBold = bold;
    popupPoolPrev = new Set(poolArr);
  }

  function activePairIndicesAt(op, val) {
    if (!tableBundle) return [];
    const out = [];
    for (let pi = 0; pi < PAIRS.length; pi++) {
      const st = tableBundle.stats[pi];
      if (!st || !st.applicable) continue;
      if (pctMeets(st.pctNum, op, val)) out.push(pi);
    }
    out.sort((a, b) => {
      const Pa = PAIRS[a][1];
      const Pb = PAIRS[b][1];
      if (Pa !== Pb) return Pa - Pb;
      return PAIRS[a][0] - PAIRS[b][0];
    });
    return out;
  }

  function simPoolPháArrAt(active) {
    const poolSet = new Set();
    const pháArr = [];
    const pháSeen = new Set();
    if (!simState) return { pool: [], phá: [] };
    for (let ai = 0; ai < active.length; ai++) {
      const pi = active[ai];
      if (simState.disabled[pi]) continue;
      const d = simState.details[pi];
      if (!d || !d.elim) continue;
      d.elim.forEach((x) => poolSet.add(x));
      if (!simTicks[pi]) {
        d.elim.forEach((x) => {
          if (pháSeen.has(x)) return;
          pháSeen.add(x);
          pháArr.push(x);
        });
      }
    }
    return { pool: sortedNumsFromSet(poolSet), phá: pháArr };
  }

  /** Peer pool chỉ từ các cặp pairIndices (luật mới) tại kỳ i. */
  function poolNumsArrForPairs(i, pairIndices) {
    if (!tableBundle || !pairIndices || !pairIndices.length) return [];
    const { splits } = tableBundle;
    const set = new Set();
    for (let ai = 0; ai < pairIndices.length; ai++) {
      const pi = pairIndices[ai];
      const s = splits[pi];
      if (!s || s.disabled.has(i)) continue;
      if (!s.hold.has(i) && !s.violate.has(i)) continue;
      const pn = s.poolNums && s.poolNums.get(i);
      if (!pn) continue;
      pn.forEach((x) => set.add(x));
    }
    return Array.from(set);
  }

  function simPoolNumsForPairs(pairIndices) {
    if (!simState || !pairIndices || !pairIndices.length) return [];
    const set = new Set();
    for (let ai = 0; ai < pairIndices.length; ai++) {
      const pi = pairIndices[ai];
      if (simState.disabled[pi]) continue;
      const d = simState.details[pi];
      if (!d || !d.elim) continue;
      d.elim.forEach((x) => set.add(x));
    }
    return Array.from(set);
  }

  function lastAnsweredIdForRate() {
    if (!dataCtx) return null;
    for (let i = dataCtx.ids.length - 1; i >= 0; i--) {
      if (dataCtx.rowNums[i] && dataCtx.rowNums[i].length) return dataCtx.ids[i];
    }
    return null;
  }

  /** % phá luật tại một bộ cột active: (mẫu − tick đủ) / mẫu. */
  function violPctAtActive(active) {
    if (!tableBundle) return null;
    const { displayIdx, splits } = tableBundle;
    let full = 0;
    for (let j = 0; j < displayIdx.length; j++) {
      const i = displayIdx[j];
      let en = 0;
      let h = 0;
      for (let ai = 0; ai < active.length; ai++) {
        const pi = active[ai];
        if (splits[pi].disabled.has(i)) continue;
        en++;
        if (splits[pi].hold.has(i)) h++;
      }
      if (en > 0 && h === en) full++;
    }
    const lastId = lastAnsweredIdForRate();
    if (lastId == null) return null;
    const mau = lastId - MIN_ID + 1;
    if (mau <= 0) return null;
    return (100 * (mau - full)) / mau;
  }

  /**
   * Timeline từ đầu thang về ngưỡng hiện tại.
   * Ghi mốc khi |pool| đổi HOẶC có số phá mới (append) — vd 7 đã có trong pool
   * từ cột hold nhưng mới vào phá khi cột violate bật: vẫn phải append vào cột phá.
   * >= : 100→thVal · <= : 1→thVal · = : một mốc.
   * boldNums: mọi peer của luật MỚI (so với mốc trước) — kể cả số đã có trong pool.
   */
  function buildThresholdPoolTimeline(opts) {
    const op = thOp;
    const end = thVal;
    const steps = [];
    if (op === '>=') {
      for (let t = 100; t >= end; t--) steps.push(t);
    } else if (op === '<=') {
      for (let t = 1; t <= end; t++) steps.push(t);
    } else {
      steps.push(end);
    }
    let prevSize = null;
    /** @type {Set<number>|null} */
    let prevMilestoneActive = null;
    /** Phá append theo timeline — không sort. */
    const pháChain = [];
    const pháSeen = new Set();
    const milestones = [];
    const isHist = opts.mode === 'hist' && Number.isFinite(opts.focusIdx);
    for (let si = 0; si < steps.length; si++) {
      const t = steps[si];
      const active = activePairIndicesAt(op, t);
      let poolArr;
      let pháArr;
      if (isHist) {
        poolArr = poolNumsArrForRow(opts.focusIdx, active);
        pháArr = violNumsArrForRow(opts.focusIdx, active, true);
      } else {
        const packed = simPoolPháArrAt(active);
        poolArr = packed.pool;
        pháArr = packed.phá;
      }
      let pháGrew = false;
      for (let i = 0; i < pháArr.length; i++) {
        const n = pháArr[i];
        if (pháSeen.has(n)) continue;
        pháSeen.add(n);
        pháChain.push(n);
        pháGrew = true;
      }
      const poolChanged = prevSize === null || poolArr.length !== prevSize;
      if (!poolChanged && !pháGrew) continue;
      const newPairs = [];
      for (let ai = 0; ai < active.length; ai++) {
        const pi = active[ai];
        if (!prevMilestoneActive || !prevMilestoneActive.has(pi)) newPairs.push(pi);
      }
      const related = isHist
        ? poolNumsArrForPairs(opts.focusIdx, newPairs)
        : simPoolNumsForPairs(newPairs);
      const poolSet = new Set(poolArr);
      const boldNums = [];
      for (let i = 0; i < related.length; i++) {
        const n = related[i];
        if (poolSet.has(n)) boldNums.push(n);
      }
      const rate = violPctAtActive(active);
      milestones.push({
        t: t,
        pool: poolArr,
        phá: pháChain.slice(),
        newlyIn: boldNums,
        violPct: rate
      });
      prevSize = poolArr.length;
      prevMilestoneActive = new Set(active);
    }
    return milestones;
  }

  /**
   * @param {object} [pickOpts] sim only: { pickable: true, pickedSet: Set }
   */
  function formatTimelinePoolHtml(poolArr, newlyIn, deriveSet, prevPool, pickOpts) {
    const nums = poolArr || [];
    const bold = new Set(newlyIn || []);
    const pickable = !!(pickOpts && pickOpts.pickable);
    const pickedSet = (pickOpts && pickOpts.pickedSet instanceof Set)
      ? pickOpts.pickedSet
      : null;
    const parts = [];
    for (let i = 0; i < nums.length; i++) {
      const n = nums[i];
      const isBold = bold.has(n);
      let bit = wrapDeriveMarkHtml(String(n), n, deriveSet);
      if (isBold) bit = '<b>' + bit + '</b>';
      const canPick = pickable && isBold;
      const isPicked = !!(pickedSet && pickedSet.has(n));
      let cls = 'tl-num';
      if (canPick) cls += ' tl-pick';
      if (canPick && isPicked) cls += ' is-picked';
      bit = '<span class="' + cls + '" data-hl-num="' + n + '" data-hl-col="pool"'
        + (isBold ? ' data-hl-bold="1"' : '')
        + (canPick
          ? ' data-tl-pick="' + n
            + '" title="Click: append/gỡ khỏi phá (tối đa 5) từ mốc lần đầu tô đen"'
          : '')
        + '>' + bit + '</span>';
      parts.push(bit);
    }
    const body = 'pool[' + nums.length + ']{' + parts.join(',') + '}';
    let deltaBtn = '';
    if (prevPool) {
      const diff = poolDiffFromPrev(nums, prevPool);
      if (diff.length) deltaBtn = copyDeltaBtnHtml(diff);
    }
    return deltaBtn
      + '<span class="tl-pool-text">' + body + '</span>'
      + copyNumsBtnHtml(nums);
  }

  /**
   * Đếm mỗi số peer thuộc bao nhiêu luật (cột threshold applicable: hold∪violate).
   * Trả HTML các dòng "Ảnh hưởng k luật: a,b,c".
   * phaSet: số ∈ tập phá (chỉ khi đã có ĐA) → tô màu như phần phá.
   */
  function buildAffectByLawHtml(opts, deriveSet, phaSet) {
    const countByNum = new Map();
    const focusIdx = opts.focusIdx;
    if (opts.timelineMode === 'hist' && Number.isFinite(focusIdx) && tableBundle) {
      const active = activePairIndices();
      const { splits } = tableBundle;
      for (let ai = 0; ai < active.length; ai++) {
        const pi = active[ai];
        const s = splits[pi];
        if (!s || s.disabled.has(focusIdx)) continue;
        if (!s.hold.has(focusIdx) && !s.violate.has(focusIdx)) continue;
        const pn = s.poolNums && s.poolNums.get(focusIdx);
        if (!pn) continue;
        pn.forEach((x) => {
          countByNum.set(x, (countByNum.get(x) || 0) + 1);
        });
      }
    } else {
      const active = activePairIndices();
      const details = opts.details || [];
      const disabled = opts.disabled || [];
      for (let ai = 0; ai < active.length; ai++) {
        const pi = active[ai];
        if (disabled[pi]) continue;
        const d = details[pi];
        if (!d || !d.elim || !d.elim.length) continue;
        for (let ei = 0; ei < d.elim.length; ei++) {
          const x = d.elim[ei];
          countByNum.set(x, (countByNum.get(x) || 0) + 1);
        }
      }
    }
    if (!countByNum.size) return '';
    // Hist: tô đỏ số ∈ tập phá (có ĐA). Sim: tô đỏ số user đã click vào phá.
    const phaMark = (
      (opts.timelineMode === 'hist'
        && opts.answerSet instanceof Set
        && opts.answerSet.size
        && phaSet instanceof Set
        && phaSet.size)
      || (opts.timelineMode === 'sim'
        && phaSet instanceof Set
        && phaSet.size)
    ) ? phaSet : null;
    /** @type {Map<number, number[]>} */
    const byK = new Map();
    countByNum.forEach((k, num) => {
      if (!byK.has(k)) byK.set(k, []);
      byK.get(k).push(num);
    });
    const ks = Array.from(byK.keys()).sort((a, b) => a - b);
    let html = '<div class="affect-by-law">';
    for (let i = 0; i < ks.length; i++) {
      const k = ks[i];
      const nums = byK.get(k).slice().sort((a, b) => a - b);
      html += '<div class="affect-line" data-affect-nums="'
        + escapeAttr(nums.join(',')) + '">'
        + '<span class="affect-label">Ảnh hưởng ' + k + ' luật [' + nums.length + ']:</span>'
        + '<span class="affect-nums">'
        + formatNumsDeriveHtml(nums, deriveSet, ',', phaMark, 'affect')
        + '</span>'
        + copyNumsBtnHtml(nums)
        + '</div>';
    }
    html += '</div>';
    return html;
  }

  /**
   * @param {number[]} [simPicks] chỉ mode sim — số đã click để append phá
   */
  function renderThresholdTimelineHtml(milestones, mode, deriveSet, simPicks) {
    if (!milestones.length) {
      return '<div class="th-tl-title">Timeline threshold</div>'
        + '<div class="th-tl-row">(không có mốc)</div>';
    }
    const isSim = mode === 'sim';
    const picks = isSim ? (simPicks || []) : [];
    const pickedSet = isSim ? new Set(picks) : null;
    const firstBoldMap = isSim ? buildFirstBoldIndexMap(milestones) : null;
    const pickOpts = isSim ? { pickable: true, pickedSet: pickedSet } : null;
    const dir = thOp === '>='
      ? ('>= 100% → ' + thVal + '%')
      : (thOp === '<='
        ? ('<= 1% → ' + thVal + '%')
        : ('= ' + thVal + '%'));
    let html = '<div class="th-tl-title">Timeline threshold (' + dir
      + ') · mốc khi |pool| đổi hoặc có số phá mới · Δ = copy hiệu pool vs mốc trên'
      + (isSim
        ? ' · click số <b>đậm</b> → append phá từ mốc lần đầu tô đen (tối đa 5 · click lại = gỡ)'
        : '')
      + '</div>';
    if (milestones.length > 1) html += '<div class="th-tl-flow" aria-hidden="true"></div>';
    for (let i = 0; i < milestones.length; i++) {
      const m = milestones[i];
      const prevPool = i > 0 ? milestones[i - 1].pool : null;
      let pháTxt;
      if (isSim) {
        const phaArr = simPháPicksAtMilestone(milestones, picks, i, firstBoldMap);
        pháTxt = phaArr.length
          ? formatNumsDeriveHtml(phaArr, deriveSet, ',', null, 'tl-pha-rm')
          : '';
      } else {
        pháTxt = m.phá.length
          ? formatNumsDeriveHtml(m.phá, deriveSet, ',', null, 'tl-pha')
          : '';
      }
      const rateTxt = Number.isFinite(m.violPct)
        ? (m.violPct.toFixed(1) + '%')
        : '—';
      html += '<div class="th-tl-row">'
        + '<span class="tl-t">' + m.t + '%</span>'
        + '<span class="tl-rate" title="% phá luật tại threshold này">' + rateTxt + '</span>'
        + '<span class="tl-pool">'
        + formatTimelinePoolHtml(m.pool, m.newlyIn, deriveSet, prevPool, pickOpts)
        + '</span>'
        + '<span class="tl-phá">phá: ' + pháTxt + '</span>'
        + '</div>';
    }
    return html;
  }

  function showElimPopupFrom(opts) {
    const focusId = opts.focusId;
    const details = opts.details;
    const disabled = opts.disabled || [];
    const mask = opts.mask || [];
    const modeLabel = opts.modeLabel || '';
    const emptyHint = opts.emptyHint || 'Không có cột đúng để loại số.';
    const showViolate = !!opts.showViolate;
    const violDetails = opts.violDetails || [];
    const violMask = opts.violMask || [];
    const violSecTitle = opts.violSecTitle || 'Phá luật (cột không ✓)';
    const violEmptyHint = opts.violEmptyHint
      || 'Kỳ này không phá luật cột nào (trong threshold).';
    const violLineSuffix = opts.violLineSuffix || 'đáp án có peer';
    const poolArr = Array.isArray(opts.poolNums) ? opts.poolNums.slice() : [];
    const wCounts = opts.counts || null;

    const deriveSetEarly = opts.deriveSet instanceof Set ? opts.deriveSet : null;
    // Phá trước — số ∈ phá không được tính/hiện trong Loại (vd 920: 7 phá (3,2) → không còn ở loại (4,2)).
    const violPart = showViolate
      ? renderPairViolBlocks(violDetails, disabled, violMask, violLineSuffix, deriveSetEarly)
      : { chosen: [], allViol: new Set(), html: '' };
    const elimPart = renderPairElimBlocks(
      details,
      disabled,
      mask,
      deriveSetEarly,
      showViolate ? violPart.allViol : null
    );

    let html = '';
    if (showViolate) {
      html += '<div class="sec-title">Loại (cột ✓)</div>';
      html += elimPart.chosen.length
        ? elimPart.html
        : '<p class="none">' + emptyHint + '</p>';
      html += '<div class="sec-title viol">' + violSecTitle + '</div>';
      html += violPart.chosen.length
        ? violPart.html
        : '<p class="none">' + violEmptyHint + '</p>';
    } else {
      html = elimPart.chosen.length
        ? elimPart.html
        : '<p class="none">' + emptyHint + '</p>';
    }

    const elimArr = Array.from(elimPart.allElim).sort((a, b) => a - b);
    const violArr = Array.from(violPart.allViol).sort((a, b) => a - b);
    modalTitle.textContent = showViolate ? ('Kỳ id ' + focusId) : 'Số bị loại';
    const colBits = [];
    if (elimPart.chosen.length) colBits.push('✓ ' + elimPart.chosen.join(' '));
    if (violPart.chosen.length) colBits.push('phá ' + violPart.chosen.join(' '));
    modalSub.textContent = modeLabel + ' id ' + focusId
      + ' · ' + (colBits.length ? colBits.join(' · ') : '—');
    const deriveSet = deriveSetEarly;
    const poolMaxArr = Array.isArray(opts.maxPoolNums) ? opts.maxPoolNums : poolArr;
    let tlMilestones = null;
    if (showViolate) {
      const tlOpts = opts.timelineMode === 'sim'
        ? { mode: 'sim' }
        : { mode: 'hist', focusIdx: opts.focusIdx };
      tlMilestones = buildThresholdPoolTimeline(tlOpts);
      seedPoolBoldFromMilestones(tlMilestones, poolArr);
    } else {
      syncPopupPoolBold(poolArr);
    }
    if (wCounts) {
      const answerSet = opts.answerSet instanceof Set ? opts.answerSet : null;
      modalRest.innerHTML = formatRestSubHtml(
        buildRestItems(poolMaxArr, wCounts),
        answerSet,
        deriveSet
      );
      modalRest.hidden = false;
    } else {
      modalRest.hidden = true;
      modalRest.innerHTML = '';
    }
    // Dòng pool cố định = pool max (cùng nguồn với rest); số ∈ derive → gạch chân.
    modalPool.innerHTML = formatPoolSubHtml(poolMaxArr, null, deriveSet, 'pool max');
    modalPool.hidden = false;
    let sumHtml;
    if (opts.timelineMode === 'sim') {
      /* Loại = pool max \ picks · Phá = picks. */
      sumHtml = formatSimPickSumHtml(deriveSet, poolMaxArr);
    } else {
      sumHtml = elimArr.length
        ? ('Loại (' + elimArr.length + ' số): '
          + formatNumsDeriveHtml(elimArr, deriveSet, ', '))
        : 'Loại (0 số): (không)';
      if (showViolate) {
        sumHtml += '<div class="viol-sum">'
          + (violArr.length
            ? ('Phá luật (' + violArr.length + ' số): '
              + formatNumsDeriveHtml(violArr, deriveSet, ', '))
            : 'Phá luật (0 số): (không)')
          + '</div>';
      }
    }
    modalSum.innerHTML = sumHtml;
    modalSum.hidden = false;
    if (showViolate && tlMilestones) {
      const isSimTl = opts.timelineMode === 'sim';
      if (isSimTl) {
        simTlMilestonesCache = tlMilestones;
        simTlDeriveSetCache = deriveSet instanceof Set ? deriveSet : null;
        simTlPoolMaxCache = poolMaxArr.slice();
        /* Giữ picks còn hợp lệ (vẫn từng tô đậm trên timeline mới). */
        if (simTlPháPicks.length) {
          const fb = buildFirstBoldIndexMap(tlMilestones);
          simTlPháPicks = simTlPháPicks.filter((n) => fb.has(Number(n)));
        }
        /* Sum sau khi lọc picks (Loại = poolMax \ picks). */
        modalSum.innerHTML = formatSimPickSumHtml(deriveSet, simTlPoolMaxCache);
      } else {
        clearSimTlPháPicks();
      }
      modalTimeline.innerHTML = renderThresholdTimelineHtml(
        tlMilestones,
        isSimTl ? 'sim' : 'hist',
        deriveSet,
        isSimTl ? simTlPháPicks : null
      );
      modalTimeline.hidden = false;
    } else {
      clearSimTlPháPicks();
      modalTimeline.hidden = true;
      modalTimeline.innerHTML = '';
    }
    // Dưới timeline, trên "Loại (cột ✓)": nhóm số theo số luật ảnh hưởng.
    const affectPhaSet = opts.timelineMode === 'sim'
      ? new Set(simTlPháPicks)
      : violPart.allViol;
    const affectHtml = showViolate
      ? buildAffectByLawHtml(opts, deriveSet, affectPhaSet)
      : '';
    modalBody.innerHTML = affectHtml + html;
    popupKind = 'elim';
    statsPopupKind = null;
    if (modalEl) modalEl.classList.remove('is-stats');
    modalBack.hidden = false;
    document.body.classList.add('modal-open');
  }

  /** @type {{ id: number, popup: boolean, mode: string|null }|null} */
  let pendingSharedFocus = null;
  let sharedFocusApplyToken = 0;

  function alignRowIntoView(id, opts) {
    const td = wrap.querySelector('td.hist-id[data-id="' + String(id) + '"]')
      || wrap.querySelector('td.sim-id[data-id="' + String(id) + '"]');
    if (!td) return false;
    const tr = td.closest('tr');
    const smooth = !(opts && opts.instant);
    const thead = wrap.querySelector('thead');
    const stickyPad = thead ? thead.getBoundingClientRect().height : 86;
    const delta = td.getBoundingClientRect().top - wrap.getBoundingClientRect().top;
    const top = Math.max(0, wrap.scrollTop + delta - stickyPad);
    wrap.scrollTo({ top: top, behavior: smooth ? 'smooth' : 'auto' });
    wrap.querySelectorAll('tr.flash-row').forEach((r) => r.classList.remove('flash-row'));
    if (tr) {
      tr.classList.add('flash-row');
      setTimeout(() => tr.classList.remove('flash-row'), 1000);
    }
    return true;
  }

  function scrollToRowId(id, opts) {
    // Nhảy từ list stats: đóng popup local, không broadcast (tránh tắt hết tab).
    modalBack.hidden = true;
    document.body.classList.remove('modal-open');
    popupKind = null;
    statsPopupKind = null;
    resetPopupPoolTrack();
    hideModalRestPool();
    modalTimeline.hidden = true;
    modalTimeline.innerHTML = '';
    return alignRowIntoView(id, opts);
  }

  function publishSharedFocus(id, opts) {
    if (!window.FocusSync || typeof window.FocusSync.publish !== 'function') return;
    if (window.FocusSync.isApplying && window.FocusSync.isApplying()) return;
    const n = Number(id);
    if (!Number.isFinite(n) || n <= 0) return;
    window.FocusSync.publish(n, opts || {});
  }

  function findHistIdxById(n) {
    if (!tableBundle) return -1;
    const { ids, displayIdx } = tableBundle;
    for (let j = 0; j < displayIdx.length; j++) {
      const i = displayIdx[j];
      if (ids[i] === n) return i;
    }
    return -1;
  }

  /** Sync từ tab khác / URL: focus id + mở/tắt popup elim đồng bộ. */
  function applySharedFocusState(state, meta) {
    const st = state && typeof state === 'object'
      ? state
      : { id: state, popup: false, mode: null };
    const n = Number(st.id);
    if (!Number.isFinite(n) || n <= 0) return false;
    const wantPopup = !!st.popup;
    const mode = st.mode === 'sim' ? 'sim' : 'hist';
    const instant = !!(meta && (meta.remote || meta.seed || meta.instant));

    if (!tableBundle || !dataCtx) {
      pendingSharedFocus = { id: n, popup: wantPopup, mode: wantPopup ? mode : null };
      return false;
    }

    const focusIdx = findHistIdxById(n);
    const isSim = !!(simState && simState.focusId === n);

    if (focusIdx < 0 && !isSim) {
      pendingSharedFocus = { id: n, popup: wantPopup, mode: wantPopup ? mode : null };
      return false;
    }
    pendingSharedFocus = null;
    const token = ++sharedFocusApplyToken;

    if (!wantPopup) {
      // Đóng popup; giữ nền cam trên hist id (không áp dụng rỗng cuối/sim).
      modalBack.hidden = true;
      document.body.classList.remove('modal-open');
      if (modalEl) modalEl.classList.remove('is-stats');
      simIdOn = false;
      if (focusIdx >= 0) histIdOnIdx = focusIdx;
      syncSimRowDom();
      syncHistIdDom();
      popupKind = null;
      statsPopupKind = null;
      resetPopupPoolTrack();
      clearCopyNumsOkEffect();
      hideDeltaTip();
      hideModalRestPool();
      modalTimeline.hidden = true;
      modalTimeline.innerHTML = '';
      requestAnimationFrame(() => {
        if (token !== sharedFocusApplyToken) return;
        alignRowIntoView(n, { instant: instant });
      });
      return true;
    }

    // Mở popup elim trên mọi tab ticks (kể cả click lại cùng id / force từ index).
    requestAnimationFrame(() => {
      if (token !== sharedFocusApplyToken) return;
      alignRowIntoView(n, { instant: true });
      const alreadyOpen = !modalBack.hidden && popupKind === 'elim'
        && ((mode === 'sim' && simIdOn) || (mode !== 'sim' && histIdOnIdx === focusIdx));
      if (alreadyOpen && !(meta && meta.force)) return;
      if (mode === 'sim' || (focusIdx < 0 && isSim)) {
        openSimElim();
      } else {
        openHistElim(focusIdx);
      }
    });
    return true;
  }

  function flushPendingSharedFocus() {
    const st = pendingSharedFocus
      || (window.FocusSync && typeof window.FocusSync.get === 'function'
        ? window.FocusSync.get()
        : null);
    if (!st || st.id == null) return false;
    return !!applySharedFocusState(st, { seed: true, instant: true });
  }

  function initSharedFocusIdSync() {
    if (!window.FocusSync || typeof window.FocusSync.init !== 'function') return;
    window.FocusSync.init({
      source: 'ticks',
      apply: (state, meta) => {
        applySharedFocusState(state, meta || {});
      }
    });
  }

  function statsSampleMau() {
    const lastAnsId = lastAnsweredIdForRate();
    return lastAnsId != null ? (lastAnsId - MIN_ID + 1) : 0;
  }

  /** Tiêu đề stats: nhãn + badge x/y z% nổi bật. */
  function setStatsModalTitle(label, x, y) {
    const den = y > 0 ? y : 0;
    const pct = den > 0 ? ((100 * x) / den).toFixed(1) + '%' : '—';

      if (restHitCache == null) restHitCache = computeRestHitStats();
      const cache = restHitCache || { hitList: [], emptyList: [], nonemptyCount: 0, periodCount: 0 };
      const hitN = cache.hitList.length;
      const emptyN = cache.emptyList.length;
      const tab = restPopupTab === 'empty' ? 'empty' : 'hit';
      const den = restSkipEmpty ? cache.nonemptyCount : mau;

      subExtra = restSkipEmpty
        ? (' · mẫu bỏ rest rỗng (' + cache.nonemptyCount + ' kỳ rest≠∅)')
        : (' · mẫu gồm rest rỗng (' + cache.periodCount + ' kỳ)');
      const tabsHtml = '<div class="rest-tabs" role="tablist">'
        + '<button type="button" data-rest-tab="hit"' + (tab === 'hit' ? ' class="is-on"' : '')
        + '>Trúng (' + hitN + ')</button>'

  modalBody.addEventListener('click', (e) => {
    const btn = e.target && e.target.closest ? e.target.closest('[data-jump-id]') : null;
    if (!btn || popupKind !== 'stats') return;
    e.preventDefault();
    e.stopPropagation();
    const id = Number(btn.getAttribute('data-jump-id'));
    if (!Number.isFinite(id)) return;
    const focusIdx = findHistIdxById(id);
    if (focusIdx >= 0) {
      rememberHistFocusClick(id);
      alignRowIntoView(id, { instant: false });
      openHistElim(focusIdx);
      publishSharedFocus(id, { popup: true, mode: 'hist', force: true });
      return;
    }
    if (simState && simState.focusId === id) {
      alignRowIntoView(id, { instant: false });
      openSimElim();
      publishSharedFocus(id, { popup: true, mode: 'sim', force: true });
      return;
    }
    scrollToRowId(id);
  });

  function clearAllIdOn() {
    simIdOn = false;
    histIdOnIdx = null;
    syncSimRowDom();
    syncHistIdDom();
  }

  /** Ghi nhận id hist vừa click (cho Ctrl+Z xoay vòng). */
  function rememberHistFocusClick(id) {
    const n = Number(id);
    if (!Number.isFinite(n) || n <= 0) return;
    if (focusUndoB === n) return;
    focusUndoA = focusUndoB;
    focusUndoB = n;
  }

  /** Ctrl+Z: xoay focus giữa hai kỳ hist vừa click. */
  function cycleHistFocusUndo() {
    if (focusUndoA == null || focusUndoB == null) return false;
    if (focusUndoA === focusUndoB) return false;
    const nextId = focusUndoA;
    focusUndoA = focusUndoB;
    focusUndoB = nextId;
    const idx = findHistIdxById(nextId);
    if (idx < 0) return false;
    alignRowIntoView(nextId, { instant: false });
    openHistElim(idx);
    publishSharedFocus(nextId, { popup: true, mode: 'hist', force: true });
    return true;
  }

  function hidePopup() {
    const wasElim = popupKind === 'elim';
    const closingSim = wasElim && simIdOn;
    const closeId = wasElim
      ? (closingSim && simState
        ? simState.focusId
        : (histIdOnIdx != null && dataCtx ? dataCtx.ids[histIdOnIdx] : null))
      : null;
    modalBack.hidden = true;
    document.body.classList.remove('modal-open');
    if (modalEl) modalEl.classList.remove('is-stats');
    /* Hist: giữ nền cam. Sim (rỗng cuối): tắt ON như cũ. */
    if (closingSim) {
      simIdOn = false;
      syncSimRowDom();
    }
    popupKind = null;
    statsPopupKind = null;
    resetPopupPoolTrack();
    clearCopyNumsOkEffect();
    clearAffectNumHl();
    hideDeltaTip();
    if (closingSim) {
      /* Có mã phòng: giữ picks để sync / mở lại; không mã: xóa như cũ. */
      if (simRoomTag) clearSimTlPháCache();
      else clearSimTlPháPicks();
    }
    hideModalRestPool();
    modalTimeline.hidden = true;
    modalTimeline.innerHTML = '';
    if (wasElim && closeId != null) {
      publishSharedFocus(closeId, { popup: false, mode: closingSim ? 'sim' : 'hist' });
    }

  /** Popup đang mở: đổi threshold → cập nhật lại nội dung theo cột mới. */
  function refreshOpenPopupAfterThreshold() {
    if (modalBack.hidden || !popupKind) return;
    if (popupKind === 'elim') {
      if (simIdOn) openSimElim();
      else if (histIdOnIdx != null) openHistElim(histIdOnIdx);
      return;
    }
    if (popupKind === 'stats' && statsPopupKind) {
      showIdListPopup(statsPopupKind);
    }
  }

  modalClose.addEventListener('click', hidePopup);

  // Copy dãy rest / pool (a,b,c — không freq; pool theo threshold header hiện tại).
  const onCopyNumsClick = (e) => {
    const btn = e.target && e.target.closest ? e.target.closest('button.copy-nums-btn') : null;
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    const text = btn.getAttribute('data-copy') || '';

  };

  if (modalPool) modalPool.addEventListener('click', onCopyNumsClick);
  if (modalTimeline) {
    modalTimeline.addEventListener('click', (e) => {
      if (!(simIdOn && popupKind === 'elim')) {
        onCopyNumsClick(e);
        return;

      const rmEl = e.target && e.target.closest
        ? e.target.closest('[data-tl-pha-rm]')
        : null;
      if (rmEl && modalTimeline.contains(rmEl)) {
        e.preventDefault();
        e.stopPropagation();
        if (removeSimTlPháPick(rmEl.getAttribute('data-tl-pha-rm'))) {
          refreshSimTimelinePháDom();

        return;

        ? e.target.closest('[data-tl-pick]')

      if (pickEl && modalTimeline.contains(pickEl)) {
