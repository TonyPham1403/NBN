  /** Tooltip Δ — góc phải trên sát con trỏ; chỉ chuỗi. */
  const deltaTip = document.createElement('div');
  deltaTip.className = 'delta-tip';
  deltaTip.setAttribute('role', 'tooltip');
  deltaTip.hidden = true;
  document.body.appendChild(deltaTip);
  let deltaTipBtn = null;
  let deltaTipX = 0;
  let deltaTipY = 0;

  function hideDeltaTip() {
    deltaTipBtn = null;
    deltaTip.classList.remove('is-on', 'is-empty');
    deltaTip.hidden = true;
    deltaTip.textContent = '';
  }

  /** Con trỏ = góc phải trên của tip → tip nằm bên trái dưới con trỏ. */
  function positionDeltaTipAt(clientX, clientY) {
    deltaTipX = clientX;
    deltaTipY = clientY;
    const tipW = deltaTip.offsetWidth || 40;
    const tipH = deltaTip.offsetHeight || 24;
    let left = clientX - tipW;
    let top = clientY;
    if (left < 4) left = 4;
    if (top + tipH > window.innerHeight - 4) {
      top = Math.max(4, window.innerHeight - tipH - 4);
    }
    if (top < 4) top = 4;
    deltaTip.style.left = Math.round(left) + 'px';
    deltaTip.style.top = Math.round(top) + 'px';
  }

  function showDeltaTip(btn, clientX, clientY) {
    if (!btn) return;
    const csv = btn.getAttribute('data-copy') || '';
    const empty = !csv;
    deltaTipBtn = btn;
    deltaTip.textContent = empty ? '(rỗng)' : csv;
    deltaTip.classList.toggle('is-empty', empty);
    deltaTip.hidden = false;
    deltaTip.classList.add('is-on');
    const x = clientX != null ? clientX : deltaTipX;
    const y = clientY != null ? clientY : deltaTipY;
    positionDeltaTipAt(x, y);
    requestAnimationFrame(() => {
      if (deltaTipBtn === btn) positionDeltaTipAt(x, y);
    });
  }

  if (modalTimeline) {
    modalTimeline.addEventListener('mouseover', (e) => {
      const btn = e.target && e.target.closest
        ? e.target.closest('button.copy-delta-btn')
        : null;
      if (!btn || !modalTimeline.contains(btn)) return;
      if (deltaTipBtn === btn) return;
      showDeltaTip(btn, e.clientX, e.clientY);
    });
    modalTimeline.addEventListener('mousemove', (e) => {
      if (!deltaTipBtn) return;
      const btn = e.target && e.target.closest
        ? e.target.closest('button.copy-delta-btn')
        : null;
      if (btn !== deltaTipBtn) return;
      positionDeltaTipAt(e.clientX, e.clientY);
    });
    modalTimeline.addEventListener('mouseout', (e) => {
      const btn = e.target && e.target.closest
        ? e.target.closest('button.copy-delta-btn')
        : null;
      if (!btn || !modalTimeline.contains(btn)) return;
      const to = e.relatedTarget;
      if (to && typeof to.closest === 'function') {
        if (btn.contains(to)) return;
        const next = to.closest('button.copy-delta-btn');
        if (next && modalTimeline.contains(next)) {
          showDeltaTip(next, e.clientX, e.clientY);
          return;
        }
      }
      hideDeltaTip();
    });
    modalTimeline.addEventListener('scroll', hideDeltaTip, true);
  }
  window.addEventListener('scroll', () => {
    if (deltaTipBtn) hideDeltaTip();
  }, true);
  window.addEventListener('resize', hideDeltaTip);

  /**
   * Rê số trên timeline →
   * (1) viền đỏ dày cả dòng "Ảnh hưởng k luật" chứa số đó
   * (2) luôn viền các chỗ số in đậm trên cột pool
   * (3) rê cột phá: thêm đúng 1 viền tại ô đang rê (không lan sang phá khác)
   */
  let affectHlKey = null;
  let affectHlEl = null;
  function clearAffectNumHl() {
    if (!modalBody) return;
    modalBody.querySelectorAll('.affect-line.is-hl').forEach((el) => {
      el.classList.remove('is-hl');
    });
    if (modalTimeline) {
      modalTimeline.querySelectorAll('.tl-num.is-hl, .tl-num.is-hl-pha').forEach((el) => {
        el.classList.remove('is-hl', 'is-hl-pha');
      });
    }
    affectHlKey = null;
    affectHlEl = null;
  }
  function setAffectNumHl(numStr, col, sourceEl) {
    const key = (col || 'pool') + ':' + numStr;
    if (col === 'pha') {
      if (affectHlKey === key && affectHlEl === sourceEl) return;
    } else if (affectHlKey === key) {
      return;
    }
    clearAffectNumHl();
    if (numStr == null || numStr === '') return;
    affectHlKey = key;
    affectHlEl = sourceEl || null;
    if (!modalBody) return;
    const n = Number(numStr);
    modalBody.querySelectorAll('.affect-line[data-affect-nums]').forEach((line) => {
      const raw = line.getAttribute('data-affect-nums') || '';
      const parts = raw.split(',');
      for (let i = 0; i < parts.length; i++) {
        if (Number(parts[i]) === n) {
          line.classList.add('is-hl');
          break;
        }
      }
    });
    if (!modalTimeline) return;
    /* Pool in đậm — cả khi rê pool lẫn rê phá */
    modalTimeline.querySelectorAll('.tl-num[data-hl-col="pool"][data-hl-bold][data-hl-num]').forEach((el) => {
      if (Number(el.getAttribute('data-hl-num')) === n) {
        el.classList.add('is-hl');
      }
    });
    /* Phá: chỉ đúng ô đang rê */
    if (col === 'pha' && sourceEl) {
      sourceEl.classList.add('is-hl-pha');
    }
  }
  if (modalTimeline) {
    modalTimeline.addEventListener('mouseover', (e) => {
      const el = e.target && e.target.closest ? e.target.closest('[data-hl-num]') : null;
      if (!el || !modalTimeline.contains(el)) return;
      setAffectNumHl(
        el.getAttribute('data-hl-num'),
        el.getAttribute('data-hl-col') || 'pool',
        el
      );
    });
    modalTimeline.addEventListener('mouseout', (e) => {
      const el = e.target && e.target.closest ? e.target.closest('[data-hl-num]') : null;
      if (!el || !modalTimeline.contains(el)) return;
      const to = e.relatedTarget;
      if (to && typeof to.closest === 'function') {
        if (el.contains(to)) return;
        if (to.closest('[data-hl-num]') && modalTimeline.contains(to)) return;
      }
      clearAffectNumHl();
    });
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !modalBack.hidden) {
      hidePopup();
      return;
    }
    /* Ctrl+Z: xoay vòng focus giữa 2 kỳ hist vừa click (không đụng input). */
    if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey
      && (e.key === 'z' || e.key === 'Z')) {
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA'
        || t.tagName === 'SELECT' || (t.isContentEditable))) {
        return;
      }
      if (cycleHistFocusUndo()) {
        e.preventDefault();
        e.stopPropagation();
      }
    }
  });
  btnFullList.addEventListener('click', () => showIdListPopup('full'));
  btnZeroList.addEventListener('click', () => showIdListPopup('zero'));
  if (btnDerivePhaList) btnDerivePhaList.addEventListener('click', () => showIdListPopup('derivePha'));
  if (btnDeriveRestList) btnDeriveRestList.addEventListener('click', () => showIdListPopup('deriveRest'));
  if (btnPhaKList) btnPhaKList.addEventListener('click', () => showIdListPopup('phaK'));
  if (btnRestList) btnRestList.addEventListener('click', () => showIdListPopup('rest'));
  if (btnRestToggle) {
    btnRestToggle.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      restSkipEmpty = !restSkipEmpty;
      saveRestSkipEmpty();
      syncRestSkipEmptyUi();
      const lastAnsId = lastAnsweredIdForRate();
      const mau = lastAnsId != null ? (lastAnsId - MIN_ID + 1) : 0;
      updateRestRateDisplay(mau, lastAnsId);
      if (!modalBack.hidden && statsPopupKind === 'rest') {
        showIdListPopup('rest');
      }
    });
  }
  if (modalBody) {
    modalBody.addEventListener('click', (e) => {
      const tabBtn = e.target && e.target.closest ? e.target.closest('[data-rest-tab]') : null;
      if (!tabBtn || popupKind !== 'stats' || statsPopupKind !== 'rest') return;
      e.preventDefault();
      e.stopPropagation();
      const tab = tabBtn.getAttribute('data-rest-tab');
      if (tab !== 'hit' && tab !== 'empty') return;
      if (restPopupTab === tab) return;
      restPopupTab = tab;
      showIdListPopup('rest');
    });
  }
  if (phaKSelect) {
    phaKSelect.addEventListener('change', () => {
      const v = Math.max(1, Math.floor(Number(phaKSelect.value) || 1));
      selectedPhaK = v;
      syncPhaKCountUi();
      if (!modalBack.hidden && statsPopupKind === 'phaK') {
        showIdListPopup('phaK');
      }
    });
  }

  function syncSimRowDom() {
    const tr = wrap.querySelector('tr.sim-row');
    if (!tr || !simState) return;
    tr.classList.toggle('is-locked', simIdOn);
    const idTd = tr.querySelector('td.sim-id');
    if (idTd) {
      idTd.classList.toggle('is-on', simIdOn);
      idTd.title = simIdOn
        ? 'ON — đóng popup'
        : 'Click: mở popup giả lập phá (click số đậm trên pool)';
    }
    const active = new Set(activePairIndices());
    tr.querySelectorAll('td.sim-cell').forEach((td) => {
      const pi = Number(td.getAttribute('data-pi'));
      if (!Number.isFinite(pi)) return;
      const off = !active.has(pi);
      if (simState.disabled[pi]) {
        td.className = 'sim-cell nop' + (off ? ' col-off' : '');
        td.setAttribute('data-pi', String(pi));
        td.textContent = '';
        td.title = 'Disable: không có derive[D]+peer[P] khác số cùng hàng W10';
        return;
      }
      /* Không tick cột — giả lập chỉ trong popup. */
      td.className = 'sim-cell' + (off ? ' col-off' : '');
      td.setAttribute('data-pi', String(pi));
      td.textContent = '';
      td.title = 'Giả lập phá: mở popup id kỳ rỗng → click số đậm trên pool';
    });
  }

  function syncHistIdDom() {
    wrap.querySelectorAll('td.hist-id').forEach((td) => {
      const idx = Number(td.getAttribute('data-idx'));
      td.classList.toggle('is-on', histIdOnIdx === idx);
    });
  }

  function openHistElim(focusIdx) {
    if (!dataCtx) return;
    const focusId = dataCtx.ids[focusIdx];
    const packed = detailsAtFocus(focusIdx, focusId);
    if (!packed) return;
    if (histIdOnIdx !== focusIdx) resetPopupPoolTrack();
    const active = activePairIndices();
    const activeSet = new Set(active);
    const holdBase = dataCtx.holdMasks.get(focusIdx) || PAIRS.map(() => false);
    const violBase = dataCtx.violateMasks.get(focusIdx) || PAIRS.map(() => false);
    const mask = holdBase.map((on, pi) => !!(on && activeSet.has(pi)));
    const violMask = violBase.map((on, pi) => !!(on && activeSet.has(pi)));
    histIdOnIdx = focusIdx;
    simIdOn = false;
    syncSimRowDom();
    syncHistIdDom();
    const deriveSet = new Set();

      if (cands[ci]) deriveSet.add(cands[ci].num);
    }
    showElimPopupFrom({
      focusId,
      focusIdx,
      details: packed.details,
      violDetails: packed.violDetails,
      disabled: packed.disabled,
      mask,
      violMask,
      poolNums: poolNumsArrForRow(focusIdx, active),
      maxPoolNums: poolNumsArrForRow(focusIdx, maxPoolPairIndices()),
      counts: windowCounts(dataCtx.rowNums, focusIdx),
      answerSet: new Set(dataCtx.rowNums[focusIdx] || []),
      deriveSet: deriveSet,
      showViolate: true,
      timelineMode: 'hist',
      modeLabel: 'Kỳ',
      emptyHint: 'Kỳ này không có cột ✓ trong các cột thỏa threshold.'
    });
  }

  function openSimElim() {
    if (!simState) return;
    if (!simIdOn) {
      resetPopupPoolTrack();
      if (simRoomTag) loadSimPhaPicksForTag(simRoomTag);
    }
    const active = activePairIndices();
    /* Không giả lập tick cột — mask/violMask tắt; phá = click pool. */
    const mask = PAIRS.map(() => false);
    const violMask = PAIRS.map(() => false);
    const violDetails = simState.details.map((d) => ({
      label: d.label,
      D: d.D,
      P: d.P,
      disabled: d.disabled,
      viol: (d.elim || []).slice(),
      lines: d.lines || []
    }));
    const poolSet = new Set();
    for (let ai = 0; ai < active.length; ai++) {
      const pi = active[ai];
      if (simState.disabled[pi]) continue;
      const d = simState.details[pi];
      if (!d || !d.elim) continue;
      d.elim.forEach((x) => poolSet.add(x));
    }
    const maxPoolSet = new Set();
    const maxActive = maxPoolPairIndices();
    for (let ai = 0; ai < maxActive.length; ai++) {
      const pi = maxActive[ai];
      if (simState.disabled[pi]) continue;
      const d = simState.details[pi];
      if (!d || !d.elim) continue;
      d.elim.forEach((x) => maxPoolSet.add(x));
    }
    histIdOnIdx = null;
    simIdOn = true;
    syncHistIdDom();
    syncSimRowDom();
    const simCounts = dataCtx
      ? windowCounts(dataCtx.rowNums, simState.focusIdx)
      : null;
    showElimPopupFrom({
      focusId: simState.focusId,
      focusIdx: simState.focusIdx,
      details: simState.details,
      violDetails: violDetails,
      disabled: simState.disabled,
      mask,
      violMask,
      poolNums: sortedNumsFromSet(poolSet),
      maxPoolNums: sortedNumsFromSet(maxPoolSet),
      counts: simCounts,
      deriveSet: new Set(simState.cands || []),
      showViolate: true,
      timelineMode: 'sim',
      modeLabel: 'Kỳ giả lập',
      emptyHint: 'Loại ban đầu = pool max; click số đậm → Phá + gỡ cả peer luật liên quan khỏi Loại.',
      violSecTitle: 'Phá luật (theo click số đậm trên pool)',
      violEmptyHint: 'Chi tiết theo cột tắt — xem tóm tắt Loại/Phá phía trên / cột phá timeline.',
      violLineSuffix: 'nếu đáp án có peer'

  function clampTh(n) {
    const v = Math.round(Number(n));
    if (!Number.isFinite(v)) return 1;
    return Math.max(1, Math.min(100, v));
  }

  function pctMeets(pctNum, op, x) {
    if (!Number.isFinite(pctNum)) return false;
    if (op === '>=') return pctNum >= x;
    if (op === '<=') return pctNum <= x;
    return Math.round(pctNum) === x;
  }

  function activePairIndices() {
    if (!tableBundle) return [];
    const out = [];
    for (let pi = 0; pi < PAIRS.length; pi++) {
      const st = tableBundle.stats[pi];
      if (!st || !st.applicable) continue;
      if (pctMeets(st.pctNum, thOp, thVal)) out.push(pi);
    }
    out.sort((a, b) => {
      const Pa = PAIRS[a][1];
      const Pb = PAIRS[b][1];
      if (Pa !== Pb) return Pa - Pb;
      return PAIRS[a][0] - PAIRS[b][0];
    });
    return out;
  }

  /** Mọi cột có mẫu (applicable>0), sắp P↑ D↑ — dựng 1 lần, threshold chỉ ẩn/hiện. */
  function poolPairIndices() {
    if (!tableBundle) return [];
    const out = [];
    for (let pi = 0; pi < PAIRS.length; pi++) {
      const st = tableBundle.stats[pi];
      if (st && st.applicable > 0) out.push(pi);
    }
    out.sort((a, b) => {
      const Pa = PAIRS[a][1];
      const Pb = PAIRS[b][1];
      if (Pa !== Pb) return Pa - Pb;
      return PAIRS[a][0] - PAIRS[b][0];
    });
    return out;
  }

  function updateSummaryForActive(active) {
    if (!tableBundle) return;
    const { displayIdx, ids, splits } = tableBundle;
    fullTickList = [];
    zeroTickList = [];
    const fullIdx = new Set();
    const zeroIdx = new Set();
    for (let j = 0; j < displayIdx.length; j++) {
      const i = displayIdx[j];
      let en = 0;
      let h = 0;
      for (let ai = 0; ai < active.length; ai++) {
        const pi = active[ai];
        if (splits[pi].disabled.has(i)) continue;
        en++;
        if (splits[pi].hold.has(i)) h++;
      }
      if (en > 0 && h === en) {
        fullTickList.push({ id: ids[i], enabled: en });
        fullIdx.add(i);
      }
      if (h === 0) {
        zeroTickList.push(ids[i]);
        zeroIdx.add(i);
      }
    }
    sumFullCount.textContent = String(fullTickList.length);
    sumZeroCount.textContent = String(zeroTickList.length);

    // % phá luật: mẫu = id cuối(có ĐA) − 21 + 1 · tử = mẫu − tick đủ · % = tử/mẫu
    const lastAnsId = lastAnsweredIdForRate();
    const mau = lastAnsId != null ? (lastAnsId - MIN_ID + 1) : 0;
    const tu = mau > 0 ? (mau - fullTickList.length) : 0;
    if (mau > 0) {
      const pct = (100 * tu) / mau;
      sumViolPct.textContent = pct.toFixed(1) + '%';
      sumViolFrac.textContent = tu + '/' + mau;
      chipViolRate.title =
        'mẫu = ' + lastAnsId + ' − 21 + 1 = ' + mau
        + ' · tử = ' + mau + ' − ' + fullTickList.length + ' = ' + tu
        + ' · % = tử/mẫu (theo threshold hiện tại)';
    } else {
      sumViolPct.textContent = '—';
      sumViolFrac.textContent = '';
      chipViolRate.title = 'Chưa có kỳ có đáp án từ id 21';
    }

    updateRestRateDisplay(mau, lastAnsId);
    computePhaKLists(active);

    summaryEl.hidden = false;
    wrap.querySelectorAll('td.hist-id').forEach((td) => {
      const idx = Number(td.getAttribute('data-idx'));
      td.classList.toggle('tick-full', fullIdx.has(idx));
      td.classList.toggle('tick-zero', zeroIdx.has(idx));
    });
  }

  function syncPhaKSelectOptions(maxK) {

  /**
   * Kỳ có ≥1 số x phá đúng k luật — theo cột active (threshold hiện tại).
   * nums trên mỗi kỳ = các x phá đúng k luật.
   */
  function computePhaKLists(active) {
    phaKListsByK = {};
    if (!tableBundle || !active || !active.length) {
      syncPhaKSelectOptions(1);
      syncPhaKCountUi();
      return;
    }
    const { displayIdx, ids, splits } = tableBundle;
    let maxK = 0;
    for (let j = 0; j < displayIdx.length; j++) {
      const i = displayIdx[j];
      const lawCountByNum = new Map();
      for (let ai = 0; ai < active.length; ai++) {
        const pi = active[ai];
        const s = splits[pi];
        if (!s || !s.violate.has(i)) continue;
        const vn = s.violNums && s.violNums.get(i);
        if (!vn) continue;
        vn.forEach((x) => {
          lawCountByNum.set(x, (lawCountByNum.get(x) || 0) + 1);
        });
      }
      if (!lawCountByNum.size) continue;
      /** @type {Record<string, number[]>} */
      const numsByK = {};
      lawCountByNum.forEach((c, x) => {
        if (c > maxK) maxK = c;
        const key = String(c);
        if (!numsByK[key]) numsByK[key] = [];
        numsByK[key].push(x);
      });
      Object.keys(numsByK).forEach((key) => {
        if (!phaKListsByK[key]) phaKListsByK[key] = [];
        phaKListsByK[key].push({
          id: ids[i],
          nums: numsByK[key].slice().sort((a, b) => a - b)
        });
      });
    }
    syncPhaKSelectOptions(maxK > 0 ? maxK : 1);
    syncPhaKCountUi();
    if (!modalBack.hidden && statsPopupKind === 'phaK') {
      showIdListPopup('phaK');
    }
  }

  /**
   * Thống kê %rest (pool tối đa): kỳ trúng (ĐA ∩ rest), kỳ rest rỗng.
   * @returns {{ hitList: { id: number, nums: number[] }[], emptyList: number[], nonemptyCount: number, periodCount: number }}
   */
  function computeRestHitStats() {
    const empty = { hitList: [], emptyList: [], nonemptyCount: 0, periodCount: 0 };
    if (!tableBundle || !dataCtx) return empty;
    const maxPairs = maxPoolPairIndices();
    const { displayIdx, ids } = tableBundle;
    const hitList = [];
    const emptyList = [];
    let nonemptyCount = 0;
    for (let j = 0; j < displayIdx.length; j++) {
      const i = displayIdx[j];
      const id = ids[i];
      const poolMax = poolNumsArrForRow(i, maxPairs);
      const counts = windowCounts(dataCtx.rowNums, i);
      const restItems = buildRestItems(poolMax, counts);
      if (!restItems.length) {
        emptyList.push(id);
        continue;
      }
      nonemptyCount++;
      const restSet = new Set();
      for (let r = 0; r < restItems.length; r++) restSet.add(restItems[r].num);
      const answer = dataCtx.rowNums[i] || [];
      const hitNums = [];
      for (let k = 0; k < answer.length; k++) {
        if (restSet.has(answer[k])) hitNums.push(answer[k]);
      }
      if (hitNums.length) {
        hitList.push({ id: id, nums: hitNums.slice().sort((a, b) => a - b) });
      }
    }
    return {
      hitList: hitList,
      emptyList: emptyList,
      nonemptyCount: nonemptyCount,
      periodCount: displayIdx.length
    };
  }

  function sortedNumsFromSet(set) {
    return Array.from(set).sort((a, b) => a - b);
  }

  /** true nếu mọi phần tử của a đều thuộc b (a ⊆ b). */
  function isSubset(a, b) {
    if (!a || !b || !a.size || !b.size) return false;
    let ok = true;
    a.forEach((x) => {
      if (!b.has(x)) ok = false;
    });
    return ok;
  }

  /**
   * 3/ derive ⊆ tập phá max · 4/ derive ⊆ rest
   * Cố định theo pool tối đa — không đổi theo threshold header.
   */
  function computeDeriveOverlapLists() {
    derivePhaMaxList = [];
    deriveRestList = [];
    if (!tableBundle || !dataCtx) {
      if (sumDerivePhaCount) sumDerivePhaCount.textContent = '0';
      if (sumDeriveRestCount) sumDeriveRestCount.textContent = '0';
      return;
    }
    const { displayIdx, ids, splits } = tableBundle;
    const candsCache = dataCtx.candsCache;
    const maxPairs = maxPoolPairIndices();
    for (let j = 0; j < displayIdx.length; j++) {
      const i = displayIdx[j];
      const derive = new Set();
      const cands = candsCache[i] || [];
      for (let ci = 0; ci < cands.length; ci++) {
        if (cands[ci] && cands[ci].inAnswer) derive.add(cands[ci].num);
      }
      if (!derive.size) continue;
      // phá max = hợp violNums mọi cột (D,P)
      const pha = new Set();
      for (let pi = 0; pi < splits.length; pi++) {
        const s = splits[pi];
        if (!s || s.disabled.has(i) || !s.violate.has(i)) continue;
        const vn = s.violNums && s.violNums.get(i);
        if (vn) vn.forEach((x) => pha.add(x));
      }
      const poolMax = poolNumsArrForRow(i, maxPairs);
      const restItems = buildRestItems(poolMax, windowCounts(dataCtx.rowNums, i));
      const rest = new Set();
      for (let r = 0; r < restItems.length; r++) rest.add(restItems[r].num);
      const nums = sortedNumsFromSet(derive);
      if (isSubset(derive, pha)) {
        derivePhaMaxList.push({ id: ids[i], nums: nums });
      }
      if (isSubset(derive, rest)) {
        deriveRestList.push({ id: ids[i], nums: nums });
      }
    }
    if (sumDerivePhaCount) sumDerivePhaCount.textContent = String(derivePhaMaxList.length);
    if (sumDeriveRestCount) sumDeriveRestCount.textContent = String(deriveRestList.length);
  }

  function formatPoolCell(arr) {
    if (!arr.length) return '';
    return 'pool[' + arr.length + '] {' + arr.join(',') + '}';
  }

  /** Tập derive (cands) của kỳ i — dùng gạch chân cột phá ngoài popup. */
  function deriveSetForRow(i) {
    if (!dataCtx || !dataCtx.candsCache) return null;
    const cands = dataCtx.candsCache[i] || [];
    if (!cands.length) return null;
    const set = new Set();
    for (let ci = 0; ci < cands.length; ci++) {
      if (cands[ci]) set.add(cands[ci].num);
    }
    return set;
  }

  /** Hợp peer loại từ các cột threshold applicable (hold∪violate) tại kỳ i. */
  function poolNumsArrForRow(i, active) {
    if (!tableBundle) return [];
    const { splits } = tableBundle;
    const set = new Set();
    for (let ai = 0; ai < active.length; ai++) {
      const pi = active[ai];
      const s = splits[pi];
      if (!s || s.disabled.has(i)) continue;
      if (!s.hold.has(i) && !s.violate.has(i)) continue;
      const pn = s.poolNums && s.poolNums.get(i);
      if (!pn) continue;
      pn.forEach((x) => set.add(x));
    }
    return sortedNumsFromSet(set);
  }

  /** @param {boolean} [appendOrder] true = giữ thứ tự gặp (timeline), không sort */
  function violNumsArrForRow(i, active, appendOrder) {
    if (!tableBundle) return [];
    const { splits } = tableBundle;
    const set = new Set();
    const out = [];
    for (let ai = 0; ai < active.length; ai++) {
      const pi = active[ai];
      const s = splits[pi];
      if (!s || !s.violate.has(i)) continue;
      const vn = s.violNums && s.violNums.get(i);
      if (!vn) continue;
      vn.forEach((x) => {
        if (set.has(x)) return;
        set.add(x);
        out.push(x);
      });
    }
    if (appendOrder) return out;
    return out.slice().sort((a, b) => a - b);
  }

  /** Đáp án ∩ rest (rest cố định theo pool tối đa); thứ tự theo đáp án; kèm freq. */
  function restAnswerItemsForRow(i) {
    if (!tableBundle || !dataCtx) return [];
    const poolMax = poolNumsArrForRow(i, maxPoolPairIndices());
    const counts = windowCounts(dataCtx.rowNums, i);
    const restItems = buildRestItems(poolMax, counts);
    if (!restItems.length) return [];
    const freqByNum = new Map();
    for (let r = 0; r < restItems.length; r++) {
      freqByNum.set(restItems[r].num, restItems[r].freq);
    }
    const answer = dataCtx.rowNums[i] || [];
    const out = [];
    const seen = new Set();
    for (let k = 0; k < answer.length; k++) {
      const n = answer[k];
      if (!freqByNum.has(n) || seen.has(n)) continue;
      seen.add(n);
      out.push({ num: n, freq: freqByNum.get(n) });
    }
    return out;
  }

  function formatRestAnsCell(items, deriveSet) {
    if (!items.length) return '';
    const parts = [];
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      const bit = String(it.num) + toSubscript(it.freq);
      parts.push(wrapDeriveMarkHtml(bit, it.num, deriveSet));
    }
    return parts.join(',');
  }

  function syncRestAnsCol() {
    wrap.querySelectorAll('td.rest-ans[data-idx]').forEach((td) => {
      const i = Number(td.getAttribute('data-idx'));
      if (!Number.isFinite(i)) return;
      const items = restAnswerItemsForRow(i);
      const plain = items.length
        ? items.map((it) => String(it.num) + toSubscript(it.freq)).join(',')
        : '';
      td.innerHTML = items.length
        ? formatRestAnsCell(items, deriveSetForRow(i))
        : '';
      td.title = plain
        ? ('Đáp án ∩ rest: ' + plain)
        : 'Không có số đáp án thuộc rest';
    });
    syncRestColWidth();
  }

  function syncPoolViolCols(active) {
    const act = active || activePairIndices();
    wrap.querySelectorAll('td.pool-nums[data-idx]').forEach((td) => {
      const i = Number(td.getAttribute('data-idx'));
      if (!Number.isFinite(i)) return;
      const arr = poolNumsArrForRow(i, act);
      const text = formatPoolCell(arr);
      td.textContent = text;
      td.title = text
        ? ('Pool peer theo cột threshold: ' + arr.join(', '))
        : 'Không có peer từ cột threshold applicable';
    });
    wrap.querySelectorAll('td.viol-nums[data-idx]').forEach((td) => {
      const i = Number(td.getAttribute('data-idx'));
      if (!Number.isFinite(i)) return;
      const arr = violNumsArrForRow(i, act);
      const text = arr.join(',');
      td.innerHTML = arr.length
        ? formatNumsDeriveHtml(arr, deriveSetForRow(i), ',')
        : '';
      td.title = text
        ? ('Phá luật ⊆ pool (cột threshold): ' + text)
        : 'Không phá luật cột nào trong threshold';
    });
    syncViolColWidth();
    syncRestAnsCol();
    syncSimPoolCol(act);
  }

  /** Đo cột sticky theo scrollWidth lớn nhất (một dòng, đủ chuỗi dài nhất). */
  function syncStickyColWidth(cssVar, cellSel, dataSel, nameSel) {
    const table = wrap.querySelector('table.dc-table');
    if (!table) return;
    const allCells = table.querySelectorAll(cellSel);
    table.style.setProperty(cssVar, '0px');
    allCells.forEach((el) => {
      el.style.minWidth = '0';
      el.style.width = 'max-content';
      el.style.maxWidth = 'none';
    });
    let maxW = 0;
    table.querySelectorAll(dataSel).forEach((td) => {
      maxW = Math.max(maxW, td.scrollWidth);
    });
    const nameTh = table.querySelector(nameSel);
    if (nameTh) maxW = Math.max(maxW, nameTh.scrollWidth);
    maxW = Math.max(36, Math.ceil(maxW));
    const px = maxW + 'px';
    allCells.forEach((el) => {
      el.style.minWidth = '';
      el.style.width = '';
      el.style.maxWidth = '';
    });
    table.style.setProperty(cssVar, px);
  }

  function syncViolColWidth() {
    syncStickyColWidth(
      '--viol-w',
      'td.viol-nums, thead th.viol-h',
      'td.viol-nums[data-idx]',
      'thead th.viol-h.name'
    );
  }

  function syncRestColWidth() {
    syncStickyColWidth(
      '--rest-w',
      'td.rest-ans, thead th.rest-h',
      'td.rest-ans[data-idx]',
      'thead th.rest-h.name'
    );
  }

  /** Kỳ giả lập: pool = hợp elim của cột threshold còn mở (chưa có đáp án → phá = —). */
  function syncSimPoolCol(active) {
    const td = wrap.querySelector('tr.sim-row td.pool-nums');
    if (!td || !simState) return;
    const act = active || activePairIndices();
    const set = new Set();
    for (let ai = 0; ai < act.length; ai++) {
      const pi = act[ai];
      if (simState.disabled[pi]) continue;
      const d = simState.details[pi];
      if (!d || !d.elim) continue;
      d.elim.forEach((x) => set.add(x));
    }
    const arr = sortedNumsFromSet(set);
    const text = formatPoolCell(arr);
    td.textContent = text || '—';
    td.title = text
      ? ('Pool giả lập (peer loại nếu luật đúng): ' + arr.join(', '))
      : 'Kỳ giả lập — chưa có peer từ cột threshold';
  }

  /** Chỉ toggle class — không đụng innerHTML → scroll không về 0. */
  function applyThresholdColumns() {
    const active = activePairIndices();
    const activeSet = new Set(active);
    wrap.querySelectorAll('table.dc-table [data-pi]').forEach((el) => {
      const pi = Number(el.getAttribute('data-pi'));
      if (!Number.isFinite(pi)) return;
      el.classList.toggle('col-off', !activeSet.has(pi));
    });
    updateSummaryForActive(active);
    syncPoolViolCols(active);
    updateStatusLine(active.length);
    syncSimRowDom();
  }

  function buildFullTable() {
    if (!tableBundle || !simState) return;
    const { displayIdx, ids, splits, stats, pairLabels } = tableBundle;
    const pool = poolPairIndices();

    let thead =
      '<thead><tr class="pct"><th class="id pct">T%</th>'
      + '<th class="pool-h pct" title="Hợp peer theo cột threshold">—</th>'
      + '<th class="viol-h pct" title="Hợp số phá luật theo threshold">—</th>'
      + '<th class="rest-h pct" title="Đáp án ∩ rest (rest cố định)">—</th>' +
      pool.map((pi) => '<th class="pct" data-pi="' + pi + '">' + stats[pi].pct + '</th>').join('') +
      '</tr><tr class="xy"><th class="id xy">x/y</th>'
      + '<th class="pool-h xy">—</th><th class="viol-h xy">—</th><th class="rest-h xy">—</th>' +
      pool.map((pi) => '<th class="xy" data-pi="' + pi + '" title="đúng / applicable">' + stats[pi].xy + '</th>').join('') +
      '</tr><tr class="name"><th class="id name">id</th>'
      + '<th class="pool-h name" title="pool[n] {peers} — hợp peer từ luật thỏa threshold; phá ⊆ pool">pool</th>'
      + '<th class="viol-h name" title="Hợp số phá luật (các cột thỏa threshold)">phá</th>'
      + '<th class="rest-h name" title="Số đáp án thuộc rest (rest = ngoài pool tối đa, có freq&gt;0)">rest</th>' +
      pool.map((pi) => '<th class="name" data-pi="' + pi + '">' + pairLabels[pi] + '</th>').join('') +
      '</tr></thead>';

    let body = '<tbody>';
    for (let j = 0; j < displayIdx.length; j++) {
      const i = displayIdx[j];
      body += '<tr><td class="id hist-id" data-idx="' + i + '" data-id="' + ids[i]
        + '" title="Click ON để xem số bị loại theo các cột ✓">' + ids[i] + '</td>'
        + '<td class="pool-nums" data-idx="' + i + '"></td>'
        + '<td class="viol-nums" data-idx="' + i + '"></td>'
        + '<td class="rest-ans" data-idx="' + i + '"></td>';
      for (let ai = 0; ai < pool.length; ai++) {
        const pi = pool[ai];
        const s = splits[pi];
        if (s.hold.has(i)) body += '<td class="ok" data-pi="' + pi + '">✓</td>';
        else if (s.disabled.has(i)) {
          body += '<td class="nop" data-pi="' + pi
            + '" title="Disable: không có derive[D]+peer[P] khác số cùng hàng W10"></td>';
        } else body += '<td data-pi="' + pi + '"></td>';
      }
      body += '</tr>';
    }

    body += '<tr class="sim-row"><td class="id sim-id" data-id="' + simState.focusId
      + '" title="Click: mở popup giả lập phá (click số đậm trên pool)">' + simState.focusId + '</td>'
      + '<td class="pool-nums" title="Kỳ giả lập">—</td>'
      + '<td class="viol-nums" title="Kỳ giả lập — chưa có đáp án">—</td>'
      + '<td class="rest-ans" title="Kỳ giả lập — chưa có đáp án">—</td>';
    for (let ai = 0; ai < pool.length; ai++) {
      const pi = pool[ai];
      if (simState.disabled[pi]) {
        body += '<td class="sim-cell nop" data-pi="' + pi
          + '" title="Disable: không có derive[D]+peer[P] khác số cùng hàng W10"></td>';
      } else {
        body += '<td class="sim-cell" data-pi="' + pi + '"></td>';
      }
    }
    body += '</tr></tbody>';

    wrap.innerHTML = '<table class="dc-table">' + thead + body + '</table>';
    bindHistIds();
    bindSimRow();
  }

  function paintTable(opts) {
    if (!tableBundle || !simState) return;
    const keepScroll = !!(opts && opts.keepScroll);
    const hasTable = !!wrap.querySelector('table.dc-table');
    // Đổi threshold: chỉ ẩn/hiện cột. Chỉ dựng lại bảng khi chưa có table.
    if (!keepScroll || !hasTable) {
      buildFullTable();
    }
    applyThresholdColumns();
    syncSimRowDom();
    syncHistIdDom();
    if (pendingSharedFocus != null) flushPendingSharedFocus();
  }

  function render(rows) {
    const t0 = performance.now();
    statusEl.textContent = 'Đang tính…';
    simTicks = PAIRS.map(() => false);
    simIdOn = false;
    histIdOnIdx = null;
    focusUndoA = null;
    focusUndoB = null;
    clearSimTlPháPicks();
    restHitCache = null;
    derivePhaMaxList = [];
    deriveRestList = [];
    phaKListsByK = {};

    const n = rows.length;
    const rowNums = new Array(n);
    const ids = new Array(n);
    for (let i = 0; i < n; i++) {
      rowNums[i] = isEmptyResultRow(rows[i])
        ? []
        : parseMainNums(rows[i].result || rows[i].Result || '');
      ids[i] = rowIdOf(rows[i], i);
    }

    const candsCache = buildCandsCache(rows, rowNums);
    const splits = PAIRS.map(([d, p]) => splitFor(rows, rowNums, candsCache, d, p));

    const displayIdx = [];
    for (let i = 0; i < n; i++) {
      if (ids[i] >= MIN_ID && rowNums[i].length) displayIdx.push(i);
    }

    const holdMasks = new Map();
    const violateMasks = new Map();
    for (let j = 0; j < displayIdx.length; j++) {
      const i = displayIdx[j];
      holdMasks.set(i, splits.map((s) => s.hold.has(i)));
      violateMasks.set(i, splits.map((s) => s.violate.has(i)));
    }

    dataCtx = { rows, rowNums, ids, candsCache, holdMasks, violateMasks };

    const stats = splits.map((s) => {
      let h = 0;
      let a = 0;
      for (let j = 0; j < displayIdx.length; j++) {
        const i = displayIdx[j];
        if (s.hold.has(i)) {
          h++;
          a++;
        } else if (s.violate.has(i)) {
          a++;
        }
      }
      const pctNum = a ? (100 * h) / a : NaN;
      return {
        hold: h,
        applicable: a,
        pctNum,
        pct: a ? pctNum.toFixed(1) + '%' : '—',
        xy: h + '/' + a
      };
    });

    simState = buildSimState(rows, rowNums, ids);
    const pairLabels = PAIRS.map(([d, p]) => '(' + d + ',' + p + ')');
    const ms = Math.round(performance.now() - t0);
    tableBundle = {
      displayIdx,
      ids,
      splits,
      stats,
      pairLabels,
      msHint: ms + 'ms'
    };

    computeDeriveOverlapLists();
    paintTable({ keepScroll: false });
    requestAnimationFrame(() => {
      if (window.FocusSync && typeof window.FocusSync.seedFromUrlOrStorage === 'function') {
        window.FocusSync.seedFromUrlOrStorage({ useStorage: true });
      }
      flushPendingSharedFocus();
      if (histIdOnIdx == null && !simIdOn) {
        wrap.scrollTop = wrap.scrollHeight;
      }
    });
  }

  function syncThresholdFromUi() {
    thVal = clampTh(thValEl.value);
    thValEl.value = String(thVal);
    syncThOpDropdown();
    saveThresholdPrefs();
    if (tableBundle) {
      applyThresholdColumns();
      refreshOpenPopupAfterThreshold();
    }
  }

  function setThresholdOp(op) {
    thOp = op === '=' || op === '<=' ? op : '>=';
    syncThOpDropdown();
    closeThOpMenu();
    saveThresholdPrefs();
    if (tableBundle) {
      applyThresholdColumns();
      refreshOpenPopupAfterThreshold();
    }
  }

  function stepThreshold(delta) {
    thVal = clampTh(thVal + delta);
    thValEl.value = String(thVal);
    saveThresholdPrefs();
    if (tableBundle) {
      applyThresholdColumns();
      refreshOpenPopupAfterThreshold();
    }
  }

  function bindHoldStep(btn, dir) {
    let delayTimer = null;
    let repeatTimer = null;
    const clear = () => {
      if (delayTimer) clearTimeout(delayTimer);
      if (repeatTimer) clearInterval(repeatTimer);
      delayTimer = null;
      repeatTimer = null;
    };
    const start = (e) => {
      e.preventDefault();
      stepThreshold(dir);
      clear();
      delayTimer = setTimeout(() => {
        repeatTimer = setInterval(() => stepThreshold(dir), 45);
      }, 280);
    };
    btn.addEventListener('mousedown', start);
    btn.addEventListener('touchstart', start, { passive: false });
    btn.addEventListener('mouseup', clear);
    btn.addEventListener('mouseleave', clear);
    btn.addEventListener('touchend', clear);
    btn.addEventListener('touchcancel', clear);
  }

  thOpBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (thOpMenu.hidden) openThOpMenu();
    else closeThOpMenu();
  });
  thOpItems.forEach((item) => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      setThresholdOp(item.getAttribute('data-op'));
    });
  });
  document.addEventListener('click', (e) => {
    if (!thOpDd.contains(e.target)) closeThOpMenu();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !thOpMenu.hidden) closeThOpMenu();
  });
  thValEl.addEventListener('change', syncThresholdFromUi);
  thValEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      syncThresholdFromUi();
      thValEl.blur();
    }
  });
  bindHoldStep(thDecEl, -1);
  bindHoldStep(thIncEl, 1);

  function showFetchError(msg) {
    errEl.hidden = false;
    errEl.textContent = msg;
    summaryEl.hidden = true;
    statusEl.textContent = 'Không tải được data.json.';
  }

  initSharedFocusIdSync();
  initSimRoomTagSync();
  // Giữ id từ URL sớm — apply khi bảng xong.
  try {
    const sp = new URLSearchParams(location.search);
    const qid = Number(sp.get('id'));
    if (Number.isFinite(qid) && qid > 0) {
      pendingSharedFocus = { id: Math.floor(qid), popup: false, mode: null };
    }
  } catch (e) { /* ignore */ }

  fetch('data.json', { cache: 'no-store' })
    .then((r) => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then((data) => {
      if (!Array.isArray(data)) throw new Error('data.json phải là mảng kỳ');
      errEl.hidden = true;
      render(data);
    })
    .catch(() => {
      showFetchError(
        'Không đọc được data.json cùng cấp. Mở trang qua http (Live Server / python -m http.server) trong thư mục có file HTML + data.json.'
      );
    });
})();
</script>
</body>
</html>
