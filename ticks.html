<script>
(function () {
  // Pool đủ (D,P) ∈ 0..9; thứ tự: P tăng dần, rồi D tăng dần.
  // Cột chỉ vào bảng khi T% thỏa threshold.
  const PAIRS = [];
  for (let P = 0; P <= 9; P++) {
    for (let D = 0; D <= 9; D++) {
      PAIRS.push([D, P]);
    }
  }
  const MIN_ID = 21;
  const statusEl = document.getElementById('status');
  const errEl = document.getElementById('err');
  const wrap = document.getElementById('wrap');
  const summaryEl = document.getElementById('summary');
  const sumFullCount = document.getElementById('sumFullCount');
  const sumZeroCount = document.getElementById('sumZeroCount');
  const sumDerivePhaCount = document.getElementById('sumDerivePhaCount');
  const sumDeriveRestCount = document.getElementById('sumDeriveRestCount');
  const sumViolPct = document.getElementById('sumViolPct');
  const sumViolFrac = document.getElementById('sumViolFrac');
  const chipViolRate = document.getElementById('chipViolRate');
  const sumRestPct = document.getElementById('sumRestPct');
  const sumRestFrac = document.getElementById('sumRestFrac');
  const chipRestRate = document.getElementById('chipRestRate');
  /** Cache: %rest không phụ thuộc threshold header. */
  let restHitCache = null;
  const btnFullList = document.getElementById('btnFullList');
  const btnZeroList = document.getElementById('btnZeroList');
  const btnDerivePhaList = document.getElementById('btnDerivePhaList');
  const btnDeriveRestList = document.getElementById('btnDeriveRestList');
  const modalBack = document.getElementById('modalBack');
  const modalEl = modalBack ? modalBack.querySelector('.modal') : null;
  const modalTitle = document.getElementById('modalTitle');
  const modalSub = document.getElementById('modalSub');
  const modalRest = document.getElementById('modalRest');
  const modalPool = document.getElementById('modalPool');
  const modalSum = document.getElementById('modalSum');
  const SUBSCRIPT_DIGITS = '₀₁₂₃₄₅₆₇₈₉';
  const modalTimeline = document.getElementById('modalTimeline');
  const modalBody = document.getElementById('modalBody');
  const modalClose = document.getElementById('modalClose');
  /** Pool kỳ đang mở popup — so sánh khi đổi threshold để in đậm số mới vào. */
  /** @type {Set<number>|null} */
  let popupPoolPrev = null;
  /** Số từng mới vào pool trong phiên popup — giữ in đậm đến khi ra khỏi pool. */
  /** @type {Set<number>} */
  let popupPoolBold = new Set();
  const thOpDd = document.getElementById('thOpDd');
  const thOpBtn = document.getElementById('thOpBtn');
  const thOpMenu = document.getElementById('thOpMenu');
  const thOpItems = Array.prototype.slice.call(thOpMenu.querySelectorAll('[data-op]'));
  const thValEl = document.getElementById('thVal');
  const thDecEl = document.getElementById('thDec');
  const thIncEl = document.getElementById('thInc');
  const OP_LABEL = { '>=': '>=', '=': '=', '<=': '<=' };

  /** @type {{ focusId: number, focusIdx: number, disabled: boolean[], details: object[], cands: number[] } | null} */
  let simState = null;
  let simTicks = PAIRS.map(() => false);
  let simIdOn = false;
  /** @type {number|null} */
  let histIdOnIdx = null;
  /** @type {'elim'|'stats'|null} */
  let popupKind = null;
  /** @type {'full'|'zero'|'derivePha'|'deriveRest'|null} */
  let statsPopupKind = null;
  /** @type {{ rows: object[], rowNums: number[][], ids: number[], candsCache: object[][], holdMasks: Map<number, boolean[]>, violateMasks: Map<number, boolean[]> } | null} */
  let dataCtx = null;
  /** @type {{ id: number, enabled: number }[]} */
  let fullTickList = [];
  /** @type {number[]} */
  let zeroTickList = [];
  /** @type {{ id: number, nums: number[] }[]} */
  let derivePhaMaxList = [];
  /** @type {{ id: number, nums: number[] }[]} */
  let deriveRestList = [];
  /** @type {null | { displayIdx: number[], ids: number[], splits: object[], stats: object[], pairLabels: string[], msHint: string }} */
  let tableBundle = null;
  const TH_LS_KEY = 'ticks.threshold';
  let thOp = '>=';
  let thVal = 70;

  function isEmptyResultRow(row) {
    return !String((row && (row.result || row.Result)) || '').trim();
  }

  function parseMainNums(s) {
    if (!s) return [];
    return String(s).split('|')[0].split(',')
      .map((x) => parseInt(x, 10))
      .filter((n) => !isNaN(n));
  }

  function rowIdOf(row, i) {
    const raw = String(row.id || row.ID || '').replace(/^0+/, '');
    const n = parseInt(raw, 10);
    return Number.isFinite(n) ? n : i + 1;
  }

  function collectDirectedAdjEdgeIndices(histSets, y, x) {
    const idxs = [];
    for (let e = 0; e < histSets.length - 1; e++) {
      if (histSets[e].has(y) && histSets[e + 1].has(x)) idxs.push(e);
    }
    return idxs;
  }

  function nonOverlapAdjCountStarts(idxs) {
    const sorted = idxs.slice().sort((a, b) => a - b);
    let last = -3;
    const counted = [];
    for (let i = 0; i < sorted.length; i++) {
      const ii = sorted[i];
      if (ii > last + 1) {
        counted.push(ii);
        last = ii;
      }
    }
    return counted;
  }

  /** focusIdx có thể = rows.length (kỳ giả lập chưa có đáp án). */
  function enumerateTail3Cands(rows, rowNums, focusIdx) {
    const n = rows.length;
    const idx = focusIdx;
    if (idx < 1 || idx > n) return [];
    const phaseRow = rows[idx - 1];
    if (!phaseRow || isEmptyResultRow(phaseRow)) return [];
    const phase1 = rowNums[idx - 1];
    if (!phase1 || phase1.length !== 5) return [];
    const lookback = 20;
    const histStart = Math.max(0, idx - lookback);
    if (idx - histStart < 3) return [];
    const answerSet = new Set(idx < n ? rowNums[idx] : []);
    const histSets = [];
    for (let r = histStart; r < idx; r++) {
      histSets.push(new Set(rowNums[r] || []));
    }
    const byNum = new Map();
    for (let yi = 0; yi < phase1.length; yi++) {
      const y = phase1[yi];
      for (let x = 1; x <= 35; x++) {
        if (x === y) continue;
        const counted = nonOverlapAdjCountStarts(
          collectDirectedAdjEdgeIndices(histSets, y, x)
        );
        if (counted.length < 2) continue;
        if (!byNum.has(x)) {
          byNum.set(x, { num: x, inAnswer: answerSet.has(x) });
        }
      }
    }
    return Array.from(byNum.values());
  }

  function buildCandsCache(rows, rowNums) {
    const n = rows.length;
    const cache = new Array(n);
    for (let i = 0; i < n; i++) {
      cache[i] = enumerateTail3Cands(rows, rowNums, i);
    }
    return cache;
  }

  function windowCounts(rowNums, focusIdx) {
    const counts = new Int16Array(36);
    for (let r = focusIdx - 10; r < focusIdx; r++) {
      if (r < 0 || r >= rowNums.length) continue;
      const nums = rowNums[r];
      for (let ni = 0; ni < nums.length; ni++) {
        const v = nums[ni];
        if (v >= 1 && v <= 35) counts[v]++;
      }
    }
    return counts;
  }

  /**
   * Cần ít nhất 1 hàng W10 có derive[D] và peer[P] khác số (cùng chuỗi).
   * Chỉ có derive freq=D mà không còn P khác cùng hàng → disable (vd 942,(5,5)).
   */
  function hasDerivePeerWitness(rowNums, focusIdx, cands, counts, deriveFreq, peerFreq) {
    if (!cands || !cands.length) return false;
    const derivesD = [];
    for (let ci = 0; ci < cands.length; ci++) {
      const c = cands[ci];
      if (!c) continue;
      if ((counts[c.num] | 0) === deriveFreq) derivesD.push(c.num);
    }
    if (!derivesD.length) return false;
    const deriveDSet = new Set(derivesD);
    for (let r = focusIdx - 10; r < focusIdx; r++) {
      if (r < 0 || r >= rowNums.length) continue;
      const nums = rowNums[r];
      if (!nums.length) continue;
      let hasDerive = false;
      for (let di = 0; di < derivesD.length; di++) {
        if (nums.indexOf(derivesD[di]) !== -1) {
          hasDerive = true;
          break;
        }
      }
      if (!hasDerive) continue;
      for (let ni = 0; ni < nums.length; ni++) {
        const v = nums[ni];
        if (!(v >= 1 && v <= 35)) continue;
        if (deriveDSet.has(v)) continue;
        if ((counts[v] | 0) === peerFreq) return true;
      }
    }
    return false;
  }

  function isPairDisabled(rowNums, focusIdx, cands, counts, deriveFreq, peerFreq) {
    return !hasDerivePeerWitness(rowNums, focusIdx, cands, counts, deriveFreq, peerFreq);
  }

  function splitFor(rows, rowNums, candsCache, deriveFreq, peerFreq) {
    const n = rows.length;
    const hold = [];
    const violate = [];
    const disabled = [];
    /** @type {Map<number, Set<number>>} */
    const violNums = new Map();
    /** Peer loại theo (D,P) tại kỳ — hợp thành cột pool; phá ⊆ pool. */
    /** @type {Map<number, Set<number>>} */
    const poolNums = new Map();
    const counts = new Int16Array(36);
    const addRow = (ri, sign) => {
      if (ri < 0 || ri >= n) return;
      const nums = rowNums[ri];
      for (let ni = 0; ni < nums.length; ni++) {
        const v = nums[ni];
        if (v >= 1 && v <= 35) counts[v] += sign;
      }
    };

    for (let i = 0; i < n; i++) {
      if (i >= 10 && rowNums[i].length) {
        const cands = candsCache[i] || [];
        if (isPairDisabled(rowNums, i, cands, counts, deriveFreq, peerFreq)) {
          disabled.push(i);
        } else {
          const answerSet = new Set(rowNums[i]);
          const derivesD = [];
          for (let ci = 0; ci < cands.length; ci++) {
            const c = cands[ci];
            if (!c) continue;
            if (deriveFreq != null && (counts[c.num] | 0) !== deriveFreq) continue;
            derivesD.push(c.num);
          }
          const deriveDSet = new Set(derivesD);
          let applicable = false;
          let isViol = false;
          /** @type {Set<number>|null} */
          let hitPeers = null;
          /** @type {Set<number>|null} */
          let allPeers = null;
          const winStart = i - 10;
          for (let r = winStart; r < i; r++) {
            const nums = rowNums[r];
            if (!nums.length) continue;
            const derivesOnRow = [];
            const seenD = new Set();
            for (let di = 0; di < derivesD.length; di++) {
              const x = derivesD[di];
              if (seenD.has(x)) continue;
              if (nums.indexOf(x) === -1) continue;
              seenD.add(x);
              derivesOnRow.push(x);
            }
            if (!derivesOnRow.length) continue;
            const wantPeer = peerFreq != null ? peerFreq : (counts[derivesOnRow[0]] | 0);
            const peersOnRow = [];
            const seenP = new Set();
            for (let ni = 0; ni < nums.length; ni++) {
              const v = nums[ni];
              if (!(v >= 1 && v <= 35) || seenP.has(v)) continue;
              if (deriveDSet.has(v)) continue;
              if ((counts[v] | 0) !== wantPeer) continue;
              seenP.add(v);
              peersOnRow.push(v);
            }
            if (!peersOnRow.length) continue;
            applicable = true;
            if (!allPeers) allPeers = new Set();
            for (let pi = 0; pi < peersOnRow.length; pi++) allPeers.add(peersOnRow[pi]);
            let anyDeriveInAnswer = false;
            for (let di = 0; di < derivesOnRow.length; di++) {
              if (answerSet.has(derivesOnRow[di])) {
                anyDeriveInAnswer = true;
                break;
              }
            }
            if (anyDeriveInAnswer) continue;
            for (let pi = 0; pi < peersOnRow.length; pi++) {
              if (answerSet.has(peersOnRow[pi])) {
                isViol = true;
                if (!hitPeers) hitPeers = new Set();
                hitPeers.add(peersOnRow[pi]);
              }
            }
          }
          if (applicable) {
            if (allPeers && allPeers.size) poolNums.set(i, allPeers);
            if (isViol) {
              violate.push(i);
              if (hitPeers && hitPeers.size) violNums.set(i, hitPeers);
            } else hold.push(i);
          }
        }
      }
      addRow(i, 1);
      if (i >= 10) addRow(i - 10, -1);
    }
    return {
      hold: new Set(hold),
      violate: new Set(violate),
      disabled: new Set(disabled),
      violNums: violNums,
      poolNums: poolNums
    };
  }

  /** Chi tiết loại peer khi giả định (D,P) đúng — trước đáp án. */
  function elimDetailsForPair(rows, rowNums, ids, focusIdx, focusId, cands, counts, D, P) {
    const label = '(' + D + ',' + P + ')';
    if (isPairDisabled(rowNums, focusIdx, cands, counts, D, P)) {
      return { label, D, P, disabled: true, lines: [], elim: [] };
    }
    const derivesD = [];
    for (let ci = 0; ci < cands.length; ci++) {
      const c = cands[ci];
      if (!c) continue;
      if ((counts[c.num] | 0) === D) derivesD.push(c.num);
    }
    const deriveDSet = new Set(derivesD);
    const lines = [];
    const elim = new Set();
    for (let r = focusIdx - 10; r < focusIdx; r++) {
      if (r < 0 || r >= rowNums.length) continue;
      const nums = rowNums[r];
      if (!nums.length) continue;
      const chuoi = focusId - ids[r];
      const derivesOnRow = [];
      for (let di = 0; di < derivesD.length; di++) {
        const x = derivesD[di];
        if (nums.indexOf(x) !== -1) derivesOnRow.push(x);
      }
      if (!derivesOnRow.length) continue;
      const peersOnRow = [];
      const seenP = new Set();
      for (let ni = 0; ni < nums.length; ni++) {
        const v = nums[ni];
        if (!(v >= 1 && v <= 35) || seenP.has(v)) continue;
        if (deriveDSet.has(v)) continue;
        if ((counts[v] | 0) !== P) continue;
        seenP.add(v);
        peersOnRow.push(v);
      }
      if (!peersOnRow.length) continue;
      peersOnRow.forEach((p) => elim.add(p));
      lines.push({
        chuoi: chuoi,
        rowId: ids[r],
        derives: derivesOnRow.slice(),
        peers: peersOnRow.slice()
      });
    }
    return {
      label,
      D,
      P,
      disabled: false,
      lines,
      elim: Array.from(elim).sort((a, b) => a - b)
    };
  }

  /** Peer nằm trong đáp án (derive không) → phá luật (D,P). */
  function violateDetailsForPair(rows, rowNums, ids, focusIdx, focusId, cands, counts, D, P) {
    const label = '(' + D + ',' + P + ')';
    if (isPairDisabled(rowNums, focusIdx, cands, counts, D, P)) {
      return { label, D, P, disabled: true, lines: [], viol: [] };
    }
    const answerSet = new Set(rowNums[focusIdx] || []);
    const derivesD = [];
    for (let ci = 0; ci < cands.length; ci++) {
      const c = cands[ci];
      if (!c) continue;
      if ((counts[c.num] | 0) === D) derivesD.push(c.num);
    }
    const deriveDSet = new Set(derivesD);
    const lines = [];
    const viol = new Set();
    for (let r = focusIdx - 10; r < focusIdx; r++) {
      if (r < 0 || r >= rowNums.length) continue;
      const nums = rowNums[r];
      if (!nums.length) continue;
      const chuoi = focusId - ids[r];
      const derivesOnRow = [];
      for (let di = 0; di < derivesD.length; di++) {
        const x = derivesD[di];
        if (nums.indexOf(x) !== -1) derivesOnRow.push(x);
      }
      if (!derivesOnRow.length) continue;
      const peersOnRow = [];
      const seenP = new Set();
      for (let ni = 0; ni < nums.length; ni++) {
        const v = nums[ni];
        if (!(v >= 1 && v <= 35) || seenP.has(v)) continue;
        if (deriveDSet.has(v)) continue;
        if ((counts[v] | 0) !== P) continue;
        seenP.add(v);
        peersOnRow.push(v);
      }
      if (!peersOnRow.length) continue;
      let anyDeriveInAnswer = false;
      for (let di = 0; di < derivesOnRow.length; di++) {
        if (answerSet.has(derivesOnRow[di])) {
          anyDeriveInAnswer = true;
          break;
        }
      }
      if (anyDeriveInAnswer) continue;
      const hit = [];
      for (let pi = 0; pi < peersOnRow.length; pi++) {
        const p = peersOnRow[pi];
        if (answerSet.has(p)) {
          hit.push(p);
          viol.add(p);
        }
      }
      if (!hit.length) continue;
      lines.push({
        chuoi: chuoi,
        rowId: ids[r],
        derives: derivesOnRow.slice(),
        peers: hit.slice()
      });
    }
    return {
      label,
      D,
      P,
      disabled: false,
      lines,
      viol: Array.from(viol).sort((a, b) => a - b)
    };
  }

  /**
   * Kỳ giả lập = kỳ ngay sau kỳ cuối CÓ đáp án.
   * Nếu data có hàng rỗng trailing (vd id 943 trống) thì focus đúng hàng đó,
   * không +1 thêm thành 944 (phase1 sẽ rỗng → mọi cột loại không).
   */
  function resolveSimFocus(rows, rowNums, ids) {
    let lastNe = rows.length - 1;
    while (lastNe >= 0 && !(rowNums[lastNe] && rowNums[lastNe].length)) {
      lastNe--;
    }
    if (lastNe < 0) return null;
    if (lastNe + 1 < rows.length && !(rowNums[lastNe + 1] && rowNums[lastNe + 1].length)) {
      return { focusIdx: lastNe + 1, focusId: ids[lastNe + 1] };
    }
    return { focusIdx: lastNe + 1, focusId: ids[lastNe] + 1 };
  }

  function buildSimState(rows, rowNums, ids) {
    const focus = resolveSimFocus(rows, rowNums, ids);
    if (!focus) return null;
    const { focusIdx, focusId } = focus;
    const counts = windowCounts(rowNums, focusIdx);
    const cands = enumerateTail3Cands(rows, rowNums, focusIdx);
    const disabled = [];
    const details = [];
    for (let pi = 0; pi < PAIRS.length; pi++) {
      const D = PAIRS[pi][0];
      const P = PAIRS[pi][1];
      disabled[pi] = isPairDisabled(rowNums, focusIdx, cands, counts, D, P);
      details[pi] = elimDetailsForPair(
        rows, rowNums, ids, focusIdx, focusId, cands, counts, D, P
      );
    }
    return { focusId, focusIdx, disabled, details, cands: cands.map((c) => c.num) };
  }

  function detailsAtFocus(focusIdx, focusId) {
    if (!dataCtx) return null;
    const { rows, rowNums, ids, candsCache } = dataCtx;
    const counts = windowCounts(rowNums, focusIdx);
    const cands = focusIdx < candsCache.length
      ? candsCache[focusIdx]
      : enumerateTail3Cands(rows, rowNums, focusIdx);
    const details = [];
    const violDetails = [];
    const disabled = [];
    for (let pi = 0; pi < PAIRS.length; pi++) {
      const D = PAIRS[pi][0];
      const P = PAIRS[pi][1];
      disabled[pi] = isPairDisabled(rowNums, focusIdx, cands || [], counts, D, P);
      details[pi] = elimDetailsForPair(
        rows, rowNums, ids, focusIdx, focusId, cands || [], counts, D, P
      );
      violDetails[pi] = violateDetailsForPair(
        rows, rowNums, ids, focusIdx, focusId, cands || [], counts, D, P
      );
    }
    return { focusId, focusIdx, details, violDetails, disabled };
  }

  function renderPairElimBlocks(details, disabled, mask) {
    const chosen = [];
    const allElim = new Set();
    let html = '';
    for (let pi = 0; pi < PAIRS.length; pi++) {
      if (!mask[pi] || disabled[pi]) continue;
      const d = details[pi];
      if (!d) continue;
      chosen.push(d.label);
      d.elim.forEach((x) => allElim.add(x));
      html += '<div class="pair-block">';
      html += '<div class="pair-title">' + d.label + ' → loại: '
        + (d.elim.length ? d.elim.join(', ') : '(không)') + '</div>';
      if (!d.lines.length) {
        html += '<div class="none">Không có chuỗi witness derive[D]+peer[P]</div>';
      } else {
        for (let li = 0; li < d.lines.length; li++) {
          const L = d.lines[li];
          html += '<div class="pair-line">chuỗi ' + L.chuoi
            + ' (id ' + L.rowId + '): derive {' + L.derives.join(',')
            + '} → loại {' + L.peers.join(',') + '}</div>';
        }
      }
      html += '</div>';
    }
    return { chosen, allElim, html };
  }

  function renderPairViolBlocks(violDetails, disabled, violMask, lineSuffix) {
    const suffix = lineSuffix || 'đáp án có peer';
    const chosen = [];
    const allViol = new Set();
    let html = '';
    for (let pi = 0; pi < PAIRS.length; pi++) {
      if (!violMask[pi] || disabled[pi]) continue;
      const d = violDetails[pi];
      if (!d || !d.viol || !d.viol.length) continue;
      chosen.push(d.label);
      d.viol.forEach((x) => allViol.add(x));
      html += '<div class="pair-block viol-block">';
      html += '<div class="pair-title viol">' + d.label + ' → phá: '
        + d.viol.join(', ') + '</div>';
      for (let li = 0; li < d.lines.length; li++) {
        const L = d.lines[li];
        html += '<div class="pair-line">chuỗi ' + L.chuoi
          + ' (id ' + L.rowId + '): derive {' + L.derives.join(',')
          + '} → ' + suffix + ' {' + L.peers.join(',') + '}</div>';
      }
      html += '</div>';
    }
    return { chosen, allViol, html };
  }

  function escapeAttr(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;');
  }

  const COPY_ICON_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">'
    + '<path fill="currentColor" d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>'
    + '</svg>';
  const COPY_OK_ICON_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">'
    + '<path fill="currentColor" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>'
    + '</svg>';

  /** Nút copy dãy a,b,c (không freq) — icon clipboard. */
  function copyNumsBtnHtml(nums) {
    const csv = (nums || []).join(',');
    return '<button type="button" class="copy-nums-btn" data-copy="'
      + escapeAttr(csv)
      + '" title="Copy ' + (csv ? csv : '(rỗng)') + '" aria-label="Copy dãy số">'
      + COPY_ICON_SVG + '</button>';
  }

  function copyTextToClipboard(text, btn) {
    const done = () => {
      if (!btn) return;
      btn.innerHTML = COPY_OK_ICON_SVG;
      btn.classList.add('is-ok');
      setTimeout(() => {
        btn.innerHTML = COPY_ICON_SVG;
        btn.classList.remove('is-ok');
      }, 900);
    };
    const fail = () => {
      if (btn) btn.title = 'Copy thất bại';
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fail);
      return;
    }
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    } catch (e) {
      fail();
    }
  }

  function formatPoolSubHtml(arr, boldSet) {
    const nums = arr || [];
    let body;
    if (!nums.length) {
      body = 'pool[0] {}';
    } else {
      const parts = [];
      for (let i = 0; i < nums.length; i++) {
        const n = nums[i];
        const isBold = !!(boldSet && boldSet.has(n));
        parts.push(isBold ? ('<b>' + n + '</b>') : String(n));
      }
      body = 'pool[' + nums.length + '] {' + parts.join(',') + '}';
    }
    return '<span class="pool-sub-text">' + body + '</span>' + copyNumsBtnHtml(nums);
  }

  function toSubscript(n) {
    return String(n).replace(/[0-9]/g, (d) => SUBSCRIPT_DIGITS[Number(d)]);
  }

  /**
   * Cột khi pool tối đa: hợp active của >=1% và <=100%
   * (rest cố định, không đổi theo threshold header).
   */
  function maxPoolPairIndices() {
    const seen = new Set();
    const out = [];
    function addAll(list) {
      for (let i = 0; i < list.length; i++) {
        const pi = list[i];
        if (seen.has(pi)) continue;
        seen.add(pi);
        out.push(pi);
      }
    }
    addAll(activePairIndicesAt('>=', 1));
    addAll(activePairIndicesAt('<=', 100));
    return out;
  }

  /** rest = (1..35) \ nonexist(freq=0) \ poolMax; mỗi số kèm freq dưới chân. */
  function buildRestItems(poolMaxArr, counts) {
    const poolSet = new Set(poolMaxArr || []);
    const out = [];
    for (let n = 1; n <= 35; n++) {
      const f = counts && (counts[n] | 0);
      if (!f) continue;
      if (poolSet.has(n)) continue;
      out.push({ num: n, freq: f });
    }
    return out;
  }

  function formatRestSubHtml(restItems, answerSet) {
    const items = restItems || [];
    const nums = items.map((it) => it.num);
    let body;
    if (!items.length) {
      body = 'rest[0] {}';
    } else {
      const ans = answerSet || null;
      const parts = [];
      for (let i = 0; i < items.length; i++) {
        const it = items[i];
        const bit = String(it.num) + '<span class="freq-sub">' + toSubscript(it.freq) + '</span>';
        parts.push(ans && ans.has(it.num)
          ? ('<span class="rest-hit">' + bit + '</span>')
          : bit);
      }
      body = 'rest[' + items.length + '] {' + parts.join(',') + '}';
    }
    return '<span class="pool-sub-text">' + body + '</span>' + copyNumsBtnHtml(nums);
  }

  function hideModalRestPool() {
    if (modalRest) {
      modalRest.hidden = true;
      modalRest.innerHTML = '';
    }
    if (modalPool) {
      modalPool.hidden = true;
      modalPool.innerHTML = '';
    }
  }

  function resetPopupPoolTrack() {
    popupPoolPrev = null;
    popupPoolBold = new Set();
  }

  function syncPopupPoolBold(poolArr) {
    const next = new Set(poolArr);
    if (!popupPoolPrev) {
      popupPoolBold = new Set();
    } else {
      const newlyIn = [];
      next.forEach((n) => {
        if (!popupPoolPrev.has(n)) newlyIn.push(n);
      });
      if (newlyIn.length) {
        // Có số mới → chỉ đậm đúng các số vừa vào lần này.
        popupPoolBold = new Set(newlyIn);
      } else {
        // Không có số mới → giữ đậm các số đậm trước đó còn nằm trong pool.
        const kept = new Set();
        popupPoolBold.forEach((n) => {
          if (next.has(n)) kept.add(n);
        });
        popupPoolBold = kept;
      }
    }
    popupPoolPrev = next;
  }

  /** Đậm dòng pool phía trên = peer của luật mới ở mốc timeline cuối. */
  function seedPoolBoldFromMilestones(milestones, poolArr) {
    const bold = new Set();
    if (milestones && milestones.length) {
      const last = milestones[milestones.length - 1];
      const newly = last.newlyIn || [];
      for (let i = 0; i < newly.length; i++) bold.add(newly[i]);
    }
    popupPoolBold = bold;
    popupPoolPrev = new Set(poolArr);
  }

  function activePairIndicesAt(op, val) {
    if (!tableBundle) return [];
    const out = [];
    for (let pi = 0; pi < PAIRS.length; pi++) {
      const st = tableBundle.stats[pi];
      if (!st || !st.applicable) continue;
      if (pctMeets(st.pctNum, op, val)) out.push(pi);
    }
    out.sort((a, b) => {
      const Pa = PAIRS[a][1];
      const Pb = PAIRS[b][1];
      if (Pa !== Pb) return Pa - Pb;
      return PAIRS[a][0] - PAIRS[b][0];
    });
    return out;
  }

  function simPoolPháArrAt(active) {
    const poolSet = new Set();
    const pháArr = [];
    const pháSeen = new Set();
    if (!simState) return { pool: [], phá: [] };
    for (let ai = 0; ai < active.length; ai++) {
      const pi = active[ai];
      if (simState.disabled[pi]) continue;
      const d = simState.details[pi];
      if (!d || !d.elim) continue;
      d.elim.forEach((x) => poolSet.add(x));
      if (!simTicks[pi]) {
        d.elim.forEach((x) => {
          if (pháSeen.has(x)) return;
          pháSeen.add(x);
          pháArr.push(x);
        });
      }
    }
    return { pool: sortedNumsFromSet(poolSet), phá: pháArr };
  }

  /** Peer pool chỉ từ các cặp pairIndices (luật mới) tại kỳ i. */
  function poolNumsArrForPairs(i, pairIndices) {
    if (!tableBundle || !pairIndices || !pairIndices.length) return [];
    const { splits } = tableBundle;
    const set = new Set();
    for (let ai = 0; ai < pairIndices.length; ai++) {
      const pi = pairIndices[ai];
      const s = splits[pi];
      if (!s || s.disabled.has(i)) continue;
      if (!s.hold.has(i) && !s.violate.has(i)) continue;
      const pn = s.poolNums && s.poolNums.get(i);
      if (!pn) continue;
      pn.forEach((x) => set.add(x));
    }
    return Array.from(set);
  }

  function simPoolNumsForPairs(pairIndices) {
    if (!simState || !pairIndices || !pairIndices.length) return [];
    const set = new Set();
    for (let ai = 0; ai < pairIndices.length; ai++) {
      const pi = pairIndices[ai];
      if (simState.disabled[pi]) continue;
      const d = simState.details[pi];
      if (!d || !d.elim) continue;
      d.elim.forEach((x) => set.add(x));
    }
    return Array.from(set);
  }

  function lastAnsweredIdForRate() {
    if (!dataCtx) return null;
    for (let i = dataCtx.ids.length - 1; i >= 0; i--) {
      if (dataCtx.rowNums[i] && dataCtx.rowNums[i].length) return dataCtx.ids[i];
    }
    return null;
  }

  /** % phá luật tại một bộ cột active: (mẫu − tick đủ) / mẫu. */
  function violPctAtActive(active) {
    if (!tableBundle) return null;
    const { displayIdx, splits } = tableBundle;
    let full = 0;
    for (let j = 0; j < displayIdx.length; j++) {
      const i = displayIdx[j];
      let en = 0;
      let h = 0;
      for (let ai = 0; ai < active.length; ai++) {
        const pi = active[ai];
        if (splits[pi].disabled.has(i)) continue;
        en++;
        if (splits[pi].hold.has(i)) h++;
      }
      if (en > 0 && h === en) full++;
    }
    const lastId = lastAnsweredIdForRate();
    if (lastId == null) return null;
    const mau = lastId - MIN_ID + 1;
    if (mau <= 0) return null;
    return (100 * (mau - full)) / mau;
  }

  /**
   * Timeline từ đầu thang về ngưỡng hiện tại; chỉ ghi mốc khi |pool| đổi.
   * >= : 100→thVal · <= : 1→thVal · = : một mốc.
   * boldNums: mọi peer của luật MỚI (so với mốc trước) — kể cả số đã có trong pool.
   */
  function buildThresholdPoolTimeline(opts) {
    const op = thOp;
    const end = thVal;
    const steps = [];
    if (op === '>=') {
      for (let t = 100; t >= end; t--) steps.push(t);
    } else if (op === '<=') {
      for (let t = 1; t <= end; t++) steps.push(t);
    } else {
      steps.push(end);
    }
    let prevSize = null;
    /** @type {Set<number>|null} */
    let prevMilestoneActive = null;
    /** Phá append theo timeline — không sort. */
    const pháChain = [];
    const pháSeen = new Set();
    const milestones = [];
    const isHist = opts.mode === 'hist' && Number.isFinite(opts.focusIdx);
    for (let si = 0; si < steps.length; si++) {
      const t = steps[si];
      const active = activePairIndicesAt(op, t);
      let poolArr;
      let pháArr;
      if (isHist) {
        poolArr = poolNumsArrForRow(opts.focusIdx, active);
        pháArr = violNumsArrForRow(opts.focusIdx, active, true);
      } else {
        const packed = simPoolPháArrAt(active);
        poolArr = packed.pool;
        pháArr = packed.phá;
      }
      if (prevSize !== null && poolArr.length === prevSize) continue;
      const newPairs = [];
      for (let ai = 0; ai < active.length; ai++) {
        const pi = active[ai];
        if (!prevMilestoneActive || !prevMilestoneActive.has(pi)) newPairs.push(pi);
      }
      const related = isHist
        ? poolNumsArrForPairs(opts.focusIdx, newPairs)
        : simPoolNumsForPairs(newPairs);
      const poolSet = new Set(poolArr);
      const boldNums = [];
      for (let i = 0; i < related.length; i++) {
        const n = related[i];
        if (poolSet.has(n)) boldNums.push(n);
      }
      for (let i = 0; i < pháArr.length; i++) {
        const n = pháArr[i];
        if (pháSeen.has(n)) continue;
        pháSeen.add(n);
        pháChain.push(n);
      }
      const rate = violPctAtActive(active);
      milestones.push({
        t: t,
        pool: poolArr,
        phá: pháChain.slice(),
        newlyIn: boldNums,
        violPct: rate
      });
      prevSize = poolArr.length;
      prevMilestoneActive = new Set(active);
    }
    return milestones;
  }

  function formatTimelinePoolHtml(poolArr, newlyIn) {
    const nums = poolArr || [];
    const bold = new Set(newlyIn || []);
    const parts = [];
    for (let i = 0; i < nums.length; i++) {
      const n = nums[i];
      parts.push(bold.has(n) ? ('<b>' + n + '</b>') : String(n));
    }
    const body = 'pool[' + nums.length + ']{' + parts.join(',') + '}';
    return '<span class="tl-pool-text">' + body + '</span>' + copyNumsBtnHtml(nums);
  }

  function renderThresholdTimelineHtml(milestones, mode) {
    if (!milestones.length) {
      return '<div class="th-tl-title">Timeline threshold</div>'
        + '<div class="th-tl-row">(không có mốc)</div>';
    }
    const isSim = mode === 'sim';
    const dir = thOp === '>='
      ? ('>= 100% → ' + thVal + '%')
      : (thOp === '<='
        ? ('<= 1% → ' + thVal + '%')
        : ('= ' + thVal + '%'));
    let html = '<div class="th-tl-title">Timeline threshold (' + dir
      + ') · mốc khi |pool| đổi</div>';
    if (milestones.length > 1) html += '<div class="th-tl-flow" aria-hidden="true"></div>';
    for (let i = 0; i < milestones.length; i++) {
      const m = milestones[i];
      const pháTxt = isSim
        ? '???'
        : (m.phá.length ? m.phá.join(',') : '');
      const rateTxt = Number.isFinite(m.violPct)
        ? (m.violPct.toFixed(1) + '%')
        : '—';
      html += '<div class="th-tl-row">'
        + '<span class="tl-t">' + m.t + '%</span>'
        + '<span class="tl-rate" title="% phá luật tại threshold này">' + rateTxt + '</span>'
        + '<span class="tl-pool">' + formatTimelinePoolHtml(m.pool, m.newlyIn) + '</span>'
        + '<span class="tl-phá">phá: ' + pháTxt + '</span>'
        + '</div>';
    }
    return html;
  }

  function showElimPopupFrom(opts) {
    const focusId = opts.focusId;
    const details = opts.details;
    const disabled = opts.disabled || [];
    const mask = opts.mask || [];
    const modeLabel = opts.modeLabel || '';
    const emptyHint = opts.emptyHint || 'Không có cột đúng để loại số.';
    const showViolate = !!opts.showViolate;
    const violDetails = opts.violDetails || [];
    const violMask = opts.violMask || [];
    const violSecTitle = opts.violSecTitle || 'Phá luật (cột không ✓)';
    const violEmptyHint = opts.violEmptyHint
      || 'Kỳ này không phá luật cột nào (trong threshold).';
    const violLineSuffix = opts.violLineSuffix || 'đáp án có peer';
    const poolArr = Array.isArray(opts.poolNums) ? opts.poolNums.slice() : [];
    const wCounts = opts.counts || null;

    const elimPart = renderPairElimBlocks(details, disabled, mask);
    const violPart = showViolate
      ? renderPairViolBlocks(violDetails, disabled, violMask, violLineSuffix)
      : { chosen: [], allViol: new Set(), html: '' };

    let html = '';
    if (showViolate) {
      html += '<div class="sec-title">Loại (cột ✓)</div>';
      html += elimPart.chosen.length
        ? elimPart.html
        : '<p class="none">' + emptyHint + '</p>';
      html += '<div class="sec-title viol">' + violSecTitle + '</div>';
      html += violPart.chosen.length
        ? violPart.html
        : '<p class="none">' + violEmptyHint + '</p>';
    } else {
      html = elimPart.chosen.length
        ? elimPart.html
        : '<p class="none">' + emptyHint + '</p>';
    }

    const elimArr = Array.from(elimPart.allElim).sort((a, b) => a - b);
    const violArr = Array.from(violPart.allViol).sort((a, b) => a - b);
    modalTitle.textContent = showViolate ? ('Kỳ id ' + focusId) : 'Số bị loại';
    const colBits = [];
    if (elimPart.chosen.length) colBits.push('✓ ' + elimPart.chosen.join(' '));
    if (violPart.chosen.length) colBits.push('phá ' + violPart.chosen.join(' '));
    modalSub.textContent = modeLabel + ' id ' + focusId
      + ' · ' + (colBits.length ? colBits.join(' · ') : '—');
    let tlMilestones = null;
    if (showViolate) {
      const tlOpts = opts.timelineMode === 'sim'
        ? { mode: 'sim' }
        : { mode: 'hist', focusIdx: opts.focusIdx };
      tlMilestones = buildThresholdPoolTimeline(tlOpts);
      seedPoolBoldFromMilestones(tlMilestones, poolArr);
    } else {
      syncPopupPoolBold(poolArr);
    }
    if (wCounts) {
      const answerSet = opts.answerSet instanceof Set ? opts.answerSet : null;
      const poolMaxArr = Array.isArray(opts.maxPoolNums) ? opts.maxPoolNums : poolArr;
      modalRest.innerHTML = formatRestSubHtml(buildRestItems(poolMaxArr, wCounts), answerSet);
      modalRest.hidden = false;
    } else {
      modalRest.hidden = true;
      modalRest.innerHTML = '';
    }
    modalPool.innerHTML = formatPoolSubHtml(poolArr, popupPoolBold);

      sumHtml += '<div class="viol-sum">'

    } else {
      modalTimeline.hidden = true;

  /** @type {{ id: number, popup: boolean, mode: string|null }|null} */
  let pendingSharedFocus = null;
  let sharedFocusApplyToken = 0;

  function alignRowIntoView(id, opts) {
    const td = wrap.querySelector('td.hist-id[data-id="' + String(id) + '"]')
      || wrap.querySelector('td.sim-id[data-id="' + String(id) + '"]');
    if (!td) return false;
    const tr = td.closest('tr');
    const smooth = !(opts && opts.instant);
    const thead = wrap.querySelector('thead');
    const stickyPad = thead ? thead.getBoundingClientRect().height : 86;
    const delta = td.getBoundingClientRect().top - wrap.getBoundingClientRect().top;
    const top = Math.max(0, wrap.scrollTop + delta - stickyPad);
    wrap.scrollTo({ top: top, behavior: smooth ? 'smooth' : 'auto' });
    wrap.querySelectorAll('tr.flash-row').forEach((r) => r.classList.remove('flash-row'));
    if (tr) {
      tr.classList.add('flash-row');
      setTimeout(() => tr.classList.remove('flash-row'), 1000);
    }
    return true;
  }

  function scrollToRowId(id, opts) {
    // Nhảy từ list stats: đóng popup local, không broadcast (tránh tắt hết tab).
    modalBack.hidden = true;
    document.body.classList.remove('modal-open');
    popupKind = null;
    statsPopupKind = null;
    resetPopupPoolTrack();
    hideModalRestPool();
    modalTimeline.hidden = true;
    modalTimeline.innerHTML = '';
    return alignRowIntoView(id, opts);
  }

  function publishSharedFocus(id, opts) {
    if (!window.FocusSync || typeof window.FocusSync.publish !== 'function') return;
    if (window.FocusSync.isApplying && window.FocusSync.isApplying()) return;
    const n = Number(id);
    if (!Number.isFinite(n) || n <= 0) return;
    window.FocusSync.publish(n, opts || {});
  }

  function findHistIdxById(n) {
    if (!tableBundle) return -1;
    const { ids, displayIdx } = tableBundle;
    for (let j = 0; j < displayIdx.length; j++) {
      const i = displayIdx[j];
      if (ids[i] === n) return i;
    }
    return -1;
  }

  /** Sync từ tab khác / URL: focus id + mở/tắt popup elim đồng bộ. */
  function applySharedFocusState(state, meta) {
    const st = state && typeof state === 'object'
      ? state
      : { id: state, popup: false, mode: null };
    const n = Number(st.id);
    if (!Number.isFinite(n) || n <= 0) return false;
    const wantPopup = !!st.popup;
    const mode = st.mode === 'sim' ? 'sim' : 'hist';
    const instant = !!(meta && (meta.remote || meta.seed || meta.instant));

    if (!tableBundle || !dataCtx) {
      pendingSharedFocus = { id: n, popup: wantPopup, mode: wantPopup ? mode : null };
      return false;
    }

    const focusIdx = findHistIdxById(n);
    const isSim = !!(simState && simState.focusId === n);

    if (focusIdx < 0 && !isSim) {
      pendingSharedFocus = { id: n, popup: wantPopup, mode: wantPopup ? mode : null };
      return false;
    }
    pendingSharedFocus = null;
    const token = ++sharedFocusApplyToken;

    if (!wantPopup) {
      // Đóng popup + bỏ ON — không publish lại.
      modalBack.hidden = true;
      document.body.classList.remove('modal-open');
      if (popupKind === 'elim') clearAllIdOn();
      else {
        simIdOn = false;
        histIdOnIdx = null;
        syncSimRowDom();
        syncHistIdDom();
      }
      popupKind = null;
      statsPopupKind = null;
      resetPopupPoolTrack();
      hideModalRestPool();
      modalTimeline.hidden = true;
      modalTimeline.innerHTML = '';
      // Vẫn đánh dấu hàng focus (không bật ON).
      requestAnimationFrame(() => {
        if (token !== sharedFocusApplyToken) return;
        alignRowIntoView(n, { instant: instant });
      });
      return true;
    }

    // Mở popup elim trên mọi tab ticks (kể cả click lại cùng id / force từ index).
    requestAnimationFrame(() => {
      if (token !== sharedFocusApplyToken) return;
      alignRowIntoView(n, { instant: true });
      const alreadyOpen = !modalBack.hidden && popupKind === 'elim'
        && ((mode === 'sim' && simIdOn) || (mode !== 'sim' && histIdOnIdx === focusIdx));
      if (alreadyOpen && !(meta && meta.force)) return;
      if (mode === 'sim' || (focusIdx < 0 && isSim)) {
        openSimElim();
      } else {
        openHistElim(focusIdx);
      }
    });
    return true;
  }

  function flushPendingSharedFocus() {
    const st = pendingSharedFocus
      || (window.FocusSync && typeof window.FocusSync.get === 'function'
        ? window.FocusSync.get()
        : null);
    if (!st || st.id == null) return false;
    return !!applySharedFocusState(st, { seed: true, instant: true });
  }

  function initSharedFocusIdSync() {
    if (!window.FocusSync || typeof window.FocusSync.init !== 'function') return;
    window.FocusSync.init({
      source: 'ticks',
      apply: (state, meta) => {
        applySharedFocusState(state, meta || {});
      }
    });
  }

  function syncSimRowDom() {
    const tr = wrap.querySelector('tr.sim-row');

      td.className = 'sim-cell' + (on ? ' ok' : '') + (off ? ' col-off' : '');
      td.setAttribute('data-pi', String(pi));

  function openHistElim(focusIdx) {
    if (!dataCtx) return;
    const focusId = dataCtx.ids[focusIdx];
    const packed = detailsAtFocus(focusIdx, focusId);
    if (!packed) return;
    if (histIdOnIdx !== focusIdx) resetPopupPoolTrack();
    const active = activePairIndices();
    const activeSet = new Set(active);
    const holdBase = dataCtx.holdMasks.get(focusIdx) || PAIRS.map(() => false);
    const violBase = dataCtx.violateMasks.get(focusIdx) || PAIRS.map(() => false);
    const mask = holdBase.map((on, pi) => !!(on && activeSet.has(pi)));
    const violMask = violBase.map((on, pi) => !!(on && activeSet.has(pi)));
    histIdOnIdx = focusIdx;
    simIdOn = false;
    syncSimRowDom();
    syncHistIdDom();
    showElimPopupFrom({
      focusId,
      focusIdx,
      details: packed.details,
      violDetails: packed.violDetails,
      disabled: packed.disabled,
      mask,
      violMask,
      poolNums: poolNumsArrForRow(focusIdx, active),
      maxPoolNums: poolNumsArrForRow(focusIdx, maxPoolPairIndices()),
      counts: windowCounts(dataCtx.rowNums, focusIdx),
      answerSet: new Set(dataCtx.rowNums[focusIdx] || []),
      showViolate: true,
      timelineMode: 'hist',
      modeLabel: 'Kỳ',
      emptyHint: 'Kỳ này không có cột ✓ trong các cột thỏa threshold.'
    });
  }

  function openSimElim() {
    if (!simState) return;
    if (!simIdOn) resetPopupPoolTrack();
    const active = activePairIndices();
    const activeSet = new Set(active);
    const mask = simTicks.map((on, pi) => !!(on && activeSet.has(pi)));
    // Cột không tick (còn mở): peer loại = số sẽ phá nếu vào đáp án.
    const violMask = simTicks.map((on, pi) => !!(!on && activeSet.has(pi) && !simState.disabled[pi]));
    const violDetails = simState.details.map((d) => ({
      label: d.label,
      D: d.D,
      P: d.P,
      disabled: d.disabled,
      viol: (d.elim || []).slice(),
      lines: d.lines || []
    }));
    const poolSet = new Set();
    for (let ai = 0; ai < active.length; ai++) {
      const pi = active[ai];
      if (simState.disabled[pi]) continue;
      const d = simState.details[pi];
      if (!d || !d.elim) continue;
      d.elim.forEach((x) => poolSet.add(x));
    }
    const maxPoolSet = new Set();
    const maxActive = maxPoolPairIndices();
    for (let ai = 0; ai < maxActive.length; ai++) {
      const pi = maxActive[ai];
      if (simState.disabled[pi]) continue;
      const d = simState.details[pi];
      if (!d || !d.elim) continue;
      d.elim.forEach((x) => maxPoolSet.add(x));
    }
    histIdOnIdx = null;
    simIdOn = true;
    syncHistIdDom();
    syncSimRowDom();
    const simCounts = dataCtx
      ? windowCounts(dataCtx.rowNums, simState.focusIdx)
      : null;
    showElimPopupFrom({
      focusId: simState.focusId,
      details: simState.details,
      violDetails: violDetails,
      disabled: simState.disabled,
      mask,
      violMask,
      poolNums: sortedNumsFromSet(poolSet),
      maxPoolNums: sortedNumsFromSet(maxPoolSet),
      counts: simCounts,
      showViolate: true,
      timelineMode: 'sim',
      modeLabel: 'Kỳ giả lập',
      emptyHint: 'Chưa tick cột nào (trong các cột thỏa threshold).',
      violSecTitle: 'Phá luật (cột không tick — nếu vào đáp án)',
      violEmptyHint: 'Không còn cột mở nào ngoài các cột đã tick (hoặc không có peer).',
      violLineSuffix: 'nếu đáp án có peer'
    });
  }

  function clampTh(n) {
    const v = Math.round(Number(n));
    if (!Number.isFinite(v)) return 1;
    return Math.max(1, Math.min(100, v));
  }

  function loadThresholdPrefs() {
    try {
      const raw = localStorage.getItem(TH_LS_KEY);
      if (!raw) return;
      const o = JSON.parse(raw);
      if (!o || typeof o !== 'object') return;
      if (o.op === '=' || o.op === '<=' || o.op === '>=') thOp = o.op;
      if (o.val != null) thVal = clampTh(o.val);
    } catch (e) { /* ignore */ }
  }

  function saveThresholdPrefs() {
    try {
      localStorage.setItem(TH_LS_KEY, JSON.stringify({ op: thOp, val: thVal }));
    } catch (e) { /* ignore */ }
  }

  function pctMeets(pctNum, op, x) {
    if (!Number.isFinite(pctNum)) return false;
    if (op === '>=') return pctNum >= x;
    if (op === '<=') return pctNum <= x;
    return Math.round(pctNum) === x;
  }

  function activePairIndices() {
    if (!tableBundle) return [];
    const out = [];
    for (let pi = 0; pi < PAIRS.length; pi++) {
      const st = tableBundle.stats[pi];
      if (!st || !st.applicable) continue;
      if (pctMeets(st.pctNum, thOp, thVal)) out.push(pi);
    }
    out.sort((a, b) => {
      const Pa = PAIRS[a][1];
      const Pb = PAIRS[b][1];
      if (Pa !== Pb) return Pa - Pb;
      return PAIRS[a][0] - PAIRS[b][0];
    });
    return out;
  }

  /** Mọi cột có mẫu (applicable>0), sắp P↑ D↑ — dựng 1 lần, threshold chỉ ẩn/hiện. */
  function poolPairIndices() {
    if (!tableBundle) return [];
    const out = [];
    for (let pi = 0; pi < PAIRS.length; pi++) {
      const st = tableBundle.stats[pi];
      if (st && st.applicable > 0) out.push(pi);
    }
    out.sort((a, b) => {
      const Pa = PAIRS[a][1];
      const Pb = PAIRS[b][1];
      if (Pa !== Pb) return Pa - Pb;
      return PAIRS[a][0] - PAIRS[b][0];
    });
    return out;
  }

  function updateSummaryForActive(active) {
    if (!tableBundle) return;
    const { displayIdx, ids, splits } = tableBundle;
    fullTickList = [];
    zeroTickList = [];
    const fullIdx = new Set();
    const zeroIdx = new Set();
    for (let j = 0; j < displayIdx.length; j++) {
      const i = displayIdx[j];
      let en = 0;
      let h = 0;
      for (let ai = 0; ai < active.length; ai++) {
        const pi = active[ai];
        if (splits[pi].disabled.has(i)) continue;
        en++;
        if (splits[pi].hold.has(i)) h++;
      }
      if (en > 0 && h === en) {
        fullTickList.push({ id: ids[i], enabled: en });
        fullIdx.add(i);
      }
      if (h === 0) {
        zeroTickList.push(ids[i]);
        zeroIdx.add(i);
      }
    }
    sumFullCount.textContent = String(fullTickList.length);
    sumZeroCount.textContent = String(zeroTickList.length);

    // % phá luật: mẫu = id cuối(có ĐA) − 21 + 1 · tử = mẫu − tick đủ · % = tử/mẫu
    const lastAnsId = lastAnsweredIdForRate();
    const mau = lastAnsId != null ? (lastAnsId - MIN_ID + 1) : 0;
    const tu = mau > 0 ? (mau - fullTickList.length) : 0;
    if (mau > 0) {
      const pct = (100 * tu) / mau;
      sumViolPct.textContent = pct.toFixed(1) + '%';
      sumViolFrac.textContent = tu + '/' + mau;
      chipViolRate.title =
        'mẫu = ' + lastAnsId + ' − 21 + 1 = ' + mau
        + ' · tử = ' + mau + ' − ' + fullTickList.length + ' = ' + tu
        + ' · % = tử/mẫu (theo threshold hiện tại)';
    } else {
      sumViolPct.textContent = '—';
      sumViolFrac.textContent = '';
      chipViolRate.title = 'Chưa có kỳ có đáp án từ id 21';
    }

    updateRestRateDisplay(mau, lastAnsId);

    summaryEl.hidden = false;
    wrap.querySelectorAll('td.hist-id').forEach((td) => {
      const idx = Number(td.getAttribute('data-idx'));
      td.classList.toggle('tick-full', fullIdx.has(idx));
      td.classList.toggle('tick-zero', zeroIdx.has(idx));
    });
  }

  /** Số kỳ (id≥21 có ĐA) có đáp án ∩ rest ≠ ∅; rest theo pool tối đa. */
  function countRestHitPeriods() {
    if (!tableBundle || !dataCtx) return 0;
    const maxPairs = maxPoolPairIndices();
    const { displayIdx } = tableBundle;
    let hit = 0;
    for (let j = 0; j < displayIdx.length; j++) {
      const i = displayIdx[j];
      const poolMax = poolNumsArrForRow(i, maxPairs);
      const counts = windowCounts(dataCtx.rowNums, i);
      const restItems = buildRestItems(poolMax, counts);
      if (!restItems.length) continue;
      const restSet = new Set();
      for (let r = 0; r < restItems.length; r++) restSet.add(restItems[r].num);
      const answer = dataCtx.rowNums[i] || [];
      for (let k = 0; k < answer.length; k++) {
        if (restSet.has(answer[k])) {
          hit++;
          break;
        }
      }
    }
    return hit;
  }

  function updateRestRateDisplay(mau, lastAnsId) {
    if (!sumRestPct || !sumRestFrac) return;
    if (!(mau > 0)) {
      sumRestPct.textContent = '—';
      sumRestFrac.textContent = '';
      if (chipRestRate) chipRestRate.title = 'Chưa có kỳ có đáp án từ id 21';
      return;
    }
    if (restHitCache == null) restHitCache = countRestHitPeriods();
    const hit = restHitCache;
    sumRestPct.textContent = ((100 * hit) / mau).toFixed(1) + '%';
    sumRestFrac.textContent = hit + '/' + mau;
    if (chipRestRate) {
      chipRestRate.title =
        'mẫu = ' + lastAnsId + ' − 21 + 1 = ' + mau
        + ' · tử = số kỳ đáp án giao rest = ' + hit
        + ' · %rest = tử/mẫu (rest cố định theo pool tối đa)';
    }
  }

  function updateStatusLine(activeLen) {
    if (!tableBundle || !simState) return;
    const { displayIdx, msHint } = tableBundle;
    const simHint = ' · giả lập id ' + simState.focusId
      + ' (derive cands: ' + (simState.cands.length ? simState.cands.join(',') : '—') + ')';
    statusEl.textContent =
      '✓ = đúng · ô đen = không derive[D]+peer[P] cùng hàng · cột thỏa threshold '
      + thOp + ' ' + thVal + '%: ' + activeLen + '/' + PAIRS.length
      + ' · click id = loại số · hàng cuối OFF=tick / ON=popup'
      + ' · id ≥ ' + MIN_ID + ' · ' + displayIdx.length + ' kỳ'
      + simHint + (msHint ? ' · ' + msHint : '');
  }

  function sortedNumsFromSet(set) {
    return Array.from(set).sort((a, b) => a - b);
  }

  function setsEqual(a, b) {
    if (!a || !b || a.size !== b.size) return false;
    let ok = true;
    a.forEach((x) => {
      if (!b.has(x)) ok = false;
    });
    return ok;
  }

  /**
   * 3/ derive (★∈đáp án) === phá max · 4/ derive === rest
   * Cố định theo pool tối đa — không đổi theo threshold header.
   */
  function computeDeriveOverlapLists() {
    derivePhaMaxList = [];
    deriveRestList = [];
    if (!tableBundle || !dataCtx) {
      if (sumDerivePhaCount) sumDerivePhaCount.textContent = '0';
      if (sumDeriveRestCount) sumDeriveRestCount.textContent = '0';
      return;
    }
    const { displayIdx, ids, splits } = tableBundle;
    const candsCache = dataCtx.candsCache;
    const maxPairs = maxPoolPairIndices();
    for (let j = 0; j < displayIdx.length; j++) {
      const i = displayIdx[j];
      const derive = new Set();
      const cands = candsCache[i] || [];
      for (let ci = 0; ci < cands.length; ci++) {
        if (cands[ci] && cands[ci].inAnswer) derive.add(cands[ci].num);
      }
      if (!derive.size) continue;
      // phá max = hợp violNums mọi cột (D,P)
      const pha = new Set();
      for (let pi = 0; pi < splits.length; pi++) {
        const s = splits[pi];
        if (!s || s.disabled.has(i) || !s.violate.has(i)) continue;
        const vn = s.violNums && s.violNums.get(i);
        if (vn) vn.forEach((x) => pha.add(x));
      }
      const poolMax = poolNumsArrForRow(i, maxPairs);
      const restItems = buildRestItems(poolMax, windowCounts(dataCtx.rowNums, i));
      const rest = new Set();
      for (let r = 0; r < restItems.length; r++) rest.add(restItems[r].num);
      const nums = sortedNumsFromSet(derive);
      if (pha.size > 0 && setsEqual(derive, pha)) {
        derivePhaMaxList.push({ id: ids[i], nums: nums });
      }
      if (rest.size > 0 && setsEqual(derive, rest)) {
        deriveRestList.push({ id: ids[i], nums: nums });
      }
    }
    if (sumDerivePhaCount) sumDerivePhaCount.textContent = String(derivePhaMaxList.length);
    if (sumDeriveRestCount) sumDeriveRestCount.textContent = String(deriveRestList.length);
  }

  function formatPoolCell(arr) {
    if (!arr.length) return '';
    return 'pool[' + arr.length + '] {' + arr.join(',') + '}';
  }

  /** Hợp peer loại từ các cột threshold applicable (hold∪violate) tại kỳ i. */
  function poolNumsArrForRow(i, active) {
    if (!tableBundle) return [];
    const { splits } = tableBundle;
    const set = new Set();
    for (let ai = 0; ai < active.length; ai++) {
      const pi = active[ai];
      const s = splits[pi];
      if (!s || s.disabled.has(i)) continue;
      if (!s.hold.has(i) && !s.violate.has(i)) continue;
      const pn = s.poolNums && s.poolNums.get(i);
      if (!pn) continue;
      pn.forEach((x) => set.add(x));
    }
    return sortedNumsFromSet(set);
  }

  /** @param {boolean} [appendOrder] true = giữ thứ tự gặp (timeline), không sort */
  function violNumsArrForRow(i, active, appendOrder) {
    if (!tableBundle) return [];
    const { splits } = tableBundle;
    const set = new Set();
    const out = [];
    for (let ai = 0; ai < active.length; ai++) {
      const pi = active[ai];
      const s = splits[pi];
      if (!s || !s.violate.has(i)) continue;
      const vn = s.violNums && s.violNums.get(i);
      if (!vn) continue;
      vn.forEach((x) => {
        if (set.has(x)) return;
        set.add(x);
        out.push(x);
      });
    }
    if (appendOrder) return out;
    return out.slice().sort((a, b) => a - b);
  }

  /** Đáp án ∩ rest (rest cố định theo pool tối đa); thứ tự theo đáp án; kèm freq. */
  function restAnswerItemsForRow(i) {
    if (!tableBundle || !dataCtx) return [];
    const poolMax = poolNumsArrForRow(i, maxPoolPairIndices());
    const counts = windowCounts(dataCtx.rowNums, i);
    const restItems = buildRestItems(poolMax, counts);
    if (!restItems.length) return [];
    const freqByNum = new Map();
    for (let r = 0; r < restItems.length; r++) {
      freqByNum.set(restItems[r].num, restItems[r].freq);
    }
    const answer = dataCtx.rowNums[i] || [];
    const out = [];
    const seen = new Set();
    for (let k = 0; k < answer.length; k++) {
      const n = answer[k];
      if (!freqByNum.has(n) || seen.has(n)) continue;
      seen.add(n);
      out.push({ num: n, freq: freqByNum.get(n) });
    }
    return out;
  }

  function formatRestAnsCell(items) {
    if (!items.length) return '';
    const parts = [];
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      parts.push(String(it.num) + toSubscript(it.freq));
    }
    return parts.join(',');
  }

  function syncRestAnsCol() {
    wrap.querySelectorAll('td.rest-ans[data-idx]').forEach((td) => {
      const i = Number(td.getAttribute('data-idx'));
      if (!Number.isFinite(i)) return;
      const items = restAnswerItemsForRow(i);
      const text = formatRestAnsCell(items);
      td.textContent = text;
      td.title = text
        ? ('Đáp án ∩ rest: ' + text)
        : 'Không có số đáp án thuộc rest';
    });
  }

  function syncPoolViolCols(active) {
    const act = active || activePairIndices();
    wrap.querySelectorAll('td.pool-nums[data-idx]').forEach((td) => {
      const i = Number(td.getAttribute('data-idx'));
      if (!Number.isFinite(i)) return;
      const arr = poolNumsArrForRow(i, act);
      const text = formatPoolCell(arr);
      td.textContent = text;
      td.title = text
        ? ('Pool peer theo cột threshold: ' + arr.join(', '))
        : 'Không có peer từ cột threshold applicable';
    });
    wrap.querySelectorAll('td.viol-nums[data-idx]').forEach((td) => {
      const i = Number(td.getAttribute('data-idx'));
      if (!Number.isFinite(i)) return;
      const arr = violNumsArrForRow(i, act);
      const text = arr.join(',');
      td.textContent = text;
      td.title = text
        ? ('Phá luật ⊆ pool (cột threshold): ' + text)
        : 'Không phá luật cột nào trong threshold';
    });
    syncRestAnsCol();
    syncSimPoolCol(act);
  }

  /** Kỳ giả lập: pool = hợp elim của cột threshold còn mở (chưa có đáp án → phá = —). */
  function syncSimPoolCol(active) {
    const td = wrap.querySelector('tr.sim-row td.pool-nums');
    if (!td || !simState) return;
    const act = active || activePairIndices();
    const set = new Set();
    for (let ai = 0; ai < act.length; ai++) {
      const pi = act[ai];
      if (simState.disabled[pi]) continue;
      const d = simState.details[pi];
      if (!d || !d.elim) continue;
      d.elim.forEach((x) => set.add(x));
    }
    const arr = sortedNumsFromSet(set);
    const text = formatPoolCell(arr);
    td.textContent = text || '—';
    td.title = text
      ? ('Pool giả lập (peer loại nếu luật đúng): ' + arr.join(', '))
      : 'Kỳ giả lập — chưa có peer từ cột threshold';
  }

  /** Chỉ toggle class — không đụng innerHTML → scroll không về 0. */
  function applyThresholdColumns() {
    const active = activePairIndices();
    const activeSet = new Set(active);
    wrap.querySelectorAll('table.dc-table [data-pi]').forEach((el) => {
      const pi = Number(el.getAttribute('data-pi'));
      if (!Number.isFinite(pi)) return;
      el.classList.toggle('col-off', !activeSet.has(pi));
    });
    updateSummaryForActive(active);
    syncPoolViolCols(active);
    updateStatusLine(active.length);
    syncSimRowDom();
  }

  function buildFullTable() {
    if (!tableBundle || !simState) return;
    const { displayIdx, ids, splits, stats, pairLabels } = tableBundle;
    const pool = poolPairIndices();

    let thead =
      '<thead><tr class="pct"><th class="id pct">T%</th>'
      + '<th class="pool-h pct" title="Hợp peer theo cột threshold">—</th>'
      + '<th class="viol-h pct" title="Hợp số phá luật theo threshold">—</th>'
      + '<th class="rest-h pct" title="Đáp án ∩ rest (rest cố định)">—</th>' +
      pool.map((pi) => '<th class="pct" data-pi="' + pi + '">' + stats[pi].pct + '</th>').join('') +
      '</tr><tr class="xy"><th class="id xy">x/y</th>'
      + '<th class="pool-h xy">—</th><th class="viol-h xy">—</th><th class="rest-h xy">—</th>' +
      pool.map((pi) => '<th class="xy" data-pi="' + pi + '" title="đúng / applicable">' + stats[pi].xy + '</th>').join('') +
      '</tr><tr class="name"><th class="id name">id</th>'
      + '<th class="pool-h name" title="pool[n] {peers} — hợp peer từ luật thỏa threshold; phá ⊆ pool">pool</th>'
      + '<th class="viol-h name" title="Hợp số phá luật (các cột thỏa threshold)">phá</th>'
      + '<th class="rest-h name" title="Số đáp án thuộc rest (rest = ngoài pool tối đa, có freq&gt;0)">rest</th>' +
      pool.map((pi) => '<th class="name" data-pi="' + pi + '">' + pairLabels[pi] + '</th>').join('') +
      '</tr></thead>';

    let body = '<tbody>';
    for (let j = 0; j < displayIdx.length; j++) {
      const i = displayIdx[j];
      body += '<tr><td class="id hist-id" data-idx="' + i + '" data-id="' + ids[i]
        + '" title="Click ON để xem số bị loại theo các cột ✓">' + ids[i] + '</td>'
        + '<td class="pool-nums" data-idx="' + i + '"></td>'
        + '<td class="viol-nums" data-idx="' + i + '"></td>'
        + '<td class="rest-ans" data-idx="' + i + '"></td>';
      for (let ai = 0; ai < pool.length; ai++) {
        const pi = pool[ai];
        const s = splits[pi];
        if (s.hold.has(i)) body += '<td class="ok" data-pi="' + pi + '">✓</td>';
        else if (s.disabled.has(i)) {
          body += '<td class="nop" data-pi="' + pi
            + '" title="Disable: không có derive[D]+peer[P] khác số cùng hàng W10"></td>';
        } else body += '<td data-pi="' + pi + '"></td>';
      }
      body += '</tr>';
    }

    body += '<tr class="sim-row"><td class="id sim-id" data-id="' + simState.focusId
      + '" title="OFF = tick giả lập · ON = xem số bị loại">' + simState.focusId + '</td>'
      + '<td class="pool-nums" title="Kỳ giả lập">—</td>'
      + '<td class="viol-nums" title="Kỳ giả lập — chưa có đáp án">—</td>'
      + '<td class="rest-ans" title="Kỳ giả lập — chưa có đáp án">—</td>';
    for (let ai = 0; ai < pool.length; ai++) {
      const pi = pool[ai];
      if (simState.disabled[pi]) {
        body += '<td class="sim-cell nop" data-pi="' + pi
          + '" title="Disable: không có derive[D]+peer[P] khác số cùng hàng W10"></td>';
      } else {
        body += '<td class="sim-cell" data-pi="' + pi + '"></td>';
      }
    }
    body += '</tr></tbody>';

    wrap.innerHTML = '<table class="dc-table">' + thead + body + '</table>';
    bindHistIds();
    bindSimRow();
  }

  function paintTable(opts) {
    if (!tableBundle || !simState) return;
    const keepScroll = !!(opts && opts.keepScroll);
    const hasTable = !!wrap.querySelector('table.dc-table');
    // Đổi threshold: chỉ ẩn/hiện cột. Chỉ dựng lại bảng khi chưa có table.
    if (!keepScroll || !hasTable) {
      buildFullTable();
    }
    applyThresholdColumns();
    syncSimRowDom();
    syncHistIdDom();
    if (pendingSharedFocus != null) flushPendingSharedFocus();
  }

  function render(rows) {
    const t0 = performance.now();
    statusEl.textContent = 'Đang tính…';
    simTicks = PAIRS.map(() => false);
    simIdOn = false;
    histIdOnIdx = null;
    restHitCache = null;
    derivePhaMaxList = [];
    deriveRestList = [];

    const n = rows.length;
    const rowNums = new Array(n);
    const ids = new Array(n);
    for (let i = 0; i < n; i++) {
      rowNums[i] = isEmptyResultRow(rows[i])
        ? []
        : parseMainNums(rows[i].result || rows[i].Result || '');
      ids[i] = rowIdOf(rows[i], i);
    }

    const candsCache = buildCandsCache(rows, rowNums);
    const splits = PAIRS.map(([d, p]) => splitFor(rows, rowNums, candsCache, d, p));

    const displayIdx = [];
    for (let i = 0; i < n; i++) {
      if (ids[i] >= MIN_ID && rowNums[i].length) displayIdx.push(i);
    }

    const holdMasks = new Map();
    const violateMasks = new Map();
    for (let j = 0; j < displayIdx.length; j++) {
      const i = displayIdx[j];
      holdMasks.set(i, splits.map((s) => s.hold.has(i)));
      violateMasks.set(i, splits.map((s) => s.violate.has(i)));
    }

    dataCtx = { rows, rowNums, ids, candsCache, holdMasks, violateMasks };

    const stats = splits.map((s) => {
      let h = 0;
      let a = 0;
      for (let j = 0; j < displayIdx.length; j++) {
        const i = displayIdx[j];
        if (s.hold.has(i)) {
          h++;
          a++;
        } else if (s.violate.has(i)) {
          a++;
        }
      }
      const pctNum = a ? (100 * h) / a : NaN;
      return {
        hold: h,
        applicable: a,
        pctNum,
        pct: a ? pctNum.toFixed(1) + '%' : '—',
        xy: h + '/' + a
      };
    });

    simState = buildSimState(rows, rowNums, ids);
    const pairLabels = PAIRS.map(([d, p]) => '(' + d + ',' + p + ')');
    const ms = Math.round(performance.now() - t0);
    tableBundle = {
      displayIdx,
      ids,
      splits,
      stats,
      pairLabels,
      msHint: ms + 'ms'
    };

    computeDeriveOverlapLists();
    paintTable({ keepScroll: false });
    requestAnimationFrame(() => {
      if (window.FocusSync && typeof window.FocusSync.seedFromUrlOrStorage === 'function') {
        window.FocusSync.seedFromUrlOrStorage({ useStorage: true });
      }
      flushPendingSharedFocus();
      if (histIdOnIdx == null && !simIdOn) {
        wrap.scrollTop = wrap.scrollHeight;
      }
    });
  }

  function syncThresholdFromUi() {
    thVal = clampTh(thValEl.value);
    thValEl.value = String(thVal);
    syncThOpDropdown();
    saveThresholdPrefs();
    if (tableBundle) {
      applyThresholdColumns();
      refreshOpenPopupAfterThreshold();
    }
  }

  function setThresholdOp(op) {
    thOp = op === '=' || op === '<=' ? op : '>=';
    syncThOpDropdown();
    closeThOpMenu();
    saveThresholdPrefs();
    if (tableBundle) {
      applyThresholdColumns();
      refreshOpenPopupAfterThreshold();
    }
  }

  function stepThreshold(delta) {
    thVal = clampTh(thVal + delta);
    thValEl.value = String(thVal);
    saveThresholdPrefs();
    if (tableBundle) {
      applyThresholdColumns();
      refreshOpenPopupAfterThreshold();
    }
  }

  function bindHoldStep(btn, dir) {
    let delayTimer = null;
    let repeatTimer = null;
    const clear = () => {
      if (delayTimer) clearTimeout(delayTimer);
      if (repeatTimer) clearInterval(repeatTimer);
      delayTimer = null;
      repeatTimer = null;
    };
    const start = (e) => {
      e.preventDefault();
      stepThreshold(dir);
      clear();
      delayTimer = setTimeout(() => {
        repeatTimer = setInterval(() => stepThreshold(dir), 45);
      }, 280);
    };
    btn.addEventListener('mousedown', start);
    btn.addEventListener('touchstart', start, { passive: false });
    btn.addEventListener('mouseup', clear);
    btn.addEventListener('mouseleave', clear);
    btn.addEventListener('touchend', clear);
    btn.addEventListener('touchcancel', clear);
  }

  thOpBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (thOpMenu.hidden) openThOpMenu();
    else closeThOpMenu();
  });
  thOpItems.forEach((item) => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      setThresholdOp(item.getAttribute('data-op'));
    });
  });
  document.addEventListener('click', (e) => {
    if (!thOpDd.contains(e.target)) closeThOpMenu();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !thOpMenu.hidden) closeThOpMenu();
  });
  thValEl.addEventListener('change', syncThresholdFromUi);
  thValEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      syncThresholdFromUi();
      thValEl.blur();
    }
  });
  bindHoldStep(thDecEl, -1);
  bindHoldStep(thIncEl, 1);

  function showFetchError(msg) {
    errEl.hidden = false;
    errEl.textContent = msg;
    summaryEl.hidden = true;
    statusEl.textContent = 'Không tải được data.json.';
  }

  initSharedFocusIdSync();
  // Giữ id từ URL sớm — apply khi bảng xong.
  try {
    const sp = new URLSearchParams(location.search);
    const qid = Number(sp.get('id'));
    if (Number.isFinite(qid) && qid > 0) {
      pendingSharedFocus = { id: Math.floor(qid), popup: false, mode: null };
    }
  } catch (e) { /* ignore */ }

  fetch('data.json', { cache: 'no-store' })
    .then((r) => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then((data) => {
      if (!Array.isArray(data)) throw new Error('data.json phải là mảng kỳ');
      errEl.hidden = true;
      render(data);
    })
    .catch(() => {
      showFetchError(
        'Không đọc được data.json cùng cấp. Mở trang qua http (Live Server / python -m http.server) trong thư mục có file HTML + data.json.'
      );
    });
})();
</script>
