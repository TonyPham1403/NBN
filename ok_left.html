        /**
         * Sau khi tắt Submit và khôi phục khoanh thủ công (không qua applyAutoRingSelection):
         * bật lại số quan sát neon từ selection hiện tại (freq>=2, có ít nhất một pair neon; ưu tiên tần suất cao).
         */
        function assignPairNeonObserveNumFromCurrentSelected() {
            if (submitActive || !raw || !raw.freq) {
                return;
            }
            const relaxedHint = isPairSelectionOnlyLoneAppliedPairWithoutExtraCircles();
            pairNeonObserveNum = null;
            var list = [];
            try {
                selected.forEach(function (n) {
                    if (!isNaN(n) && ((parseInt(raw.freq[n], 10) || 0) >= 2) && pairObserveNumWouldShowAnyNeonHint(n, relaxedHint)) {
                        list.push(n);
                    }
                });
            } catch (e0) {
                return;
            }
            if (!list.length) {
                return;
            }
            var best = null;
            var bestF = -1;
            for (var i = 0; i < list.length; i++) {
                var nn = list[i];
                var f = parseInt(raw.freq[nn], 10) || 0;
                if (best == null || f > bestF || (f === bestF && nn < best)) {
                    bestF = f;
                    best = nn;
                }
            }
            if (best != null) {
                pairNeonObserveNum = best;
            }
        }

        /**
         * Sau autoring (submit off): xác định số quan sát cho neon pair từ đúng tập số autoring.
         * Ưu tiên custom x nếu có trong tập, freq>=2 và có neon pair; không thì số trong tập có freq cao nhất (>=2) và có neon pair.
         */
        function assignPairNeonObserveNumFromAutoRingCircleNums(circleNums) {
            if (submitActive || !raw || !raw.freq) {
                return;
            }
            const relaxedHint = isPairSelectionOnlyLoneAppliedPairWithoutExtraCircles();
            pairNeonObserveNum = null;
            /* Dùng autoRingPicked (thứ tự sau sort ưu tiên tần suất) thay vì circleNums gốc */
            var list = [];
            try {
                list = Array.from(autoRingPicked).filter(function (n) {
                    return !isNaN(n) && selected.has(n);
                });
            } catch (e0) {
                list = (circleNums || []).filter(function (n) {
                    return !isNaN(n) && selected.has(n);
                });
            }
            if (!list.length) {
                return;
            }
            if (submitAutoCircleMode === 'custom') {
                var cx = clampSubmitAutoCircleCustomX(submitAutoCircleCustomX);
                if (list.indexOf(cx) !== -1) {
                    var fc = parseInt(raw.freq[cx], 10) || 0;
                    if (fc >= 2 && pairObserveNumWouldShowAnyNeonHint(cx, relaxedHint)) {
                        pairNeonObserveNum = cx;
                        return;
                    }
                }
            }
            var best = null;
            var bestF = -1;
            for (var i = 0; i < list.length; i++) {
                var nn = list[i];
                var f = parseInt(raw.freq[nn], 10) || 0;
                if (f < 2 || !pairObserveNumWouldShowAnyNeonHint(nn, relaxedHint)) {
                    continue;
                }
                if (best == null || f > bestF || (f === bestF && nn < best)) {
                    bestF = f;
                    best = nn;
                }
            }
            if (best != null) {
                pairNeonObserveNum = best;
            }
        }

        function applyAutoRingSelection(circleNums) {
            if (hasPendingClearSelectionUndo()) {
                return false;
            }
            circleNums = (circleNums || []).filter(function (n) { return !isNaN(n); });
            if (!circleNums.length) return false;

            if (submitActive) {
                if (answerPopupTicketPreviewOnly) {
                    try { markSubmitCircleOverlayCleared(); } catch (e) { /* ignore */ }
                } else {
                    markSubmitCircleOverlayAutoring();
                }
            }

            /* Khoanh trước số có tần suất cao — tránh đủ 5 slot toàn số freq thấp, bỏ lỡ số quan sát freq>=2 */
            if (!submitActive && raw && raw.freq) {
                circleNums.sort(function (a, b) {
                    var fa = parseInt(raw.freq[a], 10) || 0;
                    var fb = parseInt(raw.freq[b], 10) || 0;
                    if (fb !== fa) {
                        return fb - fa;
                    }
                    return a - b;
                });
            }

            autoRingPicked.clear();
            circleNums.forEach(function (n) { autoRingPicked.add(n); });

            if (submitActive) {
                // Autoring picks are per focus id — never keep circles from a previous id
                selected.clear();
                clearPairContributionTracking();
                circleNums.forEach(function (n) {
                    if (!isNaN(n)) selected.add(n);
                });
                try { recomputePairsFromSelected(); } catch (e) { }
                try { updateBlocked(); } catch (e) { }
                try { updatePairList(); } catch (e) { }
                try { syncCircledFocusForNav(); } catch (eFocus) { /* ignore */ }
                try { applySubmitState(); } catch (e) { }
                try { applySelectionAndBlockedInDOM(); } catch (e) { }
                try { restartNeonAnimationsInDOM(); } catch (e) { }
                try { notifyParentLeftCircledNums(); } catch (eN) { /* ignore */ }
                try { if (window.updatePickButtonUI) window.updatePickButtonUI(); } catch (ePick) { /* ignore */ }
                return true;
            }

            selected.clear();
            clearPairContributionTracking();
            transientSelected.clear();
            simulatedSelected.clear();
            pickOrder = [];
            pairNeonObserveNum = null;
            resetPairNeonObserveContextBeyondLonePair();
            currentPairIndex = -1;
            currentTailIndex = -1;
            selectionCleared = false;

            recomputePairsFromSelected();
            updateBlocked();

            for (var i = 0; i < circleNums.length; i++) {
                var n = circleNums[i];
                if (isBlocked(n)) continue;
                toggleNumber(n);
            }
            try {
                assignPairNeonObserveNumFromAutoRingCircleNums(circleNums);
            } catch (eOb) { /* ignore */ }
            try { refreshLeftPickSelectionUi(); } catch (e) { /* ignore */ }
            return true;
        }

        function normalizeAutoRingFocusKey(s) {
            var d = String(s || '').replace(/\D/g, '');
            if (!d) return '';
            var n = parseInt(d, 10);
            if (isNaN(n)) return '';
            return String(n).padStart(5, '0');
        }

        function hasCircledNumbersForNav() {
            if (submitActive) {
                return (preSubmitSelected && preSubmitSelected.size > 0)
                    || selected.size > 0
                    || autoRingPicked.size > 0;
            }
            return selected.size > 0 || simulatedSelected.size > 0 || transientSelected.size > 0;
        }

        /** Tập số khoanh đỏ dùng cho mũi tên — không gồm 5 số đáp án Submit. */
        function getCircledEffectiveSetForNav() {
            const out = new Set();
            if (submitActive) {
                selected.forEach(function (n) { out.add(n); });
                if (preSubmitSelected) preSubmitSelected.forEach(function (n) { out.add(n); });
                autoRingPicked.forEach(function (n) { out.add(n); });
                return out;
            }
            selected.forEach(function (n) { out.add(n); });
            simulatedSelected.forEach(function (n) { out.add(n); });
            transientSelected.forEach(function (n) { out.add(n); });
            autoRingPicked.forEach(function (n) { out.add(n); });
            return out;
        }

        /** Thứ tự khoanh đỏ cho fallback mũi tên — không dùng pickOrder đáp án khi Submit ON. */
        function getCircledPickOrderForNav() {
            const effective = getCircledEffectiveSetForNav();
            if (!effective.size) return [];
            const next = [];
            if (submitActive) {
                if (autoRingPicked.size) {
                    Array.from(autoRingPicked).forEach(function (n) {
                        if (!isNaN(n) && effective.has(n) && next.indexOf(n) === -1) next.push(n);
                    });
                }
                if (preSubmitOrder && preSubmitOrder.length) {
                    preSubmitOrder.forEach(function (n) {
                        if (!isNaN(n) && effective.has(n) && next.indexOf(n) === -1) next.push(n);
                    });
                }
                Array.from(selected).sort(function (a, b) { return a - b; }).forEach(function (n) {
                    if (next.indexOf(n) === -1) next.push(n);
                });
                if (preSubmitSelected) {
                    Array.from(preSubmitSelected).sort(function (a, b) { return a - b; }).forEach(function (n) {
                        if (next.indexOf(n) === -1) next.push(n);
                    });
                }
                return next.slice(0, MAX_PICK_NUMBERS);
            }

            const out = [];
            const adjPairs = [];
            for (let topIdx = 0; topIdx < sets.length - 1; topIdx++) adjPairs.push({ top: topIdx, bottom: topIdx + 1 });

            for (let i = 0; i < nums.length; i++) {
                for (let j = i + 1; j < nums.length; j++) {
                    const a = nums[i], b = nums[j];
                    const mains = [];
                    for (let idx = 0; idx < sets.length; idx++) { if (sets[idx].has(a) && sets[idx].has(b)) mains.push(idx); }
                    if (mains.length === 0) continue;
                    let allMainsOk = true;
                    for (const mainIdx of mains) {
                        /* Không lọc adjAboveCrossCount===2: giữ khớp computePairsForRows (date nền #00b0f0 / cửa sổ 10 dòng). */

                        let foundForThisMain = false;
                        for (const p of adjPairs) {
                            if (!(p.top > mainIdx && p.bottom > mainIdx)) continue;
                            if ((sets[p.top].has(a) && sets[p.bottom].has(b)) || (sets[p.top].has(b) && sets[p.bottom].has(a))) {
                                if ((sets[p.top].has(a) && sets[p.top].has(b)) || (sets[p.bottom].has(a) && sets[p.bottom].has(b))) continue;
                                foundForThisMain = true; break;
                            }
                        }
                        if (!foundForThisMain) {
                            const allowAboveIfFreq2 = (raw && raw.freq && (
                                (raw.freq[a] >= 2 && raw.freq[b] >= 2 && mainIdx === sets.length - 1) ||
                                ((raw.freq[a] === 3 && raw.freq[b] === 2) || (raw.freq[a] === 2 && raw.freq[b] === 3))
                            ));
                            if (allowAboveIfFreq2) {
                                for (const p of adjPairs) {
                                    if (!(p.bottom < mainIdx)) continue;
                                    if ((sets[p.top].has(a) && sets[p.bottom].has(b)) || (sets[p.top].has(b) && sets[p.bottom].has(a))) {
                                        if ((sets[p.top].has(a) && sets[p.top].has(b)) || (sets[p.bottom].has(a) && sets[p.bottom].has(b))) continue;
                                        foundForThisMain = true; break;
                                    }
                                }
                            }
                        }
                        if (!foundForThisMain) { allMainsOk = false; break; }
                    }
                    if (allMainsOk) {
                        if (countOrderOnlyAdjacentBoundaries(sets, a, b) >= 2) continue;
                        if (junkStackedPairNumAboveCrossingAdjacent(sets, a, b, raw && raw.freq)) continue;
                        if (junkPairIfAnyWindowFreqGe(raw && raw.freq, a, b, 6)) continue;
                        if (junkPairIfBothWindowFreqGe(raw && raw.freq, a, b, 5)) continue;
                        if (junkPairAdjacentRecallTooClose(sets, a, b)) continue;
                        out.push([a, b]);
                    }
                }
            }
            const seen = new Set(); const uniq = [];
            out.forEach(p => { const k = p[0] + ',' + p[1]; if (!seen.has(k)) { seen.add(k); uniq.push(p); } });
            return uniq;
        }

        /**
         * Trước khi áp dụng cặp (a,b) từ **strip pair** (hoặc thay cặp từ cùng nguồn): gỡ đóng góp của mọi cặp *khác* đã track.
         * — Click chuyển giữa các pair trên strip: thay thế, không chồng thêm.
         * — Số chỉ do khoanh bảng 1 / bảng 2 giữ nguyên (không nằm trong contrib cặp khác).
         * — Áp dụng từ **tail** không gọi hàm này (tail và pair strip độc lập).
         */
        function removeOtherPairContributionsBeforeApply(a, b) {
            if (submitActive) {
                return;
            }
            if (!Number.isFinite(a) || !Number.isFinite(b)) {
                return;
            }
            const selfKey = pairContributionKey(a, b);
            const keys = Array.from(pairContributionByPairKey.keys());
            for (let ki = 0; ki < keys.length; ki++) {
                const key = keys[ki];
                if (!key || key === selfKey) {
                    continue;
                }
                const parts = String(key).split(',');
                const pa = parseInt(parts[0], 10);
                const pb = parseInt(parts[1], 10);
                if (!Number.isFinite(pa) || !Number.isFinite(pb)) {
                    continue;
                }
                removePairContributionForToggleOff(pa, pb);
            }
        }

        /**
         * Trước khi áp dụng cặp (a,b) từ **strip tail**: gỡ đóng góp của mọi tail *khác* đã track.
         * — Click chuyển giữa các tail: thay thế, không chồng thêm (giống strip pair).
         * — Không gỡ cặt từ strip pair (tail và pair độc lập).
         */
        function removeOtherTailContributionsBeforeApply(a, b) {
            if (submitActive) {
                return;
            }
            if (!Number.isFinite(a) || !Number.isFinite(b)) {
                return;
            }
            const selfKey = pairContributionKey(a, b);
            const keys = Array.from(tailAppliedPairKeys);
            for (let ki = 0; ki < keys.length; ki++) {
                const key = keys[ki];
                if (!key || key === selfKey) {
                    continue;
                }
                const parts = String(key).split(',');
                const pa = parseInt(parts[0], 10);
                const pb = parseInt(parts[1], 10);
                if (!Number.isFinite(pa) || !Number.isFinite(pb)) {
                    continue;
                }
                removePairContributionForToggleOff(pa, pb);
            }
        }

        /**
         * Sau Submit OFF map pair rỗng: selection có thể vẫn là {x,y} khớp một cặp trong danh sách
         * nhưng không còn track contribution — applyPair(a,b) mới chỉ tryAdd nên chân cũ không bị gỡ.
         * Khi selected đúng 2 số và trùng một cặp khác (a,b), gỡ mọi đầu của cặp đó không thuộc cặp đang áp.
         */
        function pruneSelectedLegsReplacedByApplyPair(a, b) {
            if (submitActive || !Number.isFinite(a) || !Number.isFinite(b) || !selected) {
                return;
            }
            const newEnds = new Set([a, b]);
            const pairs = currentPairs;
            if (!pairs || !pairs.length || selected.size !== 2) {
                return;
            }
            for (let i = 0; i < pairs.length; i++) {
                const p = pairs[i];
                if (!p || p.length < 2) {
                    continue;
                }
                const x = p[0];
                const y = p[1];
                if (x === a && y === b) {
                    continue;
                }
                if (!selected.has(x) || !selected.has(y)) {
                    continue;
                }
                const strip = function (n) {
                    if (newEnds.has(n)) {
                        return;
                    }
                    try {
                        selected.delete(n);
                    } catch (e0) { /* ignore */ }
                    try {
                        if (pickOrder && pickOrder.length) {
                            let idx;
                            while ((idx = pickOrder.indexOf(n)) !== -1) {
                                pickOrder.splice(idx, 1);
                            }
                        }
                    } catch (e1) { /* ignore */ }
                    try { transientSelected.delete(n); } catch (e2) { /* ignore */ }
                    try { simulatedSelected.delete(n); } catch (e3) { /* ignore */ }
                };
                strip(x);
                strip(y);
                return;
            }
        }

        function applyPair(a, b, opts) {
            opts = opts || {};
            if (!raw || submitActive) {
                return false;
            }
            if (selectionCleared) {
                invalidateClearSelectionToggleBackup();
            }
            if (opts.fromTailList) {
                const tailIdxEarly = resolveTailIndexForApply(a, b, opts);
                if (tailIdxEarly >= 0) {
                    currentTailIndex = tailIdxEarly;
                }
            }
            if (opts.fromTailList) {
                try {
                    removeOtherTailContributionsBeforeApply(a, b);
                } catch (eRemTail) { /* ignore */ }
            } else {
                try {
                    removeOtherPairContributionsBeforeApply(a, b);
                } catch (eRem) { /* ignore */ }
                try {
                    pruneSelectedLegsReplacedByApplyPair(a, b);
                } catch (ePrune) { /* ignore */ }
            }
            const beforeCap = new Set(selected);
            const addsNeeded = [];
            try {
                for (let ci = 0; ci < 2; ci++) {
                    const nn = ci === 0 ? a : b;
                    if (isNaN(nn)) {
                        continue;
                    }
                    try { if (isBlocked(nn)) continue; } catch (e) { }
                    if (!beforeCap.has(nn)) {
                        addsNeeded.push(nn);
                    }
                }
            } catch (e) { }
            if (beforeCap.size + addsNeeded.length > MAX_PICK_NUMBERS) {
                return false;
            }
            transientSelected.clear();

            /** Giữ số quan sát đã có khi chỉ đổi cặp áp dụng (A/D hoặc click cặp khác): hint có thể nhấp nháy false giữa các bước. */
            const priorPairNeonObserveNum = pairNeonObserveNum;

            const key = pairContributionKey(a, b);
            const beforeSel = new Set(selected);
            const beforeOrder = pickOrder ? pickOrder.slice() : [];

            undoPrevSelected = new Set(beforeSel);
            undoPrevPickOrder = beforeOrder;
            undoPrevSimulated = new Set(simulatedSelected);
            undoEnabled = true;
            undoWasCleared = false;

            let contrib = new Set(pairContributionByPairKey.get(key) || []);

            const tryAdd = function (n) {
                if (isNaN(n)) return;
                try { if (isBlocked(n)) return; } catch (e) { }
                if (beforeSel.has(n)) {
                    return;
                }
                if (selected.size >= MAX_PICK_NUMBERS) {
                    return;
                }
                selected.add(n);
                contrib.add(n);
                if (!pickOrder) pickOrder = [];
                if (pickOrder.indexOf(n) === -1) {
                    pickOrder = pickOrder.filter(function (x) { return selected.has(x); });
                    while (pickOrder.length >= MAX_PICK_NUMBERS) {
                        pickOrder.shift();
                    }
                    pickOrder.push(n);
                }
                try {
                    if (!submitActive && raw && raw.freq) {
                        const fPick = parseInt(raw.freq[n], 10) || 0;
                        if (fPick >= 2 && pairNeonObserveNum === null && pairObserveNumWouldShowAnyNeonHint(n) &&
                            !isPairSelectionOnlyLoneAppliedPairWithoutExtraCircles()) {
                            pairNeonObserveNum = n;
                        }
                    }
                } catch (e) { }
            };
            tryAdd(a);
            tryAdd(b);
            pairContributionByPairKey.set(key, contrib);
            if (opts.fromTailList) {
                tailAppliedPairKeys.add(key);
            }

            if (!submitActive && raw && raw.freq && pairNeonObserveNum != null) {
                try {
                    if (!selected.has(pairNeonObserveNum) ||
                        (parseInt(raw.freq[pairNeonObserveNum], 10) || 0) < 2) {
                        pairNeonObserveNum = null;
                    }
                } catch (e) {
                    pairNeonObserveNum = null;
                }
            }
            currentPhaseNumber = b;
            currentPhaseRow = null;
            if (opts.fromTailList) {
                lastClickedRegion = 'tailList';
                syncLeftKeyboardRegion('tailList');
            } else {
                lastClickedRegion = 'pairList';
                syncLeftKeyboardRegion('pairList');
            }
            try { pushPhaseHistory(lastClickedRegion, b, null); } catch (e) { }
            if (opts.fromTailList) {
                const tailIdx = resolveTailIndexForApply(a, b, opts);
                if (tailIdx >= 0) {
                    currentTailIndex = tailIdx;
                }
            } else {
                currentPairIndex = -1;
                if (currentPairs && currentPairs.length) {
                    for (let i = 0; i < currentPairs.length; i++) {
                        const p = currentPairs[i];
                        if (p && p[0] === a && p[1] === b) {
                            currentPairIndex = i;
                            break;
                        }
                    }
                }
            }
            recomputePairsFromSelected();
            updateBlocked();
            if (opts && opts.fullRender) {
                updateRender();
            } else {
                updateRenderLightweight();
            }
            if (!submitActive && raw && raw.freq && priorPairNeonObserveNum != null) {
                try {
                    if (selected.has(priorPairNeonObserveNum)) {
                        const foPr = parseInt(raw.freq[priorPairNeonObserveNum], 10) || 0;
                        if (foPr >= 2 && pairObserveNumWouldShowAnyNeonHint(priorPairNeonObserveNum, true)) {
                            pairNeonObserveNum = priorPairNeonObserveNum;
                        }
                    }
                } catch (ePr) { /* ignore */ }
            }
            try {
                notePairNeonObserveContextFromEffectiveSize();
            } catch (eNote) { /* ignore */ }
            if (!submitActive && raw && raw.freq && isLoneAppliedPairOnlyGeometry() && !pairNeonObserveContextBeyondLonePair) {
                if (pairNeonObserveNum != null &&
                    !pairObserveNumWouldShowAnyNeonHint(pairNeonObserveNum, true)) {
                    pairNeonObserveNum = null;
                }
            }
            try {
                requestAnimationFrame(function () {
                    try { updatePairListNeonHints(); } catch (e2) { }
                });
            } catch (e) { }
            try { persistSelectionMemoryForFocus(); } catch (e) { }
            try { refreshLeftPickSelectionUi(); } catch (e) { /* ignore */ }
            return true;
        }

        function applyPairByIndex(idx, opts) {
            if (!currentPairs || idx < 0 || idx >= currentPairs.length) {
                return false;
            }
            const p = currentPairs[idx];
            if (!p) {
                return false;
            }
            if (!applyPair(p[0], p[1], opts)) {
                return false;
            }
            currentPairIndex = idx;
            if (!(opts && opts.skipFocus)) {
                setTimeout(() => {
                    const btn = document.querySelector('.pair-btn[data-idx="' + idx + '"]');
                    if (btn) btn.focus();
                    try {
                        requestAnimationFrame(() => {
                            syncPairNeonHintAnimations();
                            requestAnimationFrame(() => { syncPairNeonHintAnimations(); });
                        });
                    } catch (e) { }
                }, 40);
            }
            return true;
        }

        /**
         * A/D trên danh sách pair: chuyển cặp đang áp dụng sang cặp trước/sau (cùng logic click cặp khác —
         * removeOtherPairContributions + applyPair). applyPair đã khôi phục số quan sát nếu vẫn khoanh và freq>=2;
         * khối dưới là lớp dự phòng sau applyPairByIndex.
         */
        function navigatePairListByDirReplacePair(dir) {
            if (!raw || submitActive || !currentPairs || !currentPairs.length) {
                return false;
            }
            const n = currentPairs.length;
            if (!Number.isFinite(dir) || dir === 0) {
                return false;
            }
            let start = -1;
            if (currentPairIndex >= 0 && currentPairIndex < n) {
                const p0 = currentPairs[currentPairIndex];
                if (p0 && selected.has(p0[0]) && selected.has(p0[1])) {
                    start = currentPairIndex;
                }
            }
            if (start < 0) {
                for (let i = 0; i < n; i++) {
                    const p = currentPairs[i];
                    if (p && selected.has(p[0]) && selected.has(p[1])) {
                        start = i;
                        break;
                    }
                }
            }
            const targetIdx = (start < 0)
                ? ((dir > 0) ? 0 : (n - 1))
                : (((start + dir) % n) + n) % n;
            const savedObserve = pairNeonObserveNum;
            if (!applyPairByIndex(targetIdx, {})) {
                return false;
            }
            try {
                if (savedObserve != null && !isNaN(savedObserve) && selected.has(savedObserve) && raw && raw.freq &&
                    !isPairSelectionOnlyLoneAppliedPairWithoutExtraCircles()) {
                    const fo = parseInt(raw.freq[savedObserve], 10) || 0;
                    if (fo >= 2) {
                        pairNeonObserveNum = savedObserve;
                    }
                }
            } catch (eOb) { /* ignore */ }
            try {
                requestAnimationFrame(function () {
                    try { updatePairListNeonHints(); } catch (eH) { }
                });
            } catch (eRaf) { }
            return true;
        }

        function applyTailByIndex(idx, opts) {
            opts = opts || {};
            if (!currentTails || idx < 0 || idx >= currentTails.length) {
                return false;
            }
            const t = currentTails[idx];
            if (!t) {
                return false;
            }
            if (!applyPair(t.a, t.b, Object.assign({}, opts, { fromTailList: true, tailIndex: idx }))) {
                return false;
            }
            currentTailIndex = idx;
            if (!opts.skipFocus) {
                setTimeout(() => {
                    const btn = document.querySelector('.tail-btn[data-tail-idx="' + idx + '"]')
                        || document.querySelector('#tailList .pair-btn[data-tail-idx="' + idx + '"]');
                    if (btn) {
                        btn.focus();
                    }
                    try {
                        requestAnimationFrame(() => {
                            updateFocusIndicator();
                            requestAnimationFrame(() => { updateFocusIndicator(); });
                        });
                    } catch (e) { }
                }, 40);
            }
            return true;
        }

        /**
         * A/D trên vùng tailList: chọn tail trước/sau — cùng logic click tail (applyPair / gỡ cặp),
         * để bảng và strip cập nhật; không chỉ đổi focus.
         */
        function focusNavigateTailListByDir(dir) {
            const tailList = document.getElementById('tailList');
            if (!tailList || !currentTails || currentTails.length === 0) {
                return false;
            }
            const candidates = Array.from(tailList.querySelectorAll('.pair-btn'));
            if (!candidates.length) {
                return false;
            }
            const focusedTailBtn = document.activeElement && document.activeElement.closest
                ? document.activeElement.closest('#tailList .pair-btn')
                : null;
            let i = focusedTailBtn ? candidates.findIndex((b) => b === focusedTailBtn) : -1;
            if (i === -1) {
                const curBtn = (currentTailIndex >= 0)
                    ? tailList.querySelector('.tail-btn[data-tail-idx="' + currentTailIndex + '"]')
                    : null;
                i = curBtn ? candidates.indexOf(curBtn) : -1;
            }
            let j;
            if (i === -1) {
                j = (dir > 0) ? 0 : (candidates.length - 1);
            } else {
                j = (i + dir + candidates.length) % candidates.length;
            }
            const target = candidates[j];
            if (!target) {
                return false;
            }
            const idx = parseInt(target.getAttribute('data-tail-idx'), 10);
            const a = parseInt(target.getAttribute('data-a'), 10);
            const b = parseInt(target.getAttribute('data-b'), 10);
            if (!Number.isFinite(idx) || !Number.isFinite(a) || !Number.isFinite(b)) {
                return false;
            }
            try {
                lastClickedRegion = 'tailList';
                syncLeftKeyboardRegion('tailList');
                lastClickedNumber = b;
                pushPhaseHistory('tailList', b, null);
            } catch (e) { }
            if (selected.has(a) && selected.has(b)) {
                removePairContributionForToggleOff(a, b);
                currentTailIndex = -1;
            } else if (!applyTailByIndex(idx, {})) {
                return false;
            }
            try {
                lastClickedRegion = 'tailList';
                syncLeftKeyboardRegion('tailList');
                updateFocusIndicator();
            } catch (eFocus) { }
            try {
                target.focus();
            } catch (e2) { }
            return true;
        }

        /** Nền pair-selected (#2e7d32): mọi nút cặp có cả hai đầu trong tập hiệu lực đều xanh — kể cả nhiều cặp khoanh tay; không còn giới hạn “chỉ cặp có trong map pairContribution”. */
        function pairTailButtonShouldShowPairSelected(a, b, effective) {
            if (!effective) {
                return false;
            }
            if (!Number.isFinite(a) || !Number.isFinite(b) || !effective.has(a) || !effective.has(b)) {
                return false;
            }
            return true;
        }

        function updatePairButtonsSelection(effective) {
            const el = document.getElementById('pairList');
            if (!el) {
                return;
            }
            const btns = Array.from(el.querySelectorAll('.pair-btn'));
            btns.forEach(function (btn) {
                const a = parseInt(btn.getAttribute('data-a'), 10);
                const b = parseInt(btn.getAttribute('data-b'), 10);
                if (pairTailButtonShouldShowPairSelected(a, b, effective)) {
                    btn.classList.add('pair-selected');
                } else {
                    btn.classList.remove('pair-selected');
                }
            });
        }

        /** Có đủ dòng chuỗi để hiển thị pair — viền neon chỉ phụ thuộc dữ liệu, không phụ thuộc disableSubmit. */
        function hasLeftPaneRecordForPairNeon() {
            return !!(raw && Array.isArray(raw.lines) && raw.lines.length >= 10);
        }

        /** Tập hiệu lực cho neon pair — giống updatePairListNeonHints. */
        function getEffectiveSelectionSetForPairNeon() {
            const effective = new Set();
            if (submitActive) {
                simulatedSelected.forEach((n) => effective.add(n));
            } else {
                selected.forEach((n) => effective.add(n));
                simulatedSelected.forEach((n) => effective.add(n));
                transientSelected.forEach((n) => effective.add(n));
            }
            return effective;
        }

        /** Tập khoanh dùng cho cặp trên 10 chuỗi — khớp recomputePairsFromSelected (không gồm transientSelected). */
        function getEffectiveSelectionForPickBadges() {
            const effective = new Set();
            if (submitActive) {
                simulatedSelected.forEach(function (n) {
                    effective.add(n);
                });
            } else {
                selected.forEach(function (n) {
                    effective.add(n);
                });
                simulatedSelected.forEach(function (n) {
                    effective.add(n);
                });
            }
            return effective;
        }

        /** Cặp [a,b] theo từng dòng 10 chuỗi: hai số khoanh đầu tiên trên dòng (giống recomputePairsFromSelected). */
        function computeChainPairsFromEffectiveSelection() {
            const pairs = [];
            if (!raw) {
                return pairs;
            }
            const effective = getEffectiveSelectionForPickBadges();
            if (!effective || effective.size < 2) {
                return pairs;
            }
            getRawDisplayLines().forEach(function (line) {
                const nums = getNumsFromLineObj(line);
                const selInLine = nums.filter(function (x) {
                    return effective.has(x);
                });
                if (selInLine.length >= 2) {
                    pairs.push(selInLine.slice(0, 2));
                }
            });
            return pairs;
        }

        /** Giống noteTextHasConnectionPairing (RightPane): một số nằm trong ≥2 cặp. */
        function pickPairsSatisfyConnection(pairList) {
            if (!pairList || pairList.length < 2) {
                return false;
            }
            const numToPairIdx = new Map();
            for (let pairIndex = 0; pairIndex < pairList.length; pairIndex++) {
                const pr = pairList[pairIndex];
                if (!pr || pr.length < 2) {
                    continue;
                }
                const a = pr[0];
                const b = pr[1];
                if (!Number.isFinite(a) || !Number.isFinite(b)) {
                    continue;
                }
                for (let k = 0; k < 2; k++) {
                    const n = k === 0 ? a : b;
                    let set = numToPairIdx.get(n);
                    if (!set) {
                        set = new Set();
                        numToPairIdx.set(n, set);
                    }
                    set.add(pairIndex);
                }
            }
            for (const s of numToPairIdx.values()) {
                if (s.size >= 2) {
                    return true;
                }
            }
            return false;
        }

        /**
         * Intersection (intersect): đồng bộ logic filter trên 10 chuỗi + tập khoanh (≥2 số, không cần đủ 5).
         */
        function pickSubmitSatisfiesIntersect() {
            const eff = getEffectiveSelectionForPickBadges();
            if (!eff || eff.size < 2) {
                return false;
            }
            const answerNums = [];
            eff.forEach(function (n) {
                answerNums.push(n);
            });
            answerNums.sort(function (a, b) {
                return a - b;
            });
            const displayLines = getRawDisplayLines();
            const limit = displayLines.length;
            if (limit < 1) {
                return false;
            }
            const lines = [];
            for (let di = 0; di < limit; di++) {
                const nums = getNumsFromLineObj(displayLines[di]);
                const label = limit - di;
                lines.push({ label: label, nums: nums });
            }
            const freq = new Array(36).fill(0);
            for (let li = 0; li < lines.length; li++) {
                const nums = lines[li].nums;
                for (let k = 0; k < nums.length; k++) {
                    const n = nums[k];
                    if (n >= 1 && n <= 35) {
                        freq[n]++;
                    }
                }
            }
            const hasNum = function (nums, x) {
                return nums.indexOf(x) !== -1;
            };
            for (let ai = 0; ai < answerNums.length; ai++) {
                for (let bi = ai + 1; bi < answerNums.length; bi++) {
                    const a = answerNums[ai];
                    const b = answerNums[bi];
                    if (a === b || freq[a] < 2 || freq[b] < 2) {
                        continue;
                    }
                    const mainLabels = [];
                    for (let li = 0; li < lines.length; li++) {
                        const nums = lines[li].nums;
                        if (hasNum(nums, a) && hasNum(nums, b)) {
                            mainLabels.push(lines[li].label);
                        }
                    }
                    if (mainLabels.length === 0) {
                        continue;
                    }
                    for (let mi = 0; mi < mainLabels.length; mi++) {
                        const M = mainLabels[mi];
                        let aUp = false;
                        let aLo = false;
                        let bUp = false;
                        let bLo = false;
                        for (let li = 0; li < lines.length; li++) {
                            const lab = lines[li].label;
                            if (lab === M) {
                                continue;
                            }
                            const nums = lines[li].nums;
                            if (lab > M) {
                                if (hasNum(nums, a)) {
                                    aUp = true;
                                }
                                if (hasNum(nums, b)) {
                                    bUp = true;
                                }
                            } else if (lab < M) {
                                if (hasNum(nums, a)) {
                                    aLo = true;
                                }
                                if (hasNum(nums, b)) {
                                    bLo = true;
                                }
                            }
                        }
                        if ((aUp && bLo) || (bUp && aLo)) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        /** 3-connection: có bộ 3 số trong tập khoanh thỏa 3 cặp trên 3 chuỗi khác nhau (freq ≥2). */
        function pickSubmitSatisfiesConn3() {
            const eff = getEffectiveSelectionForPickBadges();
            if (!eff || eff.size < 3) {
                return false;
            }
            const answerNums = [];
            eff.forEach(function (n) {
                answerNums.push(n);
            });
            const lines = getPickChainLinesForAutoring();
            if (lines.length < 3) {
                return false;
            }
            const freq = new Array(36).fill(0);
            for (let li = 0; li < lines.length; li++) {
                const nums = lines[li].nums;
                for (let k = 0; k < nums.length; k++) {
                    const n = nums[k];
                    if (n >= 1 && n <= 35) {
                        freq[n]++;
                    }
                }
            }
            const len = answerNums.length;
            for (let i = 0; i < len; i++) {
                for (let j = i + 1; j < len; j++) {
                    for (let k = j + 1; k < len; k++) {
                        if (tripletSatisfiesConn3(lines, answerNums[i], answerNums[j], answerNums[k], freq)) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function syncPickPropertyBadges() {
            const row = document.getElementById('pickPropertyBadgesRow');
            const bConn = document.getElementById('pickBadgeConnection');
            const bConn3 = document.getElementById('pickBadgeConn3');
            const bIx = document.getElementById('pickBadgeIntersection');
            if (!row || !bConn || !bConn3 || !bIx) {
                return;
            }
            bConn.classList.remove('pick-badge--visible');
            bConn3.classList.remove('pick-badge--visible');
            bIx.classList.remove('pick-badge--visible');
            if (!hasLeftPaneRecordForPairNeon()) {
                row.style.display = 'none';
                return;
            }
            const pairs = computeChainPairsFromEffectiveSelection();
            const conn3 = pickSubmitSatisfiesConn3();
            const conn = !conn3 && pickPairsSatisfyConnection(pairs);
            const ix = !conn3 && pickSubmitSatisfiesIntersect();
            if (conn3) {
                bConn3.classList.add('pick-badge--visible');
            } else {
                if (conn) {
                    bConn.classList.add('pick-badge--visible');
                }
                if (ix) {
                    bIx.classList.add('pick-badge--visible');
                }
            }
            row.style.display = conn3 || conn || ix ? 'inline-flex' : 'none';
        }

        function notePairNeonObserveContextFromEffectiveSize() {
            if (submitActive) {
                return;
            }
            try {
                const eff = getEffectiveSelectionSetForPairNeon();
                if (eff && eff.size > 2) {
                    pairNeonObserveContextBeyondLonePair = true;
                }
            } catch (e0) { /* ignore */ }
        }

        function resetPairNeonObserveContextBeyondLonePair() {
            pairNeonObserveContextBeyondLonePair = false;
        }

        /**
         * Hình học: đúng 1 cặp track, tập hiệu lực = đúng 2 đầu (không số thừa / transient).
         */
        function isLoneAppliedPairOnlyGeometry() {
            if (submitActive) {
                return false;
            }
            let eff;
            try {
                eff = getEffectiveSelectionSetForPairNeon();
            } catch (e0) {
                return false;
            }
            if (!eff || eff.size !== 2) {
                return false;
            }
            if (!pairContributionByPairKey || pairContributionByPairKey.size !== 1) {
                return false;
            }
            let onlyKey = null;
            try {
                onlyKey = Array.from(pairContributionByPairKey.keys())[0];
            } catch (e1) {
                return false;
            }
            if (onlyKey == null || onlyKey === '') {
                return false;
            }
            const parts = String(onlyKey).split(',');
            const pa = parseInt(parts[0], 10);
            const pb = parseInt(parts[1], 10);
            if (!Number.isFinite(pa) || !Number.isFinite(pb)) {
                return false;
            }
            return eff.has(pa) && eff.has(pb);
        }

        /**
         * Số quan sát đã thực sự xác định trong phiên: từng có >2 số hiệu lực, và số quan sát vẫn khoanh freq>=2.
         * (Chỉ click một cặp từ đầu → không bao giờ true — không neon pair.)
         */
        function hasCommittedPairNeonObservationNumber() {
            if (!pairNeonObserveContextBeyondLonePair) {
                return false;
            }
            if (submitActive || !raw || !raw.freq || pairNeonObserveNum == null) {
                return false;
            }
            const n = pairNeonObserveNum;
            if (typeof n !== 'number' || !Number.isFinite(n) || !selected.has(n)) {
                return false;
            }
            if ((parseInt(raw.freq[n], 10) || 0) < 2) {
                return false;
            }
            return true;
        }

        /**
         * Lone mơ hồ: hình học lone VÀ chưa có ngữ cảnh xác định số quan sát (hasCommittedPairNeonObservationNumber).
         */
        function isPairSelectionOnlyLoneAppliedPairWithoutExtraCircles() {
            return isLoneAppliedPairOnlyGeometry() && !hasCommittedPairNeonObservationNumber();
        }

        function isNumClaimedForPairNeon(n, claimed, observed, effective) {
            if (observed !== null && n === observed && effective.has(n)) {
                return false;
            }
            return claimed.has(n);
        }

        /**
         * Cặp từ strip pair VÀ từ tail — cùng logic neon / claimed (tail không làm tắt gợi ý pair).
         */
        function pairObserveNumWouldShowAnyNeonHint(observed, ignoreLoneAmbiguous) {
            if (submitActive || observed == null || typeof observed !== 'number' || !Number.isFinite(observed)) {
                return false;
            }
            if (!ignoreLoneAmbiguous && isPairSelectionOnlyLoneAppliedPairWithoutExtraCircles()) {
                return false;
            }
            if (!hasLeftPaneRecordForPairNeon() || !raw) {
                return false;
            }
            const effective = getEffectiveSelectionSetForPairNeon();
            if (!effective.has(observed)) {
                return false;
            }
            const pairs = computePairs() || [];
            const tails = computeTails() || [];
            if (!pairs.length && !tails.length) {
                return false;
            }
            const claimed = new Set();
            for (let i = 0; i < pairs.length; i++) {
                const p = pairs[i];
                if (!p || p.length < 2) {
                    continue;
                }
                const a = p[0];
                const b = p[1];
                if (Number.isFinite(a) && Number.isFinite(b) && effective.has(a) && effective.has(b)) {
                    claimed.add(a);
                    claimed.add(b);
                }
            }
            for (let ti = 0; ti < tails.length; ti++) {
                const t = tails[ti];
                if (!t) {
                    continue;
                }
                const a = t.a;
                const b = t.b;
                if (Number.isFinite(a) && Number.isFinite(b) && effective.has(a) && effective.has(b)) {
                    claimed.add(a);
                    claimed.add(b);
                }
            }
            function scanPairLikeList(list, isTail) {
                for (let i = 0; i < list.length; i++) {
                    const item = list[i];
                    if (!item) {
                        continue;
                    }
                    const a = isTail ? item.a : item[0];
                    const b = isTail ? item.b : item[1];
                    if (!Number.isFinite(a) || !Number.isFinite(b)) {
                        continue;
                    }
                    if (effective.has(a) && effective.has(b)) {
                        continue;
                    }
                    const hitA = observed !== null && effective.has(a) && a === observed && !isNumClaimedForPairNeon(a, claimed, observed, effective);
                    const hitB = observed !== null && effective.has(b) && b === observed && !isNumClaimedForPairNeon(b, claimed, observed, effective);
                    if (hitA || hitB) {
                        return true;
                    }
                }
                return false;
            }
            if (scanPairLikeList(pairs, false)) {
                return true;
            }
            return scanPairLikeList(tails, true);
        }

        /** Số quan sát cho neon: một khi đã gán thì giữ đến khi bỏ khoanh hoặc freq<2 (không đổi theo hint/pair khác); chưa có thì gán tự động như assignPairNeonObserveNumFromCurrentSelected. */
        function getPairNeonObservationNumber() {
            if (!raw || !raw.freq || submitActive) {
                return null;
            }
            try {
                /* Lone mơ hồ: vẫn trả về số quan sát nếu còn ít nhất một cặp neon (tránh mất neon ngay cú click pair đầu). */
                if (isPairSelectionOnlyLoneAppliedPairWithoutExtraCircles()) {
                    if (pairNeonObserveNum != null && selected.has(pairNeonObserveNum)) {
                        const foLo = parseInt(raw.freq[pairNeonObserveNum], 10) || 0;
                        if (foLo >= 2 && pairObserveNumWouldShowAnyNeonHint(pairNeonObserveNum, true)) {
                            return pairNeonObserveNum;
                        }
                    }
                    return null;
                }
                if (pairNeonObserveNum != null) {
                    if (!selected.has(pairNeonObserveNum)) {
                        pairNeonObserveNum = null;
                    } else {
                        const fo = parseInt(raw.freq[pairNeonObserveNum], 10) || 0;
                        if (fo < 2) {
                            pairNeonObserveNum = null;
                        }
                    }
                }
                if (pairNeonObserveNum == null) {
                    assignPairNeonObserveNumFromCurrentSelected();
                }
                if (pairNeonObserveNum == null) {
                    return null;
                }
                return pairNeonObserveNum;
            } catch (e) {
                pairNeonObserveNum = null;
                return null;
            }
        }

        /**
         * Sau W/A/S/D trên bảng: nếu đã có số quan sát (còn khoanh, freq>=2) thì giữ — không ghi đè theo phase/hint.
         * Chưa có thì thử gán từ currentPhaseNumber khi hợp lệ (freq>=2, có neon pair theo hint).
         */
        function removeNumFromWasdPickSets(n) {
            if (n == null || isNaN(n)) {
                return;
            }
            selected.delete(n);
            transientSelected.delete(n);
            simulatedSelected.delete(n);
            autoRingPicked.delete(n);
            if (pickOrder) {
                var ri;
                while ((ri = pickOrder.indexOf(n)) !== -1) {
                    pickOrder.splice(ri, 1);
                }
            }
        }

        function syncAutoRingPickedFromSelectedAfterWasd() {
            if (!submitAutoCircleEnabled || submitActive) {
                return;
            }
            autoRingPicked.clear();
            var count = 0;
            (pickOrder || []).forEach(function (n) {
                if (!isNaN(n) && selected.has(n) && count < MAX_PICK_NUMBERS) {
                    autoRingPicked.add(n);
                    count += 1;
                }
            });
            if (!autoRingPicked.size) {
                selected.forEach(function (n) {
                    if (!isNaN(n) && autoRingPicked.size < MAX_PICK_NUMBERS) {
                        autoRingPicked.add(n);
                    }
                });
            }
        }

        function applyWasdPickReplace(fromNum, toNum) {
            if (toNum == null || isNaN(toNum)) {
                return null;
            }
            var dropped = [];
            if (fromNum != null && !isNaN(fromNum)) {
                removeNumFromWasdPickSets(fromNum);
            }
            removeNumFromWasdPickSets(toNum);
            selected.add(toNum);
            transientSelected.add(toNum);
            if (!pickOrder) {
                pickOrder = [];
            }
            pickOrder.push(toNum);
            while (pickOrder.length > MAX_PICK_NUMBERS) {
                var drop = pickOrder.shift();
                if (drop != null && drop !== toNum) {
                    selected.delete(drop);
                    transientSelected.delete(drop);
                    autoRingPicked.delete(drop);
                    dropped.push(drop);
                }
            }
            while (selected.size > MAX_PICK_NUMBERS) {
                var dropSel = pickOrder.length ? pickOrder[0] : null;
                if (dropSel == null) {
                    break;
                }
                removeNumFromWasdPickSets(dropSel);
                if (dropped.indexOf(dropSel) === -1) {
                    dropped.push(dropSel);
                }
            }
            syncAutoRingPickedFromSelectedAfterWasd();
            currentPhaseNumber = toNum;
            lastClickedNumber = toNum;
            try {
                pushPhaseHistory(lastClickedRegion || leftKeyboardRegion || 'left', toNum, currentPhaseRow);
            } catch (ePh) { /* ignore */ }
            return dropped;
        }

        function resolveWasdNavFocusPickNum(preferredNums) {
            function inPreferred(n) {
                return !preferredNums || preferredNums.indexOf(n) !== -1;
            }
            function inSelected(n) {
                return selected.has(n) || transientSelected.has(n)
                    || (submitActive && preSubmitSelected && preSubmitSelected.has(n));
            }
            var latestManual = getLatestManualPhaseNumberForNav(preferredNums);
            if (latestManual != null && inSelected(latestManual)) {
                return latestManual;
            }
            if (currentPhaseNumber != null && inPreferred(currentPhaseNumber) && inSelected(currentPhaseNumber)) {
                return currentPhaseNumber;
            }
            if (lastClickedNumber != null && inPreferred(lastClickedNumber) && inSelected(lastClickedNumber)) {
                return lastClickedNumber;
            }
            if (pickOrder && pickOrder.length) {
                for (var pi = pickOrder.length - 1; pi >= 0; pi--) {
                    var pn = pickOrder[pi];
                    if (inPreferred(pn) && selected.has(pn)) {
                        return pn;
                    }
                }
            }
            if (currentPhaseNumber != null && inPreferred(currentPhaseNumber)) {
                return currentPhaseNumber;
            }
            if (lastClickedNumber != null && inPreferred(lastClickedNumber)) {
                return lastClickedNumber;
            }
            if (pickOrder && pickOrder.length) {
                for (var pj = pickOrder.length - 1; pj >= 0; pj--) {
                    if (inPreferred(pickOrder[pj])) {
                        return pickOrder[pj];
                    }
                }
            }
            if (preferredNums && preferredNums.length) {
                return preferredNums[0];
            }
            return null;
        }

        function syncPairNeonObserveNumFromPhaseAfterWasd() {
            if (submitActive || !raw || !raw.freq) {
                return;
            }
            try {
                if (isPairSelectionOnlyLoneAppliedPairWithoutExtraCircles()) {
                    return;
                }
                if (pairNeonObserveNum != null) {
                    if (selected.has(pairNeonObserveNum)) {
                        const fo = parseInt(raw.freq[pairNeonObserveNum], 10) || 0;
                        if (fo >= 2) {
                            return;
                        }
                    }
                    pairNeonObserveNum = null;
                }
                if (currentPhaseNumber != null && selected.has(currentPhaseNumber)) {
                    const f = parseInt(raw.freq[currentPhaseNumber], 10) || 0;
                    if (f >= 2 && pairObserveNumWouldShowAnyNeonHint(currentPhaseNumber)) {
                        pairNeonObserveNum = currentPhaseNumber;
                    } else {
                        pairNeonObserveNum = null;
                    }
                }
            } catch (e) { }
        }

        /** Chu kỳ animation neon pair (khớp CSS) — dùng để animation-delay âm, mọi nút cùng pha. */
        const PAIR_NEON_BORDER_PERIOD_S = 1.25;
        const PAIR_NEON_GLOW_PERIOD_S = 0.9;

        function syncPairNeonHintAnimations() {
            const neonSel = '#pairList .pair-btn.pair-neon-hint:not(.pair-selected), #tailList .pair-btn.pair-neon-hint:not(.pair-selected)';
            const neonBtns = document.querySelectorAll(neonSel);
            if (!neonBtns.length) {
                return;
            }
            const t = performance.now() / 1000;
            const d1 = -(t % PAIR_NEON_BORDER_PERIOD_S);
            const d2 = -(t % PAIR_NEON_GLOW_PERIOD_S);
            const delayStr = d1 + 's, ' + d2 + 's';
            /* innerHTML / focus có thể restart animation lệch pha — tắt animation, reflow, bật lại từ CSS rồi gán delay chung */
            neonBtns.forEach((btn) => {
                btn.style.animation = 'none';
            });
            const pairList = document.getElementById('pairList');
            const tailList = document.getElementById('tailList');
            if (pairList) void pairList.offsetHeight;
            if (tailList) void tailList.offsetHeight;
            neonBtns.forEach((btn) => {
                btn.style.removeProperty('animation');
            });
            if (pairList) void pairList.offsetHeight;
            if (tailList) void tailList.offsetHeight;
            neonBtns.forEach((btn) => {
                btn.style.animationDelay = delayStr;
            });
        }

        function scheduleSyncPairNeonHintAnimations() {
            try { syncPairNeonHintAnimations(); } catch (e1) { }
            try {
                requestAnimationFrame(() => {
                    try { syncPairNeonHintAnimations(); } catch (e2) { }
                    requestAnimationFrame(() => {
                        try { syncPairNeonHintAnimations(); } catch (e3) { }
                    });
                });
            } catch (e4) { }
        }

        /**
         * Viền neon trên các nút tail: mọi tail có ít nhất một đầu trùng số đang khoanh (tập hiệu lực giống pair neon).
         * Tắt khi bỏ khoanh hết liên quan hoặc khi cả hai đầu đã khoanh (nút tail đang pair-selected — cùng CSS pair-neon-hint:not(.pair-selected)).
         */
        function updateTailListNeonHints() {
            const tailList = document.getElementById('tailList');
            if (!tailList) {
                return;
            }
            const btns = Array.from(tailList.querySelectorAll('.tail-btn'));
            const stripTailNeon = function (btn) {
                btn.classList.remove('pair-neon-hint');
                btn.style.removeProperty('animation-delay');
                btn.style.removeProperty('animation');
            };
            if (!btns.length) {
                return;
            }
            if (!hasLeftPaneRecordForPairNeon() || !raw) {
                btns.forEach(stripTailNeon);
                return;
            }
            const effective = new Set();
            if (submitActive) {
                simulatedSelected.forEach((n) => effective.add(n));
            } else {
                selected.forEach((n) => effective.add(n));
                simulatedSelected.forEach((n) => effective.add(n));
                transientSelected.forEach((n) => effective.add(n));
            }
            for (const btn of btns) {
                const a = parseInt(btn.getAttribute('data-a'), 10);
                const b = parseInt(btn.getAttribute('data-b'), 10);
                if (!Number.isFinite(a) || !Number.isFinite(b)) {
                    stripTailNeon(btn);
                    continue;
                }
                const touchesCircled = effective.has(a) || effective.has(b);
                const wantNeon = touchesCircled && !btn.classList.contains('pair-selected');
                btn.classList.toggle('pair-neon-hint', wantNeon);
            }
            btns.forEach((btn) => {
                if (!btn.classList.contains('pair-neon-hint')) {
                    btn.style.removeProperty('animation-delay');
                    btn.style.removeProperty('animation');
                }
            });
        }

        /**
         * Viền neon trên các nút cặp: khi chưa submit, gợi ý mọi cặp có đúng một đầu là số quan sát (kể cả đầu kia đã khoanh),
         * trừ khi logic hit/claimed không còn gợi ý — getPairNeonObservationNumber cố định khi đã gán.
         * Khi submitActive, vẫn gợi ý theo simulated selection như cũ.
         */
        function updatePairListNeonHints() {
            const pairList = document.getElementById('pairList');
            if (!pairList) {
                try { updateTailListNeonHints(); } catch (eTailOnly) { /* ignore */ }
                try { scheduleSyncPairNeonHintAnimations(); } catch (eSchOnly) { /* ignore */ }
                return;
            }
            const btns = Array.from(pairList.querySelectorAll('.pair-btn'));
            if (!hasLeftPaneRecordForPairNeon() || !btns.length) {
                btns.forEach((btn) => {
                    btn.classList.remove('pair-neon-hint');
                    btn.style.removeProperty('animation-delay');
                    btn.style.removeProperty('animation');
                });
                try { updateTailListNeonHints(); } catch (eTailEarly) { /* ignore */ }
                try { scheduleSyncPairNeonHintAnimations(); } catch (eSchEarly) { /* ignore */ }
                return;
            }
            const effective = new Set();
            if (submitActive) {
                simulatedSelected.forEach((n) => effective.add(n));
            } else {
                selected.forEach((n) => effective.add(n));
                simulatedSelected.forEach((n) => effective.add(n));
                transientSelected.forEach((n) => effective.add(n));
            }
            const observed = (!submitActive && raw && raw.freq) ? getPairNeonObservationNumber() : null;
            const claimed = new Set();
            for (const btn of btns) {
                const a = parseInt(btn.getAttribute('data-a'), 10);
                const b = parseInt(btn.getAttribute('data-b'), 10);
                if (Number.isFinite(a) && Number.isFinite(b) && effective.has(a) && effective.has(b)) {
                    claimed.add(a);
                    claimed.add(b);
                }
            }
            try {
                const tailsForClaimed = computeTails() || [];
                for (let ti = 0; ti < tailsForClaimed.length; ti++) {
                    const t = tailsForClaimed[ti];
                    if (!t) {
                        continue;
                    }
                    const a = t.a;
                    const b = t.b;
                    if (Number.isFinite(a) && Number.isFinite(b) && effective.has(a) && effective.has(b)) {
                        claimed.add(a);
                        claimed.add(b);
                    }
                }
            } catch (eClTail) { /* ignore */ }
            for (const btn of btns) {
                const a = parseInt(btn.getAttribute('data-a'), 10);
                const b = parseInt(btn.getAttribute('data-b'), 10);
                if (!Number.isFinite(a) || !Number.isFinite(b)) {
                    btn.classList.remove('pair-neon-hint');
                    btn.style.removeProperty('animation-delay');
                    btn.style.removeProperty('animation');
                    continue;
                }
                let hitA;
                let hitB;
                if (submitActive) {
                    hitA = effective.has(a) && !isNumClaimedForPairNeon(a, claimed, null, effective);
                    hitB = effective.has(b) && !isNumClaimedForPairNeon(b, claimed, null, effective);
                } else {
                    hitA = observed !== null && effective.has(a) && a === observed && !isNumClaimedForPairNeon(a, claimed, observed, effective);
                    hitB = observed !== null && effective.has(b) && b === observed && !isNumClaimedForPairNeon(b, claimed, observed, effective);
                }
                btn.classList.toggle('pair-neon-hint', !!(hitA || hitB));
            }
            btns.forEach((btn) => {
                if (!btn.classList.contains('pair-neon-hint')) {
                    btn.style.removeProperty('animation-delay');
                    btn.style.removeProperty('animation');

            pairsWithMain.sort((x, y) => { if (x.main !== y.main) return x.main - y.main; if (x.pair[0] !== y.pair[0]) return x.pair[0] - y.pair[0]; return x.pair[1] - y.pair[1]; });

        /** Aggregate note / nonexist number sets from the first 10 chuỗi (same source as table 2). */
        function buildAggregatedNoteNonexistSets() {
            const noteSet = [];
            const nonexistSet = [];
            if (!raw || !raw.lines) {
                return { noteSet, nonexistSet };
            }
            getRawDisplayLines().forEach(function (lineObj) {
                if (lineObj && typeof lineObj !== 'string') {
                    if (lineObj.note) {
                        const all = lineObj.note.matchAll(/\{([^}]*)\}/g);
                        for (const m of all) {
                            if (m && m[1]) {
                                const nums = m[1].split(',').map(function (x) { return parseInt(x.trim(), 10); }).filter(function (n) { return !isNaN(n); });
                                noteSet.push.apply(noteSet, nums);
                            }
                        }
                    }
                    if (lineObj.nonexist) {
                        const nums = (lineObj.nonexist || '').split(',').map(function (x) { return parseInt(x.trim(), 10); }).filter(function (n) { return !isNaN(n); });
                        nonexistSet.push.apply(nonexistSet, nums);
                    }
                }
            });
            return {
                noteSet: Array.from(new Set(noteSet)),
                nonexistSet: Array.from(new Set(nonexistSet))
            };
        }

        const LEFT_NX_CLASS_NAMES = [

        /**

         * Submit ON: giữ nguyên map nonexist pane phải.

        function resolveLeftNonexistKind(kind) {
            if (!kind) return '';
            if (!submitActive) {
                if (kind === 'purple' || kind === 'green-strike') return 'purple';
                if (kind === 'green-ul') return 'red';
                if (kind === 'green-italic') return 'yellow';

        function leftNonexistKindToClassName(kind) {
            if (kind === 'yellow') return 'left-nx-yellow';

            if (kind === 'green') return 'left-nx-green';

        function getTrackedPairChuoiLineIndicesSet() {
            const out = new Set();

                if (!pairTailButtonShouldShowPairSelected(a, b, eff)) {

                for (let ti = 0; ti < tails.length; ti++) {

        /** Mọi chỉ số dòng chuỗi có cả hai số a,b trong 5 số kết quả. */

        /**
         * Hai Chuỗi liền kề (i, i+1) tách a|b: mỗi dòng chỉ có một trong hai số.
         * Nếu đã có main (chuỗi chứa cả a và b): boundary hợp lệ **không** được chạm vào bất kỳ dòng main nào
         * (tránh nhầm ví dụ main ở chuỗi 9 cùng cạnh 9–10 với chuỗi 10).
         * Trên mỗi dòng solo: viền chân index cho a và b. Adjacent: 2 ô / mỗi cặp tách hợp lệ (tổng 2x ô, x = số boundary hợp lệ).
         * Chỉ áp cho **pair** (#pairList); **tail** không tạo viền vuông này.
         */
        function getAdjacentPairChuoiFreqHighlightSpecs() {
            const out = [];
            if (!raw || !Array.isArray(raw.lines) || raw.lines.length < 10) {
                return out;
            }
            let eff;
            try {
                eff = getEffectiveSelectionSetForPairNeon();
            } catch (eEff) {
                return out;
            }
            if (!eff || eff.size < 2) {
                return out;
            }
            const displayLines = getRawDisplayLines();
            const maxBound = displayLines.length - 1;
            const seen = new Set();

            function addSpec(li, num) {
                const k = li + ':' + num;
                if (seen.has(k)) {
                    return;
                }
                seen.add(k);
                out.push({ lineIndex: li, num: num });
            }

            function considerPair(a, b) {
                if (!Number.isFinite(a) || !Number.isFinite(b)) {
                    return;
                }
                if (!pairTailButtonShouldShowPairSelected(a, b, eff)) {
                    return;
                }
                const soloSet = findAllChuoiDisplayLineIndicesContainingBoth(a, b);
                soloSet.forEach(function (k) {
                    addSpec(k, a);
                    addSpec(k, b);
                });
                for (let i = 0; i < maxBound; i++) {
                    if (soloSet.size > 0 && (soloSet.has(i) || soloSet.has(i + 1))) {
                        continue;
                    }
                    const nums0 = getNumsFromLineObj(displayLines[i]);
                    const nums1 = getNumsFromLineObj(displayLines[i + 1]);
                    const h0a = nums0.indexOf(a) !== -1;
                    const h0b = nums0.indexOf(b) !== -1;
                    const h1a = nums1.indexOf(a) !== -1;
                    const h1b = nums1.indexOf(b) !== -1;
                    if (h0a && !h0b && h1b && !h1a) {
                        addSpec(i, a);
                        addSpec(i + 1, b);
                    } else if (h0b && !h0a && h1a && !h1b) {
                        addSpec(i, b);
                        addSpec(i + 1, a);
                    }
                }
            }

            try {
                const pairs = computePairs() || [];
                for (let pi = 0; pi < pairs.length; pi++) {
                    const p = pairs[pi];
                    if (p && p.length >= 2) {
                        considerPair(p[0], p[1]);
                    }
                }
            } catch (eP) { /* ignore */ }
            return out;
        }

        /**
         * Số vơi ra: vẫn là đầu cặp pair (a|b) nhưng xuất hiện trên chuỗi không thuộc main (cả hai)
         * hoặc adjacent (tách đúng biên liền kề). Viền đơn ngoài — không kép / không chéo.

        function getExtraPairChuoiFreqHighlightSpecs(adjSpecs) {
            const out = [];
            const adjSeen = new Set();
            (adjSpecs || []).forEach(function (sp) {

            if (!raw || !Array.isArray(raw.lines) || raw.lines.length < 10) {

            let eff;
            try {

            if (!eff || eff.size < 2) {

            const displayLines = getRawDisplayLines();
            const seen = new Set();

            function considerPair(a, b) {
                if (!Number.isFinite(a) || !Number.isFinite(b)) {
                    return;

                if (!pairTailButtonShouldShowPairSelected(a, b, eff)) {
                    return;
                }
                for (let li = 0; li < displayLines.length; li++) {
                    const nums = getNumsFromLineObj(displayLines[li]);
                    [a, b].forEach(function (num) {
                        if (nums.indexOf(num) === -1) {
                            return;
                        }
                        const k = li + ':' + num;
                        if (adjSeen.has(k) || seen.has(k)) {
                            return;
                        }
                        seen.add(k);
                        out.push({ lineIndex: li, num: num });

                }
            }

            try {
                const pairs = computePairs() || [];
                for (let pi = 0; pi < pairs.length; pi++) {
                    const p = pairs[pi];
                    if (p && p.length >= 2) {

                    }
                }

        }

        function computeAndApplyHeights() {
            var container = document.querySelector('.container');
            var right = document.getElementById('right');
            var tableWrapper = document.querySelector('.tableWrapper');
            var left = document.getElementById('left');
            if (!right || !container) return;

            // Compute available height inside the viewport below the container's top edge.
            var containerRect = container.getBoundingClientRect();
            var viewportH = window.innerHeight || document.documentElement.clientHeight;
            var bottomGap = 8; // small breathing room from bottom edge
            var availableH = Math.max(0, Math.floor(viewportH - containerRect.top - bottomGap));

            // Apply computed height to the right column and left table wrapper so they match.
            right.style.height = availableH + 'px';
            right.style.maxHeight = availableH + 'px';
            if (tableWrapper) tableWrapper.style.height = availableH + 'px';

            var table = right.querySelector('table');
            var leftTable = left ? left.querySelector('table') : null;
            if (!table) return;

            // Reset any previous transforms / CSS var overrides
            table.style.transform = '';
            table.style.transformOrigin = '';
            var leftContainer = document.querySelector('.left-container');
            if (leftContainer) {
                leftContainer.style.transform = '';
                leftContainer.style.transformOrigin = '';
                // reset right margin when clearing transforms
                try { var rightEl = document.getElementById('right'); if (rightEl) rightEl.style.marginLeft = ''; } catch (e) { }
            }
            if (leftTable) {
                leftTable.style.transform = '';
                leftTable.style.transformOrigin = '';
            }
            right.style.removeProperty('--right-row-padding');
            right.style.removeProperty('--right-font-size');
            right.style.removeProperty('--right-line-height');

            // Measure helper
            function measureTableHeight() { return table.offsetHeight; }

            var tableH = measureTableHeight();

            // If it already fits, center and exit
            if (tableH <= availableH) {
                var top = Math.max(0, Math.floor((availableH - tableH) / 2));
                table.style.marginTop = top + 'px';
                if (leftTable) leftTable.style.marginTop = top + 'px';
                right.style.overflowY = 'hidden';
                // align actions and center group, then position floating buttons
                alignTableActionsAndCenter();
                updateFloatingCopyButtons();
                try { updateFocusIndicator(); } catch (e) { }
                return;
            }

            // Try progressively reducing row padding
            var fitted = false;
            var startPad = 8, minPad = 2;
            for (var p = startPad; p >= minPad; p--) {
                right.style.setProperty('--right-row-padding', p + 'px');
                tableH = measureTableHeight();
                if (tableH <= availableH) { fitted = true; break; }
            }

            // If still too tall, reduce font-size and line-height
            if (!fitted) {
                var startFont = 11, minFont = 9;
                for (var f = startFont; f >= minFont; f--) {
                    right.style.setProperty('--right-font-size', f + 'px');
                    // set a reasonable line-height for the font
                    var lh = Math.max(12, Math.round(f * 1.45));

                }

            // If still doesn't fit, apply a last-resort scale so it visually fits
            if (!fitted) {

                var minScale = 0.7;

                    table.style.transformOrigin = 'top left';
                    var leftContainer = document.querySelector('.left-container');

                    var scaledH = table.getBoundingClientRect().height;
                    var top = Math.max(0, Math.floor((availableH - scaledH) / 2));
                    table.style.marginTop = top + 'px';
                    if (leftTable) leftTable.style.marginTop = top + 'px';
                    right.style.overflowY = 'hidden';
                    // align actions and center group, then position floating buttons
                    alignTableActionsAndCenter();
                    updateFloatingCopyButtons();
                    try { updateFocusIndicator(); } catch (e) { }
                    return;
                }
            }

            // Final measurement: center if it fits, otherwise allow scroll
            tableH = measureTableHeight();
            if (tableH <= availableH) {
                var top2 = Math.max(0, Math.floor((availableH - tableH) / 2));
                table.style.marginTop = top2 + 'px';

            alignTableActionsAndCenter();
            updateFloatingCopyButtons();
            try { updateFocusIndicator(); } catch (e) { }

        function generateChecknoteHtml(inputStr, highlightedNums, cnData) {
