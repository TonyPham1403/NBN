<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quick Lotto Left UI</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <style>
        /* Copied and scoped ok.py left UI styles. Minor adjustments: hide right column. */
        :root {
            --blocked-default: #ffffff;
            --blocked-note: #00d9f2;
            --blocked-nonexist: #f0c840;
            --submit-answer-color: #ffffff;
            --submit-note-color: #00e2d2;
            --submit-nonexist-color: #e0ca42;
        }

        body,
        table {
            font-family: Arial;
            font-size: 12px;
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #111;
        }

        /* container is a flex row; right column defines height, children stretch to match */
        .container {
            display: flex;
            justify-content: flex-start;
            align-items: stretch;
            gap: 36px;
            position: relative;
            margin-top: 6px;
            height: 100%;
            overflow-y: hidden;
            box-sizing: border-box;
        }

        table {
            border-collapse: collapse
        }

        html,
        body {
            height: 100vh;
        }

        body {
            overflow: hidden;
        }

        td,
        th {
            border: 1px solid black;
            padding: 6px 10px;
            text-align: center
        }

        .left td:nth-child(2) {
            text-align: left
        }

        .cell {
            display: inline-block;
            box-sizing: border-box;
            width: 20px;
            min-width: 20px;
            line-height: 18px;
            text-align: center;
            cursor: pointer;
            font-variant-numeric: tabular-nums;
            font-size: 12px;
            position: relative;
            --selected-ring-size: 18px;
            --selected-ring-border: 4px;
            transition: background-color .08s linear, color .08s linear;
        }

        /* Placeholder scaffold styling for empty state */
        .cell.placeholder {
            background: #eee;
            color: transparent;
            border-radius: 3px;
            display: inline-block;
            height: 18px;
            line-height: 18px;
        }

        .skeleton-label {
            display: inline-block;
            background: #f3f3f3;
            color: transparent;
            border-radius: 3px;
            padding: 4px 8px;
        }

        /* draw a circular ring using a pseudo-element so layout doesn't change
           Only sequence-number cells (have class `num`) show the ring. Use opacity/transform
           transitions and promote to its own composite layer to avoid repaint flicker. */
        .cell.num {
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
            will-change: transform, opacity;
            width: 20px;
            min-width: 20px;
            height: 20px;
            min-height: 20px;
            line-height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            vertical-align: middle;
        }

        .cell.num::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0.98);
            width: var(--selected-ring-size);
            height: var(--selected-ring-size);
            border-radius: 50%;
            border: var(--selected-ring-border) solid rgba(255, 0, 0, 0);
            box-shadow: 0 0 0 rgba(255, 0, 0, 0);
            pointer-events: none;
            opacity: 0;
            transition: box-shadow .12s ease, transform .08s ease, opacity .12s ease, border-color .12s ease;
            will-change: transform, opacity;
            backface-visibility: hidden;
        }

        .cell.num.selected::after {
            border-color: rgba(255, 0, 0, 0.95);
            box-shadow: 0 0 6px rgba(255, 0, 0, 0.12);
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .cell.num.auto-circled::after {
            border-color: rgba(255, 0, 0, 0.95);
            box-shadow: 0 0 6px rgba(255, 0, 0, 0.12);
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        /* Submitted numbers highlight (used when Space toggles submit preview).
           The submit state applies a green background; text color is mapped
           by semantic classes so submitted numbers keep their semantic hue.
           Mapping:
             - default (black text) -> white
             - .note-highlight (cyan) -> #00e2d2
             - .nonexist-intersect (yellow) -> #e0ca42
        */
        .cell.submit-highlight {
            background-color: green !important;
            color: var(--submit-answer-color) !important;
            font-weight: bold !important;
            transition: background-color .12s ease, color .12s ease;
        }

        .cell.submit-highlight.note-highlight {
            color: var(--submit-note-color) !important;
        }

        .cell.submit-highlight.nonexist-intersect {
            color: var(--submit-nonexist-color) !important;
        }

        .red {
            color: inherit;
            text-decoration: underline;
            text-decoration-color: red;
            text-decoration-thickness: 2px;
            text-decoration-style: solid
        }

        .idx-highlight {
            color: red !important;
            font-weight: bold !important
        }

        .blocked {
            background: black !important;
            color: var(--blocked-default) !important;
            font-weight: normal !important;
            pointer-events: none;
            cursor: default;
        }

        .cell.num.blocked {
            border-radius: 0;
        }

        #right td span.cell.num.blocked {
            border-radius: 0;
        }

        /* Preserve semantic submit-color mapping for blocked numbers:
           - default blocked text -> white (submit answer color)
           - blocked + note -> cyan (submit note color)
           - blocked + nonexist -> yellow (submit nonexist color)
        */
        .cell.blocked.note-highlight {
            color: var(--submit-note-color) !important;
            font-weight: bold !important;
        }

        .cell.blocked.nonexist-intersect {
            color: var(--submit-nonexist-color) !important;
            font-weight: bold !important;
        }

        .cell.blocked:not(.note-highlight):not(.nonexist-intersect) {
            color: var(--submit-answer-color) !important;
        }

        .bold {
            font-weight: bold;
            color: green
        }

        .chuoi-selected {
            background: green;
            color: white;
            font-weight: bold
        }

        .chuoi-toggled-td {
            background: black !important;
            color: #ffffff !important;
            font-weight: bold
        }

        /* Keep Chuoi label readable on neon submit rows */
        td.answer-neon>span {
            color: #000000 !important;
            font-weight: bold;
            text-shadow: none;
        }

        /* Neon glow for submitted answers (table 2) — stronger and faster animations */
        :root {
            --neon-color: #00ff66;
            --neon-mid: rgba(0, 255, 102, 0.75);
            --neon-outer: rgba(0, 255, 102, 0.6);
            --neon-inner: rgba(0, 255, 102, 1);
            --neon-dark: rgba(0, 0, 0, 0.75)
        }

        .answer-neon {
            position: relative;
            z-index: 0;
            border-radius: 0;
            overflow: visible
        }

        /* label sheen (SVG streak used for Chuỗi label background) */
        .neon-streak {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible
        }

        .neon-streak svg {
            width: 100%;
            height: 100%;
            display: block
        }

        .neon-streak .halo {
            stroke: var(--neon-color);
            stroke-width: 12;
            stroke-opacity: 0.28;
            fill: none;
            stroke-linecap: round;
            filter: drop-shadow(0 0 12px var(--neon-dark))
        }

        .neon-streak .trail {
            stroke: var(--neon-color);
            stroke-width: 7;
            fill: none;
            stroke-linecap: round;
            stroke-dasharray: 120 320;
            stroke-dashoffset: 0;
            filter: drop-shadow(0 0 8px var(--neon-dark))
        }

        .neon-streak .core {
            stroke: var(--neon-color);
            stroke-width: 4;
            fill: none;
            stroke-linecap: round;
            stroke-dasharray: 48 368;
            stroke-dashoffset: 0;
            filter: drop-shadow(0 0 10px var(--neon-dark)) drop-shadow(0 0 12px var(--neon-color)) drop-shadow(0 0 26px var(--neon-mid))
        }

        .answer-neon.animate .neon-streak .core,
        .answer-neon.animate .neon-streak .trail {
            animation: neonStroke 2.4s linear infinite
        }

        @keyframes neonStroke {
            from {
                stroke-dashoffset: 0
            }

            to {
                stroke-dashoffset: -416
            }
        }

        /* Per-number neon (strong pulsing glow for individual number cells) */
        .cell.answer-neon {
            border-radius: 6px;
            box-shadow: 0 0 0 3px var(--neon-dark), 0 0 20px var(--neon-color), 0 0 60px var(--neon-mid), 0 0 150px var(--neon-outer), inset 0 0 12px var(--neon-inner);
            transition: box-shadow .12s ease, transform .08s ease;
            will-change: box-shadow
        }

        @keyframes neonPulse {
            0% {
                box-shadow: 0 0 16px var(--neon-color), 0 0 48px var(--neon-mid), 0 0 120px var(--neon-outer)
            }

            50% {
                box-shadow: 0 0 48px var(--neon-color), 0 0 120px var(--neon-mid), 0 0 300px var(--neon-outer)
            }

            100% {
                box-shadow: 0 0 16px var(--neon-color), 0 0 48px var(--neon-mid), 0 0 120px var(--neon-outer)
            }
        }

        .cell.answer-neon.animate {
            animation: neonPulse 0.9s ease-in-out infinite
        }

        /* Keep red ring when an item is both selected and answer-neon (stronger) */
        .selected.answer-neon {
            border-radius: 50%;
            box-shadow: 0 0 0 4px red, 0 0 0 6px var(--neon-dark), 0 0 20px var(--neon-color), 0 0 60px var(--neon-mid), 0 0 150px var(--neon-outer), inset 0 0 12px var(--neon-inner);
            transition: box-shadow .12s ease, transform .08s ease
        }

        @keyframes neonPulseSelected {
            0% {
                box-shadow: 0 0 0 4px red, 0 0 16px var(--neon-color), 0 0 48px var(--neon-mid), 0 0 120px var(--neon-outer)
            }

            50% {
                box-shadow: 0 0 0 4px red, 0 0 48px var(--neon-color), 0 0 120px var(--neon-mid), 0 0 300px var(--neon-outer)
            }

            100% {
                box-shadow: 0 0 0 4px red, 0 0 16px var(--neon-color), 0 0 48px var(--neon-mid), 0 0 120px var(--neon-outer)
            }
        }

        .selected.answer-neon.animate {
            animation: neonPulseSelected 0.9s ease-in-out infinite
        }

        /* Hide right area inside iframe */
        #right {
            display: block
        }

        /* Adjust left container sizing to fit iframe area */
        .left-container {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-self: stretch;
            /* fill height set by right column */
            height: auto;
            flex: 0 0 auto;
            width: auto;
            box-sizing: border-box;
            padding-right: 8px;
            min-height: 0;
            overflow-y: hidden;
            /* prevent meaningless vertical scrollbar in left half */
            --left-table-scale: 0.81;
            transform-origin: left center;
            transform: scale(var(--left-table-scale));
        }

        .tableWrapper {
            display: flex;
            flex: 1 1 auto;
            flex-direction: column;
            justify-content: center;
            /* center table vertically within left column */
            align-items: flex-start;
            /* anchor table to left edge so it grows rightwards */
            overflow-x: visible;
            overflow-y: hidden;
            max-width: none;
            width: auto;
            box-sizing: border-box;
        }

        /* ensure the left output area itself doesn't show a vertical scrollbar */
        #left {
            overflow-y: hidden;
        }

        /* Hide scrollbar visuals for left area across browsers */
        .left-container,
        .tableWrapper,
        #left {
            -ms-overflow-style: none;
            /* IE and Edge */
            scrollbar-width: none;
            /* Firefox */
        }

        .left-container::-webkit-scrollbar,
        .tableWrapper::-webkit-scrollbar,
        #left::-webkit-scrollbar {
            width: 0;
            height: 0;
            background: transparent;
        }

        /* Left compact sizing (match ok.py) */
        #left table {
            font-size: 13px;
        }

        /* tableWrapper layout only; scale moved to .left-container */

        #left td,
        #left th {
            padding: 3px 6px;
            vertical-align: top;
            white-space: nowrap;
        }

        #left td .cell {
            width: 20px;
            min-width: 20px;
            height: 20px;
            min-height: 20px;
            line-height: 20px;
            font-size: 13px;
            margin-right: 0;
            padding: 0;
        }

        /* midwrap centers the inline-flex .container inside iframe */
        .midwrap {
            display: flex;
            justify-content: center;
            width: 100%;
            box-sizing: border-box;
        }

        /* anchor left table to left edge so it expands rightwards */
        #left table {
            margin-left: 0;
            margin-right: auto;
            display: table;
        }

        /* small copy button positioned to the right; visually place it outside without widening the table */
        #right tr>td:nth-child(2) {
            position: relative;
            overflow: visible;
        }

        /* Right column height control to avoid page scrolling in iframe */
        /* slightly reduce full-viewport height so external left-side scrollbar doesn't appear */
        .midwrap {
            height: calc(100vh - 10px);
            overflow: hidden;
        }

        /* CSS vars let JS tune row padding, font-size and line-height to fit vertically */
        #right {
            --right-row-padding: 8px;
            --right-font-size: 11px;
            --right-line-height: 16px;
            /* visual scale for the 5 number cells (does not affect layout) */
            --right-cell-scale: 1.35;
            /* increase vertical space for table 2 (slightly reduced to avoid outer scrollbar) */
            max-height: calc(100vh - 14px);
            overflow-y: auto;
            overflow-x: hidden;
            /* avoid horizontal scrollbar */
            box-sizing: border-box;
            padding-left: 8px;
            flex: 1 1 0;
            min-width: 0;
            margin-left: 0;
        }

        #right td,
        #right th {
            padding: var(--right-row-padding) 6px;
            vertical-align: middle;
        }

        /* Separate spacing for the alternating rows in table 2.
           Chuỗi rows get a little more room; index/pattern rows are compact. */
        #right tr.chuoi-main-row>td {
            padding-top: calc(var(--right-row-padding) + 1px);
            padding-bottom: calc(var(--right-row-padding) + 1px);
        }

        #right tr.chuoi-pattern-row>td {
            padding-top: calc(var(--right-row-padding) - 5px);
            padding-bottom: calc(var(--right-row-padding) - 5px);
            font-size: calc(var(--right-font-size) * 0.82);
            line-height: calc(var(--right-line-height) * var(--right-cell-scale) * 0.82);
            overflow: hidden;
        }

        /* Spacer row between Chuỗi blocks, matching ok.py's blank separator row. */
        #right tr.chuoi-gap-row>td {
            border: none;
            padding: 0;
            height: 5px;
            line-height: 5px;
            background: #ffffff !important;
            position: relative;
            z-index: 2;
            pointer-events: none;
        }

        /* Make Chuỗi rows feel taller by enlarging the visible label and numbers slightly.
           Use font-size/line-height instead of transform so the content does not spill into
           the next row and get covered by the black pattern row. */
        #right tr.chuoi-main-row td:first-child span,
        #right tr.chuoi-main-row td:nth-child(2) .cell.num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        #right tr.chuoi-main-row td:first-child span {
            font-size: calc(var(--right-font-size) * 1.1);
            line-height: 1.15;
            transform-origin: left center;
        }

        #right tr.chuoi-main-row td:nth-child(2) .cell.num {
            font-size: calc(var(--right-font-size) * var(--right-cell-scale) * 1.14);
            line-height: calc(var(--right-line-height) * var(--right-cell-scale) * 1.1);
        }

        /* For right-side numbers, use font-size/line-height scaling instead of transform so the
           selection pseudo-element stays centered on the glyph. Also adjust ring size to match. */
        #right td span.cell {
            width: auto;
            min-width: 18px;
            line-height: calc(var(--right-line-height) * var(--right-cell-scale));
            font-size: calc(var(--right-font-size) * var(--right-cell-scale));
            display: inline-block;
            margin-right: 0;
            /* scale the selection ring proportionally for right table */
            --selected-ring-size: calc(15px * var(--right-cell-scale));
            --selected-ring-border: calc(3px * var(--right-cell-scale));
        }

        #right td span.cell.num {
            width: calc(var(--right-line-height) * var(--right-cell-scale));
            min-width: calc(var(--right-line-height) * var(--right-cell-scale));
            height: calc(var(--right-line-height) * var(--right-cell-scale));
            min-height: calc(var(--right-line-height) * var(--right-cell-scale));
            line-height: calc(var(--right-line-height) * var(--right-cell-scale));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            vertical-align: middle;
        }

        /* Slightly smaller text for index/frequency cells in right table */
        #right .cell.index {
            font-size: calc(var(--right-font-size) * 0.85);
            line-height: calc(var(--right-line-height) * var(--right-cell-scale) * 0.85);
            width: calc(var(--right-line-height) * var(--right-cell-scale));
            min-width: calc(var(--right-line-height) * var(--right-cell-scale));
            height: calc(var(--right-line-height) * var(--right-cell-scale));
            min-height: calc(var(--right-line-height) * var(--right-cell-scale));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            vertical-align: middle;
            margin-right: 0;
        }

        /* Make the 5-number submit blocks in the right table appear square like table 1 */
        /* Use the right-row line-height * scale so width matches computed height and stays square */
        #right td span.cell.submit-highlight {
            box-sizing: border-box;
            /* remove any extra padding so internal content doesn't enlarge the box */
            padding: 0;
            text-align: center;
            border-radius: 4px !important;
        }

        /* Preserve semantic text colors when submit-highlight is active */
        #right td span.cell.submit-highlight.note-highlight {
            color: var(--submit-note-color) !important;
            font-weight: bold !important;
        }

        #right td span.cell.submit-highlight.nonexist-intersect {
            color: var(--submit-nonexist-color) !important;
            font-weight: bold !important;
        }

        #right td span.cell.submit-highlight.idx-highlight {
            color: red !important;
            font-weight: bold !important;
        }

        /* hide inline copy buttons in the table; we'll render floating buttons instead */
        .copyBtn {
            display: none;
        }

        /* floating container covering the full viewport (buttons positioned via JS) */
        .floatingCopyContainer {
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            pointer-events: none;
            /* allow clicks only on the buttons */
            z-index: 9999;
        }

        .copyBtnFloating {
            position: absolute;
            pointer-events: auto;
            width: 24px;
            height: 24px;
            font-size: 11px;
            border-radius: 5px;
            border: 1px solid #ccc;
            background: #f7f7f7;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
            cursor: pointer;
        }

        /* highlights for note / nonexist */
        .note-highlight {
            color: #0097a7;
            font-weight: bold
        }

        .nonexist-intersect {
            color: #e6b800;
            font-weight: bold
        }

        /* freq 0 row: per-number colors like right-pane renderNonexistHtml */
        .cell.num.left-nx-yellow {
            color: rgb(240, 200, 64);
            font-weight: bold;
        }

        .cell.num.left-nx-red {
            color: rgb(255, 0, 0);
            font-weight: bold;
        }

        .cell.num.left-nx-purple {
            color: rgb(148, 55, 220);
            font-weight: bold;
        }

        .cell.num.left-nx-green {
            color: rgb(0, 80, 0);
            font-weight: bold;
        }

        .cell.num.left-nx-green-ul {
            color: rgb(0, 80, 0);
            font-weight: bold;
            text-decoration: underline;
        }

        .cell.num.left-nx-green-italic {
            color: rgb(0, 80, 0);
            font-weight: bold;
            font-style: italic;
        }

        .cell.blocked.left-nx-yellow {
            color: rgb(240, 200, 64) !important;
            font-weight: bold !important;
        }

        .cell.blocked.left-nx-red {
            color: rgb(255, 0, 0) !important;
            font-weight: bold !important;
        }

        .cell.blocked.left-nx-purple {
            color: rgb(148, 55, 220) !important;
            font-weight: bold !important;
        }

        .cell.num.left-nx-green-strike {
            color: rgb(0, 80, 0);
            font-weight: bold;
            font-size: 1.5em;
            text-decoration: line-through;
        }

        .cell.blocked.left-nx-green-strike {
            color: rgb(0, 80, 0) !important;
            font-weight: bold !important;
            font-size: 1.5em !important;
            text-decoration: line-through !important;
        }

        .cell.blocked.left-nx-green,
        .cell.blocked.left-nx-green-ul,
        .cell.blocked.left-nx-green-italic {
            color: rgb(0, 80, 0) !important;
            font-weight: bold !important;
        }

        .tableActions .actions-left {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        #resetBtn,
        #submitBtn,
        #blockBtn {
            font-size: 12px;
            padding: 4px 10px;
            font-weight: bold;
            cursor: pointer;
            margin: 0;
            background: none;
            border: 1px solid #ccc;
            border-radius: 6px;
            min-height: 24px;
            line-height: 1.2;
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        #mode {
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 4px 8px;
            height: 24px;
            line-height: 1;
            background-color: #ffffff;
            color: #111111;
            font-weight: bold;
        }

        select#mode.synced-mode,
        #mode.synced-mode {
            background-color: #006400 !important;
            color: #ffffff !important;
            font-weight: bold;
            border-color: #006400 !important;
        }

        select#mode:disabled,
        select#mode.synced-mode:disabled,
        #mode:disabled,
        #mode.synced-mode:disabled {
            opacity: 1 !important;
            filter: none !important;
            background-color: #006400 !important;
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
        }

        /* Submit button active state: dark green background when submit preview is ON */
        #submitBtn.active {
            background: #2e7d32;
            color: #ffffff;
            border-color: #1b5e20;
        }

        /* Block toggle — ON: nền đen chữ trắng (chặn số theo mode) */
        #blockBtn.active {
            background: #111111;
            color: #ffffff;
            border-color: #111111;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
        }

        /* Block OFF: viền nét đứt, nền sáng — không chặn, số vẫn bấm được */
        #blockBtn:not(.active) {
            background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
            color: #64748b;
            border: 1px dashed #94a3b8;
            box-shadow: none;
        }

        #blockBtn:not(.active):hover {
            color: #334155;
            border-color: #64748b;
            background: #f8fafc;
        }

        /* Actions row directly above the left table (hidden until we align after scaling) */
        .tableActions {
            display: none;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            width: 100%;
            box-sizing: border-box;
            padding: 4px 0 6px 0;
            align-self: stretch;
            /* make it span full width inside .tableWrapper */
        }

        .tableActions .actions-right {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        #searchBox {
            width: calc(6ch + 16px);
            box-sizing: border-box;
            text-align: center;
            font-size: 12px;
            padding: 6px 8px;
            margin-left: 6px;
            border: none;
            border-radius: 6px;
            background: #ffffff;
            box-shadow: inset 0 0 0 1px #ccc;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            position: relative;
            z-index: 2;
            transform: translateZ(0);
        }

        #searchBox:focus {
            outline: none;
            box-shadow: inset 0 0 0 1px #1e88e5, 0 0 4px rgba(30, 136, 229, 0.15);
        }

        /* Chuỗi pattern khớp ô search (multiset digit) — giống ok.py */
        .search-hit {
            background: gold !important;
            font-weight: bold;
        }

        .pair-btn {
            box-sizing: border-box;
            background: none;
            border: 3px solid transparent;
            border-radius: 6px;
            padding: 1px 4px;
            margin: 2px;
            cursor: pointer;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            height: 24px;
            /* Cùng khung với .pair-neon-hint (border 3px + padding 1px 4px) — viền xám mỏng bằng inset, tránh đổi width khi bật/tắt neon */
            box-shadow: inset 0 0 0 1px #ccc;
        }

        .pair-btn.pair-selected {
            background: #2e7d32;
            color: #ffffff;
            border: 3px solid #1b5e20;
            box-shadow: none;
        }

        /* Neon gợi ý cặp — thời lượng animation khớp PAIR_NEON_BORDER_PERIOD_S / PAIR_NEON_GLOW_PERIOD_S trong JS (syncPairNeonHintAnimations) */
        .pair-btn.pair-neon-hint:not(.pair-selected) {
            box-sizing: border-box;
            position: relative;
            z-index: 0;
            border: 3px solid transparent;
            padding: 1px 4px;
            outline: none;
            background-image:
                linear-gradient(#ecfdf5, #ecfdf5),
                linear-gradient(90deg,
                    #14532d 0%,
                    #15803d 10%,
                    #22c55e 22%,
                    #bef264 38%,
                    #ecfccb 48%,
                    #84cc16 52%,
                    #4ade80 65%,
                    #16a34a 82%,
                    #052e16 100%);
            background-size: 100% 100%, 340% 100%;
            background-origin: border-box;
            background-clip: padding-box, border-box;
            box-shadow:
                0 0 0 1px rgba(190, 242, 100, 0.65),
                0 0 14px rgba(74, 222, 128, 0.95),
                0 0 28px rgba(34, 197, 94, 0.55);
            animation:
                pair-neon-border-slide 1.25s linear infinite,
                pair-neon-glow-pulse 0.9s ease-in-out infinite alternate;
            transition: none;
        }

        @keyframes pair-neon-border-slide {
            0% {
                background-position: 0 0, 0% 0;
            }

            100% {
                background-position: 0 0, 100% 0;
            }
        }

        @keyframes pair-neon-glow-pulse {
            0% {
                box-shadow:
                    0 0 0 1px rgba(190, 242, 100, 0.5),
                    0 0 10px rgba(74, 222, 128, 0.75),
                    0 0 22px rgba(34, 197, 94, 0.4);
            }

            100% {
                box-shadow:
                    0 0 0 2px rgba(217, 249, 157, 0.95),
                    0 0 20px rgba(190, 242, 100, 1),
                    0 0 36px rgba(74, 222, 128, 0.7);
            }
        }

        /* pair/tail selected (green): giữ cyan / vàng như submit-highlight trên bảng 1 */
        .pair-btn.pair-selected .pair-num {
            color: var(--submit-answer-color);
            font-weight: bold;
        }

        .pair-btn.pair-selected .pair-num.note-highlight {
            color: var(--submit-note-color) !important;
            font-weight: bold !important;
        }

        .pair-btn.pair-selected .pair-num.nonexist-intersect {
            color: var(--submit-nonexist-color) !important;
            font-weight: bold !important;
        }

        .pair-btn.pair-selected .pair-num.left-nx-yellow {
            color: var(--submit-nonexist-color) !important;
            font-weight: bold !important;
        }

        .pair-btn.pair-selected .pair-num.left-nx-red {
            color: rgb(255, 120, 120) !important;
            font-weight: bold !important;
        }

        .pair-btn.pair-selected .pair-num.left-nx-purple {
            color: rgb(220, 180, 255) !important;
            font-weight: bold !important;
        }

        .pair-btn.pair-selected .pair-num.left-nx-green,
        .pair-btn.pair-selected .pair-num.left-nx-green-ul,
        .pair-btn.pair-selected .pair-num.left-nx-green-italic,
        .pair-btn.pair-selected .pair-num.left-nx-green-strike {
            color: var(--submit-note-color) !important;
            font-weight: bold !important;
        }

        .pair-btn.pair-selected .pair-num.left-nx-green-ul {
            text-decoration: underline;
        }

        .pair-btn.pair-selected .pair-num.left-nx-green-italic {
            font-style: italic;
        }

        .pair-btn.pair-selected .pair-num.left-nx-green-strike {
            text-decoration: line-through;
        }

        /* pair/tail: same number colors as table 1 (when button not selected) */
        .pair-btn:not(.pair-selected) .pair-num.note-highlight {
            color: #0097a7;
            font-weight: bold;
        }

        .pair-btn:not(.pair-selected) .pair-num.nonexist-intersect {
            color: #e6b800;
            font-weight: bold;
        }

        .pair-btn:not(.pair-selected) .pair-num.left-nx-yellow {
            color: rgb(240, 200, 64);
            font-weight: bold;
        }

        .pair-btn:not(.pair-selected) .pair-num.left-nx-red {
            color: rgb(255, 0, 0);
            font-weight: bold;
        }

        .pair-btn:not(.pair-selected) .pair-num.left-nx-purple {
            color: rgb(148, 55, 220);
            font-weight: bold;
        }

        .pair-btn:not(.pair-selected) .pair-num.left-nx-green {
            color: rgb(0, 80, 0);
            font-weight: bold;
        }

        .pair-btn:not(.pair-selected) .pair-num.left-nx-green-ul {
            color: rgb(0, 80, 0);
            font-weight: bold;
            text-decoration: underline;
        }

        .pair-btn:not(.pair-selected) .pair-num.left-nx-green-italic {
            color: rgb(0, 80, 0);
            font-weight: bold;
            font-style: italic;
        }

        .pair-btn:not(.pair-selected) .pair-num.left-nx-green-strike {
            color: rgb(0, 80, 0);
            font-weight: bold;
            font-size: 1.15em;
            text-decoration: line-through;
        }
    </style>
</head>

<body>
    <div class="midwrap">
        <div class="container">
            <div class="left-container">
                <div class="controls">
                    <textarea id="input" rows="1"
                        placeholder="Paste tối đa 11 chuỗi, cách nhau bằng khoảng trắng"></textarea>
                    <br>
                    <div class="mode-row">
                        <select id="mode">
                            <option value="modeq">?</option>
                            <option value="pair1">1 bộ 2</option>
                            <option value="pair2">2 bộ 2</option>
                            <option value="pair3">3 bộ 2</option>
                            <option value="pair4">4 bộ 2</option>
                            <option value="pair5">5 bộ 2</option>
                            <option value="triple1">1 bộ 3</option>
                            <option value="quad1">1 bộ 4</option>
                        </select>
                        <button id="pickBtn">Pick</button>
                        <span id="pickPreview" style="font-weight:normal;color:#333"></span>
                    </div>
                    <div id="pairList"
                        style="margin-top:6px;font-size:13px;color:#333;white-space:normal;word-break:break-word;overflow-wrap:anywhere;display:flex;align-items:center;flex-wrap:wrap;gap:6px;max-width:100%;box-sizing:border-box">
                    </div>
                    <div id="debug" style="margin-top:8px;font-size:13px;color:#333"></div>
                </div>
                <div class="tableWrapper">
                    <div class="tableActions">
                        <div class="actions-left">
                            <button id="submitBtn" type="button">Submit</button>
                            <button id="blockBtn" type="button" aria-pressed="true">Block</button>
                        </div>
                        <div class="actions-right">
                            <input id="searchBox" type="text" inputmode="numeric" maxlength="5" placeholder="search"
                                name="left-pane-pattern-search" autocomplete="off" autocorrect="off"
                                autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true"
                                data-form-type="other">
                            <button id="resetBtn">Reset</button>
                        </div>
                    </div>
                    <div id="left" class="left"></div>
                </div>
            </div>
            <div id="right"></div>
        </div>
    </div>
    <div id="focusIndicator"
        style="position:absolute;pointer-events:none;z-index:9999;font-size:18px;line-height:18px;transition:top .12s,left .12s,opacity .12s;opacity:0">
        ➔</div>

    <div id="focusSink" tabindex="-1" style="position:fixed;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden">
    </div>
    <script>
        if (typeof window.__checknote_data === 'undefined') window.__checknote_data = null;
        window.__checknote_lastData = null;
        window.__checknotePending = null;
        window.__periodFilterNavMode = false;

        function tryFilterPopupNavFromLeft(event, step) {
            if (!window.__periodFilterNavMode) {
                return false;
            }
            event.preventDefault();
            try {
                window.parent.postMessage({ type: 'filterPopupNavigate', step: step }, '*');
            } catch (err) { }
            return true;
        }
        window.addEventListener('message', function (ev) {
            var d = ev.data || {};
            if (d.type !== 'checknotePopupData') return;
            window.__checknote_lastData = d.data || { id_to_result: {}, pair_to_ids: {}, max_id: null };
            var pend = window.__checknotePending;
            if (pend && pend.nonce === d.nonce) {
                clearTimeout(pend.timer);
                window.__checknotePending = null;
                if (pend.showChecknoteTooltip !== false) {
                    var html = generateChecknoteHtml(pend.resultPart, pend.highlightedNums, window.__checknote_lastData);
                    if (!html) html = generateFallbackHtml(pend.resultPart);
                    try {
                        window.__checknote_tooltip_result = pend.resultPart;
                        window.__checknote_tooltip_anchor = pend.anchor || document.body;
                        window.__checknote_tooltip_row = pend.rowIdx;
                    } catch (e) { }
                    showChecknoteTooltip(pend.anchor || document.body, html, {
                        hover: !!pend.hover,
                        pinned: !!pend.pinned
                    });
                }
            }
            try { if (window.updatePickButtonUI) window.updatePickButtonUI(); } catch (e) { }
            try { if (document.getElementById('pickTooltip')) refreshPickTooltip(); } catch (e) { }
        });

        // Minimal JS extracted from ok.py necessary for left UI rendering and process()
        // For full behavior we include key functions: getNumsFromLineObj, process, renderTable1, renderTable2 (renderTable2 writes into #right but it's hidden), copyLine, computePairs, applyPair, etc.
        // To keep this manageable, we include the core process/renderTable1/renderTable2 implementations copied from ok.py (compact).

        function getNumsFromLineObj(line) {
            if (!line) return [];
            let s = typeof line === 'string' ? line : (line.result || '');
            s = s.split("|")[0].trim();
            if (!s) return [];
            return s.split(",").map(x => parseInt(x, 10)).filter(n => !isNaN(n));
        }

        const MAX_PICK_NUMBERS = 5;

        let raw = null; // structure { lines: [...], freq: {...}, firstNums: [...] }
        /** Per-number nonexist highlight kinds from right pane (yellow / red / green / default black) */
        let focusNonexistHighlights = {};
        let selected = new Set();
        let blockedSet = new Set();
        let simulatedSelected = new Set();
        let submitActive = false;
        const BLOCK_FEATURE_KEY = 'leftPaneBlockEnabled';
        let blockFeatureEnabled = true;
        let preserveSubmitOnNextProcess = false;
        let preserveSelectionOnNextProcess = false;
        let answerNums = [];
        let pickOrder = [];
        let lastClickedChuoiText = '';
        let pickTooltipTimers = [];
        let pickTooltipHideTimer = null;
        let precomputedPickRows = [];
        let pickTooltipPinned = false;
        let pickTooltipDocListener = null;
        let checknoteTooltipHideTimer = null;
        let checknoteTooltipPinned = false;
        let checknoteTooltipDocListener = null;
        let disableSubmitForCurrentData = false;
        let currentPairs = []; // computed pairs
        let currentPairIndex = -1;
        let currentTails = [];
        let currentTailIndex = -1;
        let submitAutoCircleEnabled = false;
        let submitAutoCircleMode = 'max';
        /** Khi mode === 'custom': khoanh đúng một số x (1–35), không phụ thuộc tần suất trong đáp án. */
        let submitAutoCircleCustomX = 15;
        /** Track draw ids (right-pane focus row) that already received one-shot auto ring */
        let autoRingVisitedIds = new Set();
        let autoRingPicked = new Set();
        /** Remember selection per focus id so revisiting a row restores user state */
        let selectionMemoryByFocusId = new Map();
        let lastAutoRingFocusKey = '';

        // pair/triple tracking (ported from ok.py)
        let firstPair = null, secondPair = null, thirdPair = null, fourthPair = null, fifthPair = null, firstTriple = null;
        let preSubmitSelected = null, preSubmitOrder = null;
        let userModeBeforeSubmit = null, modeSynced = false;

        // navigation / transient selection state
        let transientSelected = new Set();
        /** Số quan sát cho neon pair: freq>=2, còn khoanh, và có ít nhất một cặp được gợi ý neon; không thì chọn số khoanh khác (logic assign/getPairNeon). */
        let pairNeonObserveNum = null;
        /** true sau khi tập hiệu lực từng có >2 số — mới coi là đã có ngữ cảnh xác định số quan sát (tránh chỉ click 1 cặp mà có neon). */
        let pairNeonObserveContextBeyondLonePair = false;
        let currentPhaseNumber = null;
        let currentPhaseRow = null;
        let lastClickedRegion = 'left';
        /** Keyboard (WASD) nav region for the left pane — independent of right-pane clicks */
        let leftKeyboardRegion = 'left';
        let lastClickedRow = null;
        let lastClickedNumber = null;

        function syncLeftKeyboardRegion(region) {
            if (region === 'left' || region === 'right' || region === 'pairList' || region === 'tailList') {
                leftKeyboardRegion = region;
            }
        }

        function getLeftKeyboardNavRegion() {
            try {
                var el = document.activeElement;
                if (el && el.closest) {
                    if (el.closest('#pairList .pair-btn')) {
                        return 'pairList';
                    }
                    if (el.closest('#tailList .pair-btn')) {
                        return 'tailList';
                    }
                }
            } catch (e0) { }
            if (leftKeyboardRegion === 'left' || leftKeyboardRegion === 'right' ||
                leftKeyboardRegion === 'pairList' || leftKeyboardRegion === 'tailList') {
                return leftKeyboardRegion;
            }
            var pairListExists = !!(document.getElementById && document.getElementById('pairList'));
            var tailListExists = !!(document.getElementById && document.getElementById('tailList'));
            return pairListExists ? 'pairList' : (tailListExists ? 'tailList' : 'left');
        }

        // Phase history: remember recent mouse phase selections (region, number, row)
        // so the focus arrow can revert to the last phase target when the current phase is cleared.
        let phaseHistory = []; // newest at end, keep max length 5

        function pushPhaseHistory(region, number, row) {
            try {
                if (!number && number !== 0) return;
                // Remove any existing entries with same number to keep history unique
                phaseHistory = phaseHistory.filter(function (e) { return e.number !== number; });
                phaseHistory.push({ region: region || 'left', number: number, row: (typeof row === 'number') ? row : null });
                if (phaseHistory.length > 5) phaseHistory.shift();
            } catch (e) { }
        }

        function restorePreviousPhase(excludeNumber) {
            try {
                for (let i = phaseHistory.length - 1; i >= 0; i--) {
                    const e = phaseHistory[i];
                    if (!e || e.number == null) continue;
                    if (e.number === excludeNumber) continue;
                    // Only restore to a history entry whose number is still present in selection/simulated/transient
                    if (selected.has(e.number) || simulatedSelected.has(e.number) || transientSelected.has(e.number)) {
                        lastClickedRegion = e.region || 'left';
                        syncLeftKeyboardRegion(e.region || 'left');
                        lastClickedNumber = e.number;
                        currentPhaseNumber = e.number;
                        currentPhaseRow = (typeof e.row === 'number') ? e.row : null;
                        return true;
                    }
                }
            } catch (err) { }
            lastClickedRegion = 'left';
            syncLeftKeyboardRegion('left');
            lastClickedNumber = null;
            currentPhaseNumber = null;
            currentPhaseRow = null;
            return false;
        }

        // Clear/restore toggle state for Reset / 'q' behavior
        let clearedSelectionBackup = null;
        let clearedPickOrderBackup = null;
        let clearedFocusBackup = null;
        let clearedPairNeonObserveNumBackup = null;
        let clearedPairNeonObserveContextBeyondLonePairBackup = null;
        let selectionCleared = false;

        // quick-undo state for applyPair / quick clear
        let undoPrevSelected = null;
        let undoPrevPickOrder = null;
        let undoPrevSimulated = null;
        let undoEnabled = false;
        let undoWasCleared = false;

        /** Mỗi cặp (a,b): tập số mà lần bật pair đó *mới thêm* vào selection (không gồm số đã khoanh trước đó). Toggle tắt pair chỉ gỡ các số trong tập này. */
        let pairContributionByPairKey = new Map();

        function pairContributionKey(a, b) {
            const x = Math.min(a, b);
            const y = Math.max(a, b);
            return x + ',' + y;
        }

        function clearPairContributionTracking() {
            try { pairContributionByPairKey.clear(); } catch (e) { }
        }

        function removePairContributionForToggleOff(a, b) {
            if (submitActive) return;
            const key = pairContributionKey(a, b);
            const contrib = pairContributionByPairKey.get(key);
            if (contrib && contrib.size) {
                Array.from(contrib).forEach(function (n) {
                    try {
                        if (selected.has(n)) {
                            toggleNumber(n);
                        }
                    } catch (e) { }
                });
            }
            pairContributionByPairKey.delete(key);
        }

        // Helper: detect pair-mode and extract pair count (e.g., 'pair3' -> 3)
        function isPairMode(mode) { return typeof mode === 'string' && mode.startsWith('pair'); }
        function pairModeCount(mode) { if (!isPairMode(mode)) return 0; const v = parseInt(mode.slice(4), 10); return isNaN(v) ? 0 : v; }
        function hasCurrentLine11Result() {
            if (!raw || !Array.isArray(raw.lines) || raw.lines.length < 11) return false;
            var eleventh = raw.lines[10] || {};
            var ansLine = String(eleventh.result || '').split('|')[0].trim();
            return ansLine.length > 0;
        }

        function getAnswerNumsFromCurrentLine11() {
            if (!hasCurrentLine11Result()) return [];
            var eleventh = raw.lines[10] || {};
            var ansLine = String(eleventh.result || '').split('|')[0].trim();
            return ansLine.split(',').map(function (x) { return parseInt(x, 10); }).filter(function (n) { return !isNaN(n); });
        }

        function getAnswerNumsForAutoring() {
            return getAnswerNumsFromCurrentLine11();
        }

        function clampSubmitAutoCircleCustomX(v) {
            const n = parseInt(v, 10);
            if (isNaN(n)) return 15;
            if (n < 1) return 1;
            if (n > 35) return 35;
            return n;
        }

        function clearAutoRingSelectionVisuals() {
            autoRingPicked.clear();
            if (!submitActive) {
                selected.clear();
                clearPairContributionTracking();
                transientSelected.clear();
                simulatedSelected.clear();
                pickOrder = [];
                pairNeonObserveNum = null;
                resetPairNeonObserveContextBeyondLonePair();
                currentPairIndex = -1;
                currentTailIndex = -1;
                selectionCleared = false;
                recomputePairsFromSelected();
                updateBlocked();
                try { updatePairList(); } catch (e) { }
                try { refreshPairTailSelectionState(); } catch (e) { }
                try { applySelectionAndBlockedInDOM(); } catch (e) { }
                try { updateFocusIndicator(); } catch (e) { }
            } else {
                try { applySubmitState(); } catch (e) { }
            }
        }

        function getSubmitAutoCircleSet() {
            const out = new Set();
            if (!submitAutoCircleEnabled || !raw || !raw.freq) {
                return out;
            }
            if (submitAutoCircleMode === 'custom') {
                const x = clampSubmitAutoCircleCustomX(submitAutoCircleCustomX);
                out.add(x);
                return out;
            }
            var ansSrc = getAnswerNumsForAutoring();
            if (!ansSrc.length) {
                return out;
            }

            const candidates = ansSrc
                .map(function (n) { return parseInt(n, 10); })
                .filter(function (n) { return !isNaN(n); })
                .map(function (n) { return { num: n, freq: parseInt(raw.freq[n], 10) || 0 }; });

            if (candidates.length === 0) {
                return out;
            }

            if (submitAutoCircleMode === 'min') {
                candidates.forEach(function (item) {
                    if (item.freq === 1) out.add(item.num);
                });
                return out;
            }

            let maxFreq = -Infinity;
            candidates.forEach(function (item) {
                if (item.freq > maxFreq) maxFreq = item.freq;
            });
            candidates.forEach(function (item) {
                if (item.freq === maxFreq) out.add(item.num);
            });
            return out;
        }

        /** Numbers currently circled/selected on the left pane (max 5). */
        function getLeftPaneCircledNums() {
            const nums = [];
            const effective = new Set();
            if (submitActive) {
                simulatedSelected.forEach(function (n) { effective.add(n); });
            } else {
                selected.forEach(function (n) { effective.add(n); });
                simulatedSelected.forEach(function (n) { effective.add(n); });
            }
            if (pickOrder && pickOrder.length) {
                pickOrder.forEach(function (n) {
                    if (!isNaN(n) && effective.has(n) && nums.indexOf(n) === -1) {
                        nums.push(n);
                    }
                });
            }
            Array.from(effective).sort(function (a, b) { return a - b; }).forEach(function (n) {
                if (nums.indexOf(n) === -1) {
                    nums.push(n);
                }
            });
            return nums.slice(0, MAX_PICK_NUMBERS);
        }

        function notifyParentLeftCircledNums() {
            try {
                window.parent.postMessage({
                    type: 'leftCircledNumsReady',
                    nums: getLeftPaneCircledNums()
                }, '*');
            } catch (e) { }
        }

        /**
         * Sau khi tắt Submit và khôi phục khoanh thủ công (không qua applyAutoRingSelection):
         * bật lại số quan sát neon từ selection hiện tại (freq>=2, có ít nhất một pair neon; ưu tiên tần suất cao).
         */
        function assignPairNeonObserveNumFromCurrentSelected() {
            if (submitActive || !raw || !raw.freq) {
                return;
            }
            const relaxedHint = isPairSelectionOnlyLoneAppliedPairWithoutExtraCircles();
            pairNeonObserveNum = null;
            var list = [];
