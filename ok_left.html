                const parts = s.split(/[\s,;]+/).filter(x => x.length > 0);
                const input_nums = parts.map(x => parseInt(x, 10)).filter(n => !isNaN(n));
                if (input_nums.length !== 5) return "<span style='color:red;'>❌ Vui lòng nhập đúng 5 số.</span>";
                const input_norm = input_nums.join(',');
                const id_to_result = data.id_to_result || {};
                const pair_to_ids = data.pair_to_ids || {};
                let match_ids = [];
                for (const k in id_to_result) { if (id_to_result[k] === input_norm) { const v = parseInt(k, 10); if (!isNaN(v)) match_ids.push(v); } }
                match_ids.sort((a, b) => a - b);
                let maxId = data.max_id;
                if (!maxId) {
                    const ids = Object.keys(id_to_result).map(x => parseInt(x, 10)).filter(n => !isNaN(n));
                    if (ids.length) maxId = Math.max(...ids);
                }
                let current_id = null;
                for (let i = match_ids.length - 1; i >= 0; --i) { const mid = match_ids[i]; if (maxId != null && mid + 10 <= maxId) { current_id = mid; break; } }
                if (current_id === null && match_ids.length) current_id = match_ids[match_ids.length - 1];
                if (current_id === null) current_id = (maxId || 0);
                const pairs = [];
                for (let i = 0; i < input_nums.length; i++) { for (let j = i + 1; j < input_nums.length; j++) { const a = Math.min(input_nums[i], input_nums[j]); const b = Math.max(input_nums[i], input_nums[j]); pairs.push([a, b]); } }
                const rows = [];
                pairs.forEach(p => {
                    const a = p[0], b = p[1];
                    const key = `${a},${b}`;
                    const rawEntries = pair_to_ids[key] || {};
                    const entries = [];
                    for (const idStr in rawEntries) { const dists = rawEntries[idStr]; const dist = (Array.isArray(dists) && dists.length) ? Math.min(...dists) : null; entries.push({ id: idStr, dist: dist }); }

                if (!submitActive || !raw) return;

                    debugLog('syncSubmitStateForNewData: derived from answer row', derivedAnswers);
                }

                // Fallbacks must be derived from the NEW data, not previous submit cache.
                if (!derivedAnswers || derivedAnswers.length < 5) {
                    if (pickOrder && pickOrder.length >= 5) {
                        derivedAnswers = pickOrder.slice(-5);
                        debugLog('syncSubmitStateForNewData: fallback to pickOrder', derivedAnswers);
                    } else if (raw && Array.isArray(raw.firstNums) && raw.firstNums.length >= 5) {
                        derivedAnswers = raw.firstNums.slice(0, 5);

                    } else if (raw && raw.freq) {
                        var entries = Object.entries(raw.freq || {});
                        entries.sort(function (a, b) {
                            if (b[1] !== a[1]) return b[1] - a[1];
                            return parseInt(a[0], 10) - parseInt(b[0], 10);
                        });
                        derivedAnswers = entries.slice(0, 5).map(function (e) { return parseInt(e[0], 10); });
                        debugLog('syncSubmitStateForNewData: fallback to freq top', derivedAnswers);
                    } else {
                        derivedAnswers = [];

                    }

                answerNums = derivedAnswers;

                (answerNums || []).forEach(function (n) { simulatedSelected.add(n); });

                if (!preSubmitSelected || preSubmitSelected.size === 0) {
                    snapshotPreSubmitPickState();

                        let exp = 1;
                        if (supStr.length) {
                            let digits = '';
                            for (const ch of supStr) digits += (supMap[ch] || '');
                            if (digits.length) {
                                const v = parseInt(digits, 10);
                                if (!isNaN(v)) exp = v;
                            }
                        }
                        let j = null;
                        if (idToIndex.hasOwnProperty(refId)) { j = idToIndex[refId]; if (j >= 0 && j < displayLines.length) highlightRefs11[j] = Math.max(highlightRefs11[j], exp); }
                        else if (baseFound) { j = baseIndex + Math.round((refId - baseId) / inferredStep); if (j >= 0 && j < displayLines.length) highlightRefs11[j] = Math.max(highlightRefs11[j], exp); }
                    }
                }
            }
            return highlightRefs11;
        }

        // Helper: compute base reference exponents from the 10 displayed rows (same as renderTable2)
        function computeHighlightRefs(displayLines) {
            const idToIndex = {};
            let baseFound = false, baseId = null, baseIndex = null;
            displayLines.forEach(function (lineObj, idx) {
                const noteText = (lineObj && lineObj.note) ? String(lineObj.note) : '';
                const idMatch = noteText.match(/([0-9]+)\s*-/);
                if (idMatch) {
                    const idNum = parseInt(idMatch[1], 10);
                    if (!isNaN(idNum)) {
                        idToIndex[idNum] = idx;
                        if (!baseFound) { baseFound = true; baseId = idNum; baseIndex = idx; }
                    }
                }
            });

            let inferredStep = null;
            if (baseFound) {
                for (const k in idToIndex) {
                    const idNum = parseInt(k, 10);
                    const idx = idToIndex[k];
                    if (idNum === baseId) continue;
                    const deltaId = idNum - baseId;
                    const deltaIdx = idx - baseIndex;
                    if (deltaIdx !== 0) {
                        const step = Math.round(deltaId / deltaIdx);
                        if (step !== 0) { inferredStep = step; break; }
                    }
                }
            }
            if (inferredStep === null) inferredStep = -1;

            const highlightRefs = new Array(displayLines.length).fill(0);
            const supMap = { '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '⁰': '0' };
            displayLines.forEach(function (lineObj) {
                if (!lineObj || !lineObj.note) return;
                const noteText = String(lineObj.note || '');
                const reRef = /([0-9]+)-([0-9]+)([¹²³⁴⁵⁶⁷⁸⁹⁰]*)/g;
                let m;
                while ((m = reRef.exec(noteText)) !== null) {
                    const refId = parseInt(m[2], 10);
                    const supStr = m[3] || '';
                    let exp = 1;
                    if (supStr.length) {
                        let digits = '';
                        for (const ch of supStr) digits += (supMap[ch] || '');
                        if (digits.length) {
                            const v = parseInt(digits, 10);
                            if (!isNaN(v)) exp = v;
                        }
                    }
                    let j = null;
                    if (Object.prototype.hasOwnProperty.call(idToIndex, refId)) {
                        j = idToIndex[refId];
                        highlightRefs[j] = Math.max(highlightRefs[j], exp);
                    } else if (baseFound) {
                        j = baseIndex + Math.round((refId - baseId) / inferredStep);
                        if (j >= 0 && j < displayLines.length) highlightRefs[j] = Math.max(highlightRefs[j], exp);
                    }
                }
            });
            return highlightRefs;
        }

                            if (hasInlineOnclick(el)) return;
                            ev.stopPropagation();
                            var n = parseInt(el.getAttribute('data-num'), 10);
                            if (isNaN(n)) return;
                            if (submitActive || isBlocked(n)) return;
                            try {
                                var tr = findClosestCell(el, 'tr.chuoi-main-row');
                                if (!tr) {
                                    var trPattern = findClosestCell(el, 'tr.chuoi-pattern-row');
                                    if (trPattern) tr = trPattern.previousElementSibling;
                                }
                                var rowIndex = null;
                                if (tr) {
                                    var mains = Array.from(rightRoot.querySelectorAll('tr.chuoi-main-row'));
                                    rowIndex = mains.indexOf(tr);
                                }
                                lastClickedRegion = 'right';
                                syncLeftKeyboardRegion('right');
                                lastClickedNumber = n;
                                currentPhaseNumber = n;
                                if (rowIndex != null && rowIndex >= 0) { lastClickedRow = rowIndex; currentPhaseRow = rowIndex; }
                            } catch (e2) { }
                            toggleNumber(n);
                        } catch (e) { }
                    });
                }
            } catch (e) { }
        })();

        (function initLeftPanePosnfreqHex() {
            var hex = document.getElementById('leftPosnfreqHexBtn');
            if (!hex || hex.dataset.posnfreqPaneWired === '1') {
                return;
            }
            hex.dataset.posnfreqPaneWired = '1';

            hex.addEventListener('dragstart', function (e) {
                e.preventDefault();
            });

            var dragging = false;
            var downX = 0;
            var downY = 0;
            var dragGhostEl = null;
            var dragRaf = 0;
            var dragClientX = 0;
            var dragClientY = 0;
            var dragOffsetX = 0;
            var dragOffsetY = 0;

            function clearDragUi() {
                if (dragRaf) {
                    cancelAnimationFrame(dragRaf);
                    dragRaf = 0;
                }
                if (dragGhostEl) {
                    try {
                        dragGhostEl.remove();
                    } catch (eRm) { /* ignore */ }
                    dragGhostEl = null;
                }
                hex.classList.remove('is-posnfreq-drag-source');
            }

            function positionDragGhost() {
                if (!dragGhostEl) {
                    dragRaf = 0;
                    return;
                }
                var x = Math.round(dragClientX - dragOffsetX);
                var y = Math.round(dragClientY - dragOffsetY);
                dragGhostEl.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
                dragRaf = 0;
            }

            function onMouseMove(ev) {
                if (!dragging) {
                    return;
                }
                dragClientX = ev.clientX;
                dragClientY = ev.clientY;
                if (!dragGhostEl) {
                    return;
                }
                if (!dragRaf) {
                    dragRaf = requestAnimationFrame(positionDragGhost);
                }
            }

            function detachListeners() {
                document.removeEventListener('mousemove', onMouseMove, true);
                window.removeEventListener('mouseup', endMouse, true);
                window.removeEventListener('blur', endMouseBlur, true);
            }

            function endMouseBlur() {
                if (!dragging) {
                    return;
                }
                dragging = false;
                detachListeners();
                clearDragUi();
            }

            function endMouse(ev) {
                if (!dragging) {
                    return;
                }
                if (ev.type === 'mouseup' && ev.button != null && ev.button !== 0) {
                    return;
                }
                dragging = false;
                detachListeners();
                clearDragUi();
                if (hex.hidden) {
                    return;
                }
                var cx = ev && typeof ev.clientX === 'number' ? ev.clientX : downX;
                var cy = ev && typeof ev.clientY === 'number' ? ev.clientY : downY;
                var dist = Math.hypot(cx - downX, cy - downY);
                if (dist < 8) {
                    try {
                        window.parent.postMessage({ type: 'posnfreqLeftHexToggleStrict' }, '*');
                    } catch (eT) { /* ignore */ }
                } else {
                    var hit = document.elementFromPoint(cx, cy);
                    var cell = hit && hit.closest ? hit.closest('.cell.num[data-num]') : null;
                    if (cell) {
                        var n = parseInt(cell.getAttribute('data-num'), 10);
                        if (!isNaN(n) && n >= 1 && n <= 35) {
                            try {
                                hex.textContent = String(n);
                                hex.classList.remove('posnfreq-specimen-strict');
                            } catch (eUi) { /* ignore */ }
                            try {
                                window.parent.postMessage({ type: 'posnfreqLeftHexPickNum', num: n }, '*');
                            } catch (eP) { /* ignore */ }
                        }
                    }
                }
            }

            hex.addEventListener('mousedown', function (ev) {
                if (hex.hidden) {
                    return;
                }
                if (ev.button !== 0) {
                    return;
                }
                ev.preventDefault();
                ev.stopPropagation();
                if (dragging) {
                    return;
                }
                dragging = true;
                downX = ev.clientX;
                downY = ev.clientY;
                var br = hex.getBoundingClientRect();
                dragOffsetX = ev.clientX - br.left;
                dragOffsetY = ev.clientY - br.top;
                dragClientX = ev.clientX;
                dragClientY = ev.clientY;
                dragGhostEl = document.createElement('div');
                dragGhostEl.className = 'left-posnfreq-drag-ghost';
                dragGhostEl.style.width = Math.round(br.width) + 'px';
                dragGhostEl.style.height = Math.round(br.height) + 'px';
                var inner = document.createElement('div');
                inner.className = 'left-posnfreq-drag-ghost-inner';
                inner.textContent = String(hex.textContent || '').trim();
                if (hex.classList.contains('posnfreq-specimen-strict')) {
                    inner.classList.add('posnfreq-specimen-strict');
                }
                dragGhostEl.appendChild(inner);
                document.body.appendChild(dragGhostEl);
                hex.classList.add('is-posnfreq-drag-source');
                positionDragGhost();
                document.addEventListener('mousemove', onMouseMove, true);
                window.addEventListener('mouseup', endMouse, true);
                window.addEventListener('blur', endMouseBlur, true);
            });

            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'posnfreqLeftHexRequestSync' }, '*');
                }
            } catch (eReq) {
                /* ignore */
            }
        })();
    </script>
