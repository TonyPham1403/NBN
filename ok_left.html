            const display = raw.lines.slice(0, 10);
            const sets = display.map(l => new Set(getNumsFromLineObj(l)));
            const adjMap = {};
            for (let i = 0; i < sets.length - 1; i++) {
                const top = sets[i], bottom = sets[i + 1];
                top.forEach(a => { bottom.forEach(b => { if (a === b) return; const key = a + ',' + b; if (!adjMap[key]) adjMap[key] = []; adjMap[key].push(i); }); });
            }
            const tails = [];
            for (const key in adjMap) { const idxs = adjMap[key].slice().sort((a, b) => a - b); const parts = key.split(',').map(x => parseInt(x, 10)); const a = parts[0], b = parts[1]; let last = -3, count = 0; for (const ii of idxs) { if (ii > last + 1) { count++; last = ii; } } if (count >= 2) tails.push({ a: a, b: b, idxs: idxs, main: Math.min(...idxs), count: count }); }
            return tails.sort((x, y) => { const ix = x.idxs.length ? Math.min(...x.idxs) : Infinity; const iy = y.idxs.length ? Math.min(...y.idxs) : Infinity; if (ix !== iy) return ix - iy; if (x.a !== y.a) return x.a - y.a; return x.b - y.b; });
        }

        // Compute pairs according to user's rules (copied from ok.py)
        function computePairs() {
            if (!raw || !raw.lines || raw.lines.length < 10) return [];
            const display = raw.lines.slice(0, 10);
            const sets = display.map(l => new Set(getNumsFromLineObj(l)));
            const allNums = new Set();
            sets.forEach(s => s.forEach(n => allNums.add(n)));
            const nums = Array.from(allNums).sort((a, b) => a - b);
            const out = [];
            const adjPairs = [];
            for (let topIdx = 0; topIdx < sets.length - 1; topIdx++) adjPairs.push({ top: topIdx, bottom: topIdx + 1 });

            for (let i = 0; i < nums.length; i++) {
                for (let j = i + 1; j < nums.length; j++) {
                    const a = nums[i], b = nums[j];
                    const mains = [];
                    for (let idx = 0; idx < sets.length; idx++) { if (sets[idx].has(a) && sets[idx].has(b)) mains.push(idx); }
                    if (mains.length === 0) continue;
                    let allMainsOk = true;
                    for (const mainIdx of mains) {
                        let aboveFound = false;
                        for (const p of adjPairs) {
                            if (p.bottom < mainIdx) {
                                if ((sets[p.top].has(a) && sets[p.bottom].has(b)) || (sets[p.top].has(b) && sets[p.bottom].has(a))) {
                                    if (!((sets[p.top].has(a) && sets[p.top].has(b)) || (sets[p.bottom].has(a) && sets[p.bottom].has(b)))) {
                                        const allowAboveIfFreq2 = (raw && raw.freq && (
                                            (raw.freq[a] >= 2 && raw.freq[b] >= 2 && mainIdx === sets.length - 1) ||
                                            ((raw.freq[a] === 3 && raw.freq[b] === 2) || (raw.freq[a] === 2 && raw.freq[b] === 3))
                                        ));
                                        if (!allowAboveIfFreq2) { aboveFound = true; break; }
                                    }
                                }
                            }
                        }
                        if (aboveFound) { allMainsOk = false; break; }

                        let foundForThisMain = false;
                        for (const p of adjPairs) {
                            if (!(p.top > mainIdx && p.bottom > mainIdx)) continue;
                            if ((sets[p.top].has(a) && sets[p.bottom].has(b)) || (sets[p.top].has(b) && sets[p.bottom].has(a))) {
                                if ((sets[p.top].has(a) && sets[p.top].has(b)) || (sets[p.bottom].has(a) && sets[p.bottom].has(b))) continue;
                                foundForThisMain = true; break;
                            }
                        }
                        if (!foundForThisMain) {
                            const allowAboveIfFreq2 = (raw && raw.freq && (
                                (raw.freq[a] >= 2 && raw.freq[b] >= 2 && mainIdx === sets.length - 1) ||
                                ((raw.freq[a] === 3 && raw.freq[b] === 2) || (raw.freq[a] === 2 && raw.freq[b] === 3))
                            ));
                            if (allowAboveIfFreq2) {
                                for (const p of adjPairs) {
                                    if (!(p.bottom < mainIdx)) continue;
                                    if ((sets[p.top].has(a) && sets[p.bottom].has(b)) || (sets[p.top].has(b) && sets[p.bottom].has(a))) {
                                        if ((sets[p.top].has(a) && sets[p.top].has(b)) || (sets[p.bottom].has(a) && sets[p.bottom].has(b))) continue;
                                        foundForThisMain = true; break;
                                    }
                                }
                            }
                        }
                        if (!foundForThisMain) { allMainsOk = false; break; }
                    }
                    if (allMainsOk) out.push([a, b]);
                }
            }
            const seen = new Set(); const uniq = [];
            out.forEach(p => { const k = p[0] + ',' + p[1]; if (!seen.has(k)) { seen.add(k); uniq.push(p); } });
            return uniq;
        }

        /**
         * Trước khi áp dụng cặp (a,b): gỡ đóng góp của mọi cặp *khác* đã track.
         * — Click chuyển giữa các pair (và tail pair): thay thế, không chồng thêm.
         * — Số chỉ do khoanh bảng 1 / bảng 2 giữ nguyên (không nằm trong contrib cặp khác).
         */
        function removeOtherPairContributionsBeforeApply(a, b) {
            if (submitActive) {
                return;
            }
            if (!Number.isFinite(a) || !Number.isFinite(b)) {
                return;
            }
            const selfKey = pairContributionKey(a, b);
            const keys = Array.from(pairContributionByPairKey.keys());
            for (let ki = 0; ki < keys.length; ki++) {
                const key = keys[ki];
                if (!key || key === selfKey) {
                    continue;
                }
                const parts = String(key).split(',');
                const pa = parseInt(parts[0], 10);
                const pb = parseInt(parts[1], 10);
                if (!Number.isFinite(pa) || !Number.isFinite(pb)) {
                    continue;
                }
                removePairContributionForToggleOff(pa, pb);
            }
        }

        /**
         * Sau Submit OFF map pair rỗng: selection có thể vẫn là {x,y} khớp một cặp trong danh sách
         * nhưng không còn track contribution — applyPair(a,b) mới chỉ tryAdd nên chân cũ không bị gỡ.
         * Khi selected đúng 2 số và trùng một cặp khác (a,b), gỡ mọi đầu của cặp đó không thuộc cặp đang áp.
         */
        function pruneSelectedLegsReplacedByApplyPair(a, b) {
            if (submitActive || !Number.isFinite(a) || !Number.isFinite(b) || !selected) {
                return;
            }
            const newEnds = new Set([a, b]);
            const pairs = currentPairs;
            if (!pairs || !pairs.length || selected.size !== 2) {
                return;
            }
            for (let i = 0; i < pairs.length; i++) {
                const p = pairs[i];
                if (!p || p.length < 2) {
                    continue;
                }
                const x = p[0];
                const y = p[1];
                if (x === a && y === b) {
                    continue;
                }
                if (!selected.has(x) || !selected.has(y)) {
                    continue;
                }
                const strip = function (n) {
                    if (newEnds.has(n)) {
                        return;
                    }
                    try {
                        selected.delete(n);
                    } catch (e0) { /* ignore */ }
                    try {
                        if (pickOrder && pickOrder.length) {
                            let idx;
                            while ((idx = pickOrder.indexOf(n)) !== -1) {
                                pickOrder.splice(idx, 1);
                            }
                        }
                    } catch (e1) { /* ignore */ }
                    try { transientSelected.delete(n); } catch (e2) { /* ignore */ }
                    try { simulatedSelected.delete(n); } catch (e3) { /* ignore */ }
                };
                strip(x);
                strip(y);
                return;
            }
        }

        function applyPair(a, b, opts) {
            if (!raw || submitActive) {
                return false;
            }
            if (selectionCleared) {
                selectionCleared = false;
                clearedSelectionBackup = null;
                clearedPickOrderBackup = null;
                clearedFocusBackup = null;
                clearedPairNeonObserveNumBackup = null;
                clearedPairNeonObserveContextBeyondLonePairBackup = null;
            }
            try {
                removeOtherPairContributionsBeforeApply(a, b);
            } catch (eRem) { /* ignore */ }
            try {
                pruneSelectedLegsReplacedByApplyPair(a, b);
            } catch (ePrune) { /* ignore */ }
            const beforeCap = new Set(selected);
            const addsNeeded = [];
            try {
                for (let ci = 0; ci < 2; ci++) {
                    const nn = ci === 0 ? a : b;
                    if (isNaN(nn)) {
                        continue;
                    }
                    try { if (isBlocked(nn)) continue; } catch (e) { }
                    if (!beforeCap.has(nn)) {
                        addsNeeded.push(nn);
                    }
                }
            } catch (e) { }
            if (beforeCap.size + addsNeeded.length > MAX_PICK_NUMBERS) {
                return false;
            }
            transientSelected.clear();

            /** Giữ số quan sát đã có khi chỉ đổi cặp áp dụng (A/D hoặc click cặp khác): hint có thể nhấp nháy false giữa các bước. */
            const priorPairNeonObserveNum = pairNeonObserveNum;

            const key = pairContributionKey(a, b);
            const beforeSel = new Set(selected);
            const beforeOrder = pickOrder ? pickOrder.slice() : [];

            undoPrevSelected = new Set(beforeSel);
            undoPrevPickOrder = beforeOrder;
            undoPrevSimulated = new Set(simulatedSelected);
            undoEnabled = true;
            undoWasCleared = false;

            let contrib = new Set(pairContributionByPairKey.get(key) || []);

            const tryAdd = function (n) {
                if (isNaN(n)) return;
                try { if (isBlocked(n)) return; } catch (e) { }
                if (beforeSel.has(n)) {
                    return;
                }
                if (selected.size >= MAX_PICK_NUMBERS) {
                    return;
                }
                selected.add(n);
                contrib.add(n);
                if (!pickOrder) pickOrder = [];
                if (pickOrder.indexOf(n) === -1) {
                    if (pickOrder.length >= MAX_PICK_NUMBERS) {
                        try { pickOrder.shift(); } catch (e) { }
                    }
                    pickOrder.push(n);
                }
                try {
                    if (!submitActive && raw && raw.freq) {
                        const fPick = parseInt(raw.freq[n], 10) || 0;
                        if (fPick >= 2 && pairNeonObserveNum === null && pairObserveNumWouldShowAnyNeonHint(n) &&
                            !isPairSelectionOnlyLoneAppliedPairWithoutExtraCircles()) {
                            pairNeonObserveNum = n;
                        }
                    }
                } catch (e) { }
            };
            tryAdd(a);
            tryAdd(b);
            pairContributionByPairKey.set(key, contrib);

            if (!submitActive && raw && raw.freq && pairNeonObserveNum != null) {
                try {
                    if (!selected.has(pairNeonObserveNum) ||
                        (parseInt(raw.freq[pairNeonObserveNum], 10) || 0) < 2) {
                        pairNeonObserveNum = null;
                    }
                } catch (e) {
                    pairNeonObserveNum = null;
                }
            }
            currentPhaseNumber = b;
            currentPhaseRow = null;
            try { pushPhaseHistory('pairAction', b, null); } catch (e) { }
            currentPairIndex = -1;
            if (currentPairs && currentPairs.length) {
                for (let i = 0; i < currentPairs.length; i++) {
                    const p = currentPairs[i];
                    if (p && p[0] === a && p[1] === b) {
                        currentPairIndex = i;
                        break;
                    }
                }
            }
            recomputePairsFromSelected();
            updateBlocked();
            if (opts && opts.fullRender) {
                updateRender();
            } else {
                updateRenderLightweight();
            }
            if (!submitActive && raw && raw.freq && priorPairNeonObserveNum != null) {
                try {
                    if (selected.has(priorPairNeonObserveNum)) {
                        const foPr = parseInt(raw.freq[priorPairNeonObserveNum], 10) || 0;
                        if (foPr >= 2 && pairObserveNumWouldShowAnyNeonHint(priorPairNeonObserveNum, true)) {
                            pairNeonObserveNum = priorPairNeonObserveNum;
                        }
                    }
                } catch (ePr) { /* ignore */ }
            }
            try {
                notePairNeonObserveContextFromEffectiveSize();
            } catch (eNote) { /* ignore */ }
            if (!submitActive && raw && raw.freq && isLoneAppliedPairOnlyGeometry() && !pairNeonObserveContextBeyondLonePair) {
                if (pairNeonObserveNum != null &&
                    !pairObserveNumWouldShowAnyNeonHint(pairNeonObserveNum, true)) {
                    pairNeonObserveNum = null;
                }
            }
            try {
                requestAnimationFrame(function () {
                    try { updatePairListNeonHints(); } catch (e2) { }
                });
            } catch (e) { }
            try { persistSelectionMemoryForFocus(); } catch (e) { }
            try { notifyParentLeftCircledNums(); } catch (e) { }
            return true;
        }

        function applyPairByIndex(idx, opts) {
            if (!currentPairs || idx < 0 || idx >= currentPairs.length) {
                return false;
            }
            const p = currentPairs[idx];
            if (!p) {
                return false;
            }
            if (!applyPair(p[0], p[1], opts)) {
                return false;
            }
            currentPairIndex = idx;
            if (!(opts && opts.skipFocus)) {
                setTimeout(() => {
                    const btn = document.querySelector('.pair-btn[data-idx="' + idx + '"]');
                    if (btn) btn.focus();
                    try {
                        requestAnimationFrame(() => {
                            syncPairNeonHintAnimations();
                            requestAnimationFrame(() => { syncPairNeonHintAnimations(); });
                        });
                    } catch (e) { }
                }, 40);
            }
            return true;
        }

        /**
         * A/D trên danh sách pair: chuyển cặp đang áp dụng sang cặp trước/sau (cùng logic click cặp khác —
         * removeOtherPairContributions + applyPair). applyPair đã khôi phục số quan sát nếu vẫn khoanh và freq>=2;
         * khối dưới là lớp dự phòng sau applyPairByIndex.
         */
        function navigatePairListByDirReplacePair(dir) {
            if (!raw || submitActive || !currentPairs || !currentPairs.length) {
                return false;
            }
            const n = currentPairs.length;
            if (!Number.isFinite(dir) || dir === 0) {
                return false;
            }
            let start = -1;
            if (currentPairIndex >= 0 && currentPairIndex < n) {
                const p0 = currentPairs[currentPairIndex];
                if (p0 && selected.has(p0[0]) && selected.has(p0[1])) {
                    start = currentPairIndex;
                }
            }
            if (start < 0) {
                for (let i = 0; i < n; i++) {
                    const p = currentPairs[i];
                    if (p && selected.has(p[0]) && selected.has(p[1])) {
                        start = i;
                        break;
                    }
                }
            }
            const targetIdx = (start < 0)
                ? ((dir > 0) ? 0 : (n - 1))
                : (((start + dir) % n) + n) % n;
            const savedObserve = pairNeonObserveNum;
            if (!applyPairByIndex(targetIdx, {})) {
                return false;
            }
            try {
                if (savedObserve != null && !isNaN(savedObserve) && selected.has(savedObserve) && raw && raw.freq &&
                    !isPairSelectionOnlyLoneAppliedPairWithoutExtraCircles()) {
                    const fo = parseInt(raw.freq[savedObserve], 10) || 0;
                    if (fo >= 2) {
                        pairNeonObserveNum = savedObserve;
                    }
                }
            } catch (eOb) { /* ignore */ }
            try {
                requestAnimationFrame(function () {
                    try { updatePairListNeonHints(); } catch (eH) { }
                });
            } catch (eRaf) { }
            return true;
        }

        function applyTailByIndex(idx, opts) {
            if (!currentTails || idx < 0 || idx >= currentTails.length) return;
            const t = currentTails[idx];
            if (!t) return;
            if (!applyPair(t.a, t.b, opts)) {
                return;
            }
            currentTailIndex = idx;
            if (!(opts && opts.skipFocus)) {
                setTimeout(() => { const btn = document.querySelector('.tail-btn[data-tail-idx="' + idx + '"]'); if (btn) btn.focus(); }, 40);
            }
        }

        /**
         * A/D trên vùng tailList: chỉ chuyển focus giữa các nút tail, không gọi applyPair.
         */
        function focusNavigateTailListByDir(dir) {
            const tailList = document.getElementById('tailList');
            if (!tailList || !currentTails || currentTails.length === 0) {
                return false;
            }
            const candidates = Array.from(tailList.querySelectorAll('.pair-btn'));
            if (!candidates.length) {
                return false;
            }
            const focusedTailBtn = document.activeElement && document.activeElement.closest
                ? document.activeElement.closest('#tailList .pair-btn')
                : null;
            let i = focusedTailBtn ? candidates.findIndex((b) => b === focusedTailBtn) : -1;
            if (i === -1) {
                const curBtn = (currentTailIndex >= 0)
                    ? tailList.querySelector('.tail-btn[data-tail-idx="' + currentTailIndex + '"]')
                    : null;
                i = curBtn ? candidates.indexOf(curBtn) : -1;
            }
            let j;
            if (i === -1) {
                j = (dir > 0) ? 0 : (candidates.length - 1);
            } else {
                j = (i + dir + candidates.length) % candidates.length;
            }
            const target = candidates[j];
            if (!target) {
                return false;
            }
            const idx = parseInt(target.getAttribute('data-tail-idx'), 10);
            if (!Number.isFinite(idx)) {
                return false;
            }
            try {
                lastClickedRegion = 'tailList';
                const b = parseInt(target.getAttribute('data-b'), 10);
                if (Number.isFinite(b)) {
                    lastClickedNumber = b;
                }
            } catch (e) { }
            currentTailIndex = idx;
            try {
                target.focus();
            } catch (e2) { }
            return true;
        }

        /** Nền pair-selected (#2e7d32): khi đã có ít nhất một cặp track trong map, chỉ nút có key đó; map rỗng thì mọi cặp đủ 2 số trong tập hiệu lực vẫn xanh (khoanh tay chưa qua pair). */
        function pairTailButtonShouldShowPairSelected(a, b, effective) {
            if (!effective) {
                return false;
            }
            if (!Number.isFinite(a) || !Number.isFinite(b) || !effective.has(a) || !effective.has(b)) {
                return false;
            }
            if (submitActive) {
                return true;
            }
            try {
                if (pairContributionByPairKey && pairContributionByPairKey.size > 0) {
                    return pairContributionByPairKey.has(pairContributionKey(a, b));
                }
            } catch (e) { /* ignore */ }
            return true;
        }

        function updatePairButtonsSelection(effective) {
            const el = document.getElementById('pairList');
            if (!el) {
                return;
            }
            const btns = Array.from(el.querySelectorAll('.pair-btn'));
            btns.forEach(function (btn) {
                const a = parseInt(btn.getAttribute('data-a'), 10);
                const b = parseInt(btn.getAttribute('data-b'), 10);
                if (pairTailButtonShouldShowPairSelected(a, b, effective)) {
                    btn.classList.add('pair-selected');
                } else {
                    btn.classList.remove('pair-selected');
                }
            });
        }

        /** Có đủ dòng chuỗi để hiển thị pair — viền neon chỉ phụ thuộc dữ liệu, không phụ thuộc disableSubmit. */
        function hasLeftPaneRecordForPairNeon() {
            return !!(raw && Array.isArray(raw.lines) && raw.lines.length >= 10);
        }

        /** Tập hiệu lực cho neon pair — giống updatePairListNeonHints. */
        function getEffectiveSelectionSetForPairNeon() {
            const effective = new Set();
            if (submitActive) {
                simulatedSelected.forEach((n) => effective.add(n));
            } else {
                selected.forEach((n) => effective.add(n));
                simulatedSelected.forEach((n) => effective.add(n));
                transientSelected.forEach((n) => effective.add(n));
            }
            return effective;
        }

        function notePairNeonObserveContextFromEffectiveSize() {
            if (submitActive) {
                return;
            }
            try {
                const eff = getEffectiveSelectionSetForPairNeon();
                if (eff && eff.size > 2) {
                    pairNeonObserveContextBeyondLonePair = true;
                }
            } catch (e0) { /* ignore */ }
        }

        function resetPairNeonObserveContextBeyondLonePair() {
            pairNeonObserveContextBeyondLonePair = false;
        }

        /**
         * Hình học: đúng 1 cặp track, tập hiệu lực = đúng 2 đầu (không số thừa / transient).
         */
        function isLoneAppliedPairOnlyGeometry() {
            if (submitActive) {
                return false;
            }
            let eff;
            try {
                eff = getEffectiveSelectionSetForPairNeon();
            } catch (e0) {
                return false;
            }
            if (!eff || eff.size !== 2) {
                return false;
            }
            if (!pairContributionByPairKey || pairContributionByPairKey.size !== 1) {
                return false;
            }
            let onlyKey = null;
            try {
                onlyKey = Array.from(pairContributionByPairKey.keys())[0];
            } catch (e1) {
                return false;
            }
            if (onlyKey == null || onlyKey === '') {
                return false;
            }
            const parts = String(onlyKey).split(',');
            const pa = parseInt(parts[0], 10);
            const pb = parseInt(parts[1], 10);
            if (!Number.isFinite(pa) || !Number.isFinite(pb)) {
                return false;
            }
            return eff.has(pa) && eff.has(pb);
        }

        /**
         * Số quan sát đã thực sự xác định trong phiên: từng có >2 số hiệu lực, và số quan sát vẫn khoanh freq>=2.
         * (Chỉ click một cặp từ đầu → không bao giờ true — không neon pair.)
         */
        function hasCommittedPairNeonObservationNumber() {
            if (!pairNeonObserveContextBeyondLonePair) {
                return false;
            }
            if (submitActive || !raw || !raw.freq || pairNeonObserveNum == null) {
                return false;
            }
            const n = pairNeonObserveNum;
            if (typeof n !== 'number' || !Number.isFinite(n) || !selected.has(n)) {
                return false;
            }
            if ((parseInt(raw.freq[n], 10) || 0) < 2) {
                return false;
            }
            return true;
        }

        /**
         * Lone mơ hồ: hình học lone VÀ chưa có ngữ cảnh xác định số quan sát (hasCommittedPairNeonObservationNumber).
         */
        function isPairSelectionOnlyLoneAppliedPairWithoutExtraCircles() {
            return isLoneAppliedPairOnlyGeometry() && !hasCommittedPairNeonObservationNumber();
        }

        function isNumClaimedForPairNeon(n, claimed, observed, effective) {
            if (observed !== null && n === observed && effective.has(n)) {
                return false;
            }
            return claimed.has(n);
        }

        /**
         * Số `observed` chỉ là số quan sát nếu có ít nhất một nút cặp được phép gắn pair-neon-hint:
         * tồn tại cặp chứa observed, observed trong tập hiệu lực, và không phải cả hai đầu cặp đều đã khoanh.
         * (freq>=2 một mình không đủ nếu mọi cặp liên quan đều đã đủ khoanh → không neon.)
         * @param {boolean} [ignoreLoneAmbiguous] — true: bỏ chặn lone mơ hồ (dùng khi đã có số quan sát, tránh tắt neon sau click pair đầu).
         */
        function pairObserveNumWouldShowAnyNeonHint(observed, ignoreLoneAmbiguous) {
            if (submitActive || observed == null || typeof observed !== 'number' || !Number.isFinite(observed)) {
                return false;
            }
            if (!ignoreLoneAmbiguous && isPairSelectionOnlyLoneAppliedPairWithoutExtraCircles()) {
                return false;
            }
            if (!hasLeftPaneRecordForPairNeon() || !raw) {
                return false;
            }
            const effective = getEffectiveSelectionSetForPairNeon();
            if (!effective.has(observed)) {
                return false;
            }
            const pairs = computePairs();
            if (!pairs || !pairs.length) {
                return false;
            }
            const claimed = new Set();
            for (let i = 0; i < pairs.length; i++) {
                const p = pairs[i];
                if (!p || p.length < 2) {
                    continue;
                }
                const a = p[0];
                const b = p[1];
                if (Number.isFinite(a) && Number.isFinite(b) && effective.has(a) && effective.has(b)) {
                    claimed.add(a);
                    claimed.add(b);
                }
            }
            for (let i = 0; i < pairs.length; i++) {
                const p = pairs[i];
                if (!p || p.length < 2) {
                    continue;
                }
                const a = p[0];
                const b = p[1];
                if (!Number.isFinite(a) || !Number.isFinite(b)) {
                    continue;
                }
                if (effective.has(a) && effective.has(b)) {
                    continue;
                }
                const hitA = observed !== null && effective.has(a) && a === observed && !isNumClaimedForPairNeon(a, claimed, observed, effective);
                const hitB = observed !== null && effective.has(b) && b === observed && !isNumClaimedForPairNeon(b, claimed, observed, effective);
                if (hitA || hitB) {
                    return true;
                }
            }
            return false;
        }

        /** Số quan sát cho neon: một khi đã gán thì giữ đến khi bỏ khoanh hoặc freq<2 (không đổi theo hint/pair khác); chưa có thì gán tự động như assignPairNeonObserveNumFromCurrentSelected. */
        function getPairNeonObservationNumber() {
            if (!raw || !raw.freq || submitActive) {
                return null;
            }
            try {
                /* Lone mơ hồ: vẫn trả về số quan sát nếu còn ít nhất một cặp neon (tránh mất neon ngay cú click pair đầu). */
                if (isPairSelectionOnlyLoneAppliedPairWithoutExtraCircles()) {
                    if (pairNeonObserveNum != null && selected.has(pairNeonObserveNum)) {
                        const foLo = parseInt(raw.freq[pairNeonObserveNum], 10) || 0;
                        if (foLo >= 2 && pairObserveNumWouldShowAnyNeonHint(pairNeonObserveNum, true)) {
                            return pairNeonObserveNum;
                        }
                    }
                    return null;
                }
                if (pairNeonObserveNum != null) {
                    if (!selected.has(pairNeonObserveNum)) {
                        pairNeonObserveNum = null;
                    } else {
                        const fo = parseInt(raw.freq[pairNeonObserveNum], 10) || 0;
                        if (fo < 2) {
                            pairNeonObserveNum = null;
                        }
                    }
                }
                if (pairNeonObserveNum == null) {
                    assignPairNeonObserveNumFromCurrentSelected();
                }
                if (pairNeonObserveNum == null) {
                    return null;
                }
                return pairNeonObserveNum;
            } catch (e) {
                pairNeonObserveNum = null;
                return null;
            }
        }

        /**
         * Sau W/A/S/D trên bảng: nếu đã có số quan sát (còn khoanh, freq>=2) thì giữ — không ghi đè theo phase/hint.
         * Chưa có thì thử gán từ currentPhaseNumber khi hợp lệ (freq>=2, có neon pair theo hint).
         */
        function syncPairNeonObserveNumFromPhaseAfterWasd() {
            if (submitActive || !raw || !raw.freq) {
                return;
            }
            try {
                if (isPairSelectionOnlyLoneAppliedPairWithoutExtraCircles()) {
                    return;
                }
                if (pairNeonObserveNum != null) {
                    if (selected.has(pairNeonObserveNum)) {
                        const fo = parseInt(raw.freq[pairNeonObserveNum], 10) || 0;
                        if (fo >= 2) {
                            return;
                        }
                    }
                    pairNeonObserveNum = null;
                }
                if (currentPhaseNumber != null && selected.has(currentPhaseNumber)) {
                    const f = parseInt(raw.freq[currentPhaseNumber], 10) || 0;
                    if (f >= 2 && pairObserveNumWouldShowAnyNeonHint(currentPhaseNumber)) {
                        pairNeonObserveNum = currentPhaseNumber;
                    } else {
                        pairNeonObserveNum = null;
                    }
                }
            } catch (e) { }
        }

        /** Chu kỳ animation neon pair (khớp CSS) — dùng để animation-delay âm, mọi nút cùng pha. */
        const PAIR_NEON_BORDER_PERIOD_S = 1.25;
        const PAIR_NEON_GLOW_PERIOD_S = 0.9;

        function syncPairNeonHintAnimations() {
            const pairList = document.getElementById('pairList');
            if (!pairList) {
                return;
            }
            const neonBtns = pairList.querySelectorAll('.pair-btn.pair-neon-hint:not(.pair-selected)');
            if (!neonBtns.length) {
                return;
            }
            const t = performance.now() / 1000;
            const d1 = -(t % PAIR_NEON_BORDER_PERIOD_S);
            const d2 = -(t % PAIR_NEON_GLOW_PERIOD_S);
            const delayStr = d1 + 's, ' + d2 + 's';
            /* innerHTML / focus có thể restart animation lệch pha — tắt animation, reflow, bật lại từ CSS rồi gán delay chung */
            neonBtns.forEach((btn) => {
                btn.style.animation = 'none';
            });
            void pairList.offsetHeight;
            neonBtns.forEach((btn) => {
                btn.style.removeProperty('animation');
            });
            void pairList.offsetHeight;
            neonBtns.forEach((btn) => {
                btn.style.animationDelay = delayStr;
            });
        }

        function scheduleSyncPairNeonHintAnimations() {
            try { syncPairNeonHintAnimations(); } catch (e1) { }
            try {
                requestAnimationFrame(() => {
                    try { syncPairNeonHintAnimations(); } catch (e2) { }
                    requestAnimationFrame(() => {
                        try { syncPairNeonHintAnimations(); } catch (e3) { }
                    });
                });
            } catch (e4) { }
        }

        /**
         * Viền neon trên các nút cặp: khi chưa submit, gợi ý mọi cặp có đúng một đầu là số quan sát (kể cả đầu kia đã khoanh),
         * trừ khi logic hit/claimed không còn gợi ý — getPairNeonObservationNumber cố định khi đã gán.
         * Khi submitActive, vẫn gợi ý theo simulated selection như cũ.
         */
        function updatePairListNeonHints() {
            const pairList = document.getElementById('pairList');
            if (!pairList) {
                return;
            }
            const btns = Array.from(pairList.querySelectorAll('.pair-btn'));
            if (!hasLeftPaneRecordForPairNeon() || !btns.length) {
                btns.forEach((btn) => {
                    btn.classList.remove('pair-neon-hint');
                    btn.style.removeProperty('animation-delay');
                    btn.style.removeProperty('animation');
                });
                return;
            }
            const effective = new Set();
            if (submitActive) {
                simulatedSelected.forEach((n) => effective.add(n));
            } else {
                selected.forEach((n) => effective.add(n));
                simulatedSelected.forEach((n) => effective.add(n));
                transientSelected.forEach((n) => effective.add(n));
            }
            const observed = (!submitActive && raw && raw.freq) ? getPairNeonObservationNumber() : null;
            const claimed = new Set();
            for (const btn of btns) {
                const a = parseInt(btn.getAttribute('data-a'), 10);
                const b = parseInt(btn.getAttribute('data-b'), 10);
                if (Number.isFinite(a) && Number.isFinite(b) && effective.has(a) && effective.has(b)) {
                    claimed.add(a);
                    claimed.add(b);
                }
            }
            for (const btn of btns) {
                const a = parseInt(btn.getAttribute('data-a'), 10);
                const b = parseInt(btn.getAttribute('data-b'), 10);
                if (!Number.isFinite(a) || !Number.isFinite(b)) {
                    btn.classList.remove('pair-neon-hint');
                    btn.style.removeProperty('animation-delay');
                    btn.style.removeProperty('animation');
                    continue;
                }
                let hitA;
                let hitB;
                if (submitActive) {
                    hitA = effective.has(a) && !isNumClaimedForPairNeon(a, claimed, null, effective);
                    hitB = effective.has(b) && !isNumClaimedForPairNeon(b, claimed, null, effective);
                } else {
                    hitA = observed !== null && effective.has(a) && a === observed && !isNumClaimedForPairNeon(a, claimed, observed, effective);
                    hitB = observed !== null && effective.has(b) && b === observed && !isNumClaimedForPairNeon(b, claimed, observed, effective);
                }
                btn.classList.toggle('pair-neon-hint', !!(hitA || hitB));
            }
            btns.forEach((btn) => {
                if (!btn.classList.contains('pair-neon-hint')) {
                    btn.style.removeProperty('animation-delay');
                    btn.style.removeProperty('animation');
                }
            });
            scheduleSyncPairNeonHintAnimations();
        }

        function syncPairTailWrapWidths() {
            const left = document.getElementById('left');
            if (!left) return;
            const leftTable = left.querySelector('table');
            if (!leftTable) return;

            const tableWidth = Math.max(0, Math.round(leftTable.offsetWidth || leftTable.getBoundingClientRect().width || 0));
            if (!tableWidth) return;

            const pairList = document.getElementById('pairList');
            if (pairList) {
                pairList.style.width = tableWidth + 'px';
                pairList.style.maxWidth = tableWidth + 'px';
                pairList.style.boxSizing = 'border-box';
            }

            const tailList = document.getElementById('tailList');
            if (tailList) {
                tailList.style.width = tableWidth + 'px';
                tailList.style.maxWidth = tableWidth + 'px';
                tailList.style.boxSizing = 'border-box';
            }
        }

        function refreshPairTailSelectionState() {
            const effective = new Set();
            if (submitActive) {
                simulatedSelected.forEach(n => effective.add(n));
            } else {
                selected.forEach(n => effective.add(n));
                simulatedSelected.forEach(n => effective.add(n));
                transientSelected.forEach(n => effective.add(n));
            }

            updatePairButtonsSelection(effective);

            const tailEl = document.getElementById('tailList');
            if (tailEl) {
                const tbtns = Array.from(tailEl.querySelectorAll('.pair-btn'));
                tbtns.forEach(btn => {
                    const a = parseInt(btn.getAttribute('data-a'), 10);
                    const b = parseInt(btn.getAttribute('data-b'), 10);
                    if (pairTailButtonShouldShowPairSelected(a, b, effective)) {
                        btn.classList.add('pair-selected');
                    } else {
                        btn.classList.remove('pair-selected');
                    }
                });
            }
            try { updatePairListNeonHints(); } catch (e) { }
        }

        function updatePairList() {
            const el = document.getElementById('pairList'); if (!el) return;
            const pairs = computePairs() || [];
            currentPairs = pairs;
            if (pairs.length === 0) {
                el.removeAttribute('data-pair-sig');
                el.textContent = 'pair[0]:';
                currentPairIndex = -1;
                try { updatePairListNeonHints(); } catch (e) { }
                return;
            }
            const effective = new Set(); if (submitActive) { simulatedSelected.forEach(n => effective.add(n)); } else { selected.forEach(n => effective.add(n)); }
            const displayLines = raw.lines.slice(0, 10);
            const pairsWithMain = pairs.map(p => { const a = p[0], b = p[1]; const mains = []; for (let idx = 0; idx < displayLines.length; idx++) { const nums = getNumsFromLineObj(displayLines[idx]); if (nums.indexOf(a) !== -1 && nums.indexOf(b) !== -1) { mains.push(displayLines.length - idx); } } const main = (mains.length > 0) ? Math.min(...mains) : Infinity; return { pair: p, main }; });
            pairsWithMain.sort((x, y) => { if (x.main !== y.main) return x.main - y.main; if (x.pair[0] !== y.pair[0]) return x.pair[0] - y.pair[0]; return x.pair[1] - y.pair[1]; });
            const sortedPairs = pairsWithMain.map(x => x.pair); currentPairs = sortedPairs;
            let firstMatch = -1;
            for (let i = 0; i < sortedPairs.length; i++) { const p = sortedPairs[i]; if (effective.has(p[0]) && effective.has(p[1])) { firstMatch = i; break; } }
            if (firstMatch >= 0) { if (currentPairIndex < 0) currentPairIndex = firstMatch; else { const cp = currentPairs[currentPairIndex]; if (!cp || !(effective.has(cp[0]) && effective.has(cp[1]))) currentPairIndex = firstMatch; } } else if (currentPairIndex >= 0) { const cp = currentPairs[currentPairIndex]; if (!cp || !(effective.has(cp[0]) && effective.has(cp[1]))) currentPairIndex = -1; }

            const pairSig = sortedPairs.map(p => p[0] + ',' + p[1]).join('|');
            const existingBtns = Array.from(el.querySelectorAll('.pair-btn'));
            let reuseDom = false;
            if (el.getAttribute('data-pair-sig') === pairSig && existingBtns.length === sortedPairs.length) {
                reuseDom = true;
                for (let i = 0; i < sortedPairs.length; i++) {
                    const p = sortedPairs[i];
                    const btn = existingBtns[i];
                    if (!btn) { reuseDom = false; break; }
                    const da = parseInt(btn.getAttribute('data-a'), 10);
                    const db = parseInt(btn.getAttribute('data-b'), 10);
                    if (da !== p[0] || db !== p[1]) { reuseDom = false; break; }
                }
            }
            if (reuseDom) {
                for (let i = 0; i < sortedPairs.length; i++) {
                    const o = pairsWithMain[i];
                    const main = isFinite(o.main) ? o.main : '-';
                    const btn = existingBtns[i];
                    btn.setAttribute('data-main', String(main));
                    btn.setAttribute('data-idx', String(i));
                }
                try { refreshPairTailNumberStyles(); } catch (e) { }
                updatePairButtonsSelection(effective);
                try { updatePairListNeonHints(); } catch (e) { }
                syncPairTailWrapWidths();
                return;
            }

            el.setAttribute('data-pair-sig', pairSig);
            el.innerHTML = 'pair[' + sortedPairs.length + ']: ' + pairsWithMain.map((o, i) => {
                const p = o.pair;
                const a = p[0], b = p[1];
                const main = isFinite(o.main) ? o.main : '-';
                return `<button type="button" class="pair-btn" data-idx="${i}" data-a="${a}" data-b="${b}" data-main="${main}">${formatPairTailButtonLabel(main, a, b)}</button>`;
            }).join(' ');
            const buttons = Array.from(el.querySelectorAll('.pair-btn'));
            buttons.forEach((btn, idx) => {
                btn.addEventListener('click', function (ev) {
                    ev.preventDefault();
                    const a = parseInt(btn.getAttribute('data-a'), 10);
                    const b = parseInt(btn.getAttribute('data-b'), 10);
                    try {
                        lastClickedRegion = 'pairList';
                        syncLeftKeyboardRegion('pairList');
                        lastClickedNumber = b;
                        pushPhaseHistory('pairList', b, null);
                    } catch (e) { }
                    if (selected.has(a) && selected.has(b)) {
                        removePairContributionForToggleOff(a, b);
                        currentPairIndex = -1;
                    } else {
                        applyPairByIndex(idx);
                    }
                });
            });
            updatePairButtonsSelection(effective);
            try { updatePairListNeonHints(); } catch (e) { }
            syncPairTailWrapWidths();
        }

        /** Aggregate note / nonexist number sets from the first 10 chuỗi (same source as table 2). */
        function buildAggregatedNoteNonexistSets() {
            const noteSet = [];
            const nonexistSet = [];
            if (!raw || !raw.lines) {
                return { noteSet, nonexistSet };
            }
            raw.lines.slice(0, 10).forEach(function (lineObj) {
                if (lineObj && typeof lineObj !== 'string') {
                    if (lineObj.note) {
                        const all = lineObj.note.matchAll(/\{([^}]*)\}/g);
                        for (const m of all) {
                            if (m && m[1]) {
                                const nums = m[1].split(',').map(function (x) { return parseInt(x.trim(), 10); }).filter(function (n) { return !isNaN(n); });
                                noteSet.push.apply(noteSet, nums);
                            }
                        }
                    }
                    if (lineObj.nonexist) {
                        const nums = (lineObj.nonexist || '').split(',').map(function (x) { return parseInt(x.trim(), 10); }).filter(function (n) { return !isNaN(n); });
                        nonexistSet.push.apply(nonexistSet, nums);
                    }
                }
            });
            return {
                noteSet: Array.from(new Set(noteSet)),
                nonexistSet: Array.from(new Set(nonexistSet))
            };
        }

        /**
         * Table 1: one semantic color per number (table 2 may combine several).
         * Priority: yellow (nonexist) > cyan (note). Blocked (black) is applied separately via isBlocked().
         */
        function appendLeftTableSemanticHighlight(cls, n, aggregatedNoteSet, aggregatedNonexistSet) {
            if (aggregatedNonexistSet.indexOf(n) !== -1) {
                return cls + ' nonexist-intersect';
            }
            if (aggregatedNoteSet.indexOf(n) !== -1) {
                return cls + ' note-highlight';
            }
            return cls;
        }

        function getLeftTableSubmitTextColor(n, aggregatedNoteSet, aggregatedNonexistSet) {
            if (aggregatedNonexistSet.indexOf(n) !== -1) {
                return '#f0c840';
            }
            if (aggregatedNoteSet.indexOf(n) !== -1) {
                return '#00d9f2';
            }
            return null;
        }

        const LEFT_NX_CLASS_NAMES = [
            'left-nx-yellow', 'left-nx-red', 'left-nx-purple', 'left-nx-green',
            'left-nx-green-ul', 'left-nx-green-italic', 'left-nx-green-strike'
        ];

        function isGreenNonexistKind(kind) {
            return kind === 'green' || kind === 'green-ul' || kind === 'green-italic' || kind === 'green-strike';
        }

        /**
         * Submit OFF: vàng / đỏ / tím / đen — không xanh (gạch chân, gạch ngang, xanh thường).
         * green-ul (longest + đáp án) → đỏ; green-italic → vàng; green-strike / purple → tím.
         * Submit ON: giữ nguyên map nonexist pane phải.
         */
        function resolveLeftNonexistKind(kind) {
            if (!kind) return '';
            if (!submitActive) {
                if (kind === 'purple' || kind === 'green-strike') return 'purple';
                if (kind === 'green-ul') return 'red';
                if (kind === 'green-italic') return 'yellow';
                if (isGreenNonexistKind(kind)) return '';
                return kind;
            }
            return kind;
        }

        function leftNonexistKindToClassName(kind) {
            if (kind === 'yellow') return 'left-nx-yellow';
            if (kind === 'red') return 'left-nx-red';
            if (kind === 'purple') return 'left-nx-purple';
            if (kind === 'green') return 'left-nx-green';
            if (kind === 'green-ul') return 'left-nx-green-ul';
            if (kind === 'green-italic') return 'left-nx-green-italic';
            if (kind === 'green-strike') return 'left-nx-green-strike';
            return '';
        }

        function leftNonexistKindToClass(kind) {
            const name = leftNonexistKindToClassName(kind);
            return name ? (' ' + name) : '';
        }

        function getLeftNonexistHighlightClassFromFocus(n) {
            if (!focusNonexistHighlights) return '';
            const rawKind = focusNonexistHighlights[n] || focusNonexistHighlights[String(n)];
            return leftNonexistKindToClass(resolveLeftNonexistKind(rawKind));
        }

        /** Class list for a number in pair/tail (semantic colors only — no blocked/black). */
        function getLeftTableNumberClassString(n) {
            let cls = 'pair-num';
            if (!raw || !raw.freq) return cls;
            const freqRow = parseInt(raw.freq[n], 10) || 0;
            const isFreqZeroRow = freqRow === 0;
            if (isFreqZeroRow) {
                cls += getLeftNonexistHighlightClassFromFocus(n);
            } else {
                const agg = buildAggregatedNoteNonexistSets();
                cls = appendLeftTableSemanticHighlight(cls, n, agg.noteSet, agg.nonexistSet);
            }
            return cls.trim().replace(/\s+/g, ' ');
        }

        function formatLeftTableNumSpan(n) {
            return '<span class="' + getLeftTableNumberClassString(n) + '">' + n + '</span>';
        }

        function formatPairTailButtonLabel(main, a, b) {
            return main + ':{' + formatLeftTableNumSpan(a) + ',' + formatLeftTableNumSpan(b) + '}';
        }

        function refreshPairTailNumberStyles() {
            document.querySelectorAll('#pairList .pair-btn, #tailList .pair-btn').forEach(function (btn) {
                const a = parseInt(btn.getAttribute('data-a'), 10);
                const b = parseInt(btn.getAttribute('data-b'), 10);

            try { scheduleSyncPairNeonHintAnimations(); } catch (e) { }

        function syncLeftFreqZeroNonexistStylesInDOM() {
            const left = document.getElementById('left');
            if (!left || !raw || !raw.freq) return;
            for (let i = 1; i <= MAX_NUM; i++) {
                if ((parseInt(raw.freq[i], 10) || 0) !== 0) continue;

        function renderTable1() {
            const left = document.getElementById('left');
            if (!raw) {
                // scaffold left table when no data yet
                let html = '<table><tr><th>Số lần</th><th>Các số</th><th>Tổng</th></tr>';
                // show a few placeholder frequency rows
                for (let f = 5; f >= 1; f--) {
                    html += '<tr>';
                    html += '<td>' + f + '</td>';
                    html += '<td>';
                    for (let k = 0; k < 8; k++) html += '<span class="cell placeholder">&nbsp;</span>';
                    html += '</td>';
                    html += '<td>--</td>';
                    html += '</tr>';
                }
                html += '</table>';
                left.innerHTML = html;
                return;
            }
            let { freq, firstNums } = raw;
            const agg = buildAggregatedNoteNonexistSets();
            const aggregatedNoteSet = agg.noteSet;
            const aggregatedNonexistSet = agg.nonexistSet;
            let blockCount = blockedSet.size;
            let blockLabel = `<div style="display:flex;justify-content:space-between;align-items:center;"><span>Các số</span><span style="font-weight:bold;text-align:right;">${blockCount}</span></div>`;
            let html = `<table><tr><th>Số lần</th><th>${blockLabel}</th><th>Tổng</th></tr>`;
            let groups = {};
            Object.entries(freq).forEach(([n, f]) => { if (!groups[f]) groups[f] = []; groups[f].push(parseInt(n)); });
            Object.keys(groups).sort((a, b) => b - a).forEach(f => {
                let arr = groups[f];
                const freqRow = parseInt(f, 10);
                const isFreqZeroRow = !isNaN(freqRow) && freqRow === 0;
                html += "<tr>";
                html += "<td>" + f + "</td>";
                html += "<td>" + arr.map(n => {
                    let cls = "";
                    // do NOT apply red underline to submitted answer numbers
                    if (!(submitActive && answerNums.includes(n)) && firstNums.includes(n)) cls += " red";
                    if (selected.has(n)) cls += " selected";
                    if (isBlocked(n)) cls += " blocked";
                    if (isFreqZeroRow) {
                        cls += getLeftNonexistHighlightClassFromFocus(n);
                    } else {
                        cls = appendLeftTableSemanticHighlight(cls, n, aggregatedNoteSet, aggregatedNonexistSet);
                    }
                    let clickAttr = (!submitActive && !isBlocked(n))
                        ? `onclick="onNumberCellClick(${n},'left')"` : "";
                    let style = "";
                    let submitTextColor = submitActive
                        ? getLeftTableSubmitTextColor(n, aggregatedNoteSet, aggregatedNonexistSet)
                        : null;
                    if (isBlocked(n)) {
                        // Use class-based blocked styling (match ok.py): .blocked{background:black;color:var(--blocked-default)}
                        // cls already includes 'blocked' earlier; avoid inline styles here so the CSS rule applies uniformly.
                    } else if (submitActive && answerNums.includes(n)) {
                        // mark submitted numbers with a class — CSS maps their text color by semantic class
                        cls += ' submit-highlight';
                    } else if (submitActive && submitTextColor && !isFreqZeroRow) {
                        style = `color:${submitTextColor};font-weight:bold;`;
                    }
                    return `<span class="cell num${cls}" data-num="${n}" ${clickAttr} style='${style}'>${n}</span>`;
                }).join("") + "</td>";
                html += "<td>" + arr.length + "</td>";
                html += "</tr>";
            });
            html += "</table>";
            // append tail buttons under the table (same behavior as ok.py)

                    preserveSubmitOnNextProcess = false;
                    preserveSelectionOnNextProcess = false;

                    if (wasSubmitActive) {
                        submitActive = true;
                        try {
                            const sbEl = document.getElementById('submitBtn');
                            if (sbEl) sbEl.classList.add('active');
                        } catch (e) { }
                        try { syncSubmitStateForNewData(); } catch (e) { console.error(e); }
                        try { applySubmitState(); } catch (e) { console.error(e); }
                        try { syncPickOrderForSubmitState(); } catch (e) { }
                        try { if (window.updatePickButtonUI) window.updatePickButtonUI(); } catch (e) { }
                        try {
                            if (window.parent && window.parent !== window) {
                                window.parent.postMessage({ type: 'submitStateChanged', submitActive: true }, '*');
                            }
                        } catch (e) { }
                    } else {
                        try { persistSelectionMemoryForFocus(); } catch (e) { }
                        if (msg.disableSubmit) {
                            try {
                                const sbOff = document.getElementById('submitBtn');
                                if (sbOff) {
                                    sbOff.classList.remove('active');
                                    sbOff.disabled = true;
                                }
                            } catch (e) { }
                            try {
                                if (window.parent && window.parent !== window) {
                                    window.parent.postMessage({ type: 'submitStateChanged', submitActive: false }, '*');
                                }
                            } catch (e) { }
                        }
                    }
                    lastAutoRingFocusKey = newFk;
                    if (submitAutoCircleEnabled) {
                        var focusIdForRing = focusRowId;
                        var runAutoRing = function () {
                            try { maybeApplySubmitAutoRingAfterProcess(focusIdForRing); } catch (e) { console.error(e); }
                            if (submitActive) {
                                try { applySubmitState(); } catch (e) { console.error(e); }
                                try { applySelectionAndBlockedInDOM(); } catch (e) { }
                            }
                            try { notifyParentLeftCircledNums(); } catch (e) { }
                        };
                        if (wasSubmitActive) {
                            runAutoRing();
                        } else {
                            requestAnimationFrame(runAutoRing);
                        }
                    } else {
                        requestAnimationFrame(function () {
                            try { notifyParentLeftCircledNums(); } catch (e) { }
                        });
                    }
                } else if (msg.type === 'requestLeftCircledNums' && msg.nonce) {
                    try {
                        window.parent.postMessage({
                            type: 'leftCircledNums',
                            nonce: msg.nonce,
                            nums: getLeftPaneCircledNums()
                        }, '*');
                    } catch (e) { }
                    return;
                } else if (msg.type === 'submitAutoCircleChanged') {
                    const wasEnabled = submitAutoCircleEnabled;
                    submitAutoCircleEnabled = !!msg.enabled;
                    submitAutoCircleMode = (msg.mode === 'min') ? 'min' : ((msg.mode === 'custom') ? 'custom' : 'max');
                    if (msg.customX !== undefined && msg.customX !== null && msg.customX !== '') {
                        submitAutoCircleCustomX = clampSubmitAutoCircleCustomX(msg.customX);
                    }

                    if (submitAutoCircleEnabled && !wasEnabled && raw) {
                        // When autoring is turned ON, clear current selections and apply autoring immediately
                        autoRingVisitedIds.clear();
                        selectionMemoryByFocusId.clear();
                        lastAutoRingFocusKey = '';
                        selected.clear();
                        clearPairContributionTracking();
                        transientSelected.clear();
                        simulatedSelected.clear();
                        pickOrder = [];
                        pairNeonObserveNum = null;
                        currentPairIndex = -1;
                        currentTailIndex = -1;
                        selectionCleared = false;

                        var circleNums = Array.from(getSubmitAutoCircleSet()).filter(function (n) { return !isNaN(n); });
                        if (circleNums.length > 0) {
                            var ans = [];
                            if (raw.lines && raw.lines.length > 10) {
                                var eleventh = raw.lines[10] || {};
                                var ansLine = (eleventh.result || '').split('|')[0].trim();
                                if (ansLine.length) {
                                    ans = ansLine.split(',').map(function (x) { return parseInt(x, 10); }).filter(function (n) { return !isNaN(n); });
                                }
                            }
                            if (submitAutoCircleMode !== 'custom' && ans.length >= 5) {
                                try { syncModeFromAnswerNums(ans); } catch (e) { }
                            }
                            applyAutoRingSelection(circleNums);
                        }

                        applyAutoringDomAfterSelection();
                    } else if (submitAutoCircleEnabled && wasEnabled && raw) {
                        // Đổi max/min/x hoặc giá trị x khi autoring vẫn bật: cập nhật khoanh ngay
                        var circleNumsCfg = Array.from(getSubmitAutoCircleSet()).filter(function (n) { return !isNaN(n); });
                        if (circleNumsCfg.length > 0) {
                            var ansCfg = getAnswerNumsFromCurrentLine11();
                            if (submitAutoCircleMode !== 'custom' && ansCfg.length >= 5) {
                                try { syncModeFromAnswerNums(ansCfg); } catch (e) { }
                            }
                            applyAutoRingSelection(circleNumsCfg);
                        } else {
                            try { clearAutoRingSelectionVisuals(); } catch (e) { }
                        }
                        applyAutoringDomAfterSelection();
                    } else if (!submitAutoCircleEnabled && wasEnabled) {
                        try { autoRingPicked.clear(); } catch (e) { }
                        try { autoRingVisitedIds.clear(); } catch (e) { }
                        try { selectionMemoryByFocusId.clear(); } catch (e) { }
                        lastAutoRingFocusKey = '';

                        // Clear all selections
                        selected.clear();
                        clearPairContributionTracking();
                        transientSelected.clear();
                        simulatedSelected.clear();
                        pickOrder = [];
                        pairNeonObserveNum = null;
                        currentPairIndex = -1;
                        currentTailIndex = -1;
                        selectionCleared = false;

                        try {
                            if (!submitActive && modeSynced && userModeBeforeSubmit !== null) {
                                var modeElRestore = document.getElementById('mode');
                                if (modeElRestore) {
                                    modeElRestore.value = userModeBeforeSubmit;
                                    modeElRestore.classList.remove('synced-mode');
                                    modeElRestore.disabled = false;
                                }
                                userModeBeforeSubmit = null;
                                modeSynced = false;
                            }
                        } catch (e) { }

                        // Update UI
                        try { recomputePairsFromSelected(); } catch (e) { }
                        try { updateBlocked(); } catch (e) { }
                        try { updatePairList(); } catch (e) { }
                        try { refreshPairTailSelectionState(); } catch (e) { }
                        try { applySelectionAndBlockedInDOM(); } catch (e) { }
                        try { alignTableActionsAndCenter(); } catch (e) { }
                        try { updateFloatingCopyButtons(); } catch (e) { }
                        try { updateFocusIndicator(); } catch (e) { }
                        try { notifyParentLeftCircledNums(); } catch (e) { }
                    }
                    try { applySubmitState(); } catch (e) { }
                } else if (msg.type === 'toggleSubmit') {
                    toggleSubmitOnSpace();
                }
            } catch (e) { console.error(e); }
        });

        // Wire input events
        document.getElementById('input').addEventListener('input', process);

        (function wireSearchBoxAndModeLikeOkPy() {
            try {
                var sb = document.getElementById('searchBox');
                var searchHitHighlightRaf = null;
                if (sb) {
                    sb.addEventListener('keydown', function (e) {
                        /* KeyQ: physical Q (ổn định hơn e.key khi IME / layout); không dùng kèm Ctrl/Alt/Meta */
                        var plainQ = (e.code === 'KeyQ' || e.key === 'q' || e.key === 'Q') && !e.ctrlKey && !e.metaKey && !e.altKey;
                        if (plainQ) {
                            e.preventDefault();
                            e.stopPropagation();
                            try {
                                /* toggleClearSelection() bỏ qua khi submit preview — Space thì vẫn bật/tắt submit nên cảm giác "chỉ Space ăn" */
                                if (submitActive) toggleSubmitOnSpace();
                                toggleClearSelection();
                            } catch (e0) { /* ignore */ }
                            return;
                        }
                        if (e.code === 'Space' || e.key === ' ') {
                            e.preventDefault();
                            e.stopPropagation();
                            try { toggleSubmitOnSpace(); } catch (e1) { /* ignore */ }
                            return;
                        }
                    }, true);
                    sb.addEventListener('input', function () {
                        try {
                            var next = String(this.value || '').replace(/[^0-9]/g, '').slice(0, 5);
                            if (this.value !== next) this.value = next;
                        } catch (e1) { /* ignore */ }
                        if (searchHitHighlightRaf != null) {
                            cancelAnimationFrame(searchHitHighlightRaf);
                        }
                        searchHitHighlightRaf = requestAnimationFrame(function () {
                            searchHitHighlightRaf = null;
                            try {
                                updateSearchHitHighlightsInTable2();
                            } catch (e2) { /* ignore */ }
                        });
                    });
                }
            } catch (eSb) { /* ignore */ }
            try {
                var modeEl = document.getElementById('mode');
                if (modeEl) {
                    modeEl.addEventListener('change', function () {
                        try {
                            var sbox = document.getElementById('searchBox');
                            if (sbox) {
                                sbox.value = '';
                            }
                        } catch (e0) { /* ignore */ }
                        try {
                            process();
                        } catch (e1) { /* ignore */ }
                    });
                }
            } catch (eMode) { /* ignore */ }
        })();

        // Delegated click handlers: ensure clicks on number/index cells reach toggleNumber()
        // Skip calling toggleNumber when the element already has an inline onclick to avoid double-toggle
        (function () {
            try {
                function findClosestCell(el, selector) {
                    while (el && el.nodeType !== 1) el = el.parentElement;
                    while (el) {
                        if (el.matches && el.matches(selector)) return el;
                        el = el.parentElement;
                    }
                    return null;
                }

                function hasInlineOnclick(el) {
                    try { return !!(el && el.getAttribute && el.getAttribute('onclick')); } catch (e) { return false; }
                }

                var leftRoot = document.getElementById('left');
                if (leftRoot) {
                    leftRoot.addEventListener('click', function (ev) {
                        try {
                            var el = findClosestCell(ev.target, '.cell.num[data-num]');
                            if (!el) return;
                            // If element already has inline onclick, let it handle the event to avoid double-calls
                            if (hasInlineOnclick(el)) return;
                            ev.stopPropagation();
                            var n = parseInt(el.getAttribute('data-num'), 10);
                            if (isNaN(n)) return;
                            if (submitActive || isBlocked(n)) return;
                            try { lastClickedRegion = 'left'; syncLeftKeyboardRegion('left'); lastClickedNumber = n; } catch (e2) { }
                            toggleNumber(n);
                        } catch (e) { }
                    });
                }

                var rightRoot = document.getElementById('right');
                if (rightRoot) {
                    rightRoot.addEventListener('click', function (ev) {
                        try {
                            // accept clicks on either number cells or index cells in table 2
                            var el = findClosestCell(ev.target, '.cell[data-num]');
                            if (!el) return;
                            // If element already has inline onclick, let it handle the event
                            if (hasInlineOnclick(el)) return;
                            ev.stopPropagation();
                            var n = parseInt(el.getAttribute('data-num'), 10);
                            if (isNaN(n)) return;
                            if (submitActive || isBlocked(n)) return;
                            try {
                                var tr = findClosestCell(el, 'tr.chuoi-main-row');
                                if (!tr) {
                                    var trPattern = findClosestCell(el, 'tr.chuoi-pattern-row');
                                    if (trPattern) tr = trPattern.previousElementSibling;
                                }
                                var rowIndex = null;
                                if (tr) {
                                    var mains = Array.from(rightRoot.querySelectorAll('tr.chuoi-main-row'));
                                    rowIndex = mains.indexOf(tr);
                                }
                                lastClickedRegion = 'right';
                                syncLeftKeyboardRegion('right');
                                lastClickedNumber = n;
                                if (rowIndex != null && rowIndex >= 0) { lastClickedRow = rowIndex; currentPhaseRow = rowIndex; }
                            } catch (e2) { }
                            toggleNumber(n);
                        } catch (e) { }
                    });
                }
            } catch (e) { }
        })();
