name: Auto update 535 data

on:
  push:
    branches:
      - main
  schedule:
    # Giờ Việt Nam (UTC+7) → cron GitHub luôn là UTC (= VN − 7).
    # Lưu ý: schedule GitHub KHÔNG đúng phút; thường trễ vài–vài chục phút, repo
    # ít hoạt động còn có thể bị GitHub tạm tắt lịch (phải bấm Enable / Run thủ công).
    - cron: "10 6 * * *"    # 13:10 VN
    - cron: "30 6 * * *"    # 13:30 VN
    - cron: "45 6 * * *"    # 13:45 VN
    - cron: "0 7 * * *"     # 14:00 VN
    - cron: "10 14 * * *"   # 21:10 VN
    - cron: "30 14 * * *"   # 21:30 VN
    - cron: "45 14 * * *"   # 21:45 VN
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Sync new draws into data.json
        run: python crawl_535.py --json "data.json"

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "chore: auto update 535 draw data" && git push)
