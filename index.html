                const savedNum = localStorage.getItem(FILTER_NONEXIST_NUM_KEY);
                if (savedNum != null && savedNum !== '') {
                    const parsed = parseInt(savedNum, 10);
                    filterNonexistNum = Number.isFinite(parsed) && parsed >= 1 && parsed <= MAX_NUM
                        ? parsed
                        : null;
                } else {
                    filterNonexistNum = null;
                }
                const savedStyles = localStorage.getItem(FILTER_NONEXIST_STYLES_KEY);
                if (savedStyles) {
                    const parsed = JSON.parse(savedStyles);
                    filterNonexistStyles = Array.isArray(parsed)
                        ? parsed.filter(s => NONEXIST_FILTER_STYLES.includes(s))
                        : [];
                } else {
                    filterNonexistStyles = [];
                }
                const savedColors = localStorage.getItem(FILTER_NONEXIST_COLORS_KEY);
                if (savedColors) {
                    const parsedColors = JSON.parse(savedColors);
                    filterNonexistColors = Array.isArray(parsedColors)
                        ? parsedColors.filter((c) => NONEXIST_FILTER_COLORS.includes(c))
                        : ['green'];
                } else {
                    filterNonexistColors = filterNonexistStyles.length > 0 ? ['green'] : ['green'];
                }
                if (filterNonexistColors.length === 0) {
                    filterNonexistColors = ['green'];
                }
                const g005 = localStorage.getItem(FILTER_NONEXIST_GREEN005_KEY);
                filterNonexistGreen005000 = g005 === '1';
                if (!filterNonexistColors.includes('green')) {
                    filterNonexistGreen005000 = false;
                }
            } catch (e) {
                filterNonexistNum = null;
                filterNonexistStyles = [];
                filterNonexistColors = ['green'];
                filterNonexistGreen005000 = false;
            }
        }

        function positionFilterPopupNonexist005PctTooltip(anchorEl, clientX, clientY) {
            const tip = ensureFilterPopupNonexist005PctTooltipEl();
            tip.classList.add('is-visible');
            const rect = anchorEl.getBoundingClientRect();
            const offsetX = 14;
            const offsetY = 18;
            let left = (typeof clientX === 'number' ? clientX : rect.right) + offsetX;
            let top = (typeof clientY === 'number' ? clientY : rect.bottom) + offsetY;
            const pad = 8;
            const tipW = tip.offsetWidth;
            const tipH = tip.offsetHeight;
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            if (left + tipW + pad > vw) {
                left = Math.max(pad, (typeof clientX === 'number' ? clientX : rect.left) - tipW - 10);
            }
            if (top + tipH + pad > vh) {
                top = Math.max(pad, (typeof clientY === 'number' ? clientY : rect.top) - tipH - 10);
            }
            tip.style.left = `${Math.round(left)}px`;
            tip.style.top = `${Math.round(top)}px`;
        }

            const py = denom > 0 ? Math.round((yel / denom) * 100) : 0;
            const pr = denom > 0 ? Math.round((r / denom) * 100) : 0;

                if (pctEl.hidden || !pctEl.dataset.nx005Denom) {
                    return;

                filterPopupNonexist005PctTooltipHoverTarget = pctEl;
                filterPopupNonexist005PctTooltipLastX = event.clientX;
                filterPopupNonexist005PctTooltipLastY = event.clientY;
                clearTimeout(filterPopupNonexist005PctTooltipTimer);
                filterPopupNonexist005PctTooltipTimer = setTimeout(() => {
                    if (filterPopupNonexist005PctTooltipHoverTarget === pctEl && !pctEl.hidden) {
                        showFilterPopupNonexist005PctTooltip(
                            pctEl,
                            filterPopupNonexist005PctTooltipLastX,
                            filterPopupNonexist005PctTooltipLastY
                        );
                    }
                }, FILTER_POPUP_NX005_PCT_TOOLTIP_SHOW_MS);

            pctEl.addEventListener('mousemove', (event) => {
                if (filterPopupNonexist005PctTooltipHoverTarget !== pctEl) {
                    return;

                filterPopupNonexist005PctTooltipLastX = event.clientX;

        function initFilterPopupPosnfreqControls() {
            const hex = el('filterPopupPosnfreqHexBtn');
            const srcBtn = el('filterPopupPosnfreqSourceBtn');
            if (!hex || hex.dataset.posnfreqWired) {
                return;
            }
            hex.dataset.posnfreqWired = '1';
            let draggingPosnfreqHex = false;
            let downX = 0;
            let downY = 0;
            let activePointerId = null;
            let dragGhostEl = null;
            let dragRaf = 0;
            let dragClientX = 0;
            let dragClientY = 0;
            let dragOffsetX = 0;
            let dragOffsetY = 0;

            const clearPosnfreqDragUi = () => {
                if (dragRaf) {
                    cancelAnimationFrame(dragRaf);
                    dragRaf = 0;
                }
                if (dragGhostEl) {
                    try {
                        dragGhostEl.remove();
                    } catch (e) { /* ignore */ }
                    dragGhostEl = null;
                }
                hex.classList.remove('is-posnfreq-drag-source');
            };

            const positionDragGhost = () => {
                if (!dragGhostEl) {
                    dragRaf = 0;
                    return;
                }
                const x = Math.round(dragClientX - dragOffsetX);
                const y = Math.round(dragClientY - dragOffsetY);
                dragGhostEl.style.transform = `translate3d(${x}px, ${y}px, 0)`;
                dragRaf = 0;
            };

            const onPosnfreqPointerMove = (ev) => {
                dragClientX = ev.clientX;
                dragClientY = ev.clientY;
                if (!dragGhostEl) {
                    return;
                }
                if (!dragRaf) {
                    dragRaf = requestAnimationFrame(positionDragGhost);
                }
            };

            const detachDragListeners = () => {
                window.removeEventListener('pointerup', endDrag, true);
                window.removeEventListener('pointercancel', endDrag, true);
                window.removeEventListener('mouseup', endDragMouse, true);
                document.removeEventListener('pointermove', onPosnfreqPointerMove, true);
                hex.removeEventListener('lostpointercapture', onLostPointerCapture);
            };

            const finishPointerCapture = (ev) => {
                if (activePointerId == null) {
                    return;
                }
                const pid = ev && ev.pointerId != null ? ev.pointerId : activePointerId;
                if (pid !== activePointerId) {
                    return;
                }
                try {
                    if (typeof hex.releasePointerCapture === 'function') {
                        const hasPc = typeof hex.hasPointerCapture === 'function' && hex.hasPointerCapture(pid);
                        if (hasPc) {
                            hex.releasePointerCapture(pid);
                        }
                    }
                } catch (e) { /* ignore */ }
                activePointerId = null;
            };

            function onLostPointerCapture() {
                if (!draggingPosnfreqHex) {
                    activePointerId = null;
                    clearPosnfreqDragUi();
                    return;
                }
                draggingPosnfreqHex = false;
                activePointerId = null;
                detachDragListeners();
                clearPosnfreqDragUi();
            }

            /** Thả trên iframe: pointerup thường không bubble lên parent — setPointerCapture buộc nhận up trên nút hex. */
            function endDrag(ev) {
                if (!draggingPosnfreqHex) {
                    return;
                }
                draggingPosnfreqHex = false;
                detachDragListeners();
                clearPosnfreqDragUi();
                finishPointerCapture(ev);
                if (!isPosnfreqFilterMode(periodFilterMode) || !periodFilterEnabled) {
                    return;
                }
                const cx = ev && typeof ev.clientX === 'number' ? ev.clientX : downX;
                const cy = ev && typeof ev.clientY === 'number' ? ev.clientY : downY;
                const dist = Math.hypot(cx - downX, cy - downY);
                if (dist < 8) {
                    if (posnfreqSpecimenNum != null && Number.isFinite(posnfreqSpecimenNum) && posnfreqRefSignature) {
                        posnfreqSpecimenStrict = !posnfreqSpecimenStrict;
                        syncPosnfreqMetaText();
                        schedulePosnfreqDeferredHeavyUi();

                } else {
                    const hit = elementFromPointInOkFrame(cx, cy);
                    if (hit) {

            function endDragMouse(ev) {
                if (ev.button !== 0) {

                endDrag(ev);

            hex.addEventListener('pointerdown', (ev) => {
                if (!isPosnfreqFilterMode(periodFilterMode) || !periodFilterEnabled) {
                    return;

                downY = ev.clientY;
                activePointerId = ev.pointerId;
                const br = hex.getBoundingClientRect();
                dragOffsetX = ev.clientX - br.left;
                dragOffsetY = ev.clientY - br.top;
                dragClientX = ev.clientX;
                dragClientY = ev.clientY;
                dragGhostEl = document.createElement('div');
                dragGhostEl.className = 'filter-popup-posnfreq-drag-ghost';
                dragGhostEl.style.width = `${Math.round(br.width)}px`;
                dragGhostEl.style.height = `${Math.round(br.height)}px`;
                const inner = document.createElement('div');
                inner.className = 'filter-popup-posnfreq-drag-ghost-inner';

                dragGhostEl.appendChild(inner);
                document.body.appendChild(dragGhostEl);
                hex.classList.add('is-posnfreq-drag-source');
                positionDragGhost();
                try {
                    if (typeof hex.setPointerCapture === 'function') {
                        hex.setPointerCapture(ev.pointerId);
                    }
                } catch (e) { /* ignore */ }
                hex.addEventListener('lostpointercapture', onLostPointerCapture);
                document.addEventListener('pointermove', onPosnfreqPointerMove, true);
                window.addEventListener('pointerup', endDrag, true);
                window.addEventListener('pointercancel', endDrag, true);
                window.addEventListener('mouseup', endDragMouse, true);
            });

        /**

            if (!t) {

            if (/^0[1-9]$/.test(t)) {
                return [parseInt(t, 10)];
            }
            if (/^\d{2}$/.test(t)) {
                const n = parseInt(t, 10);
                return n >= 10 && n <= MAX_NUM ? [n] : [];
            }
            const xOnes = t.match(/^x(\d)$/);
            if (xOnes) {
                const ones = parseInt(xOnes[1], 10);
                const out = [];
                for (let tens = 0; tens <= 3; tens++) {
                    const n = tens * 10 + ones;
                    if (n >= 1 && n <= MAX_NUM) {
                        out.push(n);
                    }
                }
                return out;
            }
            const xTens = t.match(/^(\d)x$/);
            if (xTens) {
                const tens = parseInt(xTens[1], 10);
                const out = [];
                for (let ones = 0; ones <= 9; ones++) {
                    const n = tens * 10 + ones;
                    if (n >= 1 && n <= MAX_NUM) {
                        out.push(n);
                    }
                }
                return out;
            }
            return [];
        }

        /** Cho phép gõ dở: 01–09, 10–35, 0 (đang gõ 0x), x, x0–x9, 0x–9x; 1–3 đơn lẻ = đang gõ 10–35. */

            const t = normalizeFilterHeader2SlotText(text);
            if (!t) {
                return true;

            if (t.length > 2) {
                return false;
            }
            if (t === 'x' || t === '0') {
                return true;
            }
            if (/^0[1-9]$/.test(t)) {
                return true;
            }
            if (/^[1-3]$/.test(t)) {
                return true;
            }
            if (/^[4-9]$/.test(t)) {
                return true;
            }
            if (/^\d{2}$/.test(t)) {
                const n = parseInt(t, 10);
                return n >= 10 && n <= MAX_NUM;
            }
            if (/^x\d$/.test(t)) {
                return true;
            }
            if (/^\dx$/.test(t)) {
                return true;
            }
            return false;
        }

                    const n = mau[m];
                    if (!exp.includes(n)) {
                        continue;
                    }
                    usedMauIdx.add(m);

                }
                if (!slotHit) {
                    return false;
                }
            }
            return true;
        }

            syncFilterHeader2InputsFromState();

            for (let slot = 0; slot < 5; slot++) {
                const input = el(`filterPopupHeader2Num${slot}`);
                if (!input) {
                    continue;
                }
                input.addEventListener('mousedown', (event) => {
                    event.stopPropagation();
                    if (!isFilterHeader2SlotEditable(slot)) {
                        event.preventDefault();
                        focusFilterHeader2Slot(getFirstEditableFilterHeader2Slot());
                    }
                });
                input.addEventListener('click', (event) => {
                    event.stopPropagation();
                    if (!isFilterHeader2SlotEditable(slot)) {
                        event.preventDefault();
                        focusFilterHeader2Slot(getFirstEditableFilterHeader2Slot());
                    }
                });
                input.addEventListener('focus', (event) => {
                    event.stopPropagation();
                    if (!isFilterHeader2SlotEditable(slot)) {
                        event.preventDefault();
                        input.blur();
                        focusFilterHeader2Slot(getFirstEditableFilterHeader2Slot());
                    }
                });
                input.addEventListener('blur', () => {
                    commitFilterHeader2NumFromSlot(slot);
                });
                input.addEventListener('paste', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    if (!isFilterHeader2SlotEditable(slot)) {
                        return;
                    }
                    const pasted = normalizeFilterHeader2SlotText(
                        String((event.clipboardData || window.clipboardData).getData('text') || '')
                    );
                    if (!pasted || !isValidFilterHeader2PartialText(pasted)) {
                        return;
                    }
                    let text = canonicalizeFilterHeader2CommittedText(pasted);
                    if (expandFilterHeader2Pattern(text).length === 0) {
                        const n = parseFilterHeader2NumInput(pasted);
                        if (n == null) {
                            return;
                        }
                        text = canonicalizeFilterHeader2CommittedText(String(n));
                    }
                    if (!isValidFilterHeader2PartialText(text) || expandFilterHeader2Pattern(text).length === 0) {
                        return;
                    }
                    setFilterPopupPositionText(input, text);
                    input.classList.toggle('is-empty', !text);
                    syncFilterHeader2SlotLive(slot, text);
                });
                input.addEventListener('keydown', (event) => {
                    const key = String(event.key || '');
                    if (!isFilterHeader2SlotEditable(slot) && key !== 'Tab') {
                        event.preventDefault();
                        event.stopPropagation();
                        return;
                    }
                    if ((key >= '0' && key <= '9') || key === 'x' || key === 'X') {
                        event.preventDefault();
                        event.stopPropagation();
                        tryAppendFilterHeader2Char(slot, key);
                        return;
                    }
                    if (key === 'Backspace') {
                        event.preventDefault();
                        event.stopPropagation();
                        tryBackspaceFilterHeader2Num(slot);
                        return;
                    }
                    if (key === 'Enter') {
                        event.preventDefault();
                        event.stopPropagation();
                        const phDisplay = getFilterHeader2PlaceholderDisplay(slot);
                        if (phDisplay.type === 'full' || phDisplay.type === 'suffix') {
                            acceptFilterHeader2SlotSuggestion(slot);
                            return;
                        }
                        commitFilterHeader2NumFromSlot(slot);
                        input.blur();
                        return;
                    }
                    if (key === 'ArrowLeft' || key === 'ArrowUp') {
                        event.preventDefault();
                        event.stopPropagation();
                        event.stopImmediatePropagation();
                        moveFilterHeader2SlotFocus(slot, -1);
                        return;
                    }
                    if (key === 'ArrowRight' || key === 'ArrowDown') {
                        event.preventDefault();
                        event.stopPropagation();
                        event.stopImmediatePropagation();
                        moveFilterHeader2SlotFocus(slot, 1);
                        return;
                    }
                    if (key === 'Tab') {
                        commitFilterHeader2NumFromSlot(slot);
                    }
                }, true);
            }
        }

        /** Filter options for the mode “pool” (dropdown All): no note-tag sub-filter. */
        function getFilterOptionsForParentCount(mode) {
            const normalized = normalizeFilterMode(mode);
            if (isNonexistFilterMode(normalized)) {
                const colors = filterNonexistColors.filter((c) => NONEXIST_FILTER_COLORS.includes(c));
                return {
                    colors,
                    styles: [],
                    num: null,
                    nonexistBracketCount: 0,
                    nonexistBracketOp: '>=',
                    applyColorStyleFilter: false
                };
            }
            if (isPosnfreqFilterMode(normalized)) {
                return getPosnfreqFilterOptionsForMatching();
            }
            if (isIntersectionFilterMode(normalized)) {
                return {
                    intersectionKind: filterIntersectionKind === 'nearintersect' ? 'nearintersect' : 'intersect',
                    intersectionMinFreqA: 2,
                    intersectionMinFreqB: 2,
                    intersectionFreqOpA: '>=',
                    intersectionFreqOpB: '>='
                };
            }
            if (isDatebandFilterMode(normalized)) {
                return {
                    datebandMinFreqA: 2,
                    datebandMinFreqB: 2,
                    datebandFreqOpA: '>=',
                    datebandFreqOpB: '>='
                };
            }
            if (isTailFilterMode(normalized)) {
                return {
                    tailMinCount: 2,
                    tailCountOp: '>='
                };
            }
            return null;
        }

        /** Tổng kỳ mẫu lớn nhất của mode chính (không thu hẹp theo lọc phụ: note tag, freq x/y, nonexist số/kiểu, …). */
        function getFilterParentCountForMode(mode) {
            if (!isPeriodFilterContextSheet()) {
                return 0;
            }
            const normalized = normalizeFilterMode(mode);
            if (isNonexistFilterMode(normalized)) {
                if (!hasActiveNonexistFilterCriteria()) {
                    return 0;
                }
            }
            return sheetManager.getFilterMatchingIndices(
                normalized,
                getFilterOptionsForParentCount(normalized)
            ).length;
        }

        function getFilterNoteTagCountForTag(tag) {
            if (!isPeriodFilterContextSheet()) {
                return 0;
            }
            const mode = periodFilterMode;
            if (!supportsNoteTagFilter(mode)) {
                return 0;
            }
            if (tag === FILTER_NOTE_TAG_ALL) {
                return getFilterParentCountForMode(mode);
            }
            const num = parseInt(tag, 10);
            if (!Number.isFinite(num)) {
                return 0;
            }
            if (isDatebandFilterMode(mode)) {
                return sheetManager.getFilterMatchingIndices(mode, getDatebandFilterOptions([num])).length;
            }
            return sheetManager.getFilterMatchingIndices(mode, { noteTags: [num] }).length;
        }

        function rebuildFilterNoteTagMenuCounts() {
            filterNoteTagMenuCounts = {};
            if (!sheetManager || !isPeriodFilterContextSheet() || !supportsNoteTagFilter(periodFilterMode)) {
                return;
            }
            const mode = periodFilterMode;
            if (isDatebandFilterMode(mode)) {
                filterNoteTagMenuCounts[FILTER_NOTE_TAG_ALL] = getFilterParentCountForMode(mode);
                for (const tag of FILTER_NOTE_TAG_VALUES) {
                    filterNoteTagMenuCounts[tag] = getFilterNoteTagCountForTag(tag);
                }
                return;
            }
            filterNoteTagMenuCounts[FILTER_NOTE_TAG_ALL] = getFilterParentCountForMode(mode);
            for (const tag of FILTER_NOTE_TAG_VALUES) {
                filterNoteTagMenuCounts[tag] = getFilterNoteTagCountForTag(tag);
            }
        }

        function scheduleRebuildFilterNoteTagMenuCounts() {
            clearTimeout(filterNoteTagCountRebuildTimer);
            filterNoteTagCountRebuildTimer = setTimeout(() => {
                filterNoteTagCountRebuildTimer = null;
                rebuildFilterNoteTagMenuCounts();
                rebuildFilterConnectionNoteTagMenuCounts();
                updateFilterPopupNoteTagMenuItemCounts();
                updateFilterPopupConnectionNoteTagMenuItemCounts();
            }, 150);
        }

        function updateFilterPopupNoteTagMenuItemCounts() {
            const menu = el('filterPopupNoteTagMenu');
            if (!menu) {
                return;
            }
            menu.querySelectorAll('.period-filter-mode-item').forEach((item) => {
                const tag = item.dataset.tag || '';
                const countSpan = item.querySelector('.period-filter-mode-item-count');
                if (countSpan) {
                    const cached = filterNoteTagMenuCounts[tag];
                    countSpan.textContent = String(
                        cached !== undefined ? cached : getFilterNoteTagCountForTag(tag)
                    );
                }
            });
        }

        function syncFilterPopupDropdownCounts() {
            updateFilterPopupNoteTagMenuItemCounts();
            updateFilterPopupConnectionNoteTagMenuItemCounts();
        }

        function commitFilterPopupNonexistNumFromUi() {
            const numInput = el('filterPopupNonexistNum');
            if (!numInput) {
                return;
            }
            filterNonexistNum = parseFilterNonexistNumInput(getFilterPopupPositionText(numInput));
            if (filterNonexistNum == null && filterNonexistGreen005000) {
                filterNonexistGreen005000 = false;
            }
            const text = filterNonexistNum != null ? String(filterNonexistNum) : '';
            setFilterPopupPositionText(numInput, text);
            syncFilterPopupNonexistSpinButtons();
        }

        function tryAppendFilterPopupNonexistDigit(digit) {
            const input = el('filterPopupNonexistNum');
            if (!input) {
                return false;
            }
            const nextText = getFilterPopupPositionText(input) + String(digit);
            const nextNum = parseInt(nextText, 10);
            if (!Number.isFinite(nextNum) || nextNum < 1 || nextNum > MAX_NUM) {
                return false;
            }
            setFilterPopupPositionText(input, nextText);
            filterNonexistNum = nextNum;
            saveFilterNonexistSettings();
            if (periodFilterEnabled && isNonexistFilterMode(periodFilterMode)) {
                refreshFilterPopup({ syncMain: false, immediateRender: true });
            } else {
                rebuildNonexistFilterModeCountOnly();
                updatePeriodFilterMatchCount();
            }
            syncFilterPopupNonexistSpinButtons();
            return true;
        }

        function tryBackspaceFilterPopupNonexistNum() {
            const input = el('filterPopupNonexistNum');
            if (!input) {
                return false;
            }
            const nextText = getFilterPopupPositionText(input).slice(0, -1);
            setFilterPopupPositionText(input, nextText);
            filterNonexistNum = parseFilterNonexistNumInput(nextText);
            if (filterNonexistNum == null && filterNonexistGreen005000) {
                filterNonexistGreen005000 = false;
            }
            saveFilterNonexistSettings();
            if (periodFilterEnabled && isNonexistFilterMode(periodFilterMode)) {
                refreshFilterPopup({ syncMain: false, immediateRender: true });
            } else {
                rebuildNonexistFilterModeCountOnly();
                updatePeriodFilterMatchCount();
            }
            syncFilterPopupNonexistSpinButtons();
            return true;
        }

        function syncFilterPopupNonexistSpinButtons() {
            const inc = el('filterPopupNonexistNumInc');
            const dec = el('filterPopupNonexistNumDec');
            if (!inc || !dec) {
                return;
            }
            const active = periodFilterEnabled && isNonexistFilterMode(periodFilterMode);
            inc.disabled = !active;
            dec.disabled = !active;
        }

        /** Số nonexist 1–35: bước +/− xoay vòng. */
        function wrapNonexistNum1To35(n) {
            const u = Math.trunc(Number(n));
            if (!Number.isFinite(u)) {
                return 1;
            }
            const m = ((u - 1) % 35 + 35) % 35;
            return m + 1;
        }

        function bumpFilterPopupNonexistNum(delta) {
            if (!periodFilterEnabled || !isNonexistFilterMode(periodFilterMode)) {
                return false;
            }
            const input = el('filterPopupNonexistNum');
            if (!input) {
                return false;
            }
            let v = filterNonexistNum;
            if (delta > 0) {
                if (v == null) {
                    v = 1;
                } else {
                    v = wrapNonexistNum1To35(v + 1);
                }
            } else if (delta < 0) {
                if (v == null) {
                    v = 35;
                } else {
                    v = wrapNonexistNum1To35(v - 1);
                }
            } else {
                return false;
            }
            filterNonexistNum = v;
            setFilterPopupPositionText(input, filterNonexistNum != null ? String(filterNonexistNum) : '');
            if (filterNonexistNum == null && filterNonexistGreen005000) {
                filterNonexistGreen005000 = false;
            }
            saveFilterNonexistSettings();
            syncFilterPopupNonexistSpinButtons();
            refreshFilterPopup({ syncMain: false, immediateRender: true });
            return true;
        }

        function applyNonexistFilterSettingsFromUi() {
            commitFilterPopupNonexistNumFromUi();
            commitFilterPopupNonexistBracketFromUi();
            saveFilterNonexistSettings();
            saveFilterNonexistBracketSettings();
            syncFilterPopupNonexistSpinButtons();
            syncFilterPopupNonexistBracketSpinButtons();
            if (periodFilterEnabled && isNonexistFilterMode(periodFilterMode)) {
                refreshFilterPopup({ syncMain: false, immediateRender: true });
            } else {
                rebuildNonexistFilterModeCountOnly();
                updatePeriodFilterMatchCount();
            }
        }

        function getFilterPopupEmptyMessage(mode) {
            const normalized = normalizeFilterMode(mode);
            if (normalized === 'all') {
                return 'Không có dữ liệu kỳ.';
            }
            if (isNonexistFilterMode(normalized)) {
                if (!hasActiveNonexistFilterCriteria()) {
                    return 'Chọn tiêu chí lọc nonexist (màu/kiểu hoặc []).';
                }
                const colorLabel = getNonexistFilterColorLabelList();
                const styles = getNonexistFilterStyleLabelList();
                const styleHint = hasNonexistColorStyleSubFilter() && isNonexistGreenFilterSelected() && styles
                    ? ` (${styles})`
                    : '';
                const colorHint = hasNonexistColorStyleSubFilter() ? `màu ${colorLabel}` : '';
                const bracketHint = `[]${normalizeIntersectionFreqOp(filterNonexistBracketOp)}${filterNonexistBracketCount}`;
                const numHint = isNonexistFilterNumEmpty() ? '' : ` AND số ${filterNonexistNum}`;
                const criteriaHint = [colorHint, bracketHint].filter(Boolean).join(', ');
                if (isNonexistFilterNumEmpty()) {
                    return `Không có kỳ nào khớp ${criteriaHint}${styleHint} trong nonexist.`;
                }
                return `Không có kỳ nào khớp ${criteriaHint}${styleHint}${numHint} trong nonexist.`;
            }
            if (isPosnfreqFilterMode(normalized)) {
                if (posnfreqSpecimenNum == null || !Number.isFinite(posnfreqSpecimenNum)) {
                    return 'Chọn specimen: kéo lục giác từ header vào ô số trên bảng trái (kỳ nguồn = kỳ đang focus).';
                }
                return 'Không có kỳ nào khớp posnfreq với specimen hiện tại.';
            }
            if (isIntersectionFilterMode(normalized)) {
                const k = filterIntersectionKind === 'nearintersect' ? 'nearintersect' : 'intersect';
                const oxa = normalizeIntersectionFreqOp(filterIntersectionOpX);
                const oya = normalizeIntersectionFreqOp(filterIntersectionOpY);
                return `Không có kỳ nào khớp intersection (${k}): cặp a,b theo thứ tự 5 số submit với freq(a)${oxa}${filterIntersectionFreqX}, freq(b)${oya}${filterIntersectionFreqY} trong tối đa 10 chuỗi trước kỳ.`;
            }
            if (isDatebandFilterMode(normalized)) {
                const oxa = normalizeIntersectionFreqOp(filterDatebandOpX);
                const oya = normalizeIntersectionFreqOp(filterDatebandOpY);
                const tags = getActiveNoteTagFilterValues();
                const tagPart = tags.length > 0
                    ? ` với note ${tags.map((n) => `${n}:`).join(', ')}`
                    : '';
                return `Không có kỳ nào khớp date #00b0f0: cặp cửa sổ 10 khớp đáp án với hai freq khớp ngưỡng x=${filterDatebandFreqX} (${oxa}) và y=${filterDatebandFreqY} (${oya}), không phân thứ tự${tagPart}.`;
            }
            if (isTailFilterMode(normalized)) {
                const op = normalizeIntersectionFreqOp(filterTailOp);
                return `Không có kỳ nào có đáp án chứa phần tử thuộc tail (cặp tail cửa sổ 10, count ${op}${filterTailCount}).`;
            }
            if (isConnectionFilterMode(normalized)) {
                const ctags = getActiveConnectionNoteTagFilterValuesForMode(normalized);
                if (ctags.length > 0) {
                    const tagLabel = ctags.map((n) => `${n}:`).join(', ');
                    return `Không có kỳ nào vừa có connection vừa có nhãn ${tagLabel} trong note (dạng N:{…}).`;
                }
                return 'Không có kỳ nào note có connection (xuất hiện trong ≥2 cặp {a,b}).';
            }
            if (isConn3FilterMode(normalized)) {
                return 'Không có kỳ nào có bộ 3-connection (3 cặp chuỗi trên 3 chuỗi khác nhau, freq ≥2).';
            }
            const hint = getFilterModeTitleHint(normalized);
            const tags = getActiveNoteTagFilterValues();
            if (tags.length > 0) {
                const tagLabel = tags.map((n) => `${n}:`).join(', ');
                return 'Không có kỳ nào khớp ' + hint + ' với note chứa ' + tagLabel + '.';
            }
            return 'Không có kỳ nào khớp ' + hint + '.';
        }

        function getPeriodFilterMenu() {
            return el('periodFilterModeMenu');
        }

        function getPeriodFilterPicker(which) {
            const isPopup = which === 'popup';
            return {
                picker: el(isPopup ? 'filterPopupModePicker' : 'periodFilterModePicker'),
                modeBtn: el(isPopup ? 'filterPopupModeBtn' : 'periodFilterModeBtn'),
                modeLabel: el(isPopup ? 'filterPopupModeBtnLabel' : 'periodFilterModeBtnLabel'),
                countEl: isPopup ? el('filterPopupMatchCount') : null
            };
        }

        function fitPeriodFilterModeBtnWidth() {
            const probe = document.createElement('span');
            probe.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap;font:700 12px Inter,Segoe UI,Arial';
            document.body.appendChild(probe);

            let maxTextWidth = 0;
            for (const mode of VALID_FILTER_MODES) {
                if (isDatebandFilterMode(mode)) {
                    maxTextWidth = Math.max(maxTextWidth, 30);
                } else {
                    probe.textContent = getFilterModeLabel(mode);
                    maxTextWidth = Math.max(maxTextWidth, probe.offsetWidth);
                }
            }
            document.body.removeChild(probe);

            const btnWidth = `${Math.ceil(maxTextWidth) + 28}px`;
            for (const which of ['toolbar', 'popup']) {
                const { modeBtn } = getPeriodFilterPicker(which);
                if (modeBtn) {
                    modeBtn.style.width = btnWidth;
                }
            }
        }

        function highlightPeriodFilterModeMenu(previewMode) {
            const menu = getPeriodFilterMenu();
            if (!menu) {
                return;
            }
            const preview = previewMode ? normalizeFilterMode(previewMode) : null;
            menu.querySelectorAll('.period-filter-mode-item').forEach((item) => {
                const itemMode = item.dataset.mode || '';
                item.classList.toggle('selected', itemMode === periodFilterMode);
                item.classList.toggle('previewing', !!preview && itemMode === preview);
            });
        }

        function buildPeriodFilterModeMenu() {
            const menu = getPeriodFilterMenu();
            if (!menu) {
                return;
            }

            menu.innerHTML = '';
            for (const mode of VALID_FILTER_MODES) {
                const item = document.createElement('li');
                item.className = 'period-filter-mode-item';
                item.setAttribute('role', 'option');
                item.dataset.mode = mode;

                const labelSpan = document.createElement('span');
                labelSpan.className = 'period-filter-mode-item-label';
                applyPeriodFilterModeVisual(labelSpan, mode);

                const countSpan = document.createElement('span');
                countSpan.className = 'period-filter-mode-item-count';
                countSpan.textContent = String(filterModeCounts[mode] ?? 0);

                item.appendChild(labelSpan);
                item.appendChild(countSpan);

                item.addEventListener('mouseenter', () => {
                    if (!periodFilterEnabled) {
                        return;
                    }
                    highlightPeriodFilterModeMenu(mode);
                    setPeriodFilterMatchCountDisplay(mode, true);
                });

                item.addEventListener('mousedown', (event) => {
                    event.preventDefault();
                });

                item.addEventListener('click', () => {
                    selectPeriodFilterMode(mode);
                });

                menu.appendChild(item);
            }
            highlightPeriodFilterModeMenu(null);
        }

        function positionPeriodFilterModeMenu() {
            const menu = getPeriodFilterMenu();
            const { modeBtn } = getPeriodFilterPicker(periodFilterMenuAnchor);
            if (!menu || !modeBtn) {
                return;
            }

            const rect = modeBtn.getBoundingClientRect();
            menu.style.left = `${Math.max(8, rect.left)}px`;
            menu.style.top = `${rect.bottom + 2}px`;
            menu.style.minWidth = `${Math.max(rect.width, 88)}px`;
        }

        function openPeriodFilterModeMenu(anchor) {
            closeSubmitRingModeMenu();
            closeFilterPopupNoteTagMenu();
            closeFilterPopupConnectionNoteTagMenu();
            closeFilterPopupNonexistColorMenu();
            closeFilterPopupIntersectionKindMenu();
            periodFilterMenuAnchor = anchor === 'popup' ? 'popup' : 'toolbar';
            const menu = getPeriodFilterMenu();
            const { modeBtn, picker } = getPeriodFilterPicker(periodFilterMenuAnchor);
            const toolbarPicker = getPeriodFilterPicker('toolbar').picker;
            if (!menu || !modeBtn || modeBtn.disabled) {
                return;
            }

            if (!menu.querySelector('.period-filter-mode-item')) {
                buildPeriodFilterModeMenu();
            } else {
                updatePeriodFilterModeMenuItemCounts();
            }

            if (menu.parentElement !== document.body) {
                document.body.appendChild(menu);
            }

            positionPeriodFilterModeMenu();
            menu.classList.remove('hidden');
            bumpFloatingOverlayZIndex(menu);
            modeBtn.setAttribute('aria-expanded', 'true');
            highlightPeriodFilterModeMenu(null);
        }

        function closePeriodFilterModeMenu() {
            const menu = getPeriodFilterMenu();
            const toolbarPicker = getPeriodFilterPicker('toolbar').picker;
            if (menu) {
                menu.classList.add('hidden');
                if (toolbarPicker && menu.parentElement === document.body) {
                    toolbarPicker.appendChild(menu);
                }
            }
            for (const which of ['toolbar', 'popup']) {
                const { modeBtn } = getPeriodFilterPicker(which);
                if (modeBtn) {
                    modeBtn.setAttribute('aria-expanded', 'false');
                }
            }
            highlightPeriodFilterModeMenu(null);
            updatePeriodFilterMatchCount();
        }

        function isFloatingPopupInteractionTarget(target) {
            if (!target || !(target instanceof Element)) {
                return false;
            }
            const filterDock = el('filterPopupDock');
            if (filterDock && !filterDock.classList.contains('hidden')
                && target.closest('#filterPopupPanel, #filterTableWrap, #filterPopupHeader')) {
                return true;
            }
            const answerDock = el('answerPopupDock');
            if (answerDock && !answerDock.classList.contains('hidden')
                && target.closest('#answerPopupPanel, #answerTableWrap, #answerPopupHeader')) {
                return true;
            }
            return false;
        }

        function closeToolbarModeDropdownMenus() {
            closeSubmitRingModeMenu();
            closePeriodFilterModeMenu();
        }

        function selectPeriodFilterMode(mode) {
            const prevMode = periodFilterMode;
            periodFilterMode = normalizeFilterMode(mode);
            if (isPosnfreqFilterMode(prevMode) && !isPosnfreqFilterMode(periodFilterMode)) {
                clearPosnfreqMarkersInIframe();
                setFilterPopupPosnfreqGreenOnly(false, { skipReconcile: true, skipCounts: true });
            }
            if (isConn3FilterMode(prevMode) && !isConn3FilterMode(periodFilterMode)) {
                setFilterPopupConn3WindowOnly(false, { skipReconcile: true, skipCounts: true });
            }
            if (isFollowPctFilterMode(prevMode) && !isFollowPctFilterMode(periodFilterMode)) {
                setFilterPopupFollowSubfilter('off', { skipReconcile: true, skipCounts: true });
            }
            if (isConnectionFilterMode(prevMode) && !isConnectionFilterMode(periodFilterMode)) {
                setFilterPopupConnectionSubfilter('off', { skipReconcile: true, skipCounts: true });
            }
            try {
                localStorage.setItem(PERIOD_FILTER_MODE_KEY, periodFilterMode);
            } catch (e) { }
            normalizeFilterNoteTagsForMode(periodFilterMode);
            saveFilterNoteTagsSettings();
            normalizeFilterConnectionNoteTags();
            saveFilterConnectionNoteTagsSettings();
            closePeriodFilterModeMenu();
            closeFilterPopupNoteTagMenu();
            closeFilterPopupConnectionNoteTagMenu();
            closeFilterPopupNonexistColorMenu();
            closeFilterPopupIntersectionKindMenu();
            scheduleRebuildFilterNoteTagMenuCounts();
            syncPeriodFilterToolbarUi();
            if (periodFilterEnabled) {
                const deferHeavy = isDatebandFilterMode(periodFilterMode)
                    || supportsNoteTagFilter(periodFilterMode)
                    || supportsConnectionNoteTagFilter(periodFilterMode);
                refreshFilterPopup({
                    syncMain: false,
                    immediateRender: !deferHeavy,
                    deferHeavy,
                    clearPopupNav: true
                });
            }
            requestAnimationFrame(() => restoreKeyboardFocusTarget());
        }

        function updatePeriodFilterModeMenuItemCounts() {
            const menu = getPeriodFilterMenu();
            if (!menu) {
                return;
            }
            menu.querySelectorAll('.period-filter-mode-item').forEach((item) => {
                const mode = item.dataset.mode || '';
                const countSpan = item.querySelector('.period-filter-mode-item-count');
                if (countSpan) {
                    countSpan.textContent = String(filterModeCounts[mode] ?? 0);
                }
            });
        }

        function rebuildFilterModeCounts() {
            filterModeCounts = {};
            if (!sheetManager) {
                return;
            }

            sheetManager.ensureNonexistGreenFilterCache();
            for (const mode of VALID_FILTER_MODES) {
                filterModeCounts[mode] = getFilterParentCountForMode(mode);
            }
            rebuildFilterNoteTagMenuCounts();
            rebuildFilterConnectionNoteTagMenuCounts();

            const filteredEl = el('filterPopupFilteredCount');
            const parentEl = el('filterPopupParentCount');

            const normalized = normalizeFilterMode(mode);
            const label = getFilterModeTitleHint(normalized);
            const filteredTotal = getFilterPopupListTotal(total);
            const parentTotal = periodFilterEnabled && isPeriodFilterContextSheet()
                ? getFilterParentCountForMode(normalized)
                : 0;
            const listPos = getFilterPopupListPosition();
            const isEditing = positionInput && document.activeElement === positionInput;
            const showPosition = !isPreview
                && periodFilterEnabled
                && filteredTotal > 0
                && (listPos > 0 || isEditing);
            const compactPosnfreqCountUi = periodFilterEnabled && isPosnfreqFilterMode(normalized);
            const compactConn3CountUi = periodFilterEnabled && isConn3FilterMode(normalized);
            const compactFilterCountUi = compactPosnfreqCountUi || compactConn3CountUi;
            const parentSuffix = el('filterPopupParentSuffix');

            filteredEl.textContent = String(filteredTotal);
            parentEl.textContent = String(parentTotal);
            if (parentSuffix) {
                parentSuffix.classList.toggle('hidden', compactPosnfreqCountUi || compactConn3CountUi);
            }
            if (positionWrap) {
                positionWrap.classList.toggle('hidden', !showPosition);
            }

                    setFilterPopupPositionText(positionInput, listPos > 0 ? String(listPos) : '');

                setFilterPopupPositionInputWidth(positionInput, getFilterPopupPositionText(positionInput));
            }

            const noteTagLabel = getActiveNoteTagFilterValues().map((n) => `${n}:`).join(', ');
            let title = compactFilterCountUi
                ? `Có ${filteredTotal} kỳ khớp ${label}`
                : `Có ${filteredTotal} / ${parentTotal} kỳ khớp ${label}`;
            if (noteTagLabel) {
                title = compactFilterCountUi
                    ? `Có ${filteredTotal} kỳ (${label}, note ${noteTagLabel})`
                    : `Có ${filteredTotal} / ${parentTotal} kỳ (${label}, note ${noteTagLabel})`;
            }
            if (isNonexistFilterMode(normalized) && periodFilterEnabled) {
                const colorLabel = getNonexistFilterColorLabelList();
                const styles = getNonexistFilterStyleLabelList();
                const styleHint = isNonexistGreenFilterSelected() && styles ? `, kiểu ${styles}` : '';
                const numHint = isNonexistFilterNumEmpty() ? '' : ` AND số ${filterNonexistNum}`;
                const bracketHint = `[]${normalizeIntersectionFreqOp(filterNonexistBracketOp)}${filterNonexistBracketCount}`;

                const criteriaHint = [colorHint, bracketHint].filter(Boolean).join(', ');
                title = `Có ${filteredTotal} / ${parentTotal} kỳ nonexist (${criteriaHint}${styleHint}${numHint})`;

            if (!periodFilterEnabled) {
                title = 'Số kỳ: vị trí / đã lọc / mode (All)';

        function getFilterPopupRenderCacheKey() {
            if (!isPeriodFilterContextSheet()) {
                return '';
            }
            const rowLen = (sheetManager.sourceRows || []).length;
            const tags = filterNoteTags.slice().sort().join(',');
            const connTags = filterConnectionNoteTags.slice().sort().join(',');

            const colors = filterNonexistColors.slice().sort().join(',');
            const num = filterNonexistNum != null ? String(filterNonexistNum) : '';
            let posnfreqKey = '';
            if (isPosnfreqFilterMode(periodFilterMode)) {
                const sn = posnfreqSpecimenNum != null && Number.isFinite(posnfreqSpecimenNum)
                    ? String(posnfreqSpecimenNum)
                    : 'x';
                const src = Number.isFinite(posnfreqSourceRowIndex) && posnfreqSourceRowIndex >= 0
                    ? String(posnfreqSourceRowIndex)
                    : 'x';
                const strict = posnfreqSpecimenStrict ? '1' : '0';
                let sig = 'x';
                if (posnfreqRefSignature && Array.isArray(posnfreqRefSignature.positions)) {
                    sig = `${posnfreqRefSignature.frequency}:${posnfreqRefSignature.positions.join('.')}`;
                }
                posnfreqKey = `pf:${sn}:${src}:${strict}:${sig}`;
            }
            const ixKind = filterIntersectionKind === 'nearintersect' ? 'nearintersect' : 'intersect';
            const opTok = (op) => {
                const o = normalizeIntersectionFreqOp(op);
                if (o === '=') {
                    return 'eq';
                }
                if (o === '<=') {
                    return 'le';
                }
                return 'ge';
            };
            const ixKey = isIntersectionFilterMode(periodFilterMode)
                ? `ix:${ixKind}:xy:${filterIntersectionFreqX},${filterIntersectionFreqY}:${opTok(filterIntersectionOpX)}:${opTok(filterIntersectionOpY)}`
                : '';
            const dbKey = isDatebandFilterMode(periodFilterMode)
                ? `db:xy:${filterDatebandFreqX},${filterDatebandFreqY}:${opTok(filterDatebandOpX)}:${opTok(filterDatebandOpY)}`
                : '';
            const tailKey = isTailFilterMode(periodFilterMode)
                ? `tail:c:${filterTailCount}:${opTok(filterTailOp)}`
                : '';
            const nxBracketKey = isNonexistFilterMode(periodFilterMode)
                ? `nxb:${filterNonexistBracketCount}:${opTok(filterNonexistBracketOp)}`
                : '';
            const h2on = `h2on:${isFilterHeader2Enabled() ? 1 : 0}`;
            const chainSel = filterPopupChainSelected.map((v) => (v ? '1' : '0')).join('');
            const chainOn = `chain:${isFilterChainPickerEnabled() ? 1 : 0}:${chainSel}:${isFilterChainCombineAnd() ? 'and' : 'or'}`;
            return [
                periodFilterMode,
                tags,
                connTags,
                num,
                colors,
                styles,
                rowLen,
                rightPaneZoom,
                posnfreqKey,
                filterNonexistGreen005000 ? 'g005:1' : 'g005:0',
                ixKey,
                dbKey,
                tailKey,
                nxBracketKey,
                h2on,
                chainOn
            ].join('|');
        }

        function pinFilterPopupGeometry(dock, panel) {
            const posRect = dock.getBoundingClientRect();
            const sizeRect = panel.getBoundingClientRect();
            dock.style.right = 'auto';
            dock.style.left = `${Math.round(posRect.left)}px`;
            dock.style.top = `${Math.round(posRect.top)}px`;
            panel.style.width = `${Math.round(sizeRect.width)}px`;
            panel.style.height = `${Math.round(sizeRect.height)}px`;
            return {
                left: posRect.left,
                top: posRect.top,
                width: sizeRect.width,
                height: sizeRect.height
            };
        }

        function bindFloatingPopupHeaderDrag(config) {
            const {
                dock,
                panel,
                header,
                dragClass,
                onLayoutSave,
                onDragMove,
                onRaise,
                shouldSkipDragStart
            } = config;
            if (!dock || !panel || !header || header.dataset.floatingDragBound === '1') {
                return;
            }
            header.dataset.floatingDragBound = '1';

            let dragging = false;
            let pointerId = -1;
            let startX = 0;
            let startY = 0;
            let startLeft = 0;
            let startTop = 0;
            let lastClientX = 0;
            let lastClientY = 0;

            function applyDragTransform(clientX, clientY) {
                const dx = clientX - startX;
                const ty = Math.max(8 - startTop, clientY - startY);
                dock.style.transform = `translate3d(${dx}px, ${ty}px, 0)`;
                if (typeof onDragMove === 'function') {
                    onDragMove();
                }
            }

            function finishDrag(event) {
                if (!dragging) {
                    return;
                }
                dragging = false;
                const clientX = event && Number.isFinite(event.clientX) ? event.clientX : lastClientX;
                const clientY = event && Number.isFinite(event.clientY) ? event.clientY : lastClientY;
                const dx = clientX - startX;
                const dy = clientY - startY;
                dock.style.transform = '';
                dock.style.left = `${Math.round(startLeft + dx)}px`;
                dock.style.top = `${Math.round(Math.max(8, startTop + dy))}px`;
                dock.classList.remove(dragClass);
                if (pointerId >= 0) {
                    try {
                        if (header.hasPointerCapture && header.hasPointerCapture(pointerId)) {
                            header.releasePointerCapture(pointerId);
                        }
                    } catch (eCap) { /* ignore */ }
                }
                pointerId = -1;
                if (typeof onLayoutSave === 'function') {
                    onLayoutSave();
                }
                if (typeof onDragMove === 'function') {
                    onDragMove();
                }
            }

            header.addEventListener('pointerdown', (event) => {
                if (event.button !== 0) {
                    return;
                }
                if (typeof shouldSkipDragStart === 'function' && shouldSkipDragStart(event)) {
                    return;
                }
                if (typeof onRaise === 'function') {
                    onRaise();
                }
                const geometry = pinFilterPopupGeometry(dock, panel);
                dragging = true;
                pointerId = event.pointerId;
                dock.classList.add(dragClass);
                dock.style.transform = '';
                startX = event.clientX;
                startY = event.clientY;
                lastClientX = startX;
                lastClientY = startY;
                startLeft = geometry.left;
                startTop = geometry.top;
                try {
                    header.setPointerCapture(pointerId);
                } catch (eCap) { /* ignore */ }
                event.preventDefault();
            });

            header.addEventListener('pointermove', (event) => {
                if (!dragging || event.pointerId !== pointerId) {
                    return;
                }
                lastClientX = event.clientX;
                lastClientY = event.clientY;
                applyDragTransform(lastClientX, lastClientY);
            });

            header.addEventListener('pointerup', finishDrag);
            header.addEventListener('pointercancel', finishDrag);

            if (panel && typeof ResizeObserver !== 'undefined') {
                const resizeObserver = new ResizeObserver(() => {
                    if (dock.classList.contains('hidden') || dock.classList.contains(dragClass)
                        || panel.classList.contains('is-filter-popup-resizing')) {
                        return;
                    }
                    if (typeof config.onResize === 'function') {
                        config.onResize();
                    }
                });
                resizeObserver.observe(panel);
            }
        }

        function applyFilterPopupResizeDelta(direction, start, dx, dy, dock, panel) {
            let left = start.left;
            let top = start.top;
            let width = start.width;
            let height = start.height;
            const maxW = Math.max(FILTER_POPUP_MIN_WIDTH, window.innerWidth - 24);
            const maxH = Math.max(FILTER_POPUP_MIN_HEIGHT, window.innerHeight - 24);

            if (direction.includes('e')) {
                width = Math.min(maxW, Math.max(FILTER_POPUP_MIN_WIDTH, start.width + dx));
            }
            if (direction.includes('w')) {
                const nextW = Math.min(maxW, Math.max(FILTER_POPUP_MIN_WIDTH, start.width - dx));
                left = start.left + (start.width - nextW);
                width = nextW;
            }
            if (direction.includes('s')) {
                height = Math.min(maxH, Math.max(FILTER_POPUP_MIN_HEIGHT, start.height + dy));
            }
            if (direction.includes('n')) {
                const nextH = Math.min(maxH, Math.max(FILTER_POPUP_MIN_HEIGHT, start.height - dy));
                top = start.top + (start.height - nextH);
                height = nextH;
            }

            const maxLeft = Math.max(8, window.innerWidth - width - 8);
            const maxTop = Math.max(8, window.innerHeight - height - 8);
            left = Math.min(maxLeft, Math.max(8, left));
            top = Math.min(maxTop, Math.max(8, top));

            dock.style.left = `${Math.round(left)}px`;
            dock.style.top = `${Math.round(top)}px`;
            panel.style.width = `${Math.round(width)}px`;
            panel.style.height = `${Math.round(height)}px`;
        }

        function initFilterPopupResize() {
            const dock = el('filterPopupDock');
            const panel = el('filterPopupPanel');
            if (!dock || !panel || panel.dataset.resizeBound === '1') {
                return;
            }
            panel.dataset.resizeBound = '1';

            let resizing = false;
            let pointerId = -1;
            let direction = '';
            let start = null;
            let pendingDx = 0;
            let pendingDy = 0;

            function flushResizeMove() {
                filterPopupResizeMoveRaf = 0;
                if (!resizing || !start) {
                    return;
                }
                applyFilterPopupResizeDelta(
                    direction,
                    start,
                    pendingDx,
                    pendingDy,
                    dock,
                    panel
                );
                repositionOpenFilterPopupFloatingMenus();
                scheduleFilterPopupResizeThumbSync();
            }

            function scheduleResizeMove(dx, dy) {
                pendingDx = dx;
                pendingDy = dy;
                if (!filterPopupResizeMoveRaf) {
                    filterPopupResizeMoveRaf = requestAnimationFrame(flushResizeMove);
                }
            }

            function finishResize(event) {
                if (!resizing) {
                    return;
                }
                resizing = false;
                if (filterPopupResizeMoveRaf) {
                    cancelAnimationFrame(filterPopupResizeMoveRaf);
                    filterPopupResizeMoveRaf = 0;
                }
                if (start) {
                    const clientX = event && Number.isFinite(event.clientX)
                        ? event.clientX
                        : start.x + pendingDx;
                    const clientY = event && Number.isFinite(event.clientY)
                        ? event.clientY
                        : start.y + pendingDy;
                    applyFilterPopupResizeDelta(
                        direction,
                        start,
                        clientX - start.x,
                        clientY - start.y,
                        dock,
                        panel
                    );
                }
                repositionOpenFilterPopupFloatingMenus();
                setFilterPopupResizeActive(false);
                finishFilterPopupResizeSync();
                start = null;
                direction = '';
                if (pointerId >= 0) {
                    try {
                        const handle = panel.querySelector('.filter-popup-resize-handle.is-capturing');
                        if (handle && handle.releasePointerCapture) {
                            handle.releasePointerCapture(pointerId);
                        }
                    } catch (eCap) { /* ignore */ }
                    panel.querySelectorAll('.filter-popup-resize-handle.is-capturing').forEach((h) => {
                        h.classList.remove('is-capturing');
                    });
                }
                pointerId = -1;
                scheduleSaveFilterPopupLayout();
            }

            panel.querySelectorAll('.filter-popup-resize-handle').forEach((handle) => {
                handle.addEventListener('pointerdown', (event) => {
                    if (event.button !== 0) {
                        return;
                    }
                    direction = String(handle.dataset.resize || '');
                    if (!direction) {
                        return;
                    }
                    const geometry = pinFilterPopupGeometry(dock, panel);
                    start = {
                        left: geometry.left,
                        top: geometry.top,
                        width: geometry.width,
                        height: geometry.height,
                        x: event.clientX,
                        y: event.clientY
                    };
                    resizing = true;
                    pointerId = event.pointerId;
                    pendingDx = 0;
                    pendingDy = 0;
                    panel.querySelectorAll('.filter-popup-resize-handle.is-capturing').forEach((h) => {
                        h.classList.remove('is-capturing');
                    });
                    handle.classList.add('is-capturing');
                    setFilterPopupResizeActive(true);
                    try {
                        handle.setPointerCapture(pointerId);
                    } catch (eCap) { /* ignore */ }
                    event.preventDefault();
                    event.stopPropagation();
                });
            });

            document.addEventListener('pointermove', (event) => {
                if (!resizing || event.pointerId !== pointerId || !start) {
                    return;
                }
                scheduleResizeMove(event.clientX - start.x, event.clientY - start.y);
            });

            document.addEventListener('pointerup', (event) => {
                if (!resizing || event.pointerId !== pointerId) {
                    return;
                }
                finishResize(event);
            });

            document.addEventListener('pointercancel', (event) => {
                if (!resizing || event.pointerId !== pointerId) {
                    return;
                }
                finishResize(event);
            });
        }

        function initFilterPopupKeyboard() {

                const shouldToggle = shiftPressedAlone && !shiftChordUsed;

            if (!s) return [];

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function shouldHighlightNote(noteText) {
            if (!noteText || noteText === '?') return false;
            const noteParts = String(noteText).split('   ');
            for (const part of noteParts) {
                const openBrace = part.indexOf('{');
                const closeBrace = part.indexOf('}', openBrace + 1);
                if (openBrace >= 0 && closeBrace > openBrace) {
                    const inside = part.substring(openBrace + 1, closeBrace);
                    const nums = inside.split(',').map(x => x.trim()).filter(Boolean);
                    if (nums.length >= 3) return true;
                }
            }
            return false;
        }

        function renderGeneratedNoteHtml(noteText) {
            const escaped = escapeHtml(noteText || '');
            return escaped.replace(/\|([^|]*)\|/g, (match, inner) => {
                const highlightedInner = inner.replace(/\b\d+\b/g, (num) => {
                    return `<span style="color:rgb(0,80,0);font-weight:bold">${num}</span>`;
                });
                return `|${highlightedInner}|`;
            });
        }

            let html = '<table><thead><tr><th>date</th><th>id</th><th>result</th><th>note</th><th>nonexist</th></tr></thead><tbody>';
            for (let i = 0; i < selectedLines.length; i++) {
                const s = selectedLines[i];
                const date = s.date || s.Date || '';
                const id = s.id || s.ID || '';
                const result = s.result || s.Result || '';
                const note = s.note || s.Note || '';
                const nonexist = s.nonexist || s.Nonexist || '';
                const noteHtml = renderGeneratedNoteHtml(note);
                const noteStyle = shouldHighlightNote(note) ? ' style="background:#ff0;"' : '';
                html += `<tr data-i="${i}" style="cursor:pointer"><td>${date}</td><td>${id}</td><td>${result}</td><td class="cell-note"${noteStyle}>${noteHtml}</td><td>${nonexist}</td></tr>`;
