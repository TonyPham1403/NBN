        function initFilterPopupDrag() {
            const dock = el('filterPopupDock');
            const header = el('filterPopupHeader');
            if (!dock || !header || header.dataset.dragBound === '1') {
                return;
            }
            header.dataset.dragBound = '1';

            let dragging = false;
            let startX = 0;
            let startY = 0;
            let startLeft = 0;
            let startTop = 0;

            const panel = el('filterPopupPanel');

            function blockFilterPopupDblclickExpand(event) {
                event.preventDefault();
                event.stopPropagation();
            }

            header.addEventListener('dblclick', blockFilterPopupDblclickExpand);
            if (panel) {
                panel.addEventListener('dblclick', (event) => {
                    if (event.target.closest('.filter-popup-filter-tools')) {
                        return;
                    }
                    blockFilterPopupDblclickExpand(event);
                });
            }

            header.addEventListener('mousedown', (event) => {
                if (event.button !== 0
                    || event.target.closest('#filterPopupClose')
                    || event.target.closest('.filter-popup-filter-tools')) {
                    return;
                }
                const geometry = pinFilterPopupGeometry(dock, panel);
                dragging = true;
                startX = event.clientX;
                startY = event.clientY;
                startLeft = geometry.left;
                startTop = geometry.top;
                event.preventDefault();
            });

            document.addEventListener('mousemove', (event) => {
                if (!dragging) {
                    return;
                }
                dock.style.left = `${startLeft + event.clientX - startX}px`;
                dock.style.top = `${Math.max(8, startTop + event.clientY - startY)}px`;
            });

            document.addEventListener('mouseup', () => {
                if (!dragging) {
                    return;
                }
                dragging = false;
                scheduleSaveFilterPopupLayout();
            });

            if (panel && typeof ResizeObserver !== 'undefined') {
                const resizeObserver = new ResizeObserver(() => {
                    if (dock.classList.contains('hidden')) {
                        return;
                    }
                    scheduleSaveFilterPopupLayout();
                });
                resizeObserver.observe(panel);
            }

            applyFilterPopupLayout();
        }

        function pinFilterPopupGeometry(dock, panel) {
            const posRect = dock.getBoundingClientRect();
            const sizeRect = panel.getBoundingClientRect();
            dock.style.right = 'auto';
            dock.style.left = `${Math.round(posRect.left)}px`;
            dock.style.top = `${Math.round(posRect.top)}px`;
            panel.style.width = `${Math.round(sizeRect.width)}px`;
            panel.style.height = `${Math.round(sizeRect.height)}px`;
            return {
                left: posRect.left,
                top: posRect.top,
                width: sizeRect.width,
                height: sizeRect.height
            };
        }

        function applyFilterPopupResizeDelta(direction, start, dx, dy, dock, panel) {
            let left = start.left;
            let top = start.top;
            let width = start.width;
            let height = start.height;
            const maxW = Math.max(FILTER_POPUP_MIN_WIDTH, window.innerWidth - 24);
            const maxH = Math.max(FILTER_POPUP_MIN_HEIGHT, window.innerHeight - 24);

            if (direction.includes('e')) {
                width = Math.min(maxW, Math.max(FILTER_POPUP_MIN_WIDTH, start.width + dx));
            }
            if (direction.includes('w')) {
                const nextW = Math.min(maxW, Math.max(FILTER_POPUP_MIN_WIDTH, start.width - dx));
                left = start.left + (start.width - nextW);
                width = nextW;
            }
            if (direction.includes('s')) {
                height = Math.min(maxH, Math.max(FILTER_POPUP_MIN_HEIGHT, start.height + dy));
            }
            if (direction.includes('n')) {
                const nextH = Math.min(maxH, Math.max(FILTER_POPUP_MIN_HEIGHT, start.height - dy));
                top = start.top + (start.height - nextH);
                height = nextH;
            }

            const maxLeft = Math.max(8, window.innerWidth - width - 8);
            const maxTop = Math.max(8, window.innerHeight - height - 8);
            left = Math.min(maxLeft, Math.max(8, left));
            top = Math.min(maxTop, Math.max(8, top));

            dock.style.left = `${Math.round(left)}px`;
            dock.style.top = `${Math.round(top)}px`;
            panel.style.width = `${Math.round(width)}px`;
            panel.style.height = `${Math.round(height)}px`;
        }

        function initFilterPopupResize() {
            const dock = el('filterPopupDock');
            const panel = el('filterPopupPanel');
            if (!dock || !panel || panel.dataset.resizeBound === '1') {
                return;
            }
            panel.dataset.resizeBound = '1';

            let resizing = false;
            let direction = '';
            let start = null;

            panel.querySelectorAll('.filter-popup-resize-handle').forEach((handle) => {
                handle.addEventListener('mousedown', (event) => {
                    if (event.button !== 0) {
                        return;
                    }
                    direction = String(handle.dataset.resize || '');
                    if (!direction) {
                        return;
                    }
                    const geometry = pinFilterPopupGeometry(dock, panel);
                    start = {
                        left: geometry.left,
                        top: geometry.top,
                        width: geometry.width,
                        height: geometry.height,
                        x: event.clientX,
                        y: event.clientY
                    };
                    resizing = true;
                    event.preventDefault();
                    event.stopPropagation();
                });
            });

            document.addEventListener('mousemove', (event) => {
                if (!resizing || !start) {
                    return;
                }
                applyFilterPopupResizeDelta(
                    direction,
                    start,
                    event.clientX - start.x,
                    event.clientY - start.y,
                    dock,
                    panel
                );
            });

            document.addEventListener('mouseup', () => {
                if (!resizing) {
                    return;
                }
                resizing = false;
                start = null;
                direction = '';
                scheduleSaveFilterPopupLayout();
            });
        }

        function isPeriodFilterShortcutBlockedTarget(target) {
            if (!target || !(target instanceof Element)) {
                return false;
            }
            const tag = target.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
                return true;
            }
            if (target.isContentEditable) {
                return true;
            }
            return !!target.closest('[contenteditable="true"]');
        }

        function initParentSpaceSubmitShortcut() {
            if (document.documentElement.dataset.parentSpaceSubmitBound === '1') {
                return;
            }
            document.documentElement.dataset.parentSpaceSubmitBound = '1';

            document.addEventListener('keydown', (event) => {
                if (event.code !== 'Space' || event.repeat) {
                    return;
                }
                if (isPeriodFilterShortcutBlockedTarget(event.target)) {
                    return;
                }
                if (!event.target || event.target.ownerDocument !== document) {
                    return;
                }

                const frame = el('okFrame');
                if (!frame || !frame.contentWindow) {
                    return;
                }

                event.preventDefault();

        function togglePeriodFilterFromShortcut() {

        }

        function initPeriodFilterCtrlShortcut() {
            if (document.documentElement.dataset.periodFilterCtrlBound === '1') {
                return;
            }
            document.documentElement.dataset.periodFilterCtrlBound = '1';

            let ctrlPressedAlone = false;
            let ctrlChordUsed = false;

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Control') {
                    if (event.repeat) {
                        return;
                    }
                    ctrlPressedAlone = true;
                    ctrlChordUsed = false;
                    if (!isPeriodFilterShortcutBlockedTarget(event.target)) {
                        event.preventDefault();
                    }
                    return;
                }
                if (event.ctrlKey) {
                    ctrlChordUsed = true;
                }
            }, true);

            document.addEventListener('keyup', (event) => {
                if (event.key !== 'Control') {
                    return;
                }
                const shouldToggle = ctrlPressedAlone && !ctrlChordUsed;
                ctrlPressedAlone = false;
                ctrlChordUsed = false;
                if (!shouldToggle || isPeriodFilterShortcutBlockedTarget(event.target)) {
                    return;
                }
                event.preventDefault();
                event.stopPropagation();
                togglePeriodFilterFromShortcut();
            }, true);
        }

        function parseNums(s) {
            if (!s) return [];
            return String(s).split(/[\|,;\s]+/).map(x => parseInt(x, 10)).filter(n => !isNaN(n));
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function shouldHighlightNote(noteText) {
            if (!noteText || noteText === '?') return false;
            const noteParts = String(noteText).split('   ');
            for (const part of noteParts) {
                const openBrace = part.indexOf('{');
                const closeBrace = part.indexOf('}', openBrace + 1);
                if (openBrace >= 0 && closeBrace > openBrace) {
                    const inside = part.substring(openBrace + 1, closeBrace);
                    const nums = inside.split(',').map(x => x.trim()).filter(Boolean);
                    if (nums.length >= 3) return true;
                }
            }
            return false;
        }

        function renderGeneratedNoteHtml(noteText) {
            const escaped = escapeHtml(noteText || '');
            return escaped.replace(/\|([^|]*)\|/g, (match, inner) => {
                const highlightedInner = inner.replace(/\b\d+\b/g, (num) => {
                    return `<span style="color:rgb(0,80,0);font-weight:bold">${num}</span>`;
                });
                return `|${highlightedInner}|`;
            });
        }

        function renderSelectedLines() {
            const wrap = el('selectedWrap');
            if (!wrap) return;
            if (!selectedLines || selectedLines.length === 0) { wrap.innerHTML = '<div class="small">Chưa chọn hàng. Click 1 hàng bên phải để lấy 11 dòng.</div>'; return; }
            let html = '<table><thead><tr><th>date</th><th>id</th><th>result</th><th>note</th><th>nonexist</th></tr></thead><tbody>';
            for (let i = 0; i < selectedLines.length; i++) {
                const s = selectedLines[i];
                const date = s.date || s.Date || '';
                const id = s.id || s.ID || '';
                const result = s.result || s.Result || '';
                const note = s.note || s.Note || '';
                const nonexist = s.nonexist || s.Nonexist || '';
                const noteHtml = renderGeneratedNoteHtml(note);
                const noteStyle = shouldHighlightNote(note) ? ' style="background:#ff0;"' : '';
                html += `<tr data-i="${i}" style="cursor:pointer"><td>${date}</td><td>${id}</td><td>${result}</td><td class="cell-note"${noteStyle}>${noteHtml}</td><td>${nonexist}</td></tr>`;
            }
            html += '</tbody></table>';
            wrap.innerHTML = html;
            // clicking a row in the selected table makes it the 'primary' row (highlight numbers in summary)
            wrap.querySelectorAll('tbody tr').forEach(tr => tr.addEventListener('click', () => {
                const i = Number(tr.dataset.i);
                const s = selectedLines[i];
                const nums = parseNums(s.result || s.Result || '');
                selectedNums.clear(); nums.forEach(n => selectedNums.add(n));
                renderSummaryTable();
            }));
        }

        function renderSummaryTable() {
            const wrap = el('summaryWrap');
            if (!wrap) return;
            if (!selectedLines || selectedLines.length === 0) { wrap.innerHTML = '<div class="small">No selection</div>'; return; }
            const counts = {};
            for (const r of selectedLines) {
                const nums = parseNums(r.result || r.Result || '');
                for (const n of nums) counts[n] = (counts[n] || 0) + 1;
            }
            let html = '<table><thead><tr><th>num</th><th>count</th></tr></thead><tbody>';
            for (let n = 1; n <= MAX_NUM; n++) {
                const c = counts[n] || 0;
                const highlight = selectedNums.has(n) ? 'background:var(--accent);color:#05210a;font-weight:800' : '';
                html += `<tr data-num="${n}" style="${highlight}"><td>${n}</td><td>${c}</td></tr>`;
            }
            html += '</tbody></table>';
            wrap.innerHTML = html;
        }

                    rememberKeyboardFocusTarget('left');

            });
            // left controls live inside the iframe now; guard bindings in parent
            const pickBtn = el('pickBtn'); if (pickBtn) pickBtn.addEventListener('click', () => {

            const resetBtn = el('resetBtn'); if (resetBtn) resetBtn.addEventListener('click', () => { selectedLines = []; selectedNums.clear(); renderSelectedLines(); renderSummaryTable(); });
            const submitBtn = el('submitBtn'); if (submitBtn) submitBtn.addEventListener('click', () => { alert('Submit clicked — trang web chỉ mô phỏng giao diện.'); });
            const copyBtn = el('copySelectionBtn'); if (copyBtn) copyBtn.addEventListener('click', () => {
                if (!selectedLines || selectedLines.length === 0) return alert('Chưa có selection');
                const txt = selectedLines.map(s => (s.result || s.Result || '') + (s.note ? '\t' + (s.note || s.Note || '') : '')).join('\n');
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(txt).catch(() => { });
                } else {
                    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
                }
            });
            const searchBox = el('searchBox'); if (searchBox) searchBox.addEventListener('input', () => {
                const v = searchBox.value.replace(/[^0-9]/g, '');
                const rows = document.querySelectorAll('#summaryWrap tbody tr');
                if (!v) { rows.forEach(r => r.style.fontWeight = ''); return; }
                rows.forEach(r => {
                    const num = r.dataset.num || r.querySelector('td')?.textContent || '';
                    if (String(num).includes(v)) r.style.fontWeight = '900'; else r.style.fontWeight = '';
                });
            });
        });
    </script>
</body>

</html>
