<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quick Lotto Helper</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #0b1220;
            --muted: #94a3b8;
            --accent: #38ef7d;
            --card: #111827;
            --text: #e6eef8
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-family: Inter, Segoe UI, Arial;
            background: var(--bg);
            color: var(--text)
        }

        .wrap {
            display: flex;
            gap: 18px;
            padding: 18px;
            flex: 1;
            min-height: 0;
            box-sizing: border-box
        }

        .app-title {
            font-weight: 700;
        }

        .zoom-toolbar {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #475569;
            flex-shrink: 0;
        }

        .zoom-toolbar button {
            width: 22px;
            height: 22px;
            padding: 0;
            border-radius: 5px;
            border: 1px solid #b8c2cc;
            background: #ffffff;
            color: #334155;
            cursor: pointer;
            line-height: 1;
            font-size: 14px;
        }

        .zoom-toolbar button:hover {
            background: #eef2f7;
        }

        .zoom-toolbar input[type=range] {
            width: 112px;
            accent-color: #38ef7d;
            cursor: pointer;
        }

        .zoom-value {
            min-width: 42px;
            text-align: right;
            font-size: 12px;
            color: #475569;
            font-variant-numeric: tabular-nums;
        }

        .pane {
            background: var(--panel);
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 12px;
            min-height: 0;
            overflow: auto
        }

        .left {
            flex: 1;
            min-width: 360px
        }

        /* Prevent left pane from showing an outer scrollbar; iframe handles internal scrolling */
        .pane.left {
            overflow: hidden;
        }

        .right {
            flex: 1;
            min-width: 420px;
            background: #ffffff;
            color: #111111;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .pane.right table,
        .pane.right th,
        .pane.right td {
            background: #ffffff;
            color: #111111;
        }


        .pane.right table {
            margin-top: 0;
        }

        .pane.right table thead th {
            position: sticky;
            top: 0;
            z-index: 3;
            background: #ffffff;
            border: 1px solid #94a3b8;
            border-bottom: 2px solid #64748b;
            box-shadow: 0 1px 0 #cbd5e1;
        }

        textarea#input {
            width: 100%;
            height: 160px;
            padding: 10px;
            font-size: 15px;
            border-radius: 6px;
            border: 1px solid #22303a;
            background: #02101a;
            color: var(--text);
            resize: vertical
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 8px
        }

        select,
        button,
        input[type=text] {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #26343f;
            background: #08121a;
            color: var(--text)
        }

        .numbers {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px
        }

        .num {
            width: 36px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: #08121a;
            border: 1px solid #16323a;
            cursor: pointer
        }

        .num.selected {
            background: var(--accent);
            color: #05210a;
            font-weight: 800
        }

        .num.blocked {
            background: #000;
            color: #777
        }

        .num.answer {
            background: green;
            color: white
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px
        }

        th,
        td {
            padding: 6px;
            border: 1px solid #22303a;
            font-size: 13px
        }

        .pane.right table thead th {
            position: sticky;
            top: 0;
            z-index: 3;
            background: #ffffff;
            border: 1px solid #94a3b8;
            border-bottom: 2px solid #64748b;
            box-shadow: 0 1px 0 #cbd5e1;
        }

        .row-actions button {
            padding: 6px 8px
        }

        .small {
            font-size: 13px;
            color: var(--muted)
        }

        .file-row {
            display: flex;
            gap: 8px;
            align-items: center
        }

        .selected-count {
            margin-left: auto;
            color: var(--muted)
        }

        .copy-selected {
            background: #0b6d3a;
            color: white;
            border: none
        }

        /* Sheet tabs styling - inspired by Excel */
        .sheet-tabs-container {
            background: #f5f5f5;
            border-top: 1px solid #d0d0d0;
            overflow-x: auto;
            padding: 0;
            margin-top: auto;
            flex-shrink: 0;
            height: 36px;
            display: flex;
            align-items: center;
        }

        .sheet-tabs-bar {
            display: flex;
            gap: 4px;
            padding: 2px 4px;
            align-items: center;
            height: 100%;
        }

        .sheet-tab {
            background: #e0e0e0;
            border: 1px solid #bbb;
            color: #333;
            padding: 4px 12px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px 4px 0 0;
            transition: background 0.2s, color 0.2s;
            white-space: nowrap;
        }

        .sheet-tab:hover {
            background: #d4d4d4;
        }

        .sheet-tab.active {
            background: #ffffff;
            border-bottom: 2px solid #38ef7d;
            color: #111;
            font-weight: 600;
        }

        .sheet-tab-add {
            background: #e0e0e0;
            border: 1px solid #bbb;
            color: #333;
            padding: 4px 8px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
            min-width: 24px;
            height: 24px;
        }

        .sheet-tab-add:hover {
            background: #d4d4d4;
        }

        /* Right pane container with flex layout for tabs */
        .right-pane-wrapper {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
            overflow: hidden;
        }

        .sheet-zoom-bar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            padding: 2px 8px 4px;
            background: #f8fafc;
            border-top: 1px solid #d7dde5;
            border-bottom: 1px solid #d7dde5;
            flex-shrink: 0;
        }

        .sheet-tools-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            background: #f8fafc;
            border-top: 1px solid #d7dde5;
            border-bottom: 1px solid #d7dde5;
            flex-shrink: 0;
            position: relative;
            z-index: 25;
            overflow: visible;
        }

        .sheet-tools-group {
            display: inline-flex;
            align-items: stretch;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            overflow: hidden;
            height: 24px;
            flex: 0 0 auto;
        }

        .sheet-tools-bar button,
        .sheet-tools-bar select {
            color: #0f172a;
            font-size: 12px;
        }

        .sheet-tools-toggle {
            width: 28px;
            height: 100%;
            padding: 0;
            position: relative;
            font-size: 0;
            line-height: 0;
            border: 0;
            border-right: 1px solid #cbd5e1;
            border-radius: 0;
            background: #ffffff;
        }

        .sheet-tools-toggle:hover {
            background: #f8fafc;
        }

        .sheet-tools-toggle::before {
            content: "";
            position: absolute;
            left: 7px;
            top: 3px;
            width: 11px;
            height: 11px;
            border: 2px solid #64748b;
            border-radius: 2px;
            transform: rotate(45deg);
            background: #ffffff;
            box-sizing: border-box;
        }

        .sheet-tools-toggle::after {
            content: "";
            position: absolute;
            left: 5px;
            bottom: 4px;
            width: 18px;
            height: 3px;
            border-radius: 2px;
            background: #94a3b8;
        }

        .sheet-tools-toggle.active {
            background: #d1fae5;
        }

        .sheet-tools-toggle.active::before {
            border-color: #047857;
        }

        .sheet-tools-toggle.active::after {
            background: #10b981;
        }

        .sheet-tools-mode-wrap {
            position: relative;
            width: 42px;
            height: 100%;
            background: #ffffff;
            flex: 0 0 auto;
        }

        .sheet-tools-mode-wrap.enabled {
            background: #006400;
        }

        .sheet-tools-mode-wrap::after {
            content: "▾";
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-52%);
            font-size: 10px;
            color: #334155;
            pointer-events: none;
        }

        .sheet-tools-mode-wrap.enabled::after {
            color: #ffffff;
        }

        .sheet-tools-mode-value {
            position: absolute;
            left: 6px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 10px;
            font-weight: 700;
            line-height: 1;
            color: #475569;
            text-transform: uppercase;
            pointer-events: none;
        }

        .sheet-tools-mode-wrap.enabled .sheet-tools-mode-value {
            color: #ffffff;
            font-weight: 800;
        }

        #submitRingModeSelect {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            padding: 0;
            border: 0;
            border-radius: 0;
            background: #ffffff;
            color: #0f172a;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
        }

        #submitRingModeSelect option {
            background: #ffffff;
            color: #0f172a;
        }

        #submitRingModeSelect:disabled {
            cursor: not-allowed;
            opacity: 1 !important;
            filter: none !important;
            -webkit-text-fill-color: inherit !important;
        }

        .sheet-tools-mode-wrap.disabled {
            opacity: 1;
        }

        .sheet-tools-group+.sheet-tools-group {
            margin-left: 6px;
        }

        .sheet-tools-toggle.filter-toggle::before {
            left: 8px;
            top: 3px;
            width: 0;
            height: 0;
            border: 0;
            border-radius: 0;
            transform: none;
            background: transparent;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 9px solid #64748b;
        }

        .sheet-tools-toggle.filter-toggle::after {
            left: 12px;
            bottom: 3px;
            width: 3px;
            height: 7px;
            border-radius: 1px;
            background: #64748b;
        }

        .sheet-tools-toggle.filter-toggle.active::before {
            border-top-color: #047857;
        }

        .sheet-tools-toggle.filter-toggle.active::after {
            background: #10b981;
        }

        .sheet-tools-group.filter-tools-group {
            height: 24px;
            overflow: visible;
            position: relative;
            z-index: 30;
        }

        .period-filter-mode-picker {
            position: relative;
            height: 100%;
            flex: 0 0 auto;
            overflow: visible;
        }

        .period-filter-mode-btn {
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            gap: 4px;
            height: 100%;
            margin: 0;
            padding: 0 8px;
            border: 0;
            border-left: 1px solid #cbd5e1;
            border-radius: 0;
            background: #ffffff;
            color: #111111;
            font-size: 12px;
            font-weight: 700;
            line-height: 24px;
            cursor: pointer;
            white-space: nowrap;
            box-sizing: border-box;
        }

        .period-filter-mode-btn:not(:disabled) {
            background: #006400;
            color: #ffffff;
            border-left-color: #004d00;
        }

        .period-filter-mode-btn:disabled {
            opacity: 1;
            color: #64748b;
            cursor: not-allowed;
            background: #f1f5f9;
        }

        .period-filter-mode-caret {
            font-size: 10px;
            line-height: 1;
            opacity: 0.9;
            flex-shrink: 0;
        }

        .period-filter-mode-menu {
            position: fixed;
            z-index: 2500;
            min-width: 88px;
            margin: 0;
            padding: 4px 0;
            list-style: none;
            background: #ffffff;
            color: #111111;
            border: 1px solid #94a3b8;
            border-radius: 4px;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.18);
            max-height: 240px;
            overflow-y: auto;
        }

        .period-filter-mode-menu.hidden {
            display: none;
        }

        .period-filter-mode-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: 600;
            color: #111111;
            cursor: pointer;
            white-space: nowrap;
            line-height: 1.2;
        }

        .period-filter-mode-item-label {
            flex: 1 1 auto;
        }

        .period-filter-mode-item-count {
            flex: 0 0 auto;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .period-filter-mode-item:hover,
        .period-filter-mode-item.previewing {
            background: #fff3c4;
        }

        .period-filter-mode-item.selected {
            background: #e8f5e9;
            font-weight: 700;
        }

        .period-filter-dateband-swatch {
            display: inline-block;
            min-width: 30px;
            height: 14px;
            background: #00b0f0;
            color: #000000;
            border-radius: 2px;
            vertical-align: middle;
            box-sizing: border-box;
        }

        .period-filter-mode-item[data-mode="dateband"] .period-filter-mode-item-label.period-filter-dateband-swatch {
            flex: 0 0 auto;
        }

        #periodFilterMatchCount {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            width: auto;
            height: 100%;
            padding: 0 4px;
            box-sizing: content-box;
            border-left: 1px solid #cbd5e1;
            background: #f8fafc;
            color: #111111;
            font-size: 12px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        #periodFilterMatchCount.enabled,
        .period-filter-match-count.enabled {
            background: #eefbf3;
            color: #111111;
        }

        #periodFilterMatchCount.preview {
            background: #fff9e6;
        }

        #periodFilterMatchCount.preview.enabled {
            background: #fff3c4;
        }

        /* Floating find-style popup: no modal backdrop, clicks pass through outside the panel */
        .filter-popup-dock {
            position: fixed;
            z-index: 1200;
            top: 88px;
            right: 28px;
            width: fit-content;
            height: fit-content;
            max-width: calc(100vw - 24px);
            max-height: calc(100vh - 24px);
            pointer-events: none;
        }

        .filter-popup-dock.hidden {
            display: none;
        }

        .filter-popup-panel {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            width: min(900px, 56vw);
            height: min(68vh, 680px);
            min-width: 360px;
            min-height: 220px;
            max-width: calc(100vw - 24px);
            max-height: calc(100vh - 24px);
            resize: both;
            overflow: hidden;
            background: #ffffff;
            color: #111111;
            border: 1px solid #94a3b8;
            border-radius: 4px;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.22);
        }

        .filter-popup-body {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 0 18px 18px 0;
            box-sizing: border-box;
            overflow: hidden;
        }

        .filter-popup-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            background: #f8fafc;
            border-bottom: 1px solid #d7dde5;
            flex-shrink: 0;
            cursor: move;
            user-select: none;
        }

        .filter-popup-title {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            color: #0f172a;
            flex-shrink: 0;
        }

        .filter-popup-title-count {
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .filter-popup-hint {
            margin-left: auto;
            font-size: 11px;
            color: #94a3b8;
        }

        .filter-popup-close {
            width: 22px;
            height: 22px;
            padding: 0;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background: #fff;
            color: #334155;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            flex-shrink: 0;
        }

        .filter-popup-close:hover {
            background: #f1f5f9;
        }

        .filter-popup-empty {
            padding: 20px 12px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }

        /* Same table viewport styling as #tableWrap */
        .right-table-viewport {
            background: #ffffff;
            color: #111111;
            --right-table-zoom: 1;
            box-sizing: border-box;
        }

        #filterTableWrap table,
        #filterTableWrap th,
        #filterTableWrap td {
            background: #ffffff;
            color: #111111;
        }

        #filterTableWrap tr.filter-popup-row-focus td {
            box-shadow: inset 0 0 0 2px #000000;
        }

        #filterTableWrap td.window-selected,
        #filterTableWrap td.window-edge-top,
        #filterTableWrap td.window-edge-bottom,
        #filterTableWrap td.window-edge-left,
        #filterTableWrap td.window-edge-right,
        #filterTableWrap td.window-divider-left,
        #filterTableWrap td.window-divider-right,
        #filterTableWrap td.window-focus {
            border-color: #e0e0e0 !important;
            border-width: 1px !important;
            box-shadow: none !important;
        }

        #filterTableWrap .win-label-inline {
            display: none !important;
        }

        .sheet-data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0;
            zoom: var(--right-table-zoom, 1);
        }

        .sheet-data-table thead th {
            position: sticky;
            top: 0;
            z-index: 20;
            background: #ffffff;
            border: 1px solid #94a3b8;
            border-bottom: 2px solid #64748b;
            box-shadow: 0 1px 0 #cbd5e1;
            font-weight: 700;
        }

        .sheet-data-table tbody tr.data-row {
            transition: background 0.15s;
        }

        .sheet-data-table tbody tr.data-row:hover {
            background: #f0f0f0;
        }

        .sheet-data-table tbody tr.empty-data-row {
            background: #fafafa;
            color: #aaa;
        }

        .sheet-data-table tbody tr.empty-data-row:hover {
            background: #f5f5f5;
        }

        .sheet-data-table td {
            padding: 6px;
            border: 1px solid #e0e0e0;
            font-size: 13px;
        }

        .combo-sheet-grid {
            table-layout: fixed;
        }

        .combo-sheet-grid td {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .combo-sheet-grid .col-a,
        .combo-sheet-grid .col-b,
        .combo-sheet-grid .col-i {
            width: 86px;
        }

        .combo-sheet-grid .col-c,
        .combo-sheet-grid .col-f,
        .combo-sheet-grid .col-g,
        .combo-sheet-grid .col-h,
        .combo-sheet-grid .col-j {
            width: 54px;
        }

        .combo-sheet-grid .col-k {
            width: 28px;
        }

        .combo-sheet-grid .col-d,
        .combo-sheet-grid .col-e {
            width: 22px;
        }

        .combo-sheet-grid .cell-col-a,
        .combo-sheet-grid .cell-col-b,
        .combo-sheet-grid .cell-col-c,
        .combo-sheet-grid .cell-col-f,
        .combo-sheet-grid .cell-col-i,
        .combo-sheet-grid .cell-col-j,
        .combo-sheet-grid .cell-col-k {
            text-align: center;
        }

        .combo-sheet-grid .blank-cell {
            background: #fff;
        }

        .combo-sheet-grid .combo-header-row td {
            position: sticky;
            top: 0;
            z-index: 20;
            font-weight: 700;
            background: #fbfdff;
            border-bottom: 2px solid #64748b;
            box-shadow: 0 1px 0 #cbd5e1;
        }

        .combo-sheet-grid .combo-header-row td.combo-logic-focus-cell {
            z-index: 21;
            background: #f8fafc;
            box-shadow: inset 0 0 0 3px #000, 0 1px 0 #cbd5e1;
        }

        .combo-sheet-grid .cell-col-f,
        .combo-sheet-grid .cell-col-g,
        .combo-sheet-grid .cell-col-h {
            background: #f8fafc;
        }

        .combo-sheet-grid .cell-col-i,
        .combo-sheet-grid .cell-col-j {
            background: #fdfdfd;
        }

        .combo-sheet-grid .cell-col-k {
            background: #fdfdfd;
        }

        .combo-sheet-grid .combo-cell-input,
        .combo-sheet-grid .combo-cell-text {
            width: 100%;
            box-sizing: border-box;
            border: 0;
            background: transparent;
            color: inherit;
            font: inherit;
            text-align: inherit;
            padding: 0;
            outline: none;
        }

        .combo-sheet-grid .combo-cell-input[type=text] {
            min-height: 20px;
        }

        .combo-sheet-grid .combo-cell-toggle {
            width: 16px;
            height: 16px;
            vertical-align: middle;
            accent-color: #38ef7d;
        }

        .sheet-data-table td.cell-result {
            position: relative;
            padding-right: 28px;
            font-family: inherit;
            font-weight: inherit;
        }

        .sheet-data-table td.cell-note {
            position: relative;
            padding-right: 28px;
        }

        .sheet-data-table td.cell-nonexist {
            position: relative;
            padding-right: 28px;
        }

        .win-label-inline {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #000;
            background: rgb(255, 255, 153);
            color: #000;
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
            border-radius: 2px;
            pointer-events: none;
            z-index: 1;
        }

        .sheet-data-table td.window-selected {
            border-color: transparent !important;
        }

        .sheet-data-table td.window-edge-top {
            border-top: 4px solid #000 !important;
        }

        .sheet-data-table td.window-edge-bottom {
            border-bottom: 4px solid #000 !important;
        }

        .sheet-data-table td.window-edge-left {
            border-left: 4px solid #000 !important;
        }

        .sheet-data-table td.window-edge-right {
            border-right: 4px solid #000 !important;
        }

        .sheet-data-table td.window-divider-left {
            border-left: 4px solid #000 !important;
        }

        .sheet-data-table td.window-divider-right {
            border-right: 4px solid #000 !important;
        }

        .sheet-data-table td.window-focus {
            border: 4px solid #000 !important;
        }

        .sheet-empty {
            padding: 20px;
            text-align: center;
            color: #aaa;
            font-style: italic;
        }

        #tableWrap {
            flex: 1;
            min-height: 0;
            overflow: auto;
            margin-top: 0;
            /* Ensure the final table row can scroll above the tabs/zoom bar */
            padding-bottom: 80px;
            /* help programmatic scrollIntoView honor bottom offset */
            scroll-padding-bottom: 72px;
        }

        #filterTableWrap {
            flex: 1;
            min-height: 0;
            overflow: auto;
            margin-top: 0;
            padding-bottom: 48px;
            scroll-padding-bottom: 40px;
            scrollbar-gutter: stable;
        }
    </style>
</head>

<body>
    <header style="padding:10px 18px;border-bottom:1px solid #14202a;background:rgba(0,0,0,0.2)">
        <strong>Quick Lotto Helper</strong> — trang đơn để paste 10-11 chuỗi và quickcopy data
    </header>
    <main class="wrap">
        <section class="pane left">
            <iframe id="okFrame" src="ok_left.html" style="width:100%;height:100%;border:0"></iframe>
        </section>

        <section class="pane right">
            <div class="right-pane-wrapper">
                <div class="sheet-tools-bar">
                    <div class="sheet-tools-group">
                        <button type="button" id="autoringToggleBtn" class="sheet-tools-toggle"
                            title="Bật/tắt khoanh tự động cho 5 số submit"
                            aria-label="Toggle auto circle submit numbers"></button>
                        <div id="submitRingModeWrap" class="sheet-tools-mode-wrap"
                            title="Chọn kiểu khoanh: max hoặc min">
                            <span id="submitRingModeValue" class="sheet-tools-mode-value">MAX</span>
                            <select id="submitRingModeSelect" title="Chọn kiểu khoanh: max hoặc min"
                                aria-label="Submit auto circle mode">
                                <option value="max">max</option>
                                <option value="min">min</option>
                            </select>
                        </div>
                    </div>
                    <div class="sheet-tools-group filter-tools-group">
                        <button type="button" id="periodFilterToggleBtn" class="sheet-tools-toggle filter-toggle"
                            title="Bật/tắt lọc kỳ theo mode (Ctrl)" aria-label="Toggle period filter (Ctrl)"></button>
                        <div id="periodFilterModePicker" class="period-filter-mode-picker">
                            <button type="button" id="periodFilterModeBtn" class="period-filter-mode-btn" disabled
                                aria-haspopup="listbox" aria-expanded="false" title="Chọn mode lọc">
                                <span id="periodFilterModeBtnLabel">1 bộ 2</span>
                                <span class="period-filter-mode-caret" aria-hidden="true">▾</span>
                            </button>
                            <ul id="periodFilterModeMenu" class="period-filter-mode-menu hidden" role="listbox"
                                aria-label="Mode lọc"></ul>
                        </div>
                        <span id="periodFilterMatchCount" class="period-filter-match-count"
                            title="Số kỳ khớp mode">0</span>
                    </div>
                </div>
                <div id="tableWrap" class="right-table-viewport" style="flex:1;overflow:auto;margin-top:0"></div>
                <div id="sheetTabsContainer" class="sheet-tabs-container"></div>
                <div class="sheet-zoom-bar">
                    <div class="zoom-toolbar" aria-label="Zoom controls">
                        <button type="button" id="zoomOutBtn" title="Zoom out">−</button>
                        <input id="zoomSlider" type="range" min="50" max="150" step="5" value="100"
                            aria-label="Zoom slider" />
                        <button type="button" id="zoomInBtn" title="Zoom in">+</button>
                        <span id="zoomValue" class="zoom-value">100%</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="filterPopupDock" class="filter-popup-dock hidden" aria-hidden="true">
        <div id="filterPopupPanel" class="filter-popup-panel" role="dialog" aria-labelledby="filterPopupTitle">
            <div id="filterPopupHeader" class="filter-popup-header">
                <span id="filterPopupTitle" class="filter-popup-title">Lọc kỳ</span>
                <span class="filter-popup-hint">Kéo tiêu đề · kéo góc/viền đổi kích thước · ↑↓ / WASD trong bảng</span>
                <button type="button" id="filterPopupClose" class="filter-popup-close" title="Ẩn bảng lọc">×</button>
            </div>
            <div class="filter-popup-body">
                <div id="filterTableWrap" class="right-table-viewport" tabindex="0" aria-label="Bảng lọc kỳ"></div>
            </div>
        </div>
    </div>

    <script src="right-pane-sheets.js"></script>
    <script>
        // Basic app: load data.json, render table, allow quick copy to left textarea
        const MAX_NUM = 35; // support up to 35
        const RIGHT_ZOOM_KEY = 'rightPaneZoom';
        const RIGHT_ZOOM_MIN = 0.5;
        const RIGHT_ZOOM_MAX = 1.5;
        const RIGHT_ZOOM_STEP = 0.05;
        const SUBMIT_RING_ENABLED_KEY = 'submitRingEnabled';
        const SUBMIT_RING_MODE_KEY = 'submitRingMode';
        const PERIOD_FILTER_ENABLED_KEY = 'periodFilterEnabled';
        const PERIOD_FILTER_MODE_KEY = 'periodFilterMode';
        const FILTER_POPUP_LAYOUT_KEY = 'filterPopupLayout';
        const FILTER_POPUP_MIN_WIDTH = 360;
        const FILTER_POPUP_MIN_HEIGHT = 220;
        const FILTER_MODE_LABELS = {
            modeq: '?',
            pair1: '1 bộ 2',
            pair2: '2 bộ 2',
            pair3: '3 bộ 2',
            pair4: '4 bộ 2',
            pair5: '5 bộ 2',
            triple1: '1 bộ 3',
            dateband: ''
        };
        const DATEBAND_FILTER_MODE = 'dateband';
        const VALID_FILTER_MODES = Object.keys(FILTER_MODE_LABELS);
        let sheetManager = null;
        let selectedNums = new Set(); // numbers from the 'primary' selected row
        let selectedLines = []; // current 11-line selection (array of full row objects)
        let iframeSubmitActive = false;
        let rightPaneZoom = 1;
        let submitRingEnabled = false;
        let submitRingMode = 'max';
        let periodFilterEnabled = false;
        let periodFilterMode = 'pair1';
        let filterPopupIndices = [];
        let filterPopupActiveIdx = -1;
        let filterModeCounts = {};
        let filterPopupLayoutSaveTimer = null;
        let keyboardFocusTarget = 'right';

        function rememberKeyboardFocusTarget(target) {
            keyboardFocusTarget = target === 'left' ? 'left' : 'right';
        }

        function restoreKeyboardFocusTarget() {
            const frame = el('okFrame');
            const wrap = el('tableWrap');

            if (keyboardFocusTarget === 'left') {
                try {
                    if (frame && frame.contentWindow) {
                        frame.contentWindow.postMessage({ type: 'requestFocus' }, '*');
                    }
                } catch (e) { }
                return;
            }

            try {
                if (wrap && typeof wrap.focus === 'function') {
                    wrap.focus({ preventScroll: true });
                }
            } catch (e) { }
        }

        function syncComboLogicUi() {
            if (!sheetManager) return;

            const wrap = el('tableWrap');
            if (!wrap || sheetManager.activeSheet !== 'combo_1') {
                return;
            }

            const f1Input = wrap.querySelector('#comboF1CellInput');
            const g1Toggle = wrap.querySelector('#comboG1CellToggle');
            const h1Input = wrap.querySelector('#comboH1CellInput');

            if (f1Input && f1Input.value !== (sheetManager.comboFocusRowId || '')) {
                f1Input.value = sheetManager.comboFocusRowId || '';
            }

            if (g1Toggle) {
                g1Toggle.checked = !!sheetManager.comboG1Enabled;
            }

            if (h1Input && h1Input.value !== sheetManager.comboH1Text) {
                h1Input.value = sheetManager.comboH1Text || '';
            }
        }

        function el(id) { return document.getElementById(id) }

        function clampZoom(value) {
            return Math.min(RIGHT_ZOOM_MAX, Math.max(RIGHT_ZOOM_MIN, value));
        }

        function syncZoomUi() {
            const slider = el('zoomSlider');
            const valueLabel = el('zoomValue');
            const pct = Math.round(rightPaneZoom * 100);

            if (slider) {
                slider.value = String(pct);
            }

            if (valueLabel) {
                valueLabel.textContent = `${pct}%`;
            }
        }

        function applyRightPaneZoom(value, persist = true) {
            rightPaneZoom = clampZoom(value);

            const wrap = el('tableWrap');
            if (wrap) {
                wrap.style.setProperty('--right-table-zoom', String(rightPaneZoom));
            }

            const filterWrap = el('filterTableWrap');
            if (filterWrap) {
                filterWrap.style.setProperty('--right-table-zoom', String(rightPaneZoom));
            }

            const table = wrap ? wrap.querySelector('.sheet-data-table') : null;
            if (table) {
                table.style.zoom = String(rightPaneZoom);
            }

            syncZoomUi();

            if (persist) {
                try {
                    localStorage.setItem(RIGHT_ZOOM_KEY, String(rightPaneZoom));
                } catch (e) {
                    console.warn('Zoom save failed:', e);
                }
            }

            if (periodFilterEnabled) {
                refreshFilterPopup({ syncMain: false });
            }

            // Zoom changes row layout; re-anchor the 11-row window at the 60/40 split.
            if (sheetManager && sheetManager.activeWindowRange) {
                const meta = sheetManager.sheets && sheetManager.activeSheet
                    ? sheetManager.sheets[sheetManager.activeSheet]
                    : null;
                if (wrap && meta && meta.kind !== 'combo') {
                    sheetManager.centerActiveWindowInView(wrap);
                }
            }
        }

        function initZoomControls() {
            const saved = parseFloat(localStorage.getItem(RIGHT_ZOOM_KEY));
            if (!Number.isNaN(saved)) {
                rightPaneZoom = clampZoom(saved);
            }

            const slider = el('zoomSlider');
            const zoomOutBtn = el('zoomOutBtn');
            const zoomInBtn = el('zoomInBtn');

            if (slider) {
                slider.addEventListener('input', () => {
                    applyRightPaneZoom(Number(slider.value) / 100);
                });
            }

            if (zoomOutBtn) {
                zoomOutBtn.addEventListener('click', () => {
                    applyRightPaneZoom(rightPaneZoom - RIGHT_ZOOM_STEP);
                });
            }

            if (zoomInBtn) {
                zoomInBtn.addEventListener('click', () => {
                    applyRightPaneZoom(rightPaneZoom + RIGHT_ZOOM_STEP);
                });
            }

            applyRightPaneZoom(rightPaneZoom, false);
        }

        function sendSubmitRingConfigToIframe() {
            const frame = el('okFrame');
            if (!frame || !frame.contentWindow) {
                return;
            }
            frame.contentWindow.postMessage({
                type: 'submitAutoCircleChanged',
                enabled: !!submitRingEnabled,
                mode: submitRingMode === 'min' ? 'min' : 'max'
            }, '*');
        }

        function syncSubmitRingToolbarUi() {
            const toggleBtn = el('autoringToggleBtn');
            const modeSelect = el('submitRingModeSelect');
            const modeWrap = el('submitRingModeWrap');
            const modeValue = el('submitRingModeValue');
            const modeHighlighted = submitRingEnabled || iframeSubmitActive;
            if (toggleBtn) {
                toggleBtn.classList.toggle('active', submitRingEnabled);
                toggleBtn.setAttribute(
                    'title',
                    submitRingEnabled
                        ? `Đang bật khoanh tự động (${submitRingMode}). Bấm để tắt`
                        : 'Đang tắt khoanh tự động. Bấm để bật'
                );
            }
            if (modeSelect) {
                modeSelect.value = submitRingMode;
                modeSelect.disabled = !submitRingEnabled;
                modeSelect.setAttribute('title', `Chế độ hiện tại: ${submitRingMode}`);
            }
            if (modeValue) {
                modeValue.textContent = (submitRingMode || 'max').toUpperCase();
            }
            if (modeWrap) {
                modeWrap.classList.toggle('disabled', !submitRingEnabled);
                modeWrap.classList.toggle('enabled', modeHighlighted);
                modeWrap.setAttribute('title', `Chế độ khoanh: ${submitRingMode}`);
            }
        }

        function initSubmitRingToolbar() {
            try {
                const savedEnabled = localStorage.getItem(SUBMIT_RING_ENABLED_KEY);
                const savedMode = localStorage.getItem(SUBMIT_RING_MODE_KEY);
                submitRingEnabled = savedEnabled === '1';
                submitRingMode = (savedMode === 'min' || savedMode === 'max') ? savedMode : 'max';
            } catch (e) {
                submitRingEnabled = false;
                submitRingMode = 'max';
            }

            const toggleBtn = el('autoringToggleBtn');
            const modeSelect = el('submitRingModeSelect');
            if (toggleBtn) {
                toggleBtn.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                });
                toggleBtn.addEventListener('click', () => {
                    submitRingEnabled = !submitRingEnabled;
                    try { localStorage.setItem(SUBMIT_RING_ENABLED_KEY, submitRingEnabled ? '1' : '0'); } catch (e) { }
                    syncSubmitRingToolbarUi();
                    sendSubmitRingConfigToIframe();
                    requestAnimationFrame(() => restoreKeyboardFocusTarget());
                });
            }
            if (modeSelect) {
                modeSelect.addEventListener('change', () => {
                    submitRingMode = modeSelect.value === 'min' ? 'min' : 'max';
                    try { localStorage.setItem(SUBMIT_RING_MODE_KEY, submitRingMode); } catch (e) { }
                    syncSubmitRingToolbarUi();
                    sendSubmitRingConfigToIframe();
                    requestAnimationFrame(() => restoreKeyboardFocusTarget());
                });
            }

            const frame = el('okFrame');
            if (frame) {
                frame.addEventListener('load', () => {
                    sendSubmitRingConfigToIframe();
                });
            }

            syncSubmitRingToolbarUi();
            sendSubmitRingConfigToIframe();
        }

        function getFilterModeLabel(mode) {
            return FILTER_MODE_LABELS[mode] || mode || '';
        }

        function isDatebandFilterMode(mode) {
            return mode === DATEBAND_FILTER_MODE;
        }

        function applyPeriodFilterModeVisual(targetEl, mode) {
            if (!targetEl) {
                return;
            }
            const isDateband = isDatebandFilterMode(mode);
            targetEl.textContent = isDateband ? '' : getFilterModeLabel(mode);
            targetEl.classList.toggle('period-filter-dateband-swatch', isDateband);
            if (isDateband) {
                targetEl.setAttribute('aria-label', 'Date nền #00b0f0');
            } else {
                targetEl.removeAttribute('aria-label');
            }
        }

        function getFilterModeTitleHint(mode) {
            if (isDatebandFilterMode(mode)) {
                return 'date nền #00b0f0';
            }
            return getFilterModeLabel(mode);
        }

        function syncFilterPopupTitle(titleEl, mode, count) {
            if (!titleEl) {
                return;
            }

            const normalized = normalizeFilterMode(mode);
            const total = typeof count === 'number'
                ? count
                : (filterModeCounts[normalized] ?? 0);

            titleEl.textContent = '';
            titleEl.appendChild(document.createTextNode('Lọc: '));
            if (isDatebandFilterMode(mode)) {
                const swatch = document.createElement('span');
                swatch.className = 'period-filter-dateband-swatch';
                swatch.setAttribute('aria-hidden', 'true');
                titleEl.appendChild(swatch);
            } else {
                titleEl.appendChild(document.createTextNode(getFilterModeLabel(mode)));
            }

            const countSpan = document.createElement('span');
            countSpan.className = 'filter-popup-title-count';
            countSpan.textContent = String(total);
            titleEl.appendChild(countSpan);
        }

        function normalizeFilterMode(mode) {
            return VALID_FILTER_MODES.includes(mode) ? mode : 'pair1';
        }

        function fitPeriodFilterModeBtnWidth() {
            const modeBtn = el('periodFilterModeBtn');
            const modeLabel = el('periodFilterModeBtnLabel');
            if (!modeBtn || !modeLabel) {
                return;
            }

            const probe = document.createElement('span');
            probe.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap;font:700 12px Inter,Segoe UI,Arial';
            document.body.appendChild(probe);

            let maxTextWidth = 0;
            for (const mode of VALID_FILTER_MODES) {
                if (isDatebandFilterMode(mode)) {
                    maxTextWidth = Math.max(maxTextWidth, 30);
                } else {
                    probe.textContent = getFilterModeLabel(mode);
                    maxTextWidth = Math.max(maxTextWidth, probe.offsetWidth);
                }
            }
            document.body.removeChild(probe);

            modeBtn.style.width = `${Math.ceil(maxTextWidth) + 28}px`;
        }

        function highlightPeriodFilterModeMenu(previewMode) {
            const menu = el('periodFilterModeMenu');
            if (!menu) {
                return;
            }
            const preview = previewMode ? normalizeFilterMode(previewMode) : null;
            menu.querySelectorAll('.period-filter-mode-item').forEach((item) => {
                const itemMode = item.dataset.mode || '';
                item.classList.toggle('selected', itemMode === periodFilterMode);
                item.classList.toggle('previewing', !!preview && itemMode === preview);
            });
        }

        function buildPeriodFilterModeMenu() {
            const menu = el('periodFilterModeMenu');
            if (!menu) {
                return;
            }

            menu.innerHTML = '';
            for (const mode of VALID_FILTER_MODES) {
                const item = document.createElement('li');
                item.className = 'period-filter-mode-item';
                item.setAttribute('role', 'option');
                item.dataset.mode = mode;

                const labelSpan = document.createElement('span');
                labelSpan.className = 'period-filter-mode-item-label';
                applyPeriodFilterModeVisual(labelSpan, mode);

                const countSpan = document.createElement('span');
                countSpan.className = 'period-filter-mode-item-count';
                countSpan.textContent = String(filterModeCounts[mode] ?? 0);

                item.appendChild(labelSpan);
                item.appendChild(countSpan);

                item.addEventListener('mouseenter', () => {
                    if (!periodFilterEnabled) {
                        return;
                    }
                    highlightPeriodFilterModeMenu(mode);
                    setPeriodFilterMatchCountDisplay(mode, true);
                });

                item.addEventListener('mousedown', (event) => {
                    event.preventDefault();
                });

                item.addEventListener('click', () => {
                    selectPeriodFilterMode(mode);
                });

                menu.appendChild(item);
            }
            highlightPeriodFilterModeMenu(null);
        }

        function positionPeriodFilterModeMenu() {
            const menu = el('periodFilterModeMenu');
            const modeBtn = el('periodFilterModeBtn');
            if (!menu || !modeBtn) {
                return;
            }

            const rect = modeBtn.getBoundingClientRect();
            menu.style.left = `${Math.max(8, rect.left)}px`;
            menu.style.top = `${rect.bottom + 2}px`;
            menu.style.minWidth = `${Math.max(rect.width, 88)}px`;
        }

        function openPeriodFilterModeMenu() {
            const menu = el('periodFilterModeMenu');
            const modeBtn = el('periodFilterModeBtn');
            const picker = el('periodFilterModePicker');
            if (!menu || !modeBtn || modeBtn.disabled) {
                return;
            }

            if (!menu.querySelector('.period-filter-mode-item')) {
                buildPeriodFilterModeMenu();
            } else {
                updatePeriodFilterModeMenuItemCounts();
            }

            if (menu.parentElement !== document.body) {
                document.body.appendChild(menu);
            }

            positionPeriodFilterModeMenu();
            menu.classList.remove('hidden');
            modeBtn.setAttribute('aria-expanded', 'true');
            highlightPeriodFilterModeMenu(null);
        }

        function closePeriodFilterModeMenu() {
            const menu = el('periodFilterModeMenu');
            const modeBtn = el('periodFilterModeBtn');
            const picker = el('periodFilterModePicker');
            if (menu) {
                menu.classList.add('hidden');
                if (picker && menu.parentElement === document.body) {
                    picker.appendChild(menu);
                }
            }
            if (modeBtn) {
                modeBtn.setAttribute('aria-expanded', 'false');
            }
            highlightPeriodFilterModeMenu(null);
            updatePeriodFilterMatchCount();
        }

        function selectPeriodFilterMode(mode) {
            periodFilterMode = normalizeFilterMode(mode);
            try {
                localStorage.setItem(PERIOD_FILTER_MODE_KEY, periodFilterMode);
            } catch (e) { }
            closePeriodFilterModeMenu();
            syncPeriodFilterToolbarUi();
            if (periodFilterEnabled) {
                refreshFilterPopup({ syncMain: false });
            }
            requestAnimationFrame(() => restoreKeyboardFocusTarget());
        }

        function updatePeriodFilterModeMenuItemCounts() {
            const menu = el('periodFilterModeMenu');
            if (!menu) {
                return;
            }
            menu.querySelectorAll('.period-filter-mode-item').forEach((item) => {
                const mode = item.dataset.mode || '';
                const countSpan = item.querySelector('.period-filter-mode-item-count');
                if (countSpan) {
                    countSpan.textContent = String(filterModeCounts[mode] ?? 0);
                }
            });
        }

        function rebuildFilterModeCounts() {
            filterModeCounts = {};
            if (!sheetManager || sheetManager.activeSheet !== 'sheet1') {
                return;
            }

            for (const mode of VALID_FILTER_MODES) {
                filterModeCounts[mode] = sheetManager.getFilterMatchingIndices(mode).length;
            }
            updatePeriodFilterModeMenuItemCounts();
        }

        function fitPeriodFilterMatchCountWidth() {
            const countEl = el('periodFilterMatchCount');
            if (!countEl) {
                return;
            }

            const probe = document.createElement('span');
            probe.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap;font:700 12px Inter,Segoe UI,Arial;font-variant-numeric:tabular-nums';
            document.body.appendChild(probe);

            let maxTextWidth = 0;
            const samples = [countEl.textContent || '0'];
            for (const mode of VALID_FILTER_MODES) {
                samples.push(String(filterModeCounts[mode] ?? 0));
            }

            for (const text of samples) {
                probe.textContent = text;
                maxTextWidth = Math.max(maxTextWidth, probe.offsetWidth);
            }
            document.body.removeChild(probe);

            countEl.style.width = `${Math.ceil(maxTextWidth) + 8}px`;
        }

        function setPeriodFilterMatchCountDisplay(mode, isPreview) {
            const countEl = el('periodFilterMatchCount');
            if (!countEl) {
                return;
            }

            const normalized = normalizeFilterMode(mode);
            let total = 0;
            if (periodFilterEnabled && sheetManager && sheetManager.activeSheet === 'sheet1') {
                total = filterModeCounts[normalized] ?? 0;
            }

            countEl.textContent = String(total);
            countEl.classList.toggle('enabled', periodFilterEnabled);
            countEl.classList.toggle('preview', !!isPreview);

            const label = getFilterModeTitleHint(normalized);
            if (!periodFilterEnabled) {
                countEl.setAttribute('title', 'Số kỳ khớp mode');
            } else if (isPreview) {
                countEl.setAttribute('title', `Xem trước: ${total} kỳ khớp ${label}`);
            } else {
                countEl.setAttribute('title', `Có ${total} kỳ khớp ${label}`);
            }

            fitPeriodFilterMatchCountWidth();
        }

        function updatePeriodFilterMatchCount() {
            setPeriodFilterMatchCountDisplay(periodFilterMode, false);
        }

        function initPeriodFilterModePicker() {
            const picker = el('periodFilterModePicker');
            const modeBtn = el('periodFilterModeBtn');
            const menu = el('periodFilterModeMenu');
            if (!picker || !modeBtn || !menu || picker.dataset.pickerBound === '1') {
                return;
            }
            picker.dataset.pickerBound = '1';

            buildPeriodFilterModeMenu();

            modeBtn.addEventListener('click', (event) => {
                event.preventDefault();
                event.stopPropagation();
                if (modeBtn.disabled) {
                    return;
                }
                if (menu.classList.contains('hidden')) {
                    openPeriodFilterModeMenu();
                } else {
                    closePeriodFilterModeMenu();
                }
            });

            menu.addEventListener('mouseleave', () => {
                highlightPeriodFilterModeMenu(null);
                updatePeriodFilterMatchCount();
            });

            menu.addEventListener('click', (event) => {
                event.stopPropagation();
            });

            document.addEventListener('mousedown', (event) => {
                if (menu.classList.contains('hidden')) {
                    return;
                }
                const target = event.target;
                if (picker.contains(target) || menu.contains(target)) {
                    return;
                }
                closePeriodFilterModeMenu();
            });

            window.addEventListener('resize', () => {
                if (!menu.classList.contains('hidden')) {
                    positionPeriodFilterModeMenu();
                }
            });
        }

        function initFilterPopupLayoutOnWindowResize() {
            if (window.filterPopupLayoutResizeBound === '1') {
                return;
            }
            window.filterPopupLayoutResizeBound = '1';
            window.addEventListener('resize', () => {
                const dock = el('filterPopupDock');
                if (!dock || dock.classList.contains('hidden')) {
                    return;
                }
                applyFilterPopupLayout();
            });
        }

        function syncPeriodFilterToolbarUi() {
            const toggleBtn = el('periodFilterToggleBtn');
            const modeBtn = el('periodFilterModeBtn');
            const modeLabelEl = el('periodFilterModeBtnLabel');
            const titleHint = getFilterModeTitleHint(periodFilterMode);

            if (toggleBtn) {
                toggleBtn.classList.toggle('active', periodFilterEnabled);
                toggleBtn.setAttribute(
                    'title',
                    periodFilterEnabled
                        ? `Đang bật lọc (${titleHint}). Bấm để tắt`
                        : 'Đang tắt lọc kỳ. Bấm để tắt'
                );
            }
            if (modeBtn) {
                modeBtn.disabled = !periodFilterEnabled;
                modeBtn.setAttribute('title', `Mode lọc: ${titleHint}`);
            }
            applyPeriodFilterModeVisual(modeLabelEl, periodFilterMode);

            fitPeriodFilterModeBtnWidth();
            highlightPeriodFilterModeMenu(null);
            updatePeriodFilterMatchCount();
        }

        function loadFilterPopupLayout() {
            try {
                const raw = localStorage.getItem(FILTER_POPUP_LAYOUT_KEY);
                if (!raw) {
                    return null;
                }
                const parsed = JSON.parse(raw);
                if (!parsed || typeof parsed.width !== 'number' || typeof parsed.height !== 'number') {
                    return null;
                }
                return parsed;
            } catch (e) {
                return null;
            }
        }

        function applyFilterPopupLayout() {
            const dock = el('filterPopupDock');
            const panel = el('filterPopupPanel');
            if (!dock || !panel) {
                return;
            }

            const layout = loadFilterPopupLayout();
            if (!layout) {
                return;
            }

            const maxW = Math.max(FILTER_POPUP_MIN_WIDTH, window.innerWidth - 24);
            const maxH = Math.max(FILTER_POPUP_MIN_HEIGHT, window.innerHeight - 24);
            const width = Math.min(maxW, Math.max(FILTER_POPUP_MIN_WIDTH, layout.width));
            const height = Math.min(maxH, Math.max(FILTER_POPUP_MIN_HEIGHT, layout.height));

            panel.style.width = `${width}px`;
            panel.style.height = `${height}px`;

            const maxLeft = Math.max(8, window.innerWidth - width - 8);
            const maxTop = Math.max(8, window.innerHeight - height - 8);

            if (typeof layout.left === 'number' && typeof layout.top === 'number') {
                dock.style.right = 'auto';
                dock.style.left = `${Math.min(maxLeft, Math.max(8, layout.left))}px`;
                dock.style.top = `${Math.min(maxTop, Math.max(8, layout.top))}px`;
            }
        }

        function scheduleSaveFilterPopupLayout() {
            if (filterPopupLayoutSaveTimer) {
                clearTimeout(filterPopupLayoutSaveTimer);
            }
            filterPopupLayoutSaveTimer = setTimeout(() => {
                filterPopupLayoutSaveTimer = null;
                saveFilterPopupLayout();
            }, 120);
        }

        function saveFilterPopupLayout() {
            const dock = el('filterPopupDock');
            const panel = el('filterPopupPanel');
            if (!dock || !panel || dock.classList.contains('hidden')) {
                return;
            }

            const rect = dock.getBoundingClientRect();
            if (rect.width < FILTER_POPUP_MIN_WIDTH || rect.height < FILTER_POPUP_MIN_HEIGHT) {
                return;
            }

            const layout = {
                left: Math.round(rect.left),
                top: Math.round(rect.top),
                width: Math.round(rect.width),
                height: Math.round(rect.height)
            };

            try {
                localStorage.setItem(FILTER_POPUP_LAYOUT_KEY, JSON.stringify(layout));
            } catch (e) { }
        }

        function openFilterPopup() {
            const dock = el('filterPopupDock');
            if (!dock) {
                return;
            }
            applyFilterPopupLayout();
            dock.classList.remove('hidden');
            dock.setAttribute('aria-hidden', 'false');
        }

        function closeFilterPopup() {
            const dock = el('filterPopupDock');
            if (!dock) {
                return;
            }
            dock.classList.add('hidden');
            dock.setAttribute('aria-hidden', 'true');
        }

        function setPeriodFilterEnabled(enabled, options = {}) {
            periodFilterEnabled = !!enabled;

            if (options.persist !== false) {
                try {
                    localStorage.setItem(PERIOD_FILTER_ENABLED_KEY, periodFilterEnabled ? '1' : '0');
                } catch (e) { }
            }

            syncPeriodFilterToolbarUi();
            closePeriodFilterModeMenu();

            if (periodFilterEnabled) {
                rebuildFilterModeCounts();
                refreshFilterPopup({ syncMain: false });
                requestAnimationFrame(() => {
                    if (options.focusPopup) {
                        const wrap = el('filterTableWrap');
                        if (wrap) {
                            try {
                                wrap.focus({ preventScroll: true });
                            } catch (e) { }
                        }
                        return;
                    }
                    if (options.restoreFocus !== false) {
                        restoreKeyboardFocusTarget();
                    }
                });
                return;
            }

            closeFilterPopup();
            syncPeriodFilterNavModeToIframe();
            if (options.restoreFocus !== false) {
                requestAnimationFrame(() => restoreKeyboardFocusTarget());
            }
        }

        function clearFilterPopupRowFocus() {
            const wrap = el('filterTableWrap');
            if (!wrap) {
                return;
            }
            wrap.querySelectorAll('tbody tr.filter-popup-row-focus').forEach(row => {
                row.classList.remove('filter-popup-row-focus');
            });
        }

        function applyFilterPopupRowFocus(idx) {
            const wrap = el('filterTableWrap');
            if (!wrap || typeof idx !== 'number' || idx < 0) {
                return;
            }

            clearFilterPopupRowFocus();
            const row = wrap.querySelector(`tbody tr[data-idx="${idx}"]`);
            if (row) {
                row.classList.add('filter-popup-row-focus');
            }
        }

        function resolveFilterPopupActiveIdx(indices) {
            if (!indices || indices.length === 0) {
                return -1;
            }
            if (indices.includes(filterPopupActiveIdx)) {
                return filterPopupActiveIdx;
            }
            const target = sheetManager && sheetManager.activeWindowRange
                ? sheetManager.activeWindowRange.target
                : -1;
            if (typeof target === 'number' && indices.includes(target)) {
                return target;
            }
            return -1;
        }

        function syncMainRowFromFilter(idx) {
            if (!sheetManager || typeof idx !== 'number' || idx < 0) {
                return;
            }
            const rows = sheetManager.dataRows || [];
            const row = rows[idx];
            if (!row) {
                return;
            }
            const isEmpty = sheetManager.isEmptyResultRow(row);
            sheetManager.onRowClick(idx, isEmpty, null);
        }

        function scrollFilterPopupRowIntoView() {
            const wrap = el('filterTableWrap');
            if (!wrap || filterPopupActiveIdx < 0) {
                return;
            }
            const tr = wrap.querySelector(`tbody tr[data-idx="${filterPopupActiveIdx}"]`);
            if (tr && typeof tr.scrollIntoView === 'function') {
                tr.scrollIntoView({ block: 'nearest' });
            }
        }

        function updateFilterPopupSelection() {
            applyFilterPopupRowFocus(filterPopupActiveIdx);
            scrollFilterPopupRowIntoView();
        }

        function isFilterPopupNavActive() {
            return periodFilterEnabled
                && !el('filterPopupDock')?.classList.contains('hidden')
                && filterPopupIndices.length > 0;
        }

        function syncPeriodFilterNavModeToIframe() {
            const frame = el('okFrame');
            if (!frame || !frame.contentWindow) {
                return;
            }
            try {
                frame.contentWindow.postMessage({
                    type: 'periodFilterNavMode',
                    active: isFilterPopupNavActive()
                }, '*');
            } catch (e) { }
        }

        function getFilterPopupNavStepFromKey(key) {
            const k = String(key || '');
            if (k === 'ArrowDown' || k === 'ArrowRight' || k === 's' || k === 'S' || k === 'd' || k === 'D') {
                return 1;
            }
            if (k === 'ArrowUp' || k === 'ArrowLeft' || k === 'w' || k === 'W' || k === 'a' || k === 'A') {
                return -1;
            }
            return 0;
        }

        function handleFilterPopupNavKeydown(event) {
            if (!isFilterPopupNavActive()) {
                return false;
            }
            if (isPeriodFilterShortcutBlockedTarget(event.target)) {
                return false;
            }
            const step = getFilterPopupNavStepFromKey(event.key);
            if (!step) {
                return false;
            }
            event.preventDefault();
            event.stopPropagation();
            navigateFilterPopup(step);
            return true;
        }

        function navigateFilterPopup(step) {
            if (!periodFilterEnabled || filterPopupIndices.length === 0) {
                return;
            }
            const pos = filterPopupIndices.indexOf(filterPopupActiveIdx);
            const basePos = pos >= 0 ? pos : 0;
            const nextPos = Math.max(0, Math.min(filterPopupIndices.length - 1, basePos + step));
            filterPopupActiveIdx = filterPopupIndices[nextPos];
            syncMainRowFromFilter(filterPopupActiveIdx);
            applyFilterPopupRowFocus(filterPopupActiveIdx);
            scrollFilterPopupRowIntoView();
        }

        function refreshFilterPopup(options = {}) {
            const syncMain = options.syncMain === true;
            if (!periodFilterEnabled) {
                closeFilterPopup();
                syncPeriodFilterNavModeToIframe();
                return;
            }

            openFilterPopup();

            const title = el('filterPopupTitle');
            const wrap = el('filterTableWrap');
            if (!wrap || !sheetManager) {
                syncPeriodFilterNavModeToIframe();
                return;
            }

            if (sheetManager.activeSheet !== 'sheet1') {
                filterPopupIndices = [];
                filterPopupActiveIdx = -1;
                wrap.innerHTML = '<div class="filter-popup-empty">Lọc chỉ áp dụng cho sheet dữ liệu chính.</div>';
                updatePeriodFilterMatchCount();
                if (title) {
                    syncFilterPopupTitle(title, periodFilterMode, 0);
                }
                syncPeriodFilterNavModeToIframe();
                return;
            }

            filterPopupIndices = sheetManager.getFilterMatchingIndices(periodFilterMode);
            filterPopupActiveIdx = resolveFilterPopupActiveIdx(filterPopupIndices);
            updatePeriodFilterMatchCount();
            if (title) {
                syncFilterPopupTitle(title, periodFilterMode, filterPopupIndices.length);
            }

            if (filterPopupIndices.length === 0) {
                syncPeriodFilterNavModeToIframe();
                const hint = getFilterModeTitleHint(periodFilterMode);
                wrap.innerHTML = '<div class="filter-popup-empty">Không có kỳ nào khớp ' + hint + '.</div>';
                return;
            }

            wrap.style.setProperty('--right-table-zoom', String(rightPaneZoom));
            sheetManager.renderSourceSheet(wrap, sheetManager.dataRows, {
                indices: filterPopupIndices,
                bindKeyboard: false,
                applyWindowSelection: false,
                onRowActivated: (idx) => {
                    filterPopupActiveIdx = idx;
                    applyFilterPopupRowFocus(idx);
                }
            });

            clearFilterPopupRowFocus();
            if (filterPopupActiveIdx >= 0) {
                if (syncMain) {
                    syncMainRowFromFilter(filterPopupActiveIdx);
                }
                applyFilterPopupRowFocus(filterPopupActiveIdx);
                scrollFilterPopupRowIntoView();
            }
            syncPeriodFilterNavModeToIframe();
        }

        function initFilterPopupDrag() {
            const dock = el('filterPopupDock');
            const header = el('filterPopupHeader');
            if (!dock || !header || header.dataset.dragBound === '1') {
                return;
            }
            header.dataset.dragBound = '1';

            let dragging = false;
            let startX = 0;
            let startY = 0;
            let startLeft = 0;
            let startTop = 0;

            const panel = el('filterPopupPanel');

            header.addEventListener('mousedown', (event) => {
                if (event.button !== 0 || event.target.closest('#filterPopupClose')) {
                    return;
                }
                const rect = dock.getBoundingClientRect();
                dragging = true;
                startX = event.clientX;
                startY = event.clientY;
                startLeft = rect.left;
                startTop = rect.top;
                dock.style.right = 'auto';
                dock.style.left = `${startLeft}px`;
                dock.style.top = `${startTop}px`;
                if (panel) {
                    panel.style.width = `${rect.width}px`;
                    panel.style.height = `${rect.height}px`;
                }
                event.preventDefault();
            });

            document.addEventListener('mousemove', (event) => {
                if (!dragging) {
                    return;
                }
                dock.style.left = `${startLeft + event.clientX - startX}px`;
                dock.style.top = `${Math.max(8, startTop + event.clientY - startY)}px`;
            });

            document.addEventListener('mouseup', () => {
                if (!dragging) {
                    return;
                }
                dragging = false;
                scheduleSaveFilterPopupLayout();
            });

            if (panel && typeof ResizeObserver !== 'undefined') {
                const resizeObserver = new ResizeObserver(() => {
                    if (dock.classList.contains('hidden')) {
                        return;
                    }
                    scheduleSaveFilterPopupLayout();
                });
                resizeObserver.observe(panel);
            }

            applyFilterPopupLayout();
        }

        function initFilterPopupGlobalNav() {
            if (document.documentElement.dataset.filterPopupGlobalNavBound === '1') {
                return;
            }
            document.documentElement.dataset.filterPopupGlobalNavBound = '1';
            document.addEventListener('keydown', (event) => {
                handleFilterPopupNavKeydown(event);
            }, true);
        }

        function initFilterPopupKeyboard() {
            const wrap = el('filterTableWrap');
            if (!wrap || wrap.dataset.filterNavBound === '1') {
                return;
            }
            wrap.dataset.filterNavBound = '1';
            initFilterPopupGlobalNav();

            wrap.addEventListener('keydown', (event) => {
                if (!periodFilterEnabled || el('filterPopupDock')?.classList.contains('hidden')) {
                    return;
                }
                if (String(event.key || '') === 'Escape') {
                    event.preventDefault();
                    setPeriodFilterEnabled(false);
                }
            });

            const closeBtn = el('filterPopupClose');
            if (closeBtn) {
                closeBtn.addEventListener('mousedown', (event) => {
                    event.stopPropagation();
                });
                closeBtn.addEventListener('click', (event) => {
                    event.stopPropagation();
                    setPeriodFilterEnabled(false);
                });
            }
        }

        function isPeriodFilterShortcutBlockedTarget(target) {
            if (!target || !(target instanceof Element)) {
                return false;
            }
            const tag = target.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
                return true;
            }
            if (target.isContentEditable) {
                return true;
            }
            return !!target.closest('[contenteditable="true"]');
        }

        function togglePeriodFilterFromShortcut() {
            const nextEnabled = !periodFilterEnabled;
            setPeriodFilterEnabled(nextEnabled, { focusPopup: false });
        }

        function initPeriodFilterCtrlShortcut() {
            if (document.documentElement.dataset.periodFilterCtrlBound === '1') {
                return;
            }
            document.documentElement.dataset.periodFilterCtrlBound = '1';

            let ctrlPressedAlone = false;
            let ctrlChordUsed = false;

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Control') {
                    if (event.repeat) {
                        return;
                    }
                    ctrlPressedAlone = true;
                    ctrlChordUsed = false;
                    if (!isPeriodFilterShortcutBlockedTarget(event.target)) {
                        event.preventDefault();
                    }
                    return;
                }
                if (event.ctrlKey) {
                    ctrlChordUsed = true;
                }
            }, true);

            document.addEventListener('keyup', (event) => {
                if (event.key !== 'Control') {
                    return;
                }
                const shouldToggle = ctrlPressedAlone && !ctrlChordUsed;
                ctrlPressedAlone = false;
                ctrlChordUsed = false;
                if (!shouldToggle || isPeriodFilterShortcutBlockedTarget(event.target)) {
                    return;
                }
                event.preventDefault();
                event.stopPropagation();
                togglePeriodFilterFromShortcut();
            }, true);
        }

        function initPeriodFilterToolbar() {
            try {
                const savedEnabled = localStorage.getItem(PERIOD_FILTER_ENABLED_KEY);
                const savedMode = localStorage.getItem(PERIOD_FILTER_MODE_KEY);
                periodFilterEnabled = savedEnabled === '1';
                periodFilterMode = normalizeFilterMode(savedMode || 'pair1');
            } catch (e) {
                periodFilterEnabled = false;
                periodFilterMode = 'pair1';
            }

            const toggleBtn = el('periodFilterToggleBtn');
            if (toggleBtn) {
                toggleBtn.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                });
                toggleBtn.addEventListener('click', () => {
                    const nextEnabled = !periodFilterEnabled;
                    setPeriodFilterEnabled(nextEnabled, { focusPopup: false });
                });
            }

            initPeriodFilterModePicker();
            initPeriodFilterCtrlShortcut();
            syncPeriodFilterToolbarUi();
            initFilterPopupLayoutOnWindowResize();
            initFilterPopupDrag();
            initFilterPopupKeyboard();
            if (periodFilterEnabled) {
                refreshFilterPopup();
            }
        }

        // Right table - using new sheet manager
        function loadData() {
            fetch('data.json').then(r => r.json()).then(j => {
                if (!sheetManager) {
                    sheetManager = new RightPaneSheetManager();
                }
                sheetManager.loadData(j);
                syncComboLogicUi();
                renderTable();
                renderSheetTabs();
            }).catch(e => {
                if (!sheetManager) {
                    sheetManager = new RightPaneSheetManager();
                }
                sheetManager.loadData([]);
                syncComboLogicUi();
                renderTable();
                renderSheetTabs();
            });
        }

        function renderTable() {
            const wrap = el('tableWrap');
            if (sheetManager) {
                rebuildFilterModeCounts();
                sheetManager.renderTable(wrap);
                if (sheetManager.activeSheet === 'combo_1') {
                    sheetManager.wireCombo1HeaderControls();
                }
                applyRightPaneZoom(rightPaneZoom, false);
                syncComboLogicUi();

                const savedScroll = sheetManager.getScrollPosition(sheetManager.activeSheet);
                if (wrap) {
                    wrap.scrollTop = savedScroll.top || 0;
                    wrap.scrollLeft = savedScroll.left || 0;
                }
                // Reapply any active window selection after a short delay to handle
                // cases where rows (like the synthetic final row) are added/updated
                // by logic that runs after the initial render. This avoids losing
                // the black border when the DOM is updated asynchronously.
                if (sheetManager.activeWindowRange) {
                    setTimeout(() => {
                        try {
                            const r = sheetManager.activeWindowRange;
                            sheetManager.applyWindowSelection(r.start, r.end, r.target);
                        } catch (err) {
                            // ignore
                        }
                    }, 20);
                }
                if (periodFilterEnabled) {
                    refreshFilterPopup({ syncMain: false });
                }
            }
        }

        function renderSheetTabs() {
            const container = el('sheetTabsContainer');
            if (sheetManager) {
                sheetManager.renderSheetTabs(container);
            }
        }

        function captureCurrentScrollPosition() {
            if (!sheetManager) {
                return;
            }

            const wrap = el('tableWrap');
            if (!wrap) {
                return;
            }

            sheetManager.setScrollPosition(sheetManager.activeSheet, wrap.scrollTop, wrap.scrollLeft);
        }

        function parseNums(s) {
            if (!s) return [];
            return String(s).split(/[\|,;\s]+/).map(x => parseInt(x, 10)).filter(n => !isNaN(n));
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function shouldHighlightNote(noteText) {
            if (!noteText || noteText === '?') return false;
            const noteParts = String(noteText).split('   ');
            for (const part of noteParts) {
                const openBrace = part.indexOf('{');
                const closeBrace = part.indexOf('}', openBrace + 1);
                if (openBrace >= 0 && closeBrace > openBrace) {
                    const inside = part.substring(openBrace + 1, closeBrace);
                    const nums = inside.split(',').map(x => x.trim()).filter(Boolean);
                    if (nums.length >= 3) return true;
                }
            }
            return false;
        }

        function renderGeneratedNoteHtml(noteText) {
            const escaped = escapeHtml(noteText || '');
