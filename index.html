<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Quick Lotto Helper</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #0b1220;
            --muted: #94a3b8;
            --accent: #38ef7d;
            --card: #111827;
            --text: #e6eef8
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-family: Inter, Segoe UI, Arial;
            background: var(--bg);
            color: var(--text)
        }

        .wrap {
            display: flex;
            gap: 12px;
            padding: 0;
            flex: 1;
            min-height: 0;
            box-sizing: border-box
        }

        .app-title {
            font-weight: 700;
        }

        .zoom-toolbar {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #475569;
            flex-shrink: 0;
        }

        .zoom-toolbar button {
            width: 22px;
            height: 22px;
            padding: 0;
            border-radius: 5px;
            border: 1px solid #b8c2cc;
            background: #ffffff;
            color: #334155;
            cursor: pointer;
            line-height: 1;
            font-size: 14px;
        }

        .zoom-toolbar button:hover {
            background: #eef2f7;
        }

        .zoom-toolbar input[type=range] {
            width: 72px;
            accent-color: #38ef7d;
            cursor: pointer;
        }

        .zoom-value {
            min-width: 42px;
            text-align: right;
            font-size: 12px;
            color: #475569;
            font-variant-numeric: tabular-nums;
        }

        .pane {
            background: var(--panel);
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 12px;
            min-height: 0;
            overflow: auto
        }

        .left {
            flex: 1;
            min-width: 360px
        }

        /* Prevent left pane from showing an outer scrollbar; iframe handles internal scrolling */
        .pane.left {
            overflow: hidden;
            padding: 0;
        }

        .right {
            flex: 1;
            min-width: 420px;
            background: #ffffff;
            color: #111111;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .pane.right table,
        .pane.right th,
        .pane.right td {
            background: #ffffff;
            color: #111111;
        }


        .pane.right table {
            margin-top: 0;
        }

        .pane.right table thead th {
            position: sticky;
            top: 0;
            z-index: 3;
            background: #ffffff;
            border: 1px solid #94a3b8;
            border-bottom: 2px solid #64748b;
            box-shadow: 0 1px 0 #cbd5e1;
        }

        select,
        button,
        input[type=text]:not(.filter-popup-position-input):not(.submit-ring-x-input):not(.combo-cell-input) {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #26343f;
            background: #08121a;
            color: var(--text)
        }

        .numbers {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px
        }

        .num {
            width: 36px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: #08121a;
            border: 1px solid #16323a;
            cursor: pointer
        }

        .num.selected {
            background: var(--accent);
            color: #05210a;
            font-weight: 800
        }

        .num.blocked {
            background: #000;
            color: #777
        }

        .num.answer {
            background: green;
            color: white
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px
        }

        th,
        td {
            padding: 6px;
            border: 1px solid #22303a;
            font-size: 13px
        }

        .row-actions button {
            padding: 6px 8px
        }

        .small {
            font-size: 13px;
            color: var(--muted)
        }

        .file-row {
            display: flex;
            gap: 8px;
            align-items: center
        }

        .selected-count {
            margin-left: auto;
            color: var(--muted)
        }

        .copy-selected {
            background: #0b6d3a;
            color: white;
            border: none
        }

        /* Sheet tabs styling - inspired by Excel */
        .sheet-tabs-container {
            background: #f5f5f5;
            border-top: 1px solid #d0d0d0;
            padding: 0;
            margin-top: auto;
            flex-shrink: 0;
            height: 36px;
            display: flex;
            align-items: center;
            flex-direction: row;
            overflow: hidden;
        }

        .sheet-tabs-bar {
            display: flex;
            gap: 4px;
            padding: 2px 4px;
            align-items: center;
            height: 100%;
            flex: 1 1 auto;
            min-width: 0;
            overflow-x: auto;
            /* Ẩn thanh cuộn ngang; vẫn cuộn bằng wheel / kéo (xem initSheetTabsHorizontalScroll) */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .sheet-tabs-bar::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        .sheet-tabs-container .zoom-toolbar {
            flex-shrink: 0;
            padding: 0 6px 0 4px;
            height: 100%;
        }

        .sheet-tab {
            background: #e0e0e0;
            border: 1px solid #bbb;
            color: #333;
            padding: 4px 12px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px 4px 0 0;
            transition: background 0.2s, color 0.2s;
            white-space: nowrap;
        }

        .sheet-tab:hover {
            background: #d4d4d4;
        }

        .sheet-tab.active {
            background: #ffffff;
            border-bottom: 2px solid #38ef7d;
            color: #111;
            font-weight: 600;
        }

        .sheet-tab-add {
            background: #e0e0e0;
            border: 1px solid #bbb;
            color: #333;
            padding: 4px 8px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
            min-width: 24px;
            height: 24px;
        }

        .sheet-tab-add:hover {
            background: #d4d4d4;
        }

        /* Sheet tracking: nền sáng, full vùng #tableWrap (dưới toolbar, trên tabs), nội dung co trong khung */
        #tableWrap.table-wrap--tracking {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-height: 0;
            min-width: 0;
            overflow: hidden;
            padding-bottom: 0;
            scroll-padding-bottom: 0;
        }

        #tableWrap.table-wrap--tracking .special-tracking-root {
            flex: 1 1 auto;
            min-height: 0;
            min-width: 0;
            width: 100%;
            max-height: 100%;
            border-radius: 0;
            box-shadow: none;
        }

        .special-tracking-root {
            --st-bg: #fff8f3;
            --st-panel: #fffaf7;
            --st-border: #e8d5ca;
            --st-text: #3d342f;
            --st-muted: #8a7b72;
            --st-accent: #c45d28;
            --st-hot: #dc2626;
            --st-focus: #c27803;
            --st-bar-bg: #f3e8e2;
            --st-track-mid: #e5d6ce;
            --st-timeline-trough: #efe4de;
            box-sizing: border-box;
            height: 100%;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #fffdfb 0%, #fff4ec 40%, #f7ebe4 100%);
            color: var(--st-text);
            font-family: Inter, "Segoe UI", system-ui, sans-serif;
            overflow: hidden;
        }

        .special-tracking-head {
            display: none;
        }

        .special-tracking-title,
        .special-tracking-sub {
            margin: 0;
        }

        .special-tracking-stage {
            flex: 1 1 0;
            min-height: 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            padding: 4px 8px 4px;
            overflow: hidden;
        }

        #tableWrap.table-wrap--tracking .special-tracking-stage {
            padding: 0;
        }

        .special-tracking-rank-wrap {
            flex: 1 1 0;
            min-height: 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .special-tracking-rank-shell {
            position: relative;
            flex: 1 1 0;
            min-height: 0;
            border-radius: 8px;
            border: 1px solid var(--st-border);
            background: linear-gradient(180deg, #fffaf6 0%, #fceee6 45%, #f0dfd6 100%);
            overflow: hidden;
        }

        .special-tracking-rank-stack {
            position: relative;
            z-index: 1;
            box-sizing: border-box;
            height: 100%;
            min-height: 160px;
            padding: 0;
            margin: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.35) 0%, transparent 55%, rgba(0, 0, 0, 0.03) 100%);
        }

        .special-tracking-rank-bar {
            position: absolute;
            left: 0;
            right: 0;
            top: calc(100% * var(--st-slot, 0) / var(--st-slot-count, 12));
            height: calc(100% / var(--st-slot-count, 12));
            z-index: calc(20 - var(--st-slot, 0));
            box-sizing: border-box;
            padding: 0;
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 0;
            border-radius: 0;
            cursor: pointer;
            border: none;
            background: transparent;
            transition: top 0.45s cubic-bezier(0.22, 1, 0.36, 1), background 0.15s, box-shadow 0.15s;
        }

        .special-tracking-root--scrubbing .special-tracking-rank-bar {
            transition-duration: 0s, 0.15s, 0.15s;
        }

        .special-tracking-root--playing .special-tracking-rank-bar {
            transition-duration: 0s, 0.15s, 0.15s;
        }

        .special-tracking-root--frame-stepping .special-tracking-rank-bar {
            transition: top 0.1s ease-out, background 0.15s, box-shadow 0.15s;
        }

        .special-tracking-rank-bar:hover {
            background: rgba(255, 255, 255, 0.42);
        }

        .special-tracking-rank-bar:focus {
            outline: none;
        }

        .special-tracking-rank-bar--just {
            background: rgba(255, 252, 240, 0.5);
            box-shadow: inset 0 0 0 1px rgba(200, 185, 120, 0.35);
        }

        .special-tracking-rank-bar--focus,
        .special-tracking-rank-bar--click-focus {
            z-index: 50 !important;
            background: transparent !important;
            box-shadow: none !important;
            outline: none !important;
            isolation: isolate;
        }

        /* Viền focus / đáp án: 2 thanh chữ nhật — main (trái, trước bụng mờ) + tail (nhãn+freq trong bụng) */
        .special-tracking-rank-bar--focus .special-tracking-rank-track--main::after,
        .special-tracking-rank-bar--click-focus .special-tracking-rank-track--main::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            z-index: 80;
            pointer-events: none;
            box-sizing: border-box;
        }

        .special-tracking-rank-bar--focus .special-tracking-rank-track--main::after {
            box-shadow: inset 0 0 0 3px #0a0a0a;
        }

        .special-tracking-rank-bar--click-focus .special-tracking-rank-track--main::after {
            box-shadow: inset 0 0 0 3px #ea580c;
        }

        .special-tracking-rank-bar--focus .special-tracking-rank-bar-tail::after,
        .special-tracking-rank-bar--click-focus .special-tracking-rank-bar-tail::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: var(--st-bar-tail-border-left-inset, calc(var(--st-freq-brace-w) - var(--st-label-digit-w) - 6px));
            right: var(--st-bar-border-right-inset, 0);
            z-index: 80;
            pointer-events: none;
            box-sizing: border-box;
        }

        .special-tracking-rank-bar--focus .special-tracking-rank-bar-tail::after {
            box-shadow: inset 0 0 0 3px #0a0a0a;
        }

        .special-tracking-rank-bar--click-focus .special-tracking-rank-bar-tail::after {
            box-shadow: inset 0 0 0 3px #ea580c;
        }

        /* Viền cam + đáp án: tắt viền xanh ::before riêng, gộp vào ::after */
        .special-tracking-rank-bar--click-focus.special-tracking-rank-bar--actual-answer .special-tracking-rank-track--main::before,
        .special-tracking-rank-bar--click-focus.special-tracking-rank-bar--actual-answer .special-tracking-rank-bar-tail::before {
            box-shadow: none !important;
        }

        /* Basic: cam ngoài, xanh lá sát trong — mỏng hơn special */
        .special-tracking-root--basic .special-tracking-rank-bar--click-focus.special-tracking-rank-bar--actual-answer .special-tracking-rank-track--main::after,
        .special-tracking-root--basic .special-tracking-rank-bar--click-focus.special-tracking-rank-bar--actual-answer .special-tracking-rank-bar-tail::after {
            box-shadow:
                inset 0 0 0 var(--st-basic-focus-border-w, 2px) #ea580c,
                inset 0 0 0 calc(var(--st-basic-focus-border-w, 2px) + 1px) rgba(0, 125, 68, 0.95);
        }

        .special-tracking-rank-bar--focus:hover,
        .special-tracking-rank-bar--click-focus:hover {
            background: transparent !important;
        }

        /* Neon dự đoán chỉ khi bật nút Predict */
        .special-tracking-root--predict-neon-on .special-tracking-rank-bar--predict {
            z-index: 44 !important;
        }

        .special-tracking-rank-bar--predict .special-tracking-rank-track--main::before,
        .special-tracking-rank-bar--predict .special-tracking-rank-bar-tail::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            z-index: 6;
            pointer-events: none;
            box-sizing: border-box;
        }

        .special-tracking-rank-bar--predict .special-tracking-rank-track--main::before {
            left: 0;
            right: 0;
        }

        .special-tracking-rank-bar--predict .special-tracking-rank-bar-tail::before {
            left: var(--st-bar-tail-border-left-inset, calc(var(--st-freq-brace-w) - var(--st-label-digit-w) - 6px));
            right: var(--st-bar-border-right-inset, 0);
        }

        /* Dự đoán id+1 (#1–#3, chưa trúng): viền xanh dương — chỉ khi bật Predict */
        .special-tracking-root--predict-neon-on .special-tracking-rank-bar--predict:not(.special-tracking-rank-bar--predict-hit) .special-tracking-rank-track--main::before,
        .special-tracking-root--predict-neon-on .special-tracking-rank-bar--predict:not(.special-tracking-rank-bar--predict-hit) .special-tracking-rank-bar-tail::before {
            box-shadow:
                inset 0 0 0 3px rgba(35, 100, 215, 0.95),
                inset 0 0 16px rgba(25, 75, 185, 0.38),
                inset 0 0 28px rgba(45, 125, 235, 0.18);
        }

        /* Dự đoán id+1 trúng đáp án: viền cyan */
        .special-tracking-root--predict-neon-on .special-tracking-rank-bar--predict.special-tracking-rank-bar--predict-hit .special-tracking-rank-track--main::before,
        .special-tracking-root--predict-neon-on .special-tracking-rank-bar--predict.special-tracking-rank-bar--predict-hit .special-tracking-rank-bar-tail::before {
            box-shadow:
                inset 0 0 0 3px rgba(0, 190, 210, 0.95),
                inset 0 0 16px rgba(0, 160, 185, 0.4),
                inset 0 0 28px rgba(0, 210, 230, 0.2);
        }

        /* Đáp án kỳ hiện tại (id): viền xanh lá — chỉ khi Predict tắt */
        .special-tracking-root:not(.special-tracking-root--predict-on) .special-tracking-rank-bar--actual-answer {
            z-index: 45 !important;
        }

        .special-tracking-root:not(.special-tracking-root--basic):not(.special-tracking-root--predict-on) .special-tracking-rank-bar--actual-answer .special-tracking-rank-track--main::before,
        .special-tracking-root:not(.special-tracking-root--basic):not(.special-tracking-root--predict-on) .special-tracking-rank-bar--actual-answer .special-tracking-rank-bar-tail::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            z-index: 6;
            pointer-events: none;
            box-sizing: border-box;
            box-shadow: inset 0 0 0 3px rgba(0, 125, 68, 0.95);
        }

        .special-tracking-root:not(.special-tracking-root--basic):not(.special-tracking-root--predict-on) .special-tracking-rank-bar--actual-answer .special-tracking-rank-track--main::before {
            left: 0;
            right: 0;
        }

        .special-tracking-root:not(.special-tracking-root--basic):not(.special-tracking-root--predict-on) .special-tracking-rank-bar--actual-answer .special-tracking-rank-bar-tail::before {
            left: var(--st-bar-tail-border-left-inset, calc(var(--st-freq-brace-w) - var(--st-label-digit-w) - 6px));
            right: var(--st-bar-border-right-inset, 0);
        }

        .special-tracking-rank-bar-main {
            flex: 1 1 0;
            min-width: 0;
            padding: 0;
            display: flex;
            flex-direction: row;
            align-items: stretch;
            position: relative;
        }

        /* Thanh 1: track chính — kết thúc trước vùng bụng mờ */
        .special-tracking-rank-track--main {
            flex: 1 1 0;
            min-width: 0;
        }

        /* Thanh 2: vùng nhãn trong bụng mờ (label-out); label-in vẫn giữ chỗ cho ghost */
        .special-tracking-rank-track--label {
            flex: 0 0 var(--st-freq-brace-w, clamp(28px, 5vw, 38px));
            min-width: 0;
        }

        .special-tracking-root--label-in .special-tracking-rank-track--label {
            visibility: hidden;
            pointer-events: none;
        }

        .special-tracking-rank-bar-tail {
            position: relative;
            flex: 0 0 calc(var(--st-freq-brace-w, clamp(28px, 5vw, 38px)) * 2);
            min-width: 0;
            display: flex;
            flex-direction: row;
            align-items: stretch;
        }

        .special-tracking-root--label-in .special-tracking-rank-bar-tail {
            flex: 0 0 var(--st-freq-brace-w, clamp(28px, 5vw, 38px));
        }

        .special-tracking-root--label-in .special-tracking-rank-bar-tail .special-tracking-rank-track--label {
            display: none;
        }

        .special-tracking-rank-track {
            flex: 1 1 0;
            width: 100%;
            min-height: 0;
            height: 100%;
            border-radius: 0;
            background: linear-gradient(180deg, #ebe1db 0%, #ddd2c8 100%);
            overflow: hidden;
            position: relative;
        }

        .special-tracking-rank-fill {
            position: relative;
            display: block;
            height: 100%;
            width: 0%;
            overflow: hidden;
            border-radius: 0;
            /* Màu theo hạng: --st-hue-t do paint() set (hạng 1 = 2/12, vàng đúng); fallback theo slot */
            background: linear-gradient(180deg,
                    hsl(calc(52 + 164 * var(--st-hue-t, calc((var(--st-slot, 0) + 1) / 12))), 100%, 96%) 0%,
                    hsl(calc(52 + 164 * var(--st-hue-t, calc((var(--st-slot, 0) + 1) / 12))), 96%, 86%) 40%,
                    hsl(calc(48 + 164 * var(--st-hue-t, calc((var(--st-slot, 0) + 1) / 12))), 88%, 58%) 100%);
            transform-origin: left center;
            transition: width 0.38s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .special-tracking-root--scrubbing .special-tracking-rank-fill {
            transition-duration: 0s;
        }

        .special-tracking-root--playing .special-tracking-rank-fill {
            transition-duration: 0s;
        }

        /* Vừa quay: giữ gradient theo hạng, chỉ sáng nhẹ — không dùng hồng (#fb7185 / #f76370) */
        .special-tracking-rank-bar--just .special-tracking-rank-fill {
            filter: saturate(1.12) brightness(1.06);
        }

        .special-tracking-rank-fill .special-tracking-rank-num,
        .special-tracking-rank-track--main>.special-tracking-rank-num,
        .special-tracking-rank-track--label>.special-tracking-rank-num {
            position: absolute;
            top: 50%;
            z-index: 2;
            font-weight: 900;
            font-size: clamp(14px, 2vh, 20px);
            line-height: 1;
            color: #000000;
            letter-spacing: -0.03em;
            -webkit-text-stroke: 0.55px rgba(255, 255, 255, 0.97);
            paint-order: stroke fill;
            /* Halo dày + đổ bóng sâu để nổi rõ trên gradient sáng */
            text-shadow:
                -1px 0 0 rgba(255, 255, 255, 0.9),
                1px 0 0 rgba(255, 255, 255, 0.9),
                0 -1px 0 rgba(255, 255, 255, 0.9),
                0 1px 0 rgba(255, 255, 255, 0.9),
                0 0 2px rgba(255, 255, 255, 1),
                0 0 12px rgba(255, 255, 255, 0.95),
                0 2px 4px rgba(0, 0, 0, 0.32),
                0 4px 10px rgba(0, 0, 0, 0.22),
                0 6px 16px rgba(0, 0, 0, 0.12);
            font-variant-numeric: tabular-nums;
            pointer-events: none;
            user-select: none;
        }

        .special-tracking-root--label-in .special-tracking-rank-track--main>.special-tracking-rank-num {
            right: auto;
        }

        .special-tracking-root--label-out .special-tracking-rank-track--label>.special-tracking-rank-num {
            right: 0;
            left: auto;
            transform: translateY(-50%);
        }

        .special-tracking-root--label-in {
            --st-bar-tail-border-left-inset: 0;
        }

        /* label-in: thanh main dừng trước vùng bụng mờ (ghost) trên cùng track */
        .special-tracking-root--label-in .special-tracking-rank-bar--focus .special-tracking-rank-track--main::after,
        .special-tracking-root--label-in .special-tracking-rank-bar--click-focus .special-tracking-rank-track--main::after,
        .special-tracking-root--label-in .special-tracking-rank-bar--actual-answer .special-tracking-rank-track--main::before,
        .special-tracking-root--label-in .special-tracking-rank-bar--predict .special-tracking-rank-track--main::before {
            right: var(--st-freq-brace-w, clamp(28px, 5vw, 38px));
        }

        .special-tracking-rank-meta {
            flex: 0 0 var(--st-freq-brace-w, clamp(28px, 5vw, 38px));
            min-width: 0;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            gap: 2px;
            padding: 0 2px 0 4px;
            box-sizing: border-box;
        }

        .special-tracking-root:not(.special-tracking-root--basic) .special-tracking-rank-meta {
            flex: 0 0 var(--st-freq-meta-w, clamp(68px, 15vw, 92px));
        }

        .special-tracking-rank-count {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            min-width: 0;
            padding: 0;
            font-size: clamp(11px, 1.5vh, 14px);

            flex: 0 0 auto;

            pointer-events: none;
            user-select: none;
            position: relative;
            z-index: 14;
            font-variant-numeric: tabular-nums;
        }

        .special-tracking-rank-bar--predict-1:not(.special-tracking-rank-bar--predict-hit) .special-tracking-rank-prio {
            color: #0b3d91;
        }

        .special-tracking-rank-bar--predict-2:not(.special-tracking-rank-bar--predict-hit) .special-tracking-rank-prio {
            color: #154f9e;
        }

        .special-tracking-rank-bar--predict-3:not(.special-tracking-rank-bar--predict-hit) .special-tracking-rank-prio {
            color: #1a5fb4;
        }

        .special-tracking-rank-bar--predict-hit.special-tracking-rank-bar--predict-1 .special-tracking-rank-prio {
            color: #087a8a;
        }

        .special-tracking-rank-bar--predict-hit.special-tracking-rank-bar--predict-2 .special-tracking-rank-prio {
            color: #0a8f9e;
        }

        .special-tracking-rank-bar--predict-hit.special-tracking-rank-bar--predict-3 .special-tracking-rank-prio {
            color: #0ca5b8;
        }

        .special-tracking-root--scrubbing .special-tracking-timeline-fill,
        .special-tracking-root--scrubbing .special-tracking-timeline-thumb,
        .special-tracking-root--playing .special-tracking-timeline-fill,
        .special-tracking-root--playing .special-tracking-timeline-thumb {
            transition: none !important;
        }

        /* Mount / toggle view: đặt timeline + bar ngay vị trí đúng, không animate từ đầu */
        .special-tracking-root--mount-snap .special-tracking-timeline-fill,
        .special-tracking-root--mount-snap .special-tracking-timeline-thumb,
        .special-tracking-root--mount-snap .special-tracking-rank-bar,
        .special-tracking-root--mount-snap .special-tracking-rank-fill,
        .special-tracking-root--mount-snap .special-tracking-freq-brace,
        .special-tracking-root--mount-snap .special-tracking-freq-gap-divider {
            transition: none !important;
        }

        .special-tracking-controls {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 2px 6px 4px;
            border-top: 1px solid var(--st-border);
            background: var(--st-panel);
        }

        .special-tracking-controls-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 5px 6px;
        }

        .special-tracking-controls-row--timeline {
            flex-direction: column;
            align-items: stretch;
            border-bottom: 1px solid var(--st-border);
            padding-bottom: 3px;
            margin-bottom: 0;
        }

        .special-tracking-timeline-head {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            width: 100%;
            min-width: 0;
            gap: 0;
        }

        .special-tracking-timeline-head .special-tracking-timeline-wrap {
            flex: 0 0 auto;
            width: 100%;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        /* Bước n/N căn giữa theo timeline; Predict + #1% nằm cụm bên phải (Predict trái #1) */
        .special-tracking-timeline-meta-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            width: 100%;
            min-width: 0;
            margin-top: 1px;
            column-gap: 4px;
        }

        .special-tracking-meta-spacer {
            min-width: 0;
            grid-column: 1;
        }

        .special-tracking-timeline-meta-row .special-tracking-step-label {
            grid-column: 2;
            justify-self: center;
            margin: 0;
            text-align: center;
            white-space: nowrap;
            font-size: clamp(9px, 1.05vh, 10px);
            line-height: 1.25;
        }

        .special-tracking-meta-right {
            grid-column: 3;
            justify-self: end;
            display: inline-flex;
            flex-direction: row;
            align-items: center;
            gap: 4px;
            min-width: 0;
            max-width: 100%;
        }

        .special-tracking-meta-right .special-tracking-predict-toggle {
            flex: 0 0 auto;
        }

        .special-tracking-meta-right .special-tracking-rank-stats {
            flex: 0 1 auto;
            min-width: 0;
            margin-left: 0;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .special-tracking-predict-toggle {
            flex: 0 0 auto;
            padding: 1px 5px;
            border-radius: 5px;
            border: 1px solid var(--st-border);
            background: linear-gradient(180deg, #fff 0%, #f3eae4 100%);
            color: var(--st-text);
            font-size: clamp(8px, 1vh, 10px);
            font-weight: 800;
            letter-spacing: 0.03em;
            line-height: 1.15;
            cursor: pointer;
            transition: box-shadow 0.2s, border-color 0.15s, background 0.15s, color 0.15s, filter 0.15s;
        }

        .special-tracking-predict-toggle:hover:not(.is-on) {
            border-color: var(--st-accent);
            background: #fffdfb;
        }

        .special-tracking-predict-toggle.is-on {
            border-color: #1d4ed8;
            background: linear-gradient(180deg, #3b82f6 0%, #2563eb 42%, #1d4ed8 100%);
            color: #fff;
            box-shadow:
                0 0 0 2px rgba(59, 130, 246, 0.5),
                0 2px 12px rgba(29, 78, 216, 0.42),
                inset 0 1px 0 rgba(255, 255, 255, 0.28);
        }

        .special-tracking-predict-toggle.is-on:hover {
            filter: brightness(1.07);
        }

        .special-tracking-rank-stats {
            font-size: clamp(8px, 1vh, 10px);
            font-weight: 700;
            color: var(--st-muted);
            line-height: 1.15;
            font-variant-numeric: tabular-nums;
        }


        .special-tracking-controls-row--transport {
            align-items: center;
            gap: 5px;
            padding: 4px 6px;
            border-radius: 8px;
            background: #212121;
            border: 1px solid #303030;
        }

        .special-tracking-icon-btn {
            flex: 0 0 auto;
            width: 30px;
            height: 30px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }

        .special-tracking-icon-btn.special-tracking-icon-btn--glyph {
            display: inline-grid;
            place-items: center;
        }

        .special-tracking-icon-btn:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        .special-tracking-icon-btn:active {
            transform: scale(0.94);
        }

        .special-tracking-icon-btn:focus-visible {
            outline: 2px solid #ff4444;
            outline-offset: 2px;
        }

        .special-tracking-icon-btn--play {
            width: 34px;
            height: 34px;
            background: #ff0000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        }

        .special-tracking-icon-btn--play:hover {
            background: #e60000;
        }

        .special-tracking-icon-btn--play .special-tracking-svg-pause {
            display: none;
        }

        .special-tracking-icon-btn--play.is-playing .special-tracking-svg-play {
            display: none;
        }

        .special-tracking-icon-btn--play.is-playing .special-tracking-svg-pause {
            display: block;
        }

        .special-tracking-icon-btn svg {
            display: block;
            flex-shrink: 0;
        }

        .special-tracking-icon-btn--glyph {
            line-height: 0;
            font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", "Arial Unicode MS", sans-serif;
            font-variant-emoji: text;
        }

        .special-tracking-icon-btn--glyph span {
            display: grid;
            place-items: center;
            width: 1.15em;
            height: 1.15em;
            margin: 0;
            padding: 0;
            font-size: 0.95rem;
            line-height: 1;
            font-variant-emoji: text;
        }

        .special-tracking-svg-play,
        .special-tracking-svg-pause {
            width: 22px;
            height: 22px;
        }

        .special-tracking-speed-slider-wrap {
            display: flex;
            flex: 1 1 140px;
            min-width: 100px;
            max-width: 320px;
            align-items: center;
            gap: 5px;
            margin-left: auto;
        }

        .special-tracking-speed-slider-inner {
            display: flex;
            flex: 1 1 0;
            min-width: 0;
            align-items: center;
            gap: 1px;
        }

        .special-tracking-speed-slider-inner .special-tracking-speed-slider {
            flex: 1 1 0;
            min-width: 80px;
        }

        .special-tracking-speed-hint {
            font-size: clamp(9px, 1.05vh, 11px);
            color: #aaa;
            white-space: nowrap;
        }

        .special-tracking-speed-readout {
            flex: 0 0 auto;
            min-width: 0;
            padding-left: 1px;
            font-size: clamp(9px, 1.05vh, 11px);
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: #f1f1f1;
            text-align: left;
            white-space: nowrap;
        }

        .special-tracking-speed-slider {
            flex: 1 1 0;
            min-width: 80px;
            height: 14px;
            margin: 0;
            accent-color: #ff0000;
            cursor: pointer;
        }

        .special-tracking-speed-slider::-webkit-slider-thumb {
            cursor: pointer;
        }

        .special-tracking-view-toggle {
            flex: 0 0 auto;
            min-width: 3.8rem;
            font-size: clamp(9px, 1.05vh, 11px);
            font-weight: 800;
            text-transform: lowercase;
            letter-spacing: 0.02em;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid #64748b;
            background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
            color: #334155;
            cursor: pointer;
            line-height: 1.2;
        }

        .special-tracking-view-toggle:hover {
            border-color: #475569;
            background: #f8fafc;
        }

        .special-tracking-view-toggle[aria-pressed="true"] {
            background: #facc15;
            color: #111;
            border-color: #ca8a04;
        }

        .special-tracking-label-toggle {
            flex: 0 0 auto;
            min-width: 3.2rem;
            font-size: clamp(9px, 1.05vh, 11px);
            font-weight: 800;
            text-transform: lowercase;
            letter-spacing: 0.02em;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid #64748b;
            background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
            color: #334155;
            cursor: pointer;
            line-height: 1.2;
        }

        .special-tracking-label-toggle:hover {
            border-color: #475569;
            background: #f8fafc;
        }

        .special-tracking-label-toggle[aria-pressed="true"] {
            background: #93c5fd;
            color: #0f172a;
            border-color: #3b82f6;
        }

        .special-tracking-root--basic {
            --st-basic-meta-w: clamp(52px, 10vw, 68px);
            --st-basic-freq-digit-w: 1.1rem;
            --st-label-digit-w: clamp(10px, 1.35vh, 13px);
            --st-freq-brace-w: var(--st-basic-meta-w);
            --st-freq-brace-right: 0;
            --st-freq-brace-count-shift-x: -35%;
            /* Viền tail: trái ôm nhãn trong bụng mờ; phải dừng sau freq */
            --st-bar-tail-border-left-inset: calc(var(--st-freq-brace-w) - var(--st-label-digit-w) - 6px);
            --st-bar-border-right-inset: calc(var(--st-basic-meta-w) - var(--st-basic-freq-digit-w) - 6px);
            --st-basic-focus-border-w: 2px;
        }

        /* Basic: viền bar mỏng hơn special (2px) */
        .special-tracking-root--basic .special-tracking-rank-bar--focus .special-tracking-rank-track--main::after,
        .special-tracking-root--basic .special-tracking-rank-bar--focus .special-tracking-rank-bar-tail::after {
            box-shadow: inset 0 0 0 var(--st-basic-focus-border-w) #0a0a0a;
        }

        .special-tracking-root--basic .special-tracking-rank-bar--click-focus .special-tracking-rank-track--main::after,
        .special-tracking-root--basic .special-tracking-rank-bar--click-focus .special-tracking-rank-bar-tail::after {
            box-shadow: inset 0 0 0 var(--st-basic-focus-border-w) #ea580c;
        }

        /* Special: bụng sát mép phải, full cột meta (giống basic — không chồng lên bar) */
        .special-tracking-root:not(.special-tracking-root--basic) {
            --st-freq-meta-w: clamp(68px, 15vw, 92px);
            --st-freq-digit-w: 1.75rem;
            --st-label-digit-w: clamp(14px, 2vh, 20px);
            --st-freq-brace-w: var(--st-freq-meta-w);
            --st-freq-brace-right: 0;
            --st-freq-brace-count-shift-x: -32%;
            --st-special-focus-border-w: 5px;
            --st-bar-tail-border-left-inset: calc(var(--st-freq-brace-w) - var(--st-label-digit-w) - 8px);
            --st-bar-border-right-inset: calc(var(--st-freq-meta-w) - var(--st-freq-digit-w) - 8px);
        }

        /* Special: viền cam focus dày hơn basic */
        .special-tracking-root:not(.special-tracking-root--basic) .special-tracking-rank-bar--click-focus .special-tracking-rank-track--main::after,
        .special-tracking-root:not(.special-tracking-root--basic) .special-tracking-rank-bar--click-focus .special-tracking-rank-bar-tail::after {
            box-shadow: inset 0 0 0 var(--st-special-focus-border-w) #ea580c;
        }

        /* Special: viền xanh đáp án dày hơn */
        .special-tracking-root:not(.special-tracking-root--basic):not(.special-tracking-root--predict-on) .special-tracking-rank-bar--actual-answer .special-tracking-rank-track--main::before,
        .special-tracking-root:not(.special-tracking-root--basic):not(.special-tracking-root--predict-on) .special-tracking-rank-bar--actual-answer .special-tracking-rank-bar-tail::before {
            box-shadow: inset 0 0 0 var(--st-special-focus-border-w) rgba(0, 125, 68, 0.95);
        }

        /* Special: cam + xanh cùng độ dày, xanh sát trong cam */
        .special-tracking-root:not(.special-tracking-root--basic) .special-tracking-rank-bar--click-focus.special-tracking-rank-bar--actual-answer .special-tracking-rank-track--main::after,
        .special-tracking-root:not(.special-tracking-root--basic) .special-tracking-rank-bar--click-focus.special-tracking-rank-bar--actual-answer .special-tracking-rank-bar-tail::after {
            box-shadow:
                inset 0 0 0 var(--st-special-focus-border-w) #ea580c,
                inset 0 0 0 calc(var(--st-special-focus-border-w) * 2) rgba(0, 125, 68, 0.95);
        }

        .special-tracking-root--basic .special-tracking-rank-num {
            font-size: clamp(10px, 1.35vh, 13px);
        }

        .special-tracking-root--basic .special-tracking-rank-count {
            font-size: clamp(9px, 1.15vh, 11px);
            min-width: var(--st-basic-freq-digit-w);
            position: relative;
            z-index: 4;
        }

        /* Basic: cửa sổ trượt 10 — win10=0 đỏ; win10=1 gạch chân; win10=0|1 + chuỗi 11 → in nghiêng */
        .special-tracking-root--basic .special-tracking-rank-bar--win10-freq-one .special-tracking-rank-num {
            text-decoration: underline solid 1.5px #000000 !important;
            text-decoration-color: #000000 !important;
            -webkit-text-decoration-color: #000000 !important;
            text-underline-offset: 2px;
        }

        .special-tracking-root--basic .special-tracking-rank-bar--win10-freq-one .special-tracking-rank-count {
            border-bottom: 1.5px solid #000000;
        }

        .special-tracking-root--basic .special-tracking-rank-num--win10-ch11-ch12-italic,
        .special-tracking-root--basic .special-tracking-rank-num--ch1-ch2-italic-left {
            font-style: italic !important;
            display: inline-block;
            transform-origin: center center;
        }

        .special-tracking-root--basic .special-tracking-rank-count--win10-ch11-ch12-italic {
            font-style: italic !important;
            display: inline-block;
            transform: skewX(-12deg);
            transform-origin: center center;
        }

        /* Basic: số có trong chuỗi 1/2 (2 kỳ liền trước) — in nghiêng sang trái; ưu tiên hơn chuỗi 11 */
        .special-tracking-root--basic .special-tracking-rank-count--ch1-ch2-italic-left {
            font-style: italic !important;
            display: inline-block;
            transform: skewX(28deg);
            transform-origin: center center;
        }

        /* Special: số đặc biệt ở kỳ 1–2 liền trước — cùng độ nghiêng trái như basic chuỗi 1/2 */
        .special-tracking-root:not(.special-tracking-root--basic) .special-tracking-rank-num--ch1-ch2-italic-left {
            font-style: italic !important;
            display: inline-block;
            transform-origin: center center;
        }

        .special-tracking-root:not(.special-tracking-root--basic) .special-tracking-rank-count--ch1-ch2-italic-left {
            font-style: italic !important;
            display: inline-block;
            transform: skewX(28deg);
            transform-origin: center center;
        }

        /* Special: số đặc biệt ở kỳ 11–12 liền trước — cùng độ nghiêng phải như basic chuỗi 11 */
        .special-tracking-root:not(.special-tracking-root--basic) .special-tracking-rank-num--win10-ch11-ch12-italic {
            font-style: italic !important;
            display: inline-block;
            transform-origin: center center;
        }

        .special-tracking-root:not(.special-tracking-root--basic) .special-tracking-rank-count--win10-ch11-ch12-italic {
            font-style: italic !important;
            display: inline-block;
            transform: skewX(-12deg);
            transform-origin: center center;
        }

        .special-tracking-root--basic .special-tracking-rank-bar--win10-freq-zero .special-tracking-rank-num,
        .special-tracking-root--basic .special-tracking-rank-bar--win10-freq-zero .special-tracking-rank-count {
            color: #ff0000 !important;
        }

        /* Special: freq không nối đuôi ±1 với số liền trước/sau trên stack */
        .special-tracking-root:not(.special-tracking-root--basic) .special-tracking-rank-bar--freq-disconnected .special-tracking-rank-num,
        .special-tracking-root:not(.special-tracking-root--basic) .special-tracking-rank-bar--freq-disconnected .special-tracking-rank-count {
            color: #ff0000 !important;
        }

        .special-tracking-root:not(.special-tracking-root--basic) .special-tracking-rank-bar--freq-disconnected .special-tracking-rank-num {
            -webkit-text-stroke: 0 !important;
            paint-order: normal;
            text-shadow: none !important;
        }

        .special-tracking-root--basic .special-tracking-rank-bar--win10-freq-zero .special-tracking-rank-num {
            -webkit-text-stroke: 0 !important;
            paint-order: normal;
            text-shadow: none !important;
        }

        /* Basic + submit/giả lập: nhãn win10=0 trong đáp án — xanh lá vừa, dễ đọc không chói */
        .special-tracking-root--basic .special-tracking-rank-bar--submit-win10-zero-answer .special-tracking-rank-num {
            color: #1f9d55 !important;
            -webkit-text-stroke: 0.35px rgba(255, 255, 255, 0.8) !important;
            paint-order: stroke fill;
            text-shadow:
                0 0 2px rgba(255, 255, 255, 0.55),
                0 1px 2px rgba(0, 0, 0, 0.1);
            text-decoration: none !important;
        }

        /* Basic + autoring (tracking): viền đen giống click quan sát bar — dùng class --focus */
        .special-tracking-root--basic .special-tracking-rank-bar--autoring-nonexist {
            z-index: 50 !important;
        }

        .special-tracking-root--basic .special-tracking-rank-meta {
            flex: 0 0 var(--st-basic-meta-w);
            min-width: 0;
            padding: 0 2px 0 2px;
        }

        .special-tracking-root--basic .special-tracking-rank-stack {
            min-height: 0;
        }

        /* Tracking basic + special: dấu } bọc cột meta (bụng + freq) — full --st-freq-brace-w */
        .special-tracking-freq-brace-layer {
            position: absolute;
            top: 0;
            right: var(--st-freq-brace-right, 0);
            bottom: 0;
            width: var(--st-freq-brace-w, clamp(28px, 5vw, 38px));
            z-index: 3;
            pointer-events: none;
            overflow: hidden;
            box-sizing: border-box;
        }

        .special-tracking-freq-brace {
            position: absolute;
            left: 0;
            right: 2px;
            width: auto;
            color: #111;
            box-sizing: border-box;
            padding: 0;
            transition: top 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                height 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .special-tracking-freq-brace-count {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 2;
            transform: translate(var(--st-freq-brace-count-shift-x, -35%), -50%);
            font-size: clamp(8px, 1.1vh, 11px);
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            color: #111;
            pointer-events: none;
            user-select: none;
            text-shadow: 0 0 3px rgba(255, 255, 255, 0.85);
            white-space: nowrap;
            letter-spacing: -0.02em;
        }

        .special-tracking-root:not(.special-tracking-root--basic) .special-tracking-freq-brace-count {
            font-size: clamp(13px, 2.35vh, 20px);
        }

        .special-tracking-root--scrubbing .special-tracking-freq-brace {
            transition-duration: 0s;
        }

        .special-tracking-root--playing .special-tracking-freq-brace {
            transition-duration: 0s;
        }

        .special-tracking-freq-brace svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Bụng solid mặc định (submit OFF): chấm li ti */
        .special-tracking-freq-brace:not(.special-tracking-freq-brace--ghost):not(.special-tracking-freq-brace--solid-shifted) svg path {
            stroke-dasharray: 0.9 3.6;
            stroke-linecap: round;
            stroke-width: 1.35;
        }

        /* Dịch chuyển freq — submit ON / giả lập: nét liền đậm, nổi bật */
        .special-tracking-freq-brace:not(.special-tracking-freq-brace--ghost).special-tracking-freq-brace--solid-shifted {
            color: #000;
            filter: drop-shadow(0 0 0.65px rgba(0, 0, 0, 0.55));
        }

        .special-tracking-freq-brace:not(.special-tracking-freq-brace--ghost).special-tracking-freq-brace--solid-shifted svg path {
            stroke-dasharray: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 2.85;
        }

        /* Submit ON: bụng mờ — đối xứng gương qua mép bar|cột meta (--st-freq-brace-w) */
        .special-tracking-freq-brace-layer--ghost {
            z-index: 4;
            left: auto;
            right: var(--st-freq-brace-w, clamp(28px, 5vw, 38px));
            width: var(--st-freq-brace-w, clamp(28px, 5vw, 38px));
            pointer-events: none;
            overflow: hidden;
            box-sizing: border-box;
        }

        .special-tracking-freq-brace--ghost {
            left: 2px;
            right: 0;
            width: auto;
        }

        /* Bụng không đổi trước/sau submit: chấm li ti thưa */
        .special-tracking-freq-brace--ghost:not(.special-tracking-freq-brace--ghost-changed) {
            color: rgba(17, 17, 17, 0.5);
        }

        .special-tracking-freq-brace--ghost:not(.special-tracking-freq-brace--ghost-changed) svg path {
            stroke-dasharray: 0.9 3.6;
            stroke-linecap: round;
            stroke-width: 1.35;
        }

        /* Bụng thay đổi sau submit / giả lập: nét liền ghost */
        .special-tracking-freq-brace--ghost-changed {
            color: #111;
        }

        .special-tracking-freq-brace--ghost-changed svg path {
            stroke-dasharray: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 1.75;
        }

        /* Special tracking: viền đậm nổi bật hơn chấm li ti */
        .special-tracking-root:not(.special-tracking-root--basic) .special-tracking-freq-brace:not(.special-tracking-freq-brace--ghost).special-tracking-freq-brace--solid-shifted {
            color: #000;
            filter: drop-shadow(0 0 1px rgba(0, 0, 0, 0.7));
        }

        .special-tracking-root:not(.special-tracking-root--basic) .special-tracking-freq-brace:not(.special-tracking-freq-brace--ghost).special-tracking-freq-brace--solid-shifted svg path {
            stroke-width: 3.35;
        }

        .special-tracking-root:not(.special-tracking-root--basic) .special-tracking-freq-brace--ghost-changed {
            color: #000;
            filter: drop-shadow(0 0 0.55px rgba(0, 0, 0, 0.5));
        }

        .special-tracking-root:not(.special-tracking-root--basic) .special-tracking-freq-brace--ghost-changed svg path {
            stroke-width: 2.15;
        }

        /* Special tracking: chấm li ti dài hơn, mật độ thưa hơn */
        .special-tracking-root:not(.special-tracking-root--basic) .special-tracking-freq-brace:not(.special-tracking-freq-brace--ghost):not(.special-tracking-freq-brace--solid-shifted) svg path,
        .special-tracking-root:not(.special-tracking-root--basic) .special-tracking-freq-brace--ghost:not(.special-tracking-freq-brace--ghost-changed) svg path {
            stroke-dasharray: 2.2 8.5;
        }

        /* Freq gap ≥2: đường kẻ ngăn phía solid (cột tail/meta) */
        .special-tracking-freq-gap-layer {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: calc(var(--st-freq-brace-w, clamp(28px, 5vw, 38px)) * 2);
            z-index: 6;
            pointer-events: none;
            overflow: hidden;
            box-sizing: border-box;
        }

        .special-tracking-root--label-in .special-tracking-freq-gap-layer {
            width: var(--st-freq-brace-w, clamp(28px, 5vw, 38px));
        }

        .special-tracking-freq-gap-divider {
            position: absolute;
            left: 3px;
            right: 3px;
            height: 4px;
            color: #000;
            border: none;
            background: none;
            transform: translateY(-50%);
            pointer-events: none;
            overflow: visible;
            transition: top 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .special-tracking-freq-gap-divider svg {
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .special-tracking-freq-gap-divider svg line {
            stroke-width: 2;
        }

        .special-tracking-root:not(.special-tracking-root--basic) .special-tracking-freq-gap-divider svg line {
            stroke-width: 2.75;
        }

        .special-tracking-freq-gap-divider--gap-ge3 {
            color: #e60000;
        }

        .special-tracking-root--scrubbing .special-tracking-freq-gap-divider,
        .special-tracking-root--playing .special-tracking-freq-gap-divider {
            transition-duration: 0s;
        }

        /* Tên bụng mờ: đối xứng gương qua mép ghost|solid (right:50% ↔ left:50%, đảo shift-x) */
        .special-tracking-freq-brace--ghost .special-tracking-freq-brace-count {
            left: auto;
            right: 50%;
            color: #111;
            text-shadow: 0 0 3px rgba(255, 255, 255, 0.85);
            transform: translate(calc(-1 * var(--st-freq-brace-count-shift-x, -35%)), -50%);
        }

        .special-tracking-root--scrubbing .special-tracking-freq-brace-layer--ghost,
        .special-tracking-root--playing .special-tracking-freq-brace-layer--ghost {
            transition: none;
        }

        .special-tracking-root--scrubbing .special-tracking-freq-brace--ghost,
        .special-tracking-root--playing .special-tracking-freq-brace--ghost {
            transition-duration: 0s;
        }

        /* Basic: viền xanh đáp án — 2 thanh (main + tail nhãn/freq) */
        .special-tracking-root--basic .special-tracking-rank-bar--actual-answer {
            z-index: 45 !important;
        }

        .special-tracking-root--basic .special-tracking-rank-bar--actual-answer .special-tracking-rank-track--main::before,
        .special-tracking-root--basic .special-tracking-rank-bar--actual-answer .special-tracking-rank-bar-tail::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            z-index: 6;
            pointer-events: none;
            box-sizing: border-box;
            box-shadow: inset 0 0 0 var(--st-basic-focus-border-w, 2px) rgba(0, 125, 68, 0.95);
        }

        .special-tracking-root--basic .special-tracking-rank-bar--actual-answer .special-tracking-rank-track--main::before {
            left: 0;
            right: 0;
        }

        .special-tracking-root--basic .special-tracking-rank-bar--actual-answer .special-tracking-rank-bar-tail::before {
            left: var(--st-bar-tail-border-left-inset, calc(var(--st-freq-brace-w) - var(--st-label-digit-w) - 6px));
            right: var(--st-bar-border-right-inset, 0);
        }

        .special-tracking-timeline-wrap {
            flex: 0 0 auto;
            padding: 0 6px 2px;
            background: var(--st-panel);
        }

        .special-tracking-timeline {
            position: relative;
            height: clamp(14px, 1.8vh, 20px);
            border-radius: 6px;
            background: #e8e8e8;
            border: 1px solid #ccc;
            cursor: pointer;
            overflow: hidden;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.12);
        }

        .special-tracking-timeline-fill {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0%;
            background: linear-gradient(180deg, #ff4d4d 0%, #ff0000 55%, #cc0000 100%);
            border-radius: 5px 0 0 5px;
            transition: width 0.1s ease-out;
            pointer-events: none;
        }

        .special-tracking-timeline-thumb {
            position: absolute;
            top: 50%;
            left: 0%;
            width: clamp(8px, 1.4vh, 11px);
            height: clamp(8px, 1.4vh, 11px);
            border-radius: 50%;
            background: #fff;
            border: 2px solid #ff0000;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
            pointer-events: none;
            transition: left 0.1s ease-out;
            z-index: 2;
            transform: translate(-50%, -50%);
        }

        .special-tracking-timeline-rail {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .special-tracking-step-label {
            font-size: clamp(9px, 1.05vh, 10px);
            color: var(--st-muted);
            margin-top: 0;
            text-align: center;
            line-height: 1.2;
        }

        .special-tracking-controls-row--timeline .special-tracking-timeline-wrap {
            padding: 0;
            background: transparent;
        }

        .special-tracking-empty {
            padding: clamp(16px, 4vh, 40px) 16px;
            text-align: center;
            color: var(--st-muted);
            font-size: clamp(12px, 1.4vh, 14px);
        }

        .special-tracking-root>.special-tracking-empty {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        /* Right pane container with flex layout for tabs */
        .right-pane-wrapper {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
            overflow: hidden;
        }

        .sheet-tools-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            background: #f8fafc;
            border-top: 1px solid #d7dde5;
            border-bottom: 1px solid #d7dde5;

            z-index: 25;
            overflow: visible;
            flex-wrap: wrap;
        }

        .presence-widget {
            position: relative;
            margin-left: auto;
            flex-shrink: 0;
        }

        .presence-widget[hidden] {

        }

        #presenceBtn.presence-btn {

        }

        .presence-dot {
            width: 8px;
            height: 8px;

        .presence-dot--offline {

            box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
        }

        .presence-panel {
            position: absolute;
            right: 0;

            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);

        .presence-panel.hidden {

        .presence-list {

        .presence-item--offline {

        .presence-text {

        .presence-status--online {

        .presence-status--offline {

        .device-avatar {

        .device-avatar--chat-header {

        /* Offline: mờ rõ để phân biệt với online */

        .presence-item > .presence-person-btn {
            position: relative;

            align-items: center;

            width: 28px;

        .presence-item > .presence-person-btn:hover {

        }

        .presence-item--offline > .presence-person-btn:hover {
            box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.35);
        }

        .presence-item > .presence-person,
        .presence-item > .presence-person-btn .presence-person {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            margin-top: 0;
            flex-shrink: 0;
        }

        .presence-person-badge {

            top: -5px;
            right: -6px;
            min-width: 14px;
            height: 14px;
            padding: 0 3px;
            border-radius: 999px;

            color: #fff;
            font: 700 9px/14px Segoe UI, Arial, sans-serif;

        .presence-you {

        .presence-device-tip-float {

            color: #f8fafc;

            white-space: pre-line;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.28);
            pointer-events: none;

        .presence-device-tip-float.hidden {

        /* Viền chat trên từng dòng menu list presence */
        #presencePanel #presenceList > .presence-item.presence-item--chat-active,
        #presencePanel #presenceList > .presence-item[data-chat-border="active"] {

        .presence-item--offline .presence-meta--geo {

        .presence-item--offline .presence-meta--device {

        /* Messenger-style dock: nổi đáy trang, từ phải sang trái */
        .chat-dock {

            flex-direction: row-reverse;

            max-width: calc(100vw - 24px);

        }

        .chat-dock > * {
            pointer-events: auto;
        }

        .chat-window {
            width: 300px;
            height: 360px;
            display: flex;
            flex-direction: column;
            border: 1px solid #cbd5e1;

            border-radius: 10px 10px 0 0;

            box-shadow: 0 -4px 24px rgba(15, 23, 42, 0.16);

        .chat-window--min {

        }

        .chat-panel-header {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 6px 8px 10px;
            border-bottom: 1px solid #e2e8f0;
            background: #166534;

        .chat-panel-heading {

            gap: 2px;

            align-self: center;
        }

            width: 24px;
            height: 24px;
            padding: 0;
            margin: 0;
            border: 0;
            border-radius: 4px;
            background: transparent;
            color: rgba(255, 255, 255, 0.92);
            font: 700 16px/24px Segoe UI, Arial, sans-serif;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            line-height: 1;
        }

        .chat-dock button.chat-min-btn:hover,

            color: #fff;
        }

        .chat-messages {

            overflow: auto;
            padding: 8px 10px;

        }

        .chat-empty {

            padding: 12px 4px;

        .chat-bubble-row {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 4px;
            margin-bottom: 6px;
            position: relative;
        }

        .chat-bubble-row--mine {
            justify-content: flex-end;
        }

        /* tools luôn trước bubble trong DOM; đảo thứ tự cho tin đối phương → tools bên phải */
        .chat-bubble-row > .chat-msg-tools {
            order: 2;
        }

        .chat-bubble-row > .chat-bubble {
            order: 1;
        }

        .chat-bubble-row--mine > .chat-msg-tools {
            order: 1;
        }

        .chat-bubble-row--mine > .chat-bubble {
            order: 2;
        }

        .chat-bubble-row--recalled .chat-bubble {

        .chat-msg-tools {

            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 2px;
            flex-shrink: 0;
            align-self: center;
            margin-top: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.12s ease;

        .chat-bubble-row:hover .chat-msg-tools,
        .chat-bubble-row:focus-within .chat-msg-tools,
        .chat-msg-tools:has(.chat-msg-menu.is-open),
        .chat-msg-tools:has(.chat-msg-more.is-open) {

            pointer-events: auto;

        .chat-dock button.chat-msg-reply,

        .chat-dock button.chat-msg-more {
            font-size: 16px;

            letter-spacing: 0;

        .chat-dock button.chat-msg-more.is-open,
        .chat-dock button.chat-msg-reply:hover,
        .chat-dock button.chat-msg-more:hover {
            background: #f1f5f9;
            color: #475569;
        }

        .chat-msg-menu {
            display: none;
            position: absolute;
            bottom: calc(100% + 8px);
            top: auto;
            z-index: 5;
            min-width: 110px;
            padding: 4px 0;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.14);
        }

        /* Tin mình: menu lệch trái (không che bubble bên phải) */
        .chat-bubble-row--mine .chat-msg-menu {
            left: auto;
            right: 0;
        }

        /* Tin đối phương: menu lệch phải (không che bubble bên trái) */
        .chat-bubble-row:not(.chat-bubble-row--mine) .chat-msg-menu {
            left: 0;
            right: auto;
        }

        /* Mũi tên chĩa xuống về phía nút ⋮ (kiểu thoại) */
        .chat-msg-menu::before,
        .chat-msg-menu::after {
            content: "";
            position: absolute;
            width: 0;
            height: 0;
            border-style: solid;
            pointer-events: none;
        }

        .chat-msg-menu::before {
            bottom: -8px;
            border-width: 8px 7px 0 7px;

        /* Bọc #tableWrap: nút go top/bottom — không thể “gắn” vào thanh OS; làm trùng cột + màu thanh WebKit/Fx */
        .right-table-viewport-wrap {
            /* Cột thumb + rail; tránh scrollbar-width: thin (Chrome 121+ có thể ép mỏng, bỏ qua ::-webkit-scrollbar width) */
            --rt-scrollbar-w: 18px;

            --rt-scrollbar-thumb: #c1c1c1;
            --rt-scrollbar-thumb-hover: #a8a8a8;
            --rt-scrollbar-btn-face: linear-gradient(180deg, #fafafa, #e3e3e3);
            --rt-scrollbar-btn-edge: #adadad;
            /* WebKit thumb: sàn tối thiểu (gậy dài hơn khi nội dung rất dài) */
            --rt-scrollbar-thumb-min: 96px;
            position: relative;
            flex: 1;
            min-height: 0;
            min-width: 0;
            margin-top: 0;
            display: flex;
            flex-direction: column;
        }

        #tableWrap,
        #filterTableWrap,
        #answerTableWrap {
            flex: 1;
            min-width: 0;
            min-height: 0;
            width: 100%;
            overflow: auto;
            margin-top: 0;
            --rt-thumb-track-inset-top: 24px;
            --rt-thumb-track-inset-bottom: 24px;
            scrollbar-gutter: stable;
            scrollbar-width: auto;
            scrollbar-color: var(--rt-scrollbar-thumb) var(--rt-scrollbar-track);
        }

        #tableWrap {
            /* Ensure the final table row can scroll above the sheet tabs row */
            padding-bottom: 48px;
            /* help programmatic scrollIntoView honor bottom offset */
            scroll-padding-bottom: 44px;
        }

            scroll-padding-top: 28px;
            scroll-padding-bottom: 32px;
        }

        .answer-table-viewport-wrap {
            flex: 1;
            min-height: 0;
            min-width: 0;
        }

        #tableWrap::-webkit-scrollbar,
        #filterTableWrap::-webkit-scrollbar,
        #answerTableWrap::-webkit-scrollbar {
            width: var(--rt-scrollbar-w, 18px);
        }

        #filterTableWrap::-webkit-scrollbar-track,
        #answerTableWrap::-webkit-scrollbar-track {
            background: var(--rt-scrollbar-track);
            margin-top: var(--rt-thumb-track-inset-top);
            margin-bottom: var(--rt-thumb-track-inset-bottom);
        }

        #filterTableWrap::-webkit-scrollbar-thumb:hover,
        #answerTableWrap::-webkit-scrollbar-thumb:hover {
            background: var(--rt-scrollbar-thumb-hover);
        }

        #tableWrap::-webkit-scrollbar-button,
        #filterTableWrap::-webkit-scrollbar-button,
        #answerTableWrap::-webkit-scrollbar-button {
            display: none;
            height: 0;
            width: 0;
        }

        /* Cột nút: flex từ trên xuống; giữa là spacer xuyên click tới thumb */
        .right-table-edge-jumps {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: var(--rt-scrollbar-w, 18px);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 0;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 1;
            background: transparent;
        }

            min-height: 0;
            align-self: stretch;
            width: 100%;
            min-width: 100%;
            pointer-events: none;
            background: transparent;
        }

        .right-table-edge-jumps-spacer+.right-table-edge-jump-btn {
            border-top: 1px solid var(--rt-scrollbar-btn-edge);
        }

        .right-table-edge-jump-btn {
            pointer-events: auto;
            flex: 0 0 auto;
            width: 100%;
            height: 12px;
            min-height: 12px;
            padding: 0;

            border: none;
            border-radius: 0;
            background: var(--rt-scrollbar-btn-face);
            color: #2a2a2a;
            font-size: 7px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
            box-sizing: border-box;
            border-bottom: 1px solid var(--rt-scrollbar-btn-edge);
        }

        /* Cùng bề + căn giữa cột thumb (▲▼ và ⏮); hẹp 4px tổng ≈ vùng thumb sau viền 1px */
        .right-table-edge-jump-btn--step,
        .right-table-edge-jump-btn--top,
        .right-table-edge-jump-btn--bottom {
            width: calc(var(--rt-scrollbar-w, 18px) - 4px);
            min-width: 12px;
        }

        .right-table-edge-jump-btn--step {
            font-size: 8px;
        }

        /* Gương trên/dưới: ▼ không border dưới (viền với ⏮ = inset trên nút dưới); ▲ giữ border dưới tới spacer — đối xứng với border trên ▼ */
        .right-table-edge-jump-btn--step-down {
            border-bottom: none;
        }

            opacity: 0.35;

        /**
         * Cột thanh scroll: [go-top][▲] | thumb | [▼][go-bottom].
         * Dùng chung cho #tableWrap và #filterTableWrap.
         */
        function bindTableScrollEdgeJumps(config) {
            const wrap = el(config.wrapId);
            const jumpTop = el(config.topBtnId);
            const stepUp = el(config.stepUpBtnId);
            const stepDown = el(config.stepDownBtnId);
            const jumpBottom = el(config.bottomBtnId);
            if (!wrap || !jumpTop || !stepUp || !stepDown || !jumpBottom) {
                return;
            }
            const boundKey = config.boundKey || 'scrollEdgeJumpsBound';
            if (wrap.dataset[boundKey] === '1') {
                return;
            }
            wrap.dataset[boundKey] = '1';

            const stepPixels = () => Math.max(48, Math.round(wrap.clientHeight * 0.22));

            const rail = wrap.parentElement
                ? wrap.parentElement.querySelector('.right-table-edge-jumps')
                : null;
            const spacer = rail ? rail.querySelector('.right-table-edge-jumps-spacer') : null;

            const syncThumbTrackInsets = () => {
                if (!rail || !spacer) {
                    return;
                }
                try {
                    const rr = rail.getBoundingClientRect();
                    const sr = spacer.getBoundingClientRect();
                    let topPx = Math.max(0, Math.round(sr.top - rr.top)) + 2;
                    let botPx = Math.max(0, Math.round(rr.bottom - sr.bottom)) + 2;
                    const ch = wrap.clientHeight || 0;
                    const maxEach = Math.max(28, Math.floor((ch - 40) / 2));
                    topPx = Math.min(topPx, maxEach);
                    botPx = Math.min(botPx, maxEach);
                    wrap.style.setProperty('--rt-thumb-track-inset-top', `${topPx}px`);
                    wrap.style.setProperty('--rt-thumb-track-inset-bottom', `${botPx}px`);
                } catch (eIn) { /* ignore */ }
            };

            if (config.syncGlobalKey) {
                window[config.syncGlobalKey] = syncThumbTrackInsets;
            }

            const syncBtns = () => {
                const maxScroll = Math.max(0, wrap.scrollHeight - wrap.clientHeight);
                const y = wrap.scrollTop;
                if (maxScroll <= 1) {
                    jumpTop.disabled = true;
                    stepUp.disabled = true;
                    stepDown.disabled = true;
                    jumpBottom.disabled = true;
                    return;
                }
                jumpTop.disabled = y <= 1;
                stepUp.disabled = y <= 1;
                stepDown.disabled = y >= maxScroll - 1;
                jumpBottom.disabled = y >= maxScroll - 1;
            };

            jumpTop.addEventListener('click', () => {
                wrap.scrollTo({ top: 0, left: wrap.scrollLeft, behavior: 'smooth' });
            });
            jumpBottom.addEventListener('click', () => {
                const maxScroll = Math.max(0, wrap.scrollHeight - wrap.clientHeight);
                wrap.scrollTo({ top: maxScroll, left: wrap.scrollLeft, behavior: 'smooth' });
            });
            stepUp.addEventListener('click', () => {
                wrap.scrollBy({ top: -stepPixels(), left: 0, behavior: 'auto' });
            });
            stepDown.addEventListener('click', () => {
                wrap.scrollBy({ top: stepPixels(), left: 0, behavior: 'auto' });
            });

            wrap.addEventListener('scroll', () => syncBtns(), { passive: true });
            window.addEventListener('resize', () => {
                requestAnimationFrame(() => {
                    syncThumbTrackInsets();
                    syncBtns();
                });
            });
            try {
                const ro = new ResizeObserver(() => {
                    if (wrap.id === 'filterTableWrap' && filterPopupResizeActive) {
                        scheduleFilterPopupResizeThumbSync();
                        return;
                    }
                    syncThumbTrackInsets();
                    syncBtns();
                });
                ro.observe(wrap);
                if (rail) {
                    ro.observe(rail);
                }
            } catch (e) { /* ignore */ }

            requestAnimationFrame(() => {
                syncThumbTrackInsets();
                syncBtns();
            });
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    syncThumbTrackInsets();
                    syncBtns();
                });
            });
        }

        function getFilterConnectionNoteTagCountForTag(tag) {
            if (!isPeriodFilterContextSheet()) {
                return 0;

            const mode = periodFilterMode;
            if (!supportsConnectionNoteTagFilter(mode)) {
                return 0;
            }
            if (tag === FILTER_NOTE_TAG_ALL) {
                return getFilterParentCountForMode(mode);
            }
            const num = parseInt(tag, 10);
            if (!Number.isFinite(num)) {
                return 0;

            return sheetManager.getFilterMatchingIndices(mode, { noteTags: [num] }).length;

        function toggleFilterPopupNoteTag(tag) {
            const max = getFilterNoteTagMaxSelections(periodFilterMode);
            if (max <= 0) {
                return;
            }

            if (isDatebandFilterMode(periodFilterMode)) {
                if (tag === FILTER_NOTE_TAG_ALL) {
                    filterNoteTags = [FILTER_NOTE_TAG_ALL];
                } else if (!FILTER_NOTE_TAG_VALUES.includes(tag)) {
                    return;
                } else if (filterNoteTags.length === 1 && filterNoteTags[0] === tag) {
                    filterNoteTags = [FILTER_NOTE_TAG_ALL];
                } else {
                    filterNoteTags = [tag];
                }
            } else if (tag === FILTER_NOTE_TAG_ALL) {
                filterNoteTags = [FILTER_NOTE_TAG_ALL];
            } else if (!FILTER_NOTE_TAG_VALUES.includes(tag)) {
                return;
            } else {
                const withoutAll = filterNoteTags.filter((t) => t !== FILTER_NOTE_TAG_ALL);
                const idx = withoutAll.indexOf(tag);
                if (idx >= 0) {
                    withoutAll.splice(idx, 1);
                } else if (withoutAll.length < max) {
                    withoutAll.push(tag);
                } else {
                    withoutAll.shift();
                    withoutAll.push(tag);
                }
                filterNoteTags = withoutAll.length ? withoutAll : [FILTER_NOTE_TAG_ALL];
            }

            normalizeFilterNoteTagsForMode(periodFilterMode);
            applyFilterNoteTagsFromUi();
            highlightFilterPopupNoteTagMenu();
            scheduleRebuildFilterNoteTagMenuCounts();

        function loadFilterNonexistSettings() {
