            initSheetTabToggleShortcut();
            initPeriodFilterToolbar();
            initAnswerPopupShortcut();
            initAnswerPopupDrag();
            initAnswerPopupResize();
            initAnswerPopupLayoutOnWindowResize();
            initFloatingPopupDockStacking();
            loadData();

            // Listen for sheet changes
            window.addEventListener('sheetChanged', (e) => {
                const finishSheetChanged = () => {
                    renderTable();
                    renderSheetTabs();
                    updatePeriodFilterMatchCount();
                    syncFilterPopupDropdownCounts();
                };
                finishSheetChanged();
                requestAnimationFrame(() => {
                    syncSubmitRingToolbarUi();
                    sendSubmitRingConfigToIframe({ contextSync: true });
                    if (sheetManager && sheetManager.activeSheet === 'combo_1') {
                        scheduleComboH1ReplaceFromLeftCircled();
                    }
                    selectedLines = [];
                    selectedNums.clear();
                    renderSelectedLines();
                    renderSummaryTable();
                });
                if (periodFilterEnabled && isPeriodFilterContextSheet()) {
                    requestAnimationFrame(() => {
                        if (isPeriodFilterContextSheet()) {
                            refreshFilterPopup({ syncMain: false, immediateRender: true });
                        }
                    });
                }
            });

            window.addEventListener('comboControlsChanged', () => {
                if (sheetManager && sheetManager.activeSheet === 'combo_1') {
                    renderTable();
                    syncComboLogicUi();
                }
                const ap = answerPopup;
                if (ap && ap.isOpen() && isComboContextSheet() && sheetManager) {
                    const idx = getMainSourceSheetFocusRowIndex();
                    if (typeof idx === 'number' && idx >= 0) {
                        ap.onFocusRowChanged(idx);
                    }
                }
            });

            const tableWrap = el('tableWrap');
            if (tableWrap) {
                tableWrap.addEventListener('focusin', () => {
                    rememberKeyboardFocusTarget('main');
                });
                tableWrap.addEventListener('scroll', () => {
                    captureCurrentScrollPosition();
                }, { passive: true });
            }

            const frame = el('okFrame');
            if (frame) {
                frame.addEventListener('focus', () => {
                    rememberKeyboardFocusTarget('left');
                });
            }

            // Listen for row clicks from sheet manager
            window.addEventListener('rowClicked', (e) => {
                const detail = e.detail || {};
                clearSheet1ArrowNavFinalize();
                const skipNavFlush = !!detail.fromSheet1NavStep
                    || (!!detail.fromTrackingSync && !!detail.trackingFrameStep);
                if (!skipNavFlush) {
                    flushRightPaneNavCoalesce();
                }
                const fromFilterNav = !!detail.fromFilterNav;
                const fromTrackingSync = !!detail.fromTrackingSync;
                if (!fromFilterNav) {
                    rememberKeyboardFocusTarget('main');
                }
                if (detail.sheetName === 'sheet1' && typeof detail.focusRowIndex === 'number') {
                    mainSheet1FocusRowIndex = detail.focusRowIndex;
                }
                if (periodFilterEnabled && !fromFilterNav && typeof detail.focusRowIndex === 'number') {
                    syncFilterPopupFocusFromMainRow(detail.focusRowIndex);
                }
                if (typeof detail.focusRowIndex === 'number' && isAnswerPopupContextSheet()) {
                    const ap = ensureAnswerPopup();
                    if (ap) {
                        ap.onFocusRowChanged(detail.focusRowIndex);
                    }
                }
                selectedLines = detail.selectedLines || [];
                selectedNums.clear();
                detail.selectedNums.forEach(n => selectedNums.add(n));
                if (!detail.light) {
                    syncComboLogicUi();
                    renderSelectedLines();
                    renderSummaryTable();
                }

                // Send selected lines to iframe for updating submit state
                const frame = el('okFrame');
                let referenceConn3HeaderLines = [];
                let referenceConn3Triplets = [];
                let referenceConn3FooterLine = '';
                if (
                    (detail.sheetName === 'sheet1' || sheetManager?.activeSheet === 'tracking')
                    && sheetManager
                    && typeof detail.focusRowIndex === 'number'
                ) {
                    try {
                        if (typeof sheetManager.getNoteReferenceHintMeta === 'function') {
                            const meta = sheetManager.getNoteReferenceHintMeta(detail.focusRowIndex);
                            if (meta && !meta.error && meta.text != null) {
                                referenceConn3HeaderLines = Array.isArray(meta.conn3HeaderLines)
                                    ? meta.conn3HeaderLines
                                    : [];
                                referenceConn3Triplets = Array.isArray(meta.conn3Triplets)
                                    ? meta.conn3Triplets
                                    : [];
                                referenceConn3FooterLine = meta.conn3FooterLine || '';
                            }
                        }
                    } catch (errRef) {
                        referenceConn3HeaderLines = [];
                        referenceConn3Triplets = [];
                        referenceConn3FooterLine = '';
                    }
                }
                if (frame && frame.contentWindow && selectedLines.length > 0) {
                    // ok_left process() expects tab-separated columns (same as iframe copyLine):
                    // result, optional note, optional nonexist. Pipe-only lines leave note/nonexist empty
                    // and break cyan/yellow highlights on freq==1 numbers.
                    const lines = selectedLines.map(row => {
                        const result = row.result || row.Result || '';
                        const note = row.note || row.Note || '';
                        const nonexist = row.nonexist || row.Nonexist || '';
                        let line = result;
                        if (note) line += '\t' + note;
                        if (nonexist) line += '\t' + nonexist;
                        return line;
                    });
                    const isFocusEmpty = selectedLines.length > 0 && !(String(selectedLines[selectedLines.length - 1].result || '').trim());
                    noteMainFocusEmptyTransition(isFocusEmpty);
                    const setLinesPayload = {
                        type: 'setLines',
                        lines: lines,
                        contextPrefixCount: detail.contextPrefixCount || 0,
                        disableSubmit: isFocusEmpty,
                        submitActive: iframeSubmitActive,
                        preserveSelection: fromFilterNav || fromTrackingSync || !!detail.fromSheet1NavStep,
                        focusRowId: String(detail.clickedRowId || '').trim(),
                        focusRowIndex: detail.focusRowIndex,
                        focusNonexistHighlights: detail.focusNonexistHighlights || {},
                        submitAutoCircleEnabled: !!submitRingEnabled,
                        submitAutoCircleMode: getEffectiveSubmitRingMode(),
                        submitAutoCircleCustomX: clampRingCustomX(submitRingCustomX),
                        ...getSubmitRingDatebandPayload(),
                        labelCircleNums: (() => {
                            const nums = getSubmitRingLabelCircleNumsForFocusRow(detail.focusRowIndex);
                            return Array.isArray(nums) ? nums : undefined;
                        })(),
                        referenceConn3HeaderLines: referenceConn3HeaderLines,
                        referenceConn3Triplets: referenceConn3Triplets,
                        referenceConn3FooterLine: referenceConn3FooterLine,
                        trackingFrameStep: !!(detail.trackingFrameStep || detail.fromSheet1NavStep)
                    };
                    if (detail.fromSheet1NavStep || (fromTrackingSync && detail.trackingFrameStep)) {
                        frame.contentWindow.postMessage(setLinesPayload, '*');
                    } else if (fromTrackingSync) {
                        scheduleTrackingSetLinesPost(setLinesPayload);
                    } else if (fromFilterNav && periodFilterEnabled && isAllLikeFilterMode(periodFilterMode)) {
                        scheduleFilterAllModeSetLines(setLinesPayload);
                    } else {
                        frame.contentWindow.postMessage(setLinesPayload, '*');
                    }
                }
                if (sheetManager && sheetManager.activeSheet === 'combo_1') {
                    scheduleComboH1ReplaceFromLeftCircled();
                }
                if (periodFilterEnabled && isPosnfreqFilterMode(periodFilterMode)
                    && (detail.sheetName === 'sheet1' || sheetManager?.activeSheet === 'tracking')
                    && typeof detail.focusRowIndex === 'number') {
                    onPosnfreqMainFocusRowChanged(detail.focusRowIndex);
                }
            });

            window.addEventListener('message', (ev) => {
                const msg = ev.data || {};
                if (msg.type === 'requestChecknotePopup') {
                    const frame = el('okFrame');
                    if (!frame || !frame.contentWindow || ev.source !== frame.contentWindow) {
                        return;
                    }
                    let data = { id_to_result: {}, pair_to_ids: {}, max_id: null, combo2_pair_stats: {} };
                    try {
                        if (sheetManager && typeof sheetManager.buildChecknoteDataFromSourceRows === 'function') {
                            data = sheetManager.buildChecknoteDataFromSourceRows();
                        }
                    } catch (err) {
                        /* keep empty data */
                    }
                    try {
                        frame.contentWindow.postMessage({ type: 'checknotePopupData', data, nonce: msg.nonce }, '*');
                    } catch (e) { /* ignore */ }
                    return;
                }
                if (msg.type === 'togglePeriodFilter') {
                    const frame = el('okFrame');
                    if (!frame || !frame.contentWindow || ev.source !== frame.contentWindow) {
                        return;
                    }
                    togglePeriodFilterFromShortcut();
                    return;
                }
                if (msg.type === 'toggleSubmitRing') {
                    const frame = el('okFrame');
                    if (!frame || !frame.contentWindow || ev.source !== frame.contentWindow) {
                        return;
                    }
                    toggleSubmitRingFromShortcut();
                    return;
                }
                if (msg.type === 'togglePhase') {
                    const frame = el('okFrame');
                    if (!frame || !frame.contentWindow || ev.source !== frame.contentWindow) {
                        return;
                    }
                    togglePhaseToolbar();
                    return;
                }
                if (msg.type === 'toggleAnswerPopup') {
                    const frame = el('okFrame');
                    if (!frame || !frame.contentWindow || ev.source !== frame.contentWindow) {
                        return;
                    }
                    if (!isAnswerPopupContextSheet()) {
                        return;
                    }
                    const ap = ensureAnswerPopup();
                    if (!ap) {
                        return;
                    }
                    if (!ap.isOpen()) {
                        ap.openPopup();
                    } else {
                        ap.close();
                    }
                    return;
                }
                if (msg.type === 'toggleSheetTab') {
                    const frame = el('okFrame');
                    if (!frame || !frame.contentWindow || ev.source !== frame.contentWindow) {
                        return;
                    }
                    toggleSheetByTabShortcut();
                    return;
                }
                if (msg.type === 'filterPopupNavigate') {
                    const frame = el('okFrame');
                    if (!frame || !frame.contentWindow || ev.source !== frame.contentWindow) {
                        return;
                    }
                    const step = Number(msg.step);
                    if (!step) {
                        return;
                    }
                    queueRightPaneNav('filter', step);
                    return;
                }
                if (msg.type === 'posnfreqLeftHexRequestSync') {
                    const frame = el('okFrame');
                    if (!frame || !frame.contentWindow || ev.source !== frame.contentWindow) {
                        return;
                    }
                    try {
                        broadcastLeftPanePosnfreqHexUi();
                    } catch (eSync) {
                        /* ignore */
                    }
                    return;
                }
                if (msg.type === 'posnfreqLeftHexPickNum') {
                    const frame = el('okFrame');
                    if (!frame || !frame.contentWindow || ev.source !== frame.contentWindow) {
                        return;
                    }
                    const n = Number(msg.num);
                    if (!Number.isFinite(n) || n < 1 || n > 35) {
                        return;
                    }
                    if (!periodFilterEnabled || !isPosnfreqFilterMode(periodFilterMode)) {
                        return;
                    }
                    scheduleApplyPosnfreqSpecimenNumAfterLeftPaint(n);
                    return;
                }
                if (msg.type === 'posnfreqLeftHexToggleStrict') {
                    const frame = el('okFrame');
                    if (!frame || !frame.contentWindow || ev.source !== frame.contentWindow) {
                        return;
                    }
                    if (!periodFilterEnabled || !isPosnfreqFilterMode(periodFilterMode)) {
                        return;
                    }
                    if (posnfreqSpecimenNum == null || !Number.isFinite(posnfreqSpecimenNum) || !posnfreqRefSignature) {
                        return;
                    }
                    posnfreqSpecimenStrict = !posnfreqSpecimenStrict;
                    syncPosnfreqMetaText();
                    schedulePosnfreqDeferredHeavyUi();
                    return;
                }
                if (msg.type === 'rightPaneNavKey') {
                    const frame = el('okFrame');
                    if (!frame || !frame.contentWindow || ev.source !== frame.contentWindow) {
                        return;
                    }
                    const arrowStep = getFilterPopupNavStepFromKey(msg.key);
                    if (arrowStep && isFilterPopupNavActive() && isRightPaneFilterKeyboardTarget()) {
                        queueRightPaneNav('filter', arrowStep);
                        return;
                    }
                    if (arrowStep && isAnswerPopupNavActive() && isRightPaneAnswerKeyboardTarget()) {
                        queueRightPaneNav('answer', arrowStep);
                        return;
                    }
                    navigateRightPaneByArrowKey(msg.key);
                    return;
                }
                if (msg.type === 'submitStateChanged') {
                    if (!msg.submitActive && savedSubmitActiveBeforeEmptyFocus !== null) {
                        return;
                    }
                    const prevSubmitActive = iframeSubmitActive;
                    iframeSubmitActive = !!msg.submitActive;
                    if (sheetManager && typeof sheetManager.setLeftSubmitActive === 'function') {
                        sheetManager.setLeftSubmitActive(!!msg.submitActive);
                    }
                    if (!msg.submitActive) {
                        try {
                            window.dispatchEvent(new CustomEvent('leftCircledNumsChanged'));
                        } catch (eTrk) { /* ignore */ }
                    }
                    window.dispatchEvent(new CustomEvent('leftSubmitStateChanged', {
                        detail: { active: !!msg.submitActive }
                    }));
                    syncSubmitRingToolbarUi();
                    if (msg.submitActive && !prevSubmitActive && answerPopup
                        && typeof answerPopup.prepareForSubmitOnFromParent === 'function') {
                        answerPopup.prepareForSubmitOnFromParent();
                    }
                    if (answerPopup && answerPopup.isOpen()) {
                        if (typeof answerPopup.syncCheckFromSubmit === 'function') {
                            answerPopup.syncCheckFromSubmit(!!msg.submitActive);
                        }
                    }
                    if (!msg.submitActive && prevSubmitActive && answerPopup
                        && typeof answerPopup.restoreAfterSubmitOffIfNeeded === 'function') {
                        answerPopup.restoreAfterSubmitOffIfNeeded(msg.leftRestoredPickSig);
                    }
                    syncAnswerPopupSheet1FocusMask();
                    scheduleComboH1ReplaceFromLeftCircled();
                } else if (msg.type === 'leftCircledNumsReady') {
                    if (sheetManager && typeof sheetManager.setLeftBasicPreviewPickNums === 'function') {
                        const forceSync = !!msg.forceSync;
                        const fromBasicTrackingPreview = !!msg.basicTrackingPreview;
                        const ignoreEmptyStash = !forceSync
                            && typeof sheetManager.shouldIgnoreEmptyLeftCircledNumsAfterStashRestore === 'function'
                            && sheetManager.shouldIgnoreEmptyLeftCircledNumsAfterStashRestore(msg.nums);
                        if (!ignoreEmptyStash) {
                            if (forceSync) {
                                sheetManager._basicPreviewStashRestoredAt = 0;
                            }
                            // Echo từ sync tracking: giữ focus chuột phải (retainFocus).
                            // Click tắt khoanh nửa trái: không có flag → cập nhật focus = tip chuỗi.
                            const changed = sheetManager.setLeftBasicPreviewPickNums(msg.nums || [], {
                                skipFocusUpdate: fromBasicTrackingPreview
                            });
                            if (changed || forceSync) {
                                window.dispatchEvent(new CustomEvent('leftCircledNumsChanged'));
                            }
                        }
                    }
                    const ap = ensureAnswerPopup();
                    if (!ap) {
                        applyLeftCircledNumsToComboH1(msg.nums);
                        return;
                    }
                    if (ap.isOpen() && msg.submitActive) {
                        if (!ap.checked) {
                            ap.syncCheckFromSubmit(true);
                        }
                        return;
                    }
                    if (ap.isOpen() && ap.onLeftCircledNums(msg.nums)) {
                        return;
                    }
                    applyLeftCircledNumsToComboH1(msg.nums);
                } else if (msg.type === 'leftCircledNums' && msg.nonce) {
                    if (sheetManager && typeof sheetManager.setLeftBasicPreviewPickNums === 'function') {
                        const changed = sheetManager.setLeftBasicPreviewPickNums(msg.nums || []);
                        if (changed) {
                            window.dispatchEvent(new CustomEvent('leftCircledNumsChanged'));
                        }
                    }
                    const ap = ensureAnswerPopup();
                    if (ap && ap.isOpen() && ap.onLeftCircledNums(msg.nums)) {
                        return;
                    }
                    applyLeftCircledNumsToComboH1(msg.nums);
                } else if (msg.type === 'childFocus' && msg.region === 'left') {
                    rememberKeyboardFocusTarget('left');
                }
            });
            // left controls live inside the iframe now; guard bindings in parent
            const pickBtn = el('pickBtn'); if (pickBtn) pickBtn.addEventListener('click', () => {
                if (!selectedLines || selectedLines.length === 0) return alert('Chọn 1 hàng ở bên phải trước');
                const last = selectedLines[selectedLines.length - 1];
                const nums = parseNums(last.result || last.Result || '').slice(0, 5);
                selectedNums.clear(); nums.forEach(n => selectedNums.add(n));
                renderSummaryTable();
            });
            const resetBtn = el('resetBtn'); if (resetBtn) resetBtn.addEventListener('click', () => { selectedLines = []; selectedNums.clear(); renderSelectedLines(); renderSummaryTable(); });
            const submitBtn = el('submitBtn'); if (submitBtn) submitBtn.addEventListener('click', () => { alert('Submit clicked — trang web chỉ mô phỏng giao diện.'); });
            const copyBtn = el('copySelectionBtn'); if (copyBtn) copyBtn.addEventListener('click', () => {
                if (!selectedLines || selectedLines.length === 0) return alert('Chưa có selection');
                const txt = selectedLines.map(s => (s.result || s.Result || '') + (s.note ? '\t' + (s.note || s.Note || '') : '')).join('\n');
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(txt).catch(() => { });
                } else {
                    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
                }
            });
            const searchBox = el('searchBox'); if (searchBox) searchBox.addEventListener('input', () => {
                const v = searchBox.value.replace(/[^0-9]/g, '');
                const rows = document.querySelectorAll('#summaryWrap tbody tr');
                if (!v) { rows.forEach(r => r.style.fontWeight = ''); return; }
                rows.forEach(r => {
                    const num = r.dataset.num || r.querySelector('td')?.textContent || '';
                    if (String(num).includes(v)) r.style.fontWeight = '900'; else r.style.fontWeight = '';
                });
            });
        });
    </script>
    <div id="chatDock" class="chat-dock" aria-live="polite"></div>
</body>

</html>
