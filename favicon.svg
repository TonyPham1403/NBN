<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Quick Lotto Helper">
  <!-- Golden ratio φ ≈ 1.618 — layout: 32 = 19.78 + 12.22 -->
  <defs>
    <linearGradient id="field" x1="8" y1="4" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="42%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <radialGradient id="orb" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#86efac"/>
    </radialGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.6" stdDeviation="0.55" flood-color="#064e3b" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Canvas: corner radius ≈ 32/φ² -->
  <rect width="32" height="32" rx="7.6" fill="url(#field)"/>

  <!-- Fibonacci / φ spiral guide (very subtle) -->
  <path d="M5.2 27.4 C5.2 14.8 14.8 5.2 27.4 5.2" fill="none" stroke="#a7f3d0" stroke-width="0.65" opacity="0.22"/>

  <!-- Three orbs — radii 9.2 : 5.7 : 3.5 ≈ φ² : φ : 1 -->
  <!-- Centers on golden grid (12.22 | 19.78) -->
  <circle cx="19.78" cy="19.78" r="9.2" fill="url(#orb)" filter="url(#lift)" stroke="#047857" stroke-width="0.55"/>
  <circle cx="12.22" cy="19.78" r="5.7" fill="url(#orb)" filter="url(#lift)" stroke="#047857" stroke-width="0.5"/>
  <circle cx="19.78" cy="12.22" r="3.5" fill="url(#orb)" filter="url(#lift)" stroke="#047857" stroke-width="0.45"/>

  <!-- Accent ring at φ inset — “helper” focus, not a digit -->
  <circle cx="16" cy="16" r="10.1" fill="none" stroke="#ecfdf5" stroke-width="0.75" opacity="0.55"/>
</svg>
